  - slug: tool-who-executes-mcq
    skill: llm-tool-use
    kind: multiple_choice
    difficulty: 3
    minutes: 3
    diagnostic: true
    title: Who runs the tool?
    objective: Describe the tool-calling loop and the application's responsibilities in it.
    prompt: |
      Your application gives a chat model a definition for one of your own
      functions, `get_order_status(order_id: str)`. A user asks "Where is order
      1182?", and the model's reply is a tool call to `get_order_status` with
      the arguments `{"order_id": "1182"}`.

      What happens next in a correctly built integration?
    hints:
      - A tool definition is a description (a name, a purpose and a parameter schema). Can the model reach your database?
      - The model is stateless. How does it ever learn the order's status?
    explanation: |
      For your own functions, the model only *requests* a call. Your
      application parses it, validates the arguments, checks the current user
      is allowed to make it, executes the function and appends both the
      assistant's tool-call message and the tool result to the conversation.
      Then it sends a new request so the model can use the result. If the
      result is never sent back, the model never sees it and will often ask
      again.
    content:
      options:
        - id: a
          text: Your code validates the arguments (including whether this user may see order 1182), runs the function, then sends a new request containing the conversation, the tool call and its result so the model can write the answer.
          correct: true
          feedback: Exactly. The model proposes, your code decides and executes, and the result goes back in the next request.
        - id: b
          text: The provider runs `get_order_status` on its own servers using the definition you supplied, then returns the final answer.
          feedback: Your function lives in your systems. The definition only describes it, so the model emits a request and your application decides whether and how to run it.
          misconception:
            code: model-executes-tools
            label: Thinks the model or provider executes the application's own tools
            category: conceptual
        - id: c
          text: Nothing more is needed, because the tool call shows that the model has already looked the order up.
          feedback: A tool call is a request, not a record of something that happened. Until your code runs it, no lookup has occurred, and any status the model states without a result would be invented.
          misconception:
            code: model-executes-tools
            label: Thinks the model or provider executes the application's own tools
            category: conceptual
        - id: d
          text: Your code runs the function and the model receives the return value automatically, so the next request only needs a "continue" message.
          feedback: Nothing reaches the model unless you send it. The tool call and its result must be appended to the messages of the next request.
          misconception:
            code: model-sees-results-automatically
            label: Assumes tool results reach the model without being sent back in the conversation
            category: conceptual

  - slug: tool-loop-reset-debug
    skill: llm-tool-use
    secondary_skills: [llm-fundamentals]
    kind: debugging
    difficulty: 4
    minutes: 10
    tags: [scenario]
    title: The agent keeps calling the same tool
    objective: Diagnose an agent loop that discards tool results, and explain how conversation state must flow between requests.
    prompt: |
      This agent answers order questions using tools. `client.chat(...)` sends
      the messages and returns a reply with `.tool_calls` (each with `.id`,
      `.name` and `.arguments`, a JSON string), `.message` (the assistant
      message to append) and `.text`.

      In production logs, every step shows the model requesting `lookup_order`
      with the same arguments. The tool succeeds each time, and the function
      finally raises "agent did not finish". Select the line with the defect
      and explain the fix.
    hints:
      - Follow the `messages` list across two iterations of the loop. What does the second request contain?
      - The model only knows what is in the request you send it.
    explanation: |
      `messages` is rebuilt from scratch at the top of every iteration, so the
      assistant's tool call and the tool results appended at the end of each
      step are thrown away. The model is stateless: each request looks like the
      original question, so it sensibly asks for the same lookup again until
      `max_steps` runs out. Create the list once, before the loop, and keep
      appending to it.
    solution: |
      Line 5 rebuilds `messages` from scratch on every iteration of the loop,
      so the assistant's tool call and the tool result appended at the end of
      each step are thrown away. The model is stateless (it only sees the
      messages sent in each request), so every request looks like the original
      question and it asks for `lookup_order` again until `max_steps` runs out.

      Fix: create the list once, before the loop, and keep appending the
      assistant message and tool results to it.

      ```python
      def run_agent(client, question, max_steps=6):
          messages = [
              {"role": "system", "content": SYSTEM_PROMPT},
              {"role": "user", "content": question},
          ]
          for step in range(max_steps):
              reply = client.chat(messages=messages, tools=TOOL_SCHEMAS)
              ...
      ```
    content:
      language: python
      code: |
        import json

        def run_agent(client, question, max_steps=6):
            for step in range(max_steps):
                messages = [
                    {"role": "system", "content": SYSTEM_PROMPT},
                    {"role": "user", "content": question},
                ]
                reply = client.chat(messages=messages, tools=TOOL_SCHEMAS)
                if not reply.tool_calls:
                    return reply.text
                messages.append(reply.message)
                for call in reply.tool_calls:
                    args = json.loads(call.arguments)
                    result = TOOLS[call.name](**args)
                    messages.append(
                        {"role": "tool", "tool_call_id": call.id, "content": json.dumps(result)}
                    )
            raise RuntimeError("agent did not finish")
      bug_lines: [5]
      line_weight: 0.4
      min_words: 15
      max_words: 220
      criteria:
        - id: messages-reset
          label: Explains that the message list is rebuilt every iteration, discarding the tool call and its result
          weight: 2
          required: true
          any: ["re creat", "recreat", "re initiali", "reinitiali", "reset", "set back", "rebuil", "re build", "overwrit", "inside the loop", "in the loop", "each iteration", "every iteration", "each loop", "every loop", "each pass", "every pass", "each time", "every time", 're:\b(start|top|beginning)\s+of\s+(each|every|the)\s+(loop|iteration|step|pass)', "discard", "thrown away", "throws away", "wipe", "starts over", "from scratch", "lost", "gone"]
          missing_feedback: Follow `messages` from one iteration to the next. What happens to the tool result appended at the end of step 1?
          misconception:
            code: model-sees-results-automatically
            label: Assumes tool results reach the model without being sent back in the conversation
            category: conceptual
        - id: stateless-model
          label: Explains that the model only sees what is sent in each request, so it never sees the result and asks again
          weight: 2
          any: ["stateless", "never sees", "doesn't see", "does not see", "can't see", "cannot see", "never receives", "doesn't receive", "does not receive", "no memory", "doesn't remember", "does not remember", "only sees", "only knows", "same request", "same prompt", "same messages", "same input", "original question", 're:\bnever\s+(gets|get|receives?|sees?)\b', 're:\bdoesn.t\s+(see|receive|get|remember)']
          missing_feedback: Why does the model keep asking for the same tool? Think about what it receives in each request.
        - id: move-before-loop
          label: Creates the message list once, before the loop
          weight: 1
          any: ["move", 're:\b(before|above|outside( of)?|prior to|ahead of)\s+(the\s+)?(for\s+)?(loop|iteration)', "once", "hoist"]
          missing_feedback: Where should the initial messages be created so that results accumulate?

  - slug: tool-sql-agent-review
    skill: llm-tool-use
    kind: code_review
    difficulty: 4
    minutes: 12
    tags: [scenario]
    title: Review a support agent with a SQL tool
    objective: Identify over-privileged tools, unbounded agent loops, unvalidated arguments and unbounded tool output.
    prompt: |
      A support agent can look things up for customers. `question` comes
      straight from the public chat widget, and `db` is connected to the
      production database with the application's credentials. Review the
      implementation before it ships and list the problems, with a fix for
      each.
    hints:
      - What is the worst query a model could run here, and who can influence what the model does?
      - What stops this loop?
      - What happens when the arguments are malformed or the query returns a million rows?
    explanation: |
      - **Over-privileged tool.** "Run any SQL" on production lets the model,
        and anyone who can prompt-inject it through the chat widget, read
        other customers' data or modify tables. Expose narrow, purpose-built
        tools (`get_order(order_id)`) backed by parameterised queries, a
        read-only least-privilege role and an authorisation check for the
        current customer.
      - **Unbounded loop.** `while True` has no step limit or timeout. Cap the
        iterations and the total time.
      - **No argument validation or error handling.** Malformed JSON, a missing
        key or a database error crashes the request. Validate arguments against
        the schema and return errors to the model as tool results.
      - **Unbounded output.** `str(rows)` can dump a huge result set into the
        context. Limit rows and truncate output.
    solution: |
      1. The `run_sql` tool lets the model run arbitrary SQL against
         production with the application's privileges. Anyone typing into the
         chat widget can use prompt injection to read other customers' data or
         DROP and UPDATE tables. Replace it with narrow, purpose-built tools
         such as `get_order(order_id)` that use parameterised queries, a
         read-only least-privilege database user, and an authorization check
         that the order belongs to the current customer.
      2. `while True` has no max steps or timeout, so a confused model can loop
         forever and run up cost. Cap the iterations and the total time.
      3. Arguments aren't validated. `json.loads` or the `["query"]` lookup can
         raise (malformed JSON, KeyError) and database errors crash the whole
         request. Validate arguments against the schema and return errors to
         the model as the tool result.
      4. `str(rows)` puts an unbounded result set into the conversation, which
         can blow the context window and expose more data than needed. Limit
         the rows and truncate the output.
    content:
      min_words: 40
      max_words: 400
      language: python
      code: |
        import json

        TOOLS = [{
            "name": "run_sql",
            "description": "Run any SQL query against the production database.",
            "parameters": {"type": "object", "properties": {"query": {"type": "string"}}},
        }]


        def support_agent(question: str) -> str:
            messages = [{"role": "user", "content": question}]
            while True:
                reply = llm.chat(messages=messages, tools=TOOLS)
                if not reply.tool_calls:
                    return reply.text
                messages.append(reply.message)
                for call in reply.tool_calls:
                    rows = db.execute(json.loads(call.arguments)["query"])
                    messages.append(
                        {"role": "tool", "tool_call_id": call.id, "content": str(rows)}
                    )
      criteria:
        - id: least-privilege
          label: Flags the arbitrary-SQL tool and proposes narrow, authorised, least-privilege tools
          weight: 2
          required: true
          any: ["any sql", "arbitrary", "raw sql", "drop", "delete", "update", "insert", "read only", "least privilege", "privilege", "permission", "authori", "scope", "narrow", "specific tool", "purpose built", "dedicated tool", "get_order", "allowlist", "allow list", "whitelist", "parameteri", "sql injection", "prompt injection", "inject", "destructive", "other customers", "other users", "exfiltrat", "leak", "too powerful", "too broad"]
          missing_feedback: What is the most damaging thing this tool can do, and who can influence the model that calls it?
          misconception:
            code: overpowered-tools
            label: Gives an agent broad tools and credentials instead of narrow, authorised ones
            category: security
        - id: loop-bound
          label: Notes that the loop has no step limit or timeout
          weight: 1
          any: ["while true", "infinite", "max steps", "max_steps", "maximum number", "maximum steps", "step limit", "iteration limit", "max iterations", "max_iterations", "limit the number of", "runaway", "never terminat", "never end", "forever", "loop limit", "budget", "timeout", "time limit"]
          missing_feedback: What guarantees that `support_agent` eventually returns?
          misconception:
            code: unbounded-agent-loop
            label: Runs an agent loop with no step or time limit
            category: performance
        - id: argument-validation
          label: Validates tool arguments and handles errors instead of crashing
          weight: 1
          any: ["validat", "json.loads", "jsondecodeerror", "keyerror", "malformed", "invalid json", "valid json", "invalid arguments", "exception", "error handling", "handle errors", "try/except", "try except", 're:\btry\s*(/|and)?\s*except', "catch", "raise", "crash", "schema", "return the error", "errors to the model", "send the error"]
          missing_feedback: What happens if `call.arguments` isn't valid JSON, lacks `query`, or the query fails?
          misconception:
            code: trusts-tool-arguments
            label: Executes model-supplied tool arguments without validation or error handling
            category: edge_case
        - id: output-size
          label: Limits the size of tool output fed back into the context
          weight: 1
          any: ["str(rows)", "huge", "large result", "large output", "result size", "output size", "size of the result", "number of rows", "too many rows", "million rows", "row limit", "limit the rows", "limit rows", "truncat", "paginat", "context window", "token", 're:\blimit\s+\d+']
          missing_feedback: How much text can `str(rows)` add to the conversation?
          misconception:
            code: unbounded-tool-output
            label: Feeds unbounded tool output back into the model's context
            category: performance


  # ===========================================================================
  # algo-complexity
  # ===========================================================================
  - slug: complexity-list-membership-mcq
    skill: algo-complexity
    kind: multiple_choice
    difficulty: 1
    minutes: 2
    diagnostic: true
    tags: [interview]
    title: The hidden loop in a list comprehension
    objective: Recognise that membership tests on a list are linear and can make a single loop quadratic.
    prompt: |
      ```python
      def find_new_users(signups, existing):
          """Both arguments are lists of n email addresses."""
          return [email for email in signups if email not in existing]
      ```

      What is the worst-case time complexity of `find_new_users` in terms of n?
    hints:
      - Count the explicit loop, then ask what `not in` has to do when `existing` is a list.
      - How many elements might `email not in existing` compare before it can answer?
    explanation: |
      `email not in existing` scans the list until it finds a match, and for
      a new user that means comparing against every element: O(n). Doing that
      for each of the n signups gives **O(n²)**. Converting once with
      `existing_set = set(existing)` makes each check O(1) on average, so the
      whole function becomes O(n).
    content:
      options:
        - id: a
          text: O(n²), because `email not in existing` scans the list, so each of the n checks can take O(n).
          correct: true
          feedback: Right. The membership test is a hidden inner loop. Build a set once and the function becomes O(n) on average.
        - id: b
          text: O(n), because `in` is a constant-time lookup, so each email costs O(1).
          feedback: That's true for sets and dict keys, which use hashing. A list has no index by value, so `in` compares element by element.
          misconception:
            code: list-in-is-constant
            label: Thinks `in` on a list is a constant-time lookup like a set
            category: performance
        - id: c
          text: O(n log n), because Python sorts `existing` behind the scenes so it can binary-search it.
          feedback: Python never sorts a list implicitly. `in` on a list is a plain linear scan.
          misconception:
            code: assumes-sorted-search
            label: Thinks `in` on a list uses sorting or binary search
            category: conceptual
        - id: d
          text: O(2n), meaning one pass over `signups` and one pass over `existing`.
          feedback: The scan of `existing` happens once for every email, not once overall. Constant factors such as the 2 in O(2n) are also dropped in Big-O.
          misconception:
            code: hidden-loop-counted-once
            label: Treats a scan inside a loop as if it happened only once
            category: performance

  - slug: complexity-halving-loop-short
    skill: algo-complexity
    kind: short_answer
    difficulty: 2
    minutes: 3
    tags: [interview]
    title: A loop that halves around a loop that doesn't
    objective: Derive the complexity of a halving outer loop whose inner loop always does n steps.
    prompt: |
      ```python
      def count_steps(n):
          steps = 0
          i = n
          while i > 1:
              for _ in range(n):
                  steps += 1
              i //= 2
          return steps
      ```

      What is the time complexity of `count_steps(n)` in Big-O notation?
    hints:
      - How many times does the `while` loop run? Try n = 16 and n = 1024.
      - The inner loop's length does not depend on `i`.
    explanation: |
      The outer loop halves `i` each time, so it runs about log₂ n times. The
      inner loop always runs exactly n times, whatever `i` is. Total work:
      n × log n = **O(n log n)**. Compare it with `for _ in range(i)`, where
      the inner work shrinks as n + n/2 + n/4 + … < 2n, which is O(n). Look at
      what each loop actually depends on rather than counting nesting levels.
    content:
      placeholder: e.g. O(n)
      ignore_spaces: true
      accepted: ["O(n log n)", "O(nlogn)", "O(n*log n)", "O(n * log n)", "O(n log(n))", "O(n·log n)", "n log n", "nlogn", "O(n lg n)", "linearithmic", "Θ(n log n)", "theta(n log n)"]
      patterns: ['(o|θ|theta)?\(?n[*·]?(log|lg)(_?2)?\(?n\)?\)?']
      wrong:
        - answers: ["O(n^2)", "O(n2)", "O(n²)", "O(n*n)", "n^2", "quadratic"]
          feedback: Nested loops aren't automatically quadratic. The outer loop halves `i`, so it runs only about log₂ n times.
          misconception:
            code: nested-loops-always-quadratic
            label: Assumes nested loops are always O(n²)
            category: performance
        - answers: ["O(log n)", "O(logn)", "log n", "logarithmic"]
          feedback: The outer loop runs about log n times, but every one of those iterations does n steps of inner work.
          misconception:
            code: ignores-inner-loop
            label: Counts the halving outer loop but ignores the inner loop's work
            category: performance
        - answers: ["O(n)", "n", "linear"]
          feedback: That would be right if the inner loop were `range(i)`, since n + n/2 + n/4 + … < 2n. Here it is `range(n)`, so it never shrinks.
          misconception:
            code: halving-series-misapplied
            label: Applies the halving-series shortcut when the inner loop does not shrink
            category: logic

  - slug: complexity-running-balance
    skill: algo-complexity
    kind: python_code
    difficulty: 2
    minutes: 15
    tags: [interview]
    title: Speed up the account statement
    objective: Replace repeated slicing and summing with a single running total to turn O(n²) code into O(n).
    prompt: |
      The account statement endpoint times out for customers with many
      transactions. Profiling points at this function:

      ```python
      def running_balances(opening, amounts):
          balances = []
          for i in range(len(amounts)):
              balances.append(opening + sum(amounts[:i + 1]))
          return balances
      ```

      Rewrite `running_balances(opening, amounts)` so it returns the same
      results in **O(n)** time:

      - `opening` is the opening balance and `amounts` are signed transaction
        amounts in cents (integers).
      - Return a list with the balance after each transaction, in order.
      - `amounts` may be any iterable, including a generator streaming rows
        from the database, so consume it in a single pass.
    hints:
      - Each iteration of the slow version recomputes a sum the previous iteration nearly had. What could you carry from one step to the next?
      - Keep a running balance variable, add each amount to it and append the result.
      - A generator has no `len()` and can only be iterated once, so loop over `amounts` directly.
    explanation: |
      `amounts[:i + 1]` copies i + 1 elements and `sum` walks them again, so
      iteration i costs O(i) and the whole loop costs 1 + 2 + … + n = O(n²).
      With 200,000 transactions that is about 20 billion elements copied and
      another 20 billion added up.
      Carrying a running total makes each step O(1) and the function O(n), and
      iterating directly also makes it work on generators. The general lesson:
      when a loop recomputes something from scratch, ask whether it can be
      updated incrementally.
    solution: |
      ```python
      def running_balances(opening, amounts):
          balances = []
          balance = opening
          for amount in amounts:
              balance += amount
              balances.append(balance)
          return balances
      ```

      The standard library has this built in as well:
      `list(itertools.accumulate(amounts, initial=opening))[1:]`.
    content:
      starter_code: |
        def running_balances(opening, amounts):
            """Return the balance after each transaction, in order, in O(n) time."""
            balances = []
            # TODO: replace the quadratic version from the prompt with a single pass.
            return balances
      reference_solution: |
        def running_balances(opening, amounts):
            balances = []
            balance = opening
            for amount in amounts:
                balance += amount
                balances.append(balance)
            return balances
    tests:
      - name: matches the slow version on a small statement
        code: |
          assert running_balances(10_000, [2_500, -4_000, 750]) == [12_500, 8_500, 9_250]
      - name: no transactions gives an empty statement
        code: |
          assert running_balances(500, []) == []
      - name: balances can go negative
        code: |
          assert running_balances(0, [-300, 100]) == [-300, -200]
      - name: accepts a generator and reads it once
        hidden: true
        code: |
          assert running_balances(100, (amount for amount in [1, 2, 3])) == [101, 103, 106]
      - name: handles 200,000 transactions quickly
        hidden: true
        code: |
          result = running_balances(0, [1] * 200_000)
          assert len(result) == 200_000
          assert result[0] == 1 and result[-1] == 200_000

