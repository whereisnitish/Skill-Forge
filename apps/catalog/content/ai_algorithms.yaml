    title: Is the new prompt actually better?
    objective: Choose an evidence-based way to compare a prompt change before shipping it.
    prompt: |
      You rewrote the system prompt of a customer-support bot. You tried five
      questions by hand and the new answers read better.

      What is the most sound next step before shipping?
    hints:
      - Five hand-picked questions are a tiny, biased sample. What would a fair comparison look like?
      - Think about regressions. A change can improve some kinds of question and break others.
    explanation: |
      Compare both versions on the **same versioned eval set** of
      representative real cases, including edge cases and past failures. Score
      them with metrics that fit the task, look at per-category results, and
      read the cases that got worse. Averages hide regressions, a handful of
      spot checks hides almost everything, and outputs vary between runs, so
      re-run when the difference is small.
    content:
      options:
        - id: a
          text: Run the current and the new prompt on the same versioned eval set of representative real questions (including past failures), compare overall and per-category scores, and read the cases that got worse.
          correct: true
          feedback: Yes. The same fixed set makes the comparison fair, categories reveal hidden regressions, and reading failures tells you why.
        - id: b
          text: Ship it, because five clearly better answers show that the new prompt is an improvement.
          feedback: Five hand-picked examples can't show that nothing else broke. Prompt changes often help one kind of question and hurt another.
          misconception:
            code: vibes-based-eval
            label: Trusts a handful of manual spot checks as evidence of improvement
            category: conceptual
        - id: c
          text: Ask the model to rate its own answers from 1 to 10 for both prompts and ship whichever averages higher.
          feedback: Model grading can help, but an unchecked self-rating on a vague 1 to 10 scale is noisy and biased, for example towards longer answers. Check a judge against human labels before trusting it.
          misconception:
