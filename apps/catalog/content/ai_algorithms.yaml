  - slug: graphs-fewest-introductions-mcq
    skill: algo-graphs
    kind: multiple_choice
    difficulty: 3
    minutes: 3
    diagnostic: true
    tags: [interview]
    title: Fewest introductions between two employees
    objective: Choose BFS with a visited set for fewest-hop paths in an unweighted graph with cycles.
    prompt: |
      An internal directory stores who-knows-whom as an undirected, unweighted
      graph with plenty of cycles. You need the **fewest introductions** that
      connect two employees.

      Which approach is correct and efficient?
    hints:
      - Which traversal explores everything one hop away before anything two hops away?
      - What happens in a graph with cycles if you never remember where you've been?
    explanation: |
      BFS explores in order of distance: every node one hop away, then every
      node two hops away, and so on. So the first time it reaches the target,
      it has used the fewest possible edges. The visited set (marking nodes as
      they are enqueued) makes each node enter the queue once, giving O(V + E).
      DFS finds *a* path, not necessarily the shortest. Dijkstra's algorithm is
      for weighted edges and is unnecessary overhead when every edge costs the
      same.
    content:
      options:
        - id: a
          text: BFS from one employee with a visited set. The level at which the other employee is first reached is the minimum number of hops.
          correct: true
          feedback: Right. BFS reaches nodes in order of hop count, and the visited set keeps it O(V + E) despite cycles.
        - id: b
          text: DFS from one employee, returning the depth at which the other employee is first found.
          feedback: DFS commits to one branch and can reach the target through a long detour first. It finds a path, not necessarily the shortest one.
          misconception:
            code: dfs-finds-shortest
            label: Assumes the first path DFS finds is the shortest
            category: conceptual
        - id: c
          text: BFS without a visited set, since the first arrival is still the shortest and repeat visits don't matter.
          feedback: The first arrival is shortest, but without a visited set every cycle re-enqueues nodes, so the queue grows exponentially. If the two employees aren't connected, the search never ends.
          misconception:
            code: visited-set-optional
            label: Thinks a visited set is optional when traversing graphs with cycles
            category: logic
        - id: d
          text: Dijkstra's algorithm, because any shortest-path question requires it.
          feedback: Dijkstra gives the right answer here, but it needs a priority queue and takes O((V + E) log V) with a binary heap. With equal edge weights, BFS finds the same distances in O(V + E).
          misconception:
            code: dijkstra-always-needed
            label: Reaches for Dijkstra's algorithm when every edge has the same weight
            category: performance

  - slug: graphs-blast-radius
    skill: algo-graphs
    secondary_skills: [algo-hashing]
    kind: python_code
    difficulty: 4
    minutes: 25
    tags: [interview, scenario]
    title: Blast radius of a failing service
    objective: Reverse a dependency graph and run BFS with a visited set to compute fewest-hop distances to every dependent.
    prompt: |
      During an incident you want to know which services are affected when one
      goes down. `calls` maps each service to the services it calls directly.
      A service is affected if it calls the failed service directly or through
      a chain of calls.

      Write `blast_radius(calls, failed)`, which returns a dict mapping each
      affected service to the **fewest hops** from it to the failed service
      (direct callers are 1 hop away).

      - Some services appear only as callees, never as keys.
      - The graph can contain cycles. The failed service itself is never in
        the result.
      - If nothing depends on `failed`, or it doesn't appear at all, return `{}`.
      - Graphs can have tens of thousands of services in long chains.
      - Don't modify `calls`.

      ```python
      calls = {"web": ["api"], "api": ["db", "cache"], "worker": ["db"], "cache": []}
      blast_radius(calls, "db")
      # {"api": 1, "worker": 1, "web": 2}
      ```
    hints:
      - The edges point from caller to callee, but you need to walk from the failed service to the services that call it. Build the reversed graph first.
      - BFS from the failed service over the reversed edges visits services in order of hop count.
      - Record each service's distance when you first enqueue it, and use that dict as your visited set. Long chains also rule out deep recursion.
    explanation: |
      "Who depends on X?" is a question about **incoming** edges, so first
      invert the adjacency dict (callee → callers), which is O(V + E). Then run
      BFS from the failed service. BFS reaches services in order of distance,
      so the first time a service is discovered is its fewest-hop distance,
      and storing that distance doubles as the visited set that stops cycles
      from looping forever. DFS can record a longer detour first, and a
      recursive version would also hit Python's recursion limit (1,000 frames
      by default) on a chain of 20,000 services.
    solution: |
      ```python
      from collections import deque

      def blast_radius(calls, failed):
          callers = {}
          for service, callees in calls.items():
              for callee in callees:
                  callers.setdefault(callee, []).append(service)

          distances = {failed: 0}
          queue = deque([failed])
          while queue:
              current = queue.popleft()
              for caller in callers.get(current, []):
                  if caller not in distances:      # first discovery = fewest hops
                      distances[caller] = distances[current] + 1
                      queue.append(caller)
          del distances[failed]
          return distances
      ```

      `deque.popleft()` is O(1), whereas `list.pop(0)` shifts every element.
      The whole function is O(V + E) and never recurses.
    content:
      starter_code: |
        from collections import deque


        def blast_radius(calls, failed):
            """Map each service that depends on `failed` to its fewest hops from it."""
            return {}
      reference_solution: |
        from collections import deque


        def blast_radius(calls, failed):
            callers = {}
            for service, callees in calls.items():
                for callee in callees:
                    callers.setdefault(callee, []).append(service)
            distances = {failed: 0}
            queue = deque([failed])
            while queue:
                current = queue.popleft()
                for caller in callers.get(current, []):
                    if caller not in distances:
                        distances[caller] = distances[current] + 1
                        queue.append(caller)
            del distances[failed]
            return distances
    tests:
      - name: finds direct and indirect dependents
        code: |
          calls = {"web": ["api"], "api": ["db", "cache"], "worker": ["db"], "cache": []}
          assert blast_radius(calls, "db") == {"api": 1, "worker": 1, "web": 2}
      - name: reports the fewest hops
        code: |
          calls = {
              "gateway": ["search", "orders"],
              "search": ["catalog"],
              "catalog": ["payments"],
              "orders": ["payments"],
          }
          assert blast_radius(calls, "payments") == {"catalog": 1, "orders": 1, "search": 2, "gateway": 2}
      - name: nothing depends on the failed service
        code: |
          assert blast_radius({"a": ["b"]}, "a") == {}
          assert blast_radius({"a": ["b"]}, "unknown") == {}
      - name: survives cycles and self-calls
        hidden: true
        code: |
          assert blast_radius({"a": ["b"], "b": ["c"], "c": ["a"]}, "a") == {"c": 1, "b": 2}
          assert blast_radius({"a": ["a", "b"]}, "b") == {"a": 1}
          assert blast_radius({"a": ["a"]}, "a") == {}
      - name: does not modify the input
        hidden: true
        code: |
          import copy
          calls = {"web": ["api"], "api": ["db"], "worker": ["db", "api"]}
          before = copy.deepcopy(calls)
          blast_radius(calls, "db")
          assert calls == before
      - name: handles a chain of 20,000 services
        hidden: true
        code: |
          calls = {f"s{i}": [f"s{i + 1}"] for i in range(20_000)}
          result = blast_radius(calls, "s20000")
          assert len(result) == 20_000
          assert result["s19999"] == 1 and result["s0"] == 20_000

  - slug: graphs-missing-visited-debug
    skill: algo-graphs
    kind: debugging
    difficulty: 4
    minutes: 10
    tags: [interview]
    title: A permission check that never finishes
    objective: Diagnose a BFS without a visited set on a cyclic graph and fix it so that each node is queued at most once.
    prompt: |
      Permission groups can include other groups, and this helper checks
      whether a group inherits from `admin`. It passes its unit tests, which use
      small trees. In production, some checks never finish and the worker's
      memory climbs until it is killed. It only happens for groups that do
      **not** inherit from `admin`.

      Select the line with the defect and explain the fix.
    hints:
      - Production group data isn't a tree. What happens when group A includes B and B includes A?
      - Why would the hang only happen when the answer is False?
    explanation: |
      Group inheritance contains cycles, and the BFS appends every neighbour
      unconditionally, so the same groups are enqueued again and again. When
      `admin` is reachable, BFS still reaches it after finitely many levels,
      which is why positive checks return. When it isn't, the queue never
      empties and keeps growing. Keep a visited set seeded with `start` and add
      each neighbour to it **when it is enqueued**, skipping neighbours already
      seen. Every node is then queued at most once and the search is O(V + E).
    solution: |
      Line 12 appends every neighbour unconditionally. Group inheritance has
      cycles (A includes B, B includes A), so the same groups are enqueued
      again and again. If `admin` is unreachable the queue never empties and
      keeps growing, which explains both the hang and the memory climb. When
      `admin` is reachable, BFS still reaches it eventually, which is why only
      negative checks hang.

      Fix: keep a visited set seeded with `start` and add each neighbour to it
      when it is enqueued, skipping neighbours already seen. Each node is then
      queued at most once and the search is O(V + E).

      ```python
      queue, visited = deque([start]), {start}
      while queue:
          node = queue.popleft()
          if node == target:
              return True
          for neighbour in graph.get(node, []):
              if neighbour not in visited:
                  visited.add(neighbour)
                  queue.append(neighbour)
      return False
      ```
    content:
      language: python
      code: |
        from collections import deque


        def can_reach(graph, start, target):
            """True if target is reachable from start; graph maps node -> list of neighbours."""
            queue = deque([start])
            while queue:
                node = queue.popleft()
                if node == target:
                    return True
                for neighbour in graph.get(node, []):
                    queue.append(neighbour)
            return False
