  - slug: hashing-set-lookup-mcq
    skill: algo-hashing
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    tags: [interview]
    title: Why is a set lookup fast?
    objective: Explain why membership tests on a set are O(1) on average while on a list they are O(n).
    prompt: |
      `blocked` holds 100,000 IP addresses. Checking `ip in blocked` is
      effectively instant when `blocked` is a `set`, but noticeably slow when it
      is a `list`.

      Why?
    hints:
      - A list only knows positions. What extra information does a set compute for every element it stores?
      - Think about where the set looks first when you ask about `ip`.
    explanation: |
      A set (like a dict) is a hash table. It computes `hash(ip)`, uses it to
      pick a slot, and only compares `ip` with the entries found there, which
      takes O(1) on average regardless of size. A list has no index by value,
      so `in` compares elements one by one: O(n). Sets aren't sorted, and
      nothing is cached between lookups.
    content:
      options:
        - id: a
          text: The set hashes `ip` to find the slot where it would be stored and compares only the few entries there, while the list compares `ip` with its elements one by one.
          correct: true
          feedback: Right. Hashing turns the question "is it here?" into "look in this one place", which is O(1) on average.
        - id: b
          text: Sets keep their elements sorted, so Python can binary-search them.
          feedback: Sets are unordered (iterating one doesn't give sorted output), and a binary search would be O(log n), not the O(1) average of a hash lookup.
          misconception:
            code: sets-are-sorted
            label: Thinks sets are kept sorted and searched with binary search
            category: conceptual
        - id: c
          text: A set stores each value only once, so there are fewer elements to scan.
          feedback: With 100,000 distinct addresses both hold the same number of items. The speed comes from hashing, not from removing duplicates.
          misconception:
            code: set-is-deduplicated-list
            label: Thinks a set is a de-duplicated list that is scanned
            category: conceptual
        - id: d
          text: Python caches the results of earlier membership tests on sets.
          feedback: There is no result cache. Even the very first lookup of a new address is fast, because the hash points straight at the right slot.
          misconception:
            code: membership-cached
            label: Believes membership results are cached between lookups
            category: conceptual

  - slug: hashing-gift-card-pair
    skill: algo-hashing
    kind: python_code
    difficulty: 2
    minutes: 15
    tags: [interview]
    title: Spend a gift card exactly
    objective: Use a dict of previously seen values to find a pair with a target sum in one pass, with deterministic tie-breaking.
    prompt: |
      A checkout feature lets customers spend a gift card exactly. Given item
      prices in cents (in catalogue order) and the card balance, find two
      **different** items whose prices add up exactly to the balance.

      Write `find_exact_pair(prices, balance)`:

      - Return a tuple `(i, j)` with `i < j` and
        `prices[i] + prices[j] == balance`, or `None` if no pair exists.
      - If several pairs exist, return the one with the smallest `j`. If several
        `i` work with that `j`, return the smallest `i`.
      - Catalogues can hold 100,000 items, so aim for O(n).

      ```python
      find_exact_pair([500, 1200, 300, 700], 1000)   # (2, 3)
      ```
    hints:
      - For each price, which other price would complete the pair? Could you check whether you've already seen it in O(1)?
      - Scan left to right and remember where each price was first seen. The first `j` that finds its partner is the smallest `j`.
      - Look up the partner before recording the current price, so an item can't pair with itself, and keep the first index when a price repeats.
    explanation: |
      Brute force checks every pair, which is O(n²) and about 5 billion pairs
      for 100,000 items. Instead, scan once and keep a dict from price to the
      first index where it appeared. For each `j`, the partner is
      `balance - prices[j]`, and a dict lookup tells you in O(1) on average
      whether it appeared earlier. Checking before inserting stops an item
      pairing with itself, and keeping the *first* index (`setdefault`)
      gives the smallest `i`.
    solution: |
      ```python
      def find_exact_pair(prices, balance):
          first_index = {}
          for j, price in enumerate(prices):
              i = first_index.get(balance - price)
              if i is not None:
                  return (i, j)
              first_index.setdefault(price, j)
          return None
      ```

      This is a single O(n) pass with O(n) extra memory. Overwriting with
      `first_index[price] = j` would return the *latest* earlier index instead
      of the smallest one.
    content:
      starter_code: |
        def find_exact_pair(prices, balance):
            """Return (i, j) with i < j and prices[i] + prices[j] == balance, or None."""
            return None
      reference_solution: |
        def find_exact_pair(prices, balance):
            first_index = {}
            for j, price in enumerate(prices):
                i = first_index.get(balance - price)
                if i is not None:
                    return (i, j)
                first_index.setdefault(price, j)
            return None
    tests:
      - name: finds the matching pair
        code: |
          assert find_exact_pair([500, 1200, 300, 700], 1000) == (2, 3)
      - name: returns None when no pair exists
        code: |
          assert find_exact_pair([100, 200], 1000) is None
          assert find_exact_pair([], 1000) is None
      - name: an item can't be used twice
        code: |
          assert find_exact_pair([500, 250], 1000) is None
          assert find_exact_pair([500, 250, 500], 1000) == (0, 2)
      - name: picks the smallest j, then the smallest i
        hidden: true
        code: |
          assert find_exact_pair([1, 5, 5, 9], 10) == (1, 2)
          assert find_exact_pair([3, 3, 7], 10) == (0, 2)
          assert find_exact_pair([0, 0], 0) == (0, 1)
      - name: handles 100,000 prices quickly
        hidden: true
        code: |
          assert find_exact_pair(list(range(100_000)), 10**9) is None
          assert find_exact_pair(list(range(0, 200_000, 2)), 399_994) == (99_998, 99_999)

  - slug: hashing-dict-lookup-explain
    skill: algo-hashing
    kind: concept_explanation
    difficulty: 2
    minutes: 8
    title: How does a dict find a key?
    objective: Explain hash-table lookup, why O(1) is an average, and why keys must be hashable and must not change.
    prompt: |
      A junior colleague asks:

      > Why is looking up a key in a dict O(1) when searching a list is O(n)?
      > And why does Python refuse to use a list as a dict key, when a tuple is
      > fine?

      Explain how a hash table finds a key, why the O(1) is an *average*
      rather than a guarantee, and what hashability and immutability have to
      do with it.
    hints:
      - Start from what Python does with `hash(key)`. Where does that number send the lookup?
      - Two different keys can end up in the same place. What does Python do then, and what happens if that occurs a lot?
      - The entry is filed under the hash computed when it was inserted. What if the key changed afterwards?
    explanation: |
      A dict is an array of slots. Python computes `hash(key)`, derives a slot
      from it and looks there, then confirms with `==` that the stored key is
      really equal, so no scan of the other entries is needed. Different keys
      can land in the same slot (a **collision**), and Python then probes
      further slots. With a good hash function and automatic resizing,
      collisions stay rare and lookups average O(1), but many colliding keys
      (a poor `__hash__` or adversarial input) degrade towards O(n).

      The entry is filed under the hash computed at insertion, so a key's
      hash must never change while it is stored. Lists are mutable, so Python
      makes them unhashable. A tuple's hash is stable as long as everything
      inside it is hashable too.
    solution: |
      A dict is a hash table: an array of slots. To store or find a key,
      Python calls `hash(key)` and uses that number to compute which slot to
      look in, so it jumps almost directly to the right place instead of
      scanning every entry the way a list search does. Because the hash only
      narrows the search, Python then compares the key in that slot with `==`
      to confirm it really is the same key.

      The O(1) is an average. Different keys can map to the same slot (a
      collision), and Python then probes other slots. With a good hash
      function and a table that resizes as it fills, collisions stay rare, but
      many colliding keys (a bad `__hash__` or adversarial input) degrade
      lookups towards O(n) in the worst case.

      Keys must be hashable, and their hash must never change while they are
      in the dict, because the entry is filed under the hash computed at
      insertion time. A list is mutable. If you appended to it after inserting
      it, its hash would change and the dict would look in the wrong slot, so
      Python refuses to hash lists. A tuple is immutable, so its hash is
      stable (as long as everything inside it is hashable too).
    content:
      min_words: 40
      max_words: 350
      placeholder: Explain hashing, collisions and why keys must not change…
      criteria:
        - id: hash-to-slot
          label: Explains that the key's hash determines the slot to look in, so no scan is needed
          weight: 2
          required: true
          any: ["slot", "bucket", "jump", "directly", "straight to", "without scanning", "instead of scanning", 're:\bhash\w*.{0,80}\b(position|location|index|slot|bucket|address|array|table)', 're:\b(compute|calculate|work out|determine)s?\b.{0,40}\b(where|position|location|index|slot)']
          missing_feedback: Explain how a hash table uses `hash(key)` to know where to look, instead of scanning.
          misconception:
            code: dict-lookup-is-scan
            label: Thinks dict lookups search through the stored keys
            category: conceptual
        - id: collisions
          label: Explains collisions and why O(1) is an average that can degrade towards O(n)
          weight: 2
          any: ["collision", "collide", "same slot", "same bucket", "same hash", "same index", "same position", "same place", "same spot", "worst", "degrad", "slow down", "slows down", "toward linear", "towards linear", "probe", "probing", "chaining", "chain"]
          missing_feedback: Why is O(1) only an average? What happens when different keys land in the same place?
          misconception:
            code: hashing-always-constant
            label: Believes dict lookups are O(1) in every case
            category: performance
        - id: equality-check
          label: Mentions that keys found via the hash are confirmed with an equality comparison
          weight: 1
          any: ["==", "__eq__", "equality", "equal", "compar", "same key"]
          missing_feedback: After finding the slot, how does Python know the stored key is really the one you asked for?
        - id: stable-hash
          label: Explains that a key's hash must not change while stored, which is why mutable lists are rejected
          weight: 2
          any: ["immutable", "mutable", "mutat", "can change", "could change", "would change", "might change", "changes", "modif", "stale", "frozen", "never change", "stable", 're:\bhash\w*\s+(would|could|might|will)\s+(change|differ)']
          missing_feedback: What would go wrong if a key could change after it was inserted?
          misconception:
            code: mutable-key-hash
            label: Doesn't see why a key's hash must stay constant while it is stored
            category: conceptual

