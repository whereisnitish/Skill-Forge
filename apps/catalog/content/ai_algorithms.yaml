          missing_feedback: Trace `merge_sort` on a one-element list. What are `events[:mid]` and `events[mid:]`?
          misconception:
            code: recursion-no-progress
            label: Doesn't check that every recursive call works on a smaller input
            category: logic
        - id: fix-base-case
          label: Changes the base case to cover lists of length 0 or 1
          weight: 2
          any: ['re:<=\s*1', 're:<\s*2', 're:==\s*1', "less than 2", "less than two", "fewer than 2", "fewer than two", "one or fewer", "1 or fewer", "at most one", "at most 1", "zero or one", "0 or 1", "one or zero", 're:\b(empty|0|zero)\s+or\s+(one|1|a single)']
          missing_feedback: Which condition should the base case test so that every list that can't be split further returns immediately?
          misconception:
