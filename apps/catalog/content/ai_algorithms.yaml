            category: conceptual

  - slug: eval-exact-match-scorer
    skill: llm-evaluation
    secondary_skills: [algo-hashing]
    kind: python_code
    difficulty: 4
    minutes: 20
    tags: [scenario]
    title: Score an intent classifier against an eval set
    objective: Implement a normalised exact-match scorer with per-category accuracy, failure listing and eval-set sanity checks.
    prompt: |
      You're adding a regression check for an intent classifier. Write
      `score_exact_match(cases, predictions)`:

      - `cases` is a list of dicts such as
        `{"id": "c1", "expected": "refund", "category": "billing"}`. `expected`
        is either a string or a list of acceptable strings.
      - `predictions` maps case id to the model's raw output string. A case
        with no prediction counts as incorrect. Predictions for ids that are not
        in `cases` are ignored.
      - Compare after normalising both sides: case-fold, collapse runs of
        whitespace to a single space, strip surrounding whitespace, and remove
        trailing `.`, `!` and `?` characters.
      - Return
        `{"accuracy": float, "by_category": {category: float}, "failures": [ids]}`.
        `accuracy` is the fraction of cases that are correct, `by_category`
        gives that fraction per category, and `failures` lists the failing case
        ids in the order the cases appear.
      - Raise `ValueError` if `cases` is empty or if two cases share an id, since
        a duplicated case silently skews the score.
    hints:
      - Write a small `normalise(text)` helper first, and apply it to the prediction and to every expected answer.
      - Keep two counters per category (cases and correct), so a single pass fills both the overall and the per-category results.
      - Use `predictions.get(case_id)` so that missing predictions become failures instead of a `KeyError`.
    explanation: |
      Exact match is the right metric when the output space is a fixed set of
      labels, but only after normalisation. Otherwise "Refund." and "refund"
      count as different answers and the metric measures formatting instead of
      correctness. Per-category scores expose regressions that an overall
      average hides, the failure list tells you which cases to read, and
      rejecting duplicate or empty eval sets protects the number from silent
      data problems.
    solution: |
      ```python
      def _normalise(text):
          return " ".join(str(text).casefold().split()).rstrip(".!?").strip()

      def score_exact_match(cases, predictions):
          if not cases:
              raise ValueError("no eval cases")
          seen, totals, correct, failures = set(), {}, {}, []
          for case in cases:
              case_id = case["id"]
              if case_id in seen:
                  raise ValueError(f"duplicate case id {case_id!r}")
              seen.add(case_id)
              expected = case["expected"]
              if isinstance(expected, str):
                  expected = [expected]
              accepted = {_normalise(answer) for answer in expected}
              prediction = predictions.get(case_id)
              ok = prediction is not None and _normalise(prediction) in accepted
              category = case["category"]
              totals[category] = totals.get(category, 0) + 1
              correct[category] = correct.get(category, 0) + int(ok)
              if not ok:
                  failures.append(case_id)
          return {
              "accuracy": (len(cases) - len(failures)) / len(cases),
              "by_category": {c: correct[c] / totals[c] for c in totals},
              "failures": failures,
          }
      ```
    content:
      starter_code: |
        def score_exact_match(cases, predictions):
            """Return accuracy, per-category accuracy and failing ids for an eval run."""
            correct = 0
            for case in cases:
                if predictions[case["id"]] == case["expected"]:
                    correct += 1
            return {"accuracy": correct / len(cases), "by_category": {}, "failures": []}
      reference_solution: |
        def _normalise(text):
            return " ".join(str(text).casefold().split()).rstrip(".!?").strip()


        def score_exact_match(cases, predictions):
            if not cases:
                raise ValueError("no eval cases")
            seen = set()
            totals = {}
            correct = {}
            failures = []
            for case in cases:
                case_id = case["id"]
                if case_id in seen:
                    raise ValueError(f"duplicate case id {case_id!r}")
                seen.add(case_id)
                expected = case["expected"]
                if isinstance(expected, str):
                    expected = [expected]
                accepted = {_normalise(answer) for answer in expected}
                prediction = predictions.get(case_id)
                ok = prediction is not None and _normalise(prediction) in accepted
                category = case["category"]
                totals[category] = totals.get(category, 0) + 1
                correct[category] = correct.get(category, 0) + (1 if ok else 0)
                if not ok:
                    failures.append(case_id)
            return {
                "accuracy": (len(cases) - len(failures)) / len(cases),
                "by_category": {category: correct[category] / totals[category] for category in totals},
                "failures": failures,
            }
    tests:
      - name: scores normalised exact matches per category
        code: |
          cases = [
              {"id": "c1", "expected": "refund", "category": "billing"},
              {"id": "c2", "expected": "cancel subscription", "category": "billing"},
              {"id": "c3", "expected": "reset password", "category": "account"},
              {"id": "c4", "expected": "reset password", "category": "account"},
          ]
          predictions = {"c1": " Refund. ", "c2": "Cancel   subscription!", "c3": "reset password", "c4": "change email"}
          result = score_exact_match(cases, predictions)
          assert result["accuracy"] == 0.75
          assert result["by_category"] == {"billing": 1.0, "account": 0.5}
          assert result["failures"] == ["c4"]
      - name: accepts any of several expected answers
        code: |
          cases = [
              {"id": "a", "expected": ["cancel", "cancel subscription"], "category": "billing"},
              {"id": "b", "expected": ["cancel", "cancel subscription"], "category": "billing"},
          ]
          result = score_exact_match(cases, {"a": "Cancel subscription.", "b": "CANCEL"})
          assert result["accuracy"] == 1.0
          assert result["failures"] == []
      - name: missing predictions count as failures
        hidden: true
        code: |
          cases = [
              {"id": "c1", "expected": "refund", "category": "billing"},
              {"id": "c2", "expected": "refund", "category": "billing"},
          ]
          result = score_exact_match(cases, {"c1": "refund", "zz": "refund"})
          assert result["accuracy"] == 0.5
          assert result["by_category"] == {"billing": 0.5}
          assert result["failures"] == ["c2"]
      - name: keeps failures in case order across categories
        hidden: true
        code: |
          import math
          cases = [
              {"id": "q3", "expected": "bug", "category": "tech"},
              {"id": "q1", "expected": "bug", "category": "tech"},
              {"id": "q2", "expected": "outage", "category": "tech"},
              {"id": "q9", "expected": "invoice", "category": "billing"},
          ]
          predictions = {"q3": "feature request", "q1": "Bug?", "q2": "bug", "q9": "invoice"}
          result = score_exact_match(cases, predictions)
          assert result["failures"] == ["q3", "q2"]
          assert math.isclose(result["by_category"]["tech"], 1 / 3)
          assert result["by_category"]["billing"] == 1.0
          assert result["accuracy"] == 0.5
      - name: rejects empty and duplicated eval sets
        hidden: true
        code: |
          for bad_cases in (
              [],
              [
                  {"id": "x", "expected": "a", "category": "c"},
                  {"id": "x", "expected": "b", "category": "c"},
              ],
          ):
              try:
                  score_exact_match(bad_cases, {"x": "a"})
              except ValueError:
                  continue
              raise AssertionError(f"expected ValueError for {bad_cases!r}")

  - slug: eval-llm-judge-explain
    skill: llm-evaluation
    secondary_skills: [llm-rag]
    kind: concept_explanation
    difficulty: 4
    minutes: 10
    tags: [scenario]
    title: Set up an LLM judge you can trust
    objective: Explain how to design, calibrate and use model-graded evaluation, including its known biases.
    prompt: |
      Your team wants to grade a RAG assistant's free-text answers
      automatically with another model ("LLM-as-judge"), because exact match
      fails on paraphrased answers.

      Explain how you would set this up so the scores can be trusted:

      - what the judge should be given and asked;
      - how you would check the judge itself;
      - which biases or failure modes you would watch for;
      - how you would use the results when changing prompts or models.
    hints:
      - '"Rate this answer from 1 to 10" is a vague instruction. What would make the judge''s task concrete?'
      - A judge is itself a model whose output needs evaluating. What would you compare its verdicts with?
      - Think about answer length, the order in which answers are shown, and how you would compare two versions of the system.
    explanation: |
      A judge is a measurement instrument, so build it and test it like one.
      Give it a narrow rubric with concrete, preferably pass/fail questions,
      together with the question, the retrieved sources and a reference answer.
      Then **measure its agreement with human labels** on a sample before
      relying on it, and re-check whenever the judge prompt or model changes.
      Known biases include favouring longer or more confident answers,
      position bias in pairwise comparisons (swap the order), preferring its
      own model family, and run-to-run variance. Use the judge on a fixed,
      versioned eval set, compare every change against a baseline per
      category, and read the regressions instead of trusting only the average.
    solution: |
      I'd give the judge a narrow rubric rather than "rate this from 1 to 10":
      the question, the retrieved source passages and a reference answer,
      plus specific pass/fail questions such as "Is every claim supported by
      the sources?" and "Does it answer the question that was asked?", with a
      short justification for each verdict.

      Before trusting it, I'd have people label a sample of a few hundred
      answers and measure the judge's agreement with those human labels,
      iterating on the judge prompt until agreement is high. I'd repeat that
      calibration whenever the judge model or prompt changes.

      Biases to watch: judges tend to favour longer, more verbose answers, can
      prefer whichever answer is shown first (position bias, so swap the order
      and average), may prefer outputs from their own model family, and are
      themselves non-deterministic.

      Finally, I'd run the judge on a fixed, versioned eval set for every
      prompt or model change, compare against the current baseline per
      category, read the regressions rather than just the average, and keep
      spot-checking judge decisions by hand.
    content:
      min_words: 50
      max_words: 400
      placeholder: Describe the judge's inputs, how you'd validate it, its biases and how you'd use it…
      criteria:
        - id: human-calibration
          label: Checks the judge against human-labelled examples (agreement or calibration)
          weight: 2
          required: true
          any: ["human", "people", "person", "expert", "reviewer", "by hand", "manual", "agreement", "agree", "calibrat", "hand label", "labelled", "labeled", "gold", "annotat", "inter rater", "kappa", "spot check", 're:\b(check|validat|compar|test)\w*\s+(the\s+)?judge', 're:\bhow often\b.{0,40}\bmatch']
          missing_feedback: How would you know the judge's verdicts are right? Compare it with something you trust.
          misconception:
            code: uncalibrated-judge
            label: Trusts model-graded scores without checking them against human judgement
            category: conceptual
        - id: rubric-inputs
          label: Gives the judge a concrete rubric plus the sources or a reference answer
          weight: 2
          any: ["rubric", "criteria", "criterion", "checklist", "reference answer", "reference", "expected answer", "ground truth", "gold answer", "source", "retrieved", "context", "pass/fail", "pass or fail", "pass fail", "binary", "yes/no", "yes or no", "faithful", "grounded", "supported by"]
          missing_feedback: What exactly does the judge see, and what precise question does it answer?
        - id: judge-biases
          label: Names judge biases such as verbosity, position or self-preference, or run-to-run variance
          weight: 1
          any: ["bias", "verbos", "longer answers", "long answers", "length", "position", "first option", "first answer", "shown first", "order of", "swap", "self preference", "own outputs", "own answers", "same model", "same family", "own model family", "sycophan", "lenient", "leniency", "inconsistent", "non determin", "nondetermin", "variance"]
          missing_feedback: Judges have systematic preferences. Name some and say how you'd counter them.
          misconception:
            code: judge-is-unbiased
            label: Assumes an LLM judge grades without systematic biases
            category: conceptual
        - id: regression-process
          label: Uses the judge on a fixed eval set and compares each change against a baseline
          weight: 1
          any: ["baseline", "regression", "compar", "before and after", "every change", "each change", "every prompt", "each prompt", 're:\bci\b', "continuous integration", "versioned", "fixed set", "fixed eval", "same eval", "same set", "same dataset", "over time", "per category", "side by side", "a/b"]
          missing_feedback: How do the judge's scores feed into decisions about prompt and model changes?

