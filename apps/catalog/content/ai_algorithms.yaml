# AI engineering and algorithms curriculum.
# Skill graph: docs/curriculum-map.md, section "ai_algorithms.yaml".
# Schema: docs/content-authoring.md.

skills:
  # ---------------------------------------------------------------------------
  # Category: ai-engineering
  # ---------------------------------------------------------------------------
  - slug: llm-fundamentals
    name: "LLM fundamentals: tokens & context"
    category: ai-engineering
    difficulty: 1
    review_interval_days: 3
    summary: Understand how language models read and write tokens, what the context window limits, and how sampling settings such as temperature shape the output.
    description: |
      Large language models read and write **tokens**, which are sub-word pieces
      of text, not whole words or characters. Each request sends the entire
      input (system instructions, conversation history, any documents), and the
      model generates its reply one token at a time by sampling from a
      probability distribution over possible next tokens. The **context window**
      caps how many tokens a single request can involve, and the generated
      tokens count towards it too.

      These mechanics drive everyday engineering decisions. Cost and latency
      scale with tokens, long conversations and large documents have to be
      trimmed or summarised to fit, and settings such as temperature control
      how varied the output is. The model keeps no memory between calls, so
      your application must send all the context each request needs.

      Common pitfalls: estimating limits in words instead of tokens, forgetting
      to reserve room for the reply, assuming the model "remembers" earlier
      requests, and expecting temperature 0 to make output identical every time.
    objectives:
      - Explain what tokens are and why token counts differ from word or character counts.
      - Budget a context window across the system prompt, history, retrieved content and the reserved reply.
      - Explain how temperature changes sampling and why outputs vary between identical requests.
      - Recognise that the model is stateless and each request must carry the context it needs.

  - slug: llm-prompting
    name: Prompt design
    category: ai-engineering
    difficulty: 2
    review_interval_days: 3
    summary: Write prompts that are specific and testable, with explicit instructions, delimited inputs, worked examples and a defined output format.
    description: |
      Prompt design turns a task into instructions a model can follow
      reliably: a clear goal, explicit constraints, the exact output format
      and, where it helps, a few worked examples (few-shot prompting). Good
      prompts keep instructions separate from the data being processed, using
      message roles and clear delimiters so the model can tell what to *do*
      from what to *read*.

      In production a prompt is code. It is versioned, tested against examples
      and changed deliberately. Vague prompts produce replies that vary in shape
      and content, which breaks the code that consumes them. Untrusted text
      (user messages, emails, web pages) mixed into the instructions opens the
      door to **prompt injection**, where that text tries to override your
      instructions.

      Common pitfalls: relying on emphasis ("VERY IMPORTANT") instead of a
      precise specification, asking for a format but never checking it,
      trimming history in a way that silently drops the system prompt, and
      believing a clever instruction alone can make injection impossible.
    objectives:
      - Separate instructions from untrusted data using message roles and clear delimiters.
      - Specify the task, constraints and exact output format, adding few-shot examples where useful.
      - Manage conversation history so the system instructions are never silently dropped.
      - Recognise prompt injection risks and why prompt wording alone cannot fully prevent them.
    prerequisites:
      - llm-fundamentals

  - slug: llm-structured-output
    name: Structured output & validation
    category: ai-engineering
    difficulty: 3
    review_interval_days: 2
    summary: Get machine-readable output from a model and treat it as untrusted input by requesting a schema, parsing defensively, validating every field and handling failures.
    description: |
      Structured output means asking a model for machine-readable data,
      usually JSON matching a schema with named fields, types and allowed
      values, so that your code can act on it. Many APIs offer a JSON mode or
      schema-constrained generation, and libraries can derive a schema from a
      typed class. Even so, the content is produced by a probabilistic model
      and must be treated as **untrusted input**.

      Robust systems parse defensively (stray prose, Markdown code fences),
      validate every field (required keys, types, enums, ranges, cross-field
      rules) and decide what happens on failure: a bounded retry that feeds the
      validation error back, a safe fallback, or routing to a human. Validation
      is also a security boundary. If a model's output can trigger refunds,
      emails or database writes, the values must be checked against business
      rules, not just against the schema.

      Common pitfalls: assuming syntactically valid JSON means correct data,
      calling `json.loads` with no error handling, trusting model-chosen
      amounts or IDs, and retrying malformed output without a limit.
    objectives:
      - Request output in an explicit schema with named fields, types and allowed values.
      - Parse model replies defensively, including stray prose and Markdown code fences.
      - Validate required fields, types, enums and ranges before acting on the data.
      - Handle invalid output with bounded retries, a safe fallback or human review.
      - Explain why valid JSON, or a schema-conformant reply, is not the same as correct data.
    prerequisites:
      - llm-prompting
      - skill: py-typing
        strength: recommended
        min_mastery: 0.5
    related: [py-typing]

  - slug: llm-rag
    name: Retrieval-augmented generation
    category: ai-engineering
    difficulty: 3
    review_interval_days: 2
    summary: Ground model answers in your own documents by chunking and embedding content, retrieving the most relevant passages and assembling them into a safe, citeable prompt.
    description: |
      Retrieval-augmented generation (RAG) answers questions from your own
      content. Documents are split into chunks, each chunk is turned into an
      **embedding** (a vector that captures its meaning), and at query time the
      most similar chunks are retrieved and placed in the prompt so the model
      can answer from them and cite them. It is how assistants work with
      private, recent or frequently changing knowledge without retraining a
      model.

      Quality is mostly decided before the model sees anything: chunk size and
      overlap, metadata, whether retrieval combines semantic (vector) and
      lexical (keyword) search, how many chunks fit the token budget, and
      whether permissions are enforced in the search itself. The prompt then
      has to treat retrieved text as reference data (delimited, cited and never
      obeyed as instructions) and give the model an explicit way to say that
      the answer is not in the documents.

      Common pitfalls: chunks so small they lose context or so large they
      dilute relevance, relying on embeddings alone for exact identifiers such
      as error codes, stuffing dozens of chunks into the prompt, filtering by
      permission in the prompt instead of in the query, and blaming the model
      for what is really a retrieval failure.
    objectives:
      - Split documents into chunks with a sensible size and overlap.
      - Explain how embedding similarity retrieval works and where it struggles, such as exact identifiers.
      - Assemble retrieved context with delimiters, source citations and an explicit "not found" path.
      - Enforce access control at retrieval time rather than in the prompt.
      - Diagnose whether a bad answer came from retrieval or from generation.
    prerequisites:
      - llm-prompting

  - slug: llm-evaluation
    name: Evaluating LLM systems
    category: ai-engineering
    difficulty: 4
    review_interval_days: 2
    summary: Measure LLM features like any other software by building representative eval sets, choosing metrics that fit the task and catching regressions before users do.
    description: |
      Evaluating an LLM system means measuring, repeatedly and automatically,
      whether it does its job, so that prompt edits, model upgrades and
      retrieval changes are compared on evidence rather than impressions. The
      core asset is an **eval set**: representative real inputs with expected
      outputs or grading rubrics, including edge cases and past failures, kept
      under version control.

      Metrics follow the task. Classification and extraction can use exact
      match after normalisation, retrieval uses measures such as recall@k, and
      open-ended answers need rubric grading by people or by a model acting as
      a judge, which must itself be checked against human labels. Outputs vary
      between runs, so compare candidates on the same set, look at
      per-category results and individual regressions, and repeat runs when
      differences are small.

      Common pitfalls: shipping on a handful of hand-picked examples, eval sets
      that drift or are duplicated, a single average hiding a regression in one
      category, and trusting an unchecked LLM judge that favours longer answers
      or whichever option it sees first.
    objectives:
      - Build a versioned eval set from representative real cases, edge cases and known failures.
      - Choose metrics that fit the task, such as normalised exact match, recall@k or rubric scores.
      - Evaluate retrieval and generation separately in RAG systems.
      - Calibrate model-graded (LLM-as-judge) scoring against human labels and watch for its biases.
      - Compare every prompt, model or retrieval change against a baseline, per category.
    prerequisites:
      - llm-rag
      - llm-structured-output

  - slug: llm-tool-use
    name: Tool use & agents
    category: ai-engineering
    difficulty: 4
    review_interval_days: 2
    summary: Let models call your functions safely by describing tools with schemas, running the call-execute-respond loop, validating arguments and bounding what an agent can do.
    description: |
      Tool use (function calling) lets a model request actions. You describe
      tools with names, descriptions and JSON-schema parameters, and the model
      can reply with a structured call. **Your code** validates and executes
      it, sends the result back, and the model then continues or answers. An
      agent is this loop repeated until the task is done, which makes it
      powerful and also easy to get wrong.

      Every tool call is untrusted input that can have real side effects.
      Production agents validate arguments, authorise each call for the
      current user, prefer narrow purpose-built tools over general ones such as
      "run any SQL", bound the loop with step limits and timeouts, cap the size
      of tool output, and ask for confirmation before destructive actions.
      Because the model is stateless, the application must append the
      assistant's tool call and each tool result to the conversation before the
      next request.

      Common pitfalls: thinking the model provider runs your functions,
      forgetting to send tool results back (so the model repeats the call),
      unbounded `while True` loops, executing arguments without validation, and
      giving an agent broad credentials that a prompt injection could abuse.
    objectives:
      - Describe the tool-calling loop in which the model proposes a call, your code executes it and the result is sent back.
      - Define tools with clear names, descriptions and JSON-schema arguments.
      - Validate and authorise every tool call before executing it.
      - Bound agent loops with step limits, timeouts, output caps and confirmation for destructive actions.
      - Debug loops that repeat or stall by inspecting the message history sent to the model.
    prerequisites:
      - llm-structured-output

  # ---------------------------------------------------------------------------
  # Category: algorithms
  # ---------------------------------------------------------------------------
  - slug: algo-complexity
    name: Big-O complexity
    category: algorithms
    difficulty: 1
    review_interval_days: 3
    summary: Reason about how running time and memory grow with input size, and spot accidental quadratic work before it reaches production.
    description: |
      Big-O notation describes how an algorithm's running time or memory grows
      as its input grows, ignoring constant factors. It lets you predict
      whether code that is instant on a test fixture will still be acceptable
      with a million rows, and compare approaches before writing them.

      In real code the expensive parts are often hidden. `x in some_list`,
      `list.index`, `list.pop(0)`, `list.insert(0, x)` and slicing all do work
      proportional to the size of the list, so a loop around one of them turns
      linear-looking code into O(n²). Recognising the shape of loops (nested,
      halving, or running over a shrinking range) is the core skill.

      Common pitfalls: assuming nested loops are always O(n²) or that a single
      loop is always O(n), ignoring the cost of built-in operations, confusing
      average and worst case, and tuning constant factors while an accidental
      quadratic remains.
    objectives:
      - Derive the Big-O time complexity of simple, nested and halving loops.
      - Distinguish O(1), O(log n), O(n), O(n log n) and O(n²) growth and what each means at scale.
      - Identify hidden linear costs in Python operations such as `in` on a list, `list.index` and slicing.
      - Remove repeated work with running totals or precomputed lookups to avoid accidental quadratic behaviour.
    related: [py-performance]

  - slug: algo-hashing
    name: Hash maps & sets
    category: algorithms
    difficulty: 2
    review_interval_days: 3
    summary: Use dicts and sets for constant-time average lookups, counting and grouping, and understand what makes a good key and when hashing degrades.
    description: |
      Hash maps (`dict`) and hash sets (`set`) store items in a table indexed by
      each key's hash, so lookups, inserts and deletes take O(1) time on
      average instead of scanning. They are the workhorse behind
      de-duplication, counting, grouping, caching, joins and the "have I seen
      this before?" check that turns many O(n²) algorithms into O(n).

      Using them well means knowing their contract. Keys must be hashable, and
      objects that compare equal must have equal hashes. A key's hash must not
      change while it is stored, which is why lists cannot be keys and why
      mutating a field used by `__hash__` makes an object impossible to find.
      The O(1) is an average: many collisions, from a poor hash function or
      adversarial input, degrade operations towards O(n).

      Common pitfalls: membership tests against a list inside a loop, mutable
      objects as keys, defining `__eq__` without a matching `__hash__`, and
      relying on set iteration order for deterministic output.
    objectives:
      - Replace repeated linear searches with dict or set lookups.
      - Use a dict to count, group or remember previously seen values in a single pass.
      - Explain why average lookup is O(1) and what makes it degrade.
      - Explain why keys must be hashable and must not change while they are stored.
    prerequisites:
      - algo-complexity
      - py-data-structures

  - slug: algo-two-pointers
    name: Two pointers & sliding window
    category: algorithms
    difficulty: 3
    review_interval_days: 2
    summary: Solve sequence problems in linear time by moving two indices through the data, from pair searches on sorted arrays to sliding windows over logs and streams.
    description: |
      The two-pointer technique walks two indices through a sequence so that
      each element is processed a constant number of times. On sorted data,
      pointers moving inwards find pairs with a target sum. A slow and a fast
      pointer compact or partition a list in place. A **sliding window**, with
      a left and a right edge over a contiguous range, answers questions about
      subarrays and substrings, such as the longest run that fits a budget.

      These patterns turn brute-force scans over all pairs or ranges, which are
      O(n²) or worse, into O(n) passes. That matters for logs, metrics and
      streams as much as for interviews. The key is an invariant that
      justifies each move: why it is safe to discard an element or shrink the
      window without missing an answer.

      Common pitfalls: applying a window when the condition is not monotonic
      (for example a sum window when values can be negative), recording the
      answer before the window is valid again, off-by-one window lengths, and
      assuming a `while` nested inside a `for` must be quadratic.
    objectives:
      - Recognise problems where two indices can replace a nested loop.
      - Implement variable-size sliding windows that update their state incrementally.
      - Justify each pointer move with an invariant that rules out skipped candidates.
      - Explain why a window algorithm is O(n) even with a nested `while` loop.
      - Handle edge cases such as empty input, no valid window and ties.
    prerequisites:
      - algo-complexity

  - slug: algo-recursion
    name: Recursion
    category: algorithms
    difficulty: 3
    review_interval_days: 2
    summary: Solve problems by reducing them to smaller instances of themselves, with sound base cases, a clear picture of the call stack and a sense of when to iterate or memoise instead.
    description: |
      A recursive function solves a problem by calling itself on smaller
      inputs until it reaches a **base case** that it can answer directly.
      Recursion fits naturally whenever data is self-similar: trees, nested
      JSON or configuration, directory structures, divide-and-conquer
      algorithms such as merge sort, and backtracking searches.

      To reason about recursion, trust the recursive call to solve the smaller
      problem and check two things: the base cases cover every input that
      cannot be reduced further, and every recursive call makes progress
      towards one. In Python each call adds a stack frame and the default
      recursion limit is 1,000 frames, so very deep inputs such as a long chain
      may need an explicit stack instead. Repeated subproblems call for
      memoisation, for example with `functools.cache`.

      Common pitfalls: base cases that miss an input (such as a one-element
      list), recursive calls that do not shrink the input, discarding the value
      a recursive call returns, and exponential running time from recomputing
      the same subproblems.
    objectives:
      - Identify base cases and check that every recursive call makes progress towards one.
      - Trace recursive calls and their return values through the call stack.
      - Recurse over nested data such as trees, configuration documents and directory structures.
      - Recognise Python's recursion limit and when to switch to an explicit stack.
      - Use memoisation when subproblems repeat.
    prerequisites:
      - algo-complexity
      - py-functions

  - slug: algo-binary-search
    name: Binary search
    category: algorithms
    difficulty: 3
    review_interval_days: 2
    summary: Find values and boundaries in sorted data or monotonic conditions in O(log n), using loop invariants that avoid off-by-one errors and infinite loops.
    description: |
      Binary search finds a target in sorted data by repeatedly halving the
      range that can contain it, taking O(log n) steps: about 20 comparisons
      for a million items. More generally it finds the **boundary** of any
      monotonic condition, such as the first timestamp after a cutoff, the
      first release with a bug or the smallest capacity that meets a deadline,
      even when there is no array at all.

      Correct binary search is mostly about invariants: what is true of `lo`
      and `hi` on every iteration, whether the range is half-open, and how
      `mid` is rounded so that the range always shrinks. Python's `bisect`
      module implements the standard lower and upper bounds and is the right
      choice whenever it fits.

      Common pitfalls: off-by-one boundaries (`<` versus `<=`, `hi = mid`
      versus `hi = mid - 1`), loops that never end once two candidates remain,
      returning any match when the first one is needed, and applying binary
      search to unsorted data or a condition that is not monotonic.
    objectives:
      - Implement binary search with an explicit loop invariant and a half-open range.
      - Find boundaries such as the first or last position and the insertion point, not just any match.
      - Apply binary search to monotonic predicates such as the first failing release.
      - Diagnose off-by-one errors and non-terminating loops in hand-written searches.
      - Use the standard-library `bisect` module where it fits.
    prerequisites:
      - algo-complexity

  - slug: algo-graphs
    name: Graph traversal (BFS/DFS)
    category: algorithms
    difficulty: 4
    review_interval_days: 2
    summary: Explore networks of services, people and permissions with breadth-first and depth-first search, using a visited set to survive cycles and BFS for fewest-hop paths.
    description: |
      Graphs model anything made of things and connections: service
      dependencies, social networks, road maps, package imports and
      permission inheritance. Breadth-first search (BFS) explores level by
      level with a queue and finds the fewest-hops path in an unweighted graph.
      Depth-first search (DFS) goes as deep as possible first, using recursion
      or an explicit stack, and suits reachability, cycle detection and
      topological ordering.

      Both visit each vertex and edge a constant number of times, O(V + E),
      provided they remember which vertices they have already seen. Real graphs
      almost always contain cycles, so a missing visited set turns a fast
      traversal into an infinite loop or an exponential one. Choosing the right
      representation (usually a dict that maps each node to its neighbours)
      and the right direction for the edges matters as much as the traversal.

      Common pitfalls: no visited set, marking nodes only when they are
      dequeued so duplicates pile up in the queue, assuming DFS finds shortest
      paths, using BFS on weighted graphs where Dijkstra's algorithm is needed,
      and hitting the recursion limit on long paths.
    objectives:
      - Represent graphs as adjacency dicts and reverse edges when the question asks about dependents.
      - Implement BFS with a queue and a visited set, and explain why it finds fewest-hop paths.
      - Implement DFS recursively or with an explicit stack for reachability and cycle detection.
      - Choose between BFS, DFS and Dijkstra's algorithm for a given problem.
      - Analyse traversal cost as O(V + E).
    prerequisites:
      - algo-recursion
      - algo-hashing

challenges:
  # ===========================================================================
  # llm-fundamentals
  # ===========================================================================
  - slug: llm-context-window-mcq
    skill: llm-fundamentals
    kind: multiple_choice
    difficulty: 1
    minutes: 2
    diagnostic: true
    title: What has to fit in the context window?
    objective: Identify what counts against a model's context window in a chat request.
    prompt: |
      Your support assistant calls a chat model with a **16,000-token** context
      window. Each request contains a system prompt, the conversation so far and
      the customer's new message, and the model then writes a reply.

      Which statement about the 16,000-token limit is accurate?
    hints:
      - Think about everything the model has to work with at once while it writes the last token of its reply.
      - The model keeps no state between your API calls.
    explanation: |
      The context window is the total number of tokens the model can work with
      in a single request: everything you send **plus** everything it
      generates. The model is stateless, so your application resends the
      history on every call, and that history competes for the same budget as
      documents and the reply.

      Tokens are sub-word pieces, so the limit is not a word count. A common
      rule of thumb for English is roughly four characters, or three-quarters
      of a word, per token, but it depends on the tokenizer, and code, numbers
      and many other languages need more tokens per word.
    content:
      options:
        - id: a
          text: The system prompt, the history, the new message and the generated reply must all fit within 16,000 tokens together.
          correct: true
          feedback: Right. Input and output share one budget, so a long history leaves less room for documents and for the answer.
        - id: b
          text: Only the new message counts, because the provider remembers earlier turns of the conversation for you.
          feedback: Chat models are stateless between requests. Your application resends the history every time, and every resent token counts.
          misconception:
            code: model-remembers-conversation
            label: Thinks the model keeps conversation state between requests
            category: conceptual
        - id: c
          text: The limit is about 16,000 words, since a token is essentially one word.
          feedback: Tokens are sub-word units. Many common English words are a single token, but longer words, numbers, code and non-English text often split into several, so a word count underestimates usage.
          misconception:
            code: token-equals-word
            label: Thinks a token is the same as a word
            category: conceptual
        - id: d
          text: Only the input counts. The reply is budgeted separately, so a prompt that fills the window still leaves the model room to answer.
          feedback: Generated tokens share the context window with the prompt (APIs usually also cap the reply length separately). A prompt that fills the window leaves no room for the answer.
          misconception:
            code: output-not-in-context
            label: Forgets that generated tokens share the context window with the prompt
            category: conceptual

  - slug: llm-token-budget-short
    skill: llm-fundamentals
    kind: short_answer
    difficulty: 2
    minutes: 3
    tags: [scenario]
    title: Budget a context window for retrieved documents
    objective: Calculate how many tokens remain for retrieved content after reserving space for the rest of the request and the reply.
    prompt: |
      A documentation assistant uses a model with a **32,000-token** context
      window. Every request includes:

      | Part of the request | Tokens |
      |---|---|
      | System prompt | 1,500 |
      | Conversation history (already trimmed) | 9,000 |
      | The user's new question | 500 |

      You also reserve **2,000 tokens** for the model's answer.

      How many tokens can you spend on retrieved document chunks without
      exceeding the window? Answer with a number.
    hints:
      - Start from the full window and subtract every part of the request.
      - The tokens the model generates live in the same window as the prompt.
    explanation: |
      32,000 − 1,500 − 9,000 − 500 − 2,000 = **19,000** tokens.

      The reply shares the window with the prompt, so its reservation comes out
      of the same budget. Skip it and a request can fill the window, leaving
      the model no room to answer (or the API rejects the request). In
      production, count tokens with the model's own tokenizer and keep a safety
      margin, because the same text produces different token counts on
      different models.
    content:
      placeholder: e.g. 12000
      ignore_spaces: true
      accepted: ["19000", "19,000", "19k", "19000 tokens", "19,000 tokens", "19k tokens"]
      patterns: ['19[,.]?000(tokens?)?', '19k(tokens?)?']
      wrong:
        - answers: ["21000", "21,000", "21k"]
          feedback: That leaves out the 2,000 tokens reserved for the reply. Generated tokens count against the same window as the prompt.
          misconception:
            code: output-not-in-context
            label: Forgets that generated tokens share the context window with the prompt
            category: conceptual
        - answers: ["21500", "21,500"]
          feedback: That leaves out both the user's new question and the space reserved for the reply. Both are part of the request's token budget.
          misconception:
            code: output-not-in-context
            label: Forgets that generated tokens share the context window with the prompt
            category: conceptual
        - answers: ["19500", "19,500"]
          feedback: Close, but the user's new 500-token question is part of the request too.
        - answers: ["20500", "20,500"]
          feedback: Close, but the system prompt is sent with every request, so its 1,500 tokens count too.

  - slug: llm-temperature-explain
    skill: llm-fundamentals
    kind: concept_explanation
    difficulty: 2
    minutes: 7
    title: Why does the same prompt give different answers?
    objective: Explain token sampling and temperature, and choose settings and safeguards for an endpoint that needs repeatable output.
    prompt: |
      A teammate reports: "We sent exactly the same prompt twice and got two
      different answers, so the model must be broken." The request used
      `temperature=0.9`.

      Explain to them:

      1. how the model actually produces its reply, token by token;
      2. what temperature changes;
      3. what you would set and do if this endpoint must give consistent,
         repeatable output (for example, classifying tickets), including the
         limits of that approach.
    hints:
      - The model doesn't look anything up. At each step it scores every possible next token.
      - Temperature reshapes those scores before one token is picked. What happens to unlikely tokens at high and at low temperature?
      - Is temperature 0 a hard guarantee of identical output? What else would you put around a classification endpoint?
    explanation: |
      At every step the model computes a probability distribution over possible
      next tokens and **samples** one, appends it and repeats. Two runs can
      diverge as soon as one sampled token differs, and everything after it
      follows from that choice.

      Temperature rescales the distribution before sampling. High values
      flatten it, so less likely tokens are chosen more often and output is
      more varied. Low values sharpen it towards the most likely tokens, and
      temperature 0 approximates always taking the top token. For
      classification, use a low temperature, constrain the output to fixed
      labels and validate it. Even at temperature 0, identical output is not
      guaranteed: serving infrastructure (batching, floating-point effects)
      and model version changes can still flip close calls, so pin the model
      version and cache results when exact repeatability matters.
    solution: |
      A language model doesn't look up a stored answer. At each step it
      computes a probability distribution over the possible next tokens,
      samples one, appends it and repeats until the reply is finished. Two runs
      can therefore diverge as soon as a single sampled token differs.

      Temperature reshapes that distribution before sampling. A high
      temperature such as 0.9 flattens it, so less likely tokens are picked
      more often and the output is more varied and creative. A low temperature
      sharpens it towards the most likely tokens, so the output is more focused
      and predictable. With 0.9, variation is expected; the model isn't broken.

      For a classification endpoint I would set the temperature to 0 (or close
      to it), restrict the reply to a fixed set of labels and validate it in
      code. Even at temperature 0, output is not guaranteed to be identical on
      every call: batching and floating-point effects on the serving hardware
      can flip near-ties, and providers update models. So I would pin the model
      version, cache results where exact repeatability matters, and treat the
      output as mostly repeatable rather than fully deterministic.
    content:
      min_words: 40
      max_words: 320
      placeholder: Explain sampling, temperature and what you would change…
      criteria:
