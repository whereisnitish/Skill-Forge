  - slug: recursion-tree-depth-mcq
    skill: algo-recursion
    kind: multiple_choice
    difficulty: 2
    minutes: 3
    diagnostic: true
    tags: [interview]
    title: Trace a recursive depth calculation
    objective: Trace recursive calls and combine their return values correctly.
    prompt: |
      ```python
      def depth(node):
          if not node["children"]:
              return 1
          return 1 + max(depth(child) for child in node["children"])

      tree = {"children": [
          {"children": []},
          {"children": [{"children": []}]},
      ]}
      print(depth(tree))
      ```

      What does this print?
    hints:
      - Start with the leaves. What does `depth` return for a node with no children?
      - Work upwards. Each node adds 1 to the largest result among its children.
    explanation: |
      Work bottom-up. Every leaf hits the base case and returns 1. The second
      child has one leaf, so it returns 1 + max(1) = 2. The root returns
      1 + max(1, 2) = **3**. The empty-children check is the base case, and
      every recursive call is made on a child, which is a strictly smaller
      subtree, so the recursion always terminates.
    content:
      options:
        - id: a
          text: "3"
          correct: true
          feedback: Right. Leaves return 1, the middle node returns 1 + 1 = 2, and the root returns 1 + max(1, 2) = 3.
        - id: b
          text: "2"
          feedback: That misses one level. The root also adds 1 on top of the deepest child's result, which is 2.
          misconception:
            code: recursion-drops-a-level
            label: Loses a level when combining the values returned by recursive calls
            category: logic
        - id: c
          text: "4"
          feedback: That's the total number of nodes, which is what you would get by adding the children's results. `max` keeps only the deepest branch.
          misconception:
            code: sums-instead-of-max
            label: Combines child results by adding instead of taking the maximum
            category: logic
        - id: d
          text: RecursionError, because there is no base case.
          feedback: "`if not node[\"children\"]: return 1` is the base case. Leaves stop the recursion, and each call is made on a smaller subtree."
          misconception:
            code: missed-base-case
            label: Doesn't recognise the base case that stops the recursion
            category: conceptual

  - slug: recursion-flatten-settings
    skill: algo-recursion
    kind: python_code
    difficulty: 3
    minutes: 20
    tags: [interview]
    title: Flatten nested settings into dotted keys
    objective: Recurse over arbitrarily nested dicts, carrying a key prefix and validating keys along the way.
    prompt: |
      Your deployment tool stores settings as nested dictionaries, but the
      secrets manager it syncs to only accepts flat keys. Write
      `flatten(settings)` that returns a **new** flat dict whose keys join the
      nested keys with dots:

      ```python
      flatten({"db": {"host": "db.internal", "port": 5432}, "debug": False})
      # {"db.host": "db.internal", "db.port": 5432, "debug": False}
      ```

      Rules:

      - Nesting can be any depth.
      - Only dicts are descended into. Every other value (including lists,
        `None`, `0` and `False`) is a leaf and is kept as it is.
      - An empty nested dict contributes no keys.
      - All keys are strings. Raise `ValueError` if any key contains a `.`,
        since the flattened name would be ambiguous.
      - Don't modify the input.

      The starter code only handles one level of nesting.
    hints:
      - What is the smallest version of the problem? A dict whose values are all leaves.
      - Give your function (or a helper) a `prefix` parameter, so a nested call knows the path that led to it.
      - Check each key for a dot before you use it, at every level.
    explanation: |
      Nested dicts are a recursive structure, so the solution mirrors it. For
      each key, build the full dotted name from the prefix. If the value is a
      dict, recurse with that name as the new prefix, otherwise record a leaf.
      The base case is implicit: a dict with no nested dicts makes no further
      calls, and an empty dict contributes nothing. Building a new result
      instead of mutating the input keeps the function safe to call on shared
      configuration. Testing `isinstance(value, dict)` rather than truthiness
      keeps `0`, `False` and `None` as leaves.
    solution: |
      ```python
      def flatten(settings, prefix=""):
          flat = {}
          for key, value in settings.items():
              if "." in key:
                  raise ValueError(f"key {key!r} contains a dot")
              full_key = f"{prefix}.{key}" if prefix else key
              if isinstance(value, dict):
                  flat.update(flatten(value, full_key))
              else:
                  flat[full_key] = value
          return flat
      ```

      Recursion depth equals the nesting depth, which is tiny for real
      configuration files. For untrusted, arbitrarily deep input you would
      switch to an explicit stack to stay clear of the recursion limit.
    content:
      starter_code: |
        def flatten(settings):
            """Return a new dict with nested keys joined by dots."""
            flat = {}
            for key, value in settings.items():
                if isinstance(value, dict):
                    for sub_key, sub_value in value.items():
                        flat[key + "." + sub_key] = sub_value
                else:
                    flat[key] = value
            return flat
      reference_solution: |
        def flatten(settings, prefix=""):
            flat = {}
            for key, value in settings.items():
                if "." in key:
                    raise ValueError(f"key {key!r} contains a dot")
                full_key = f"{prefix}.{key}" if prefix else key
                if isinstance(value, dict):
                    flat.update(flatten(value, full_key))
                else:
                    flat[full_key] = value
            return flat
    tests:
      - name: flattens one level of nesting
        code: |
          assert flatten({"db": {"host": "db.internal", "port": 5432}, "debug": False}) == {
              "db.host": "db.internal",
              "db.port": 5432,
              "debug": False,
          }
      - name: lists and other values are leaves
        code: |
          assert flatten({"hosts": ["a", "b"], "retries": 3}) == {"hosts": ["a", "b"], "retries": 3}
      - name: handles deeper nesting
        code: |
          settings = {"service": {"http": {"timeout": {"connect": 2, "read": 10}}, "name": "api"}}
          assert flatten(settings) == {
              "service.http.timeout.connect": 2,
              "service.http.timeout.read": 10,
              "service.name": "api",
          }
      - name: keeps falsy leaves and skips empty dicts
        hidden: true
        code: |
          settings = {"a": {"x": 0, "y": None, "z": False, "w": ""}, "b": {}, "c": []}
          assert flatten(settings) == {"a.x": 0, "a.y": None, "a.z": False, "a.w": "", "c": []}
          assert flatten({}) == {}
      - name: rejects dotted keys at any depth
        hidden: true
        code: |
          for bad in ({"db.host": "x"}, {"db": {"read.replica": "y"}}, {"a": {"b": {"c.d": 1}}}):
              try:
                  flatten(bad)
              except ValueError:
                  continue
              raise AssertionError(f"{bad!r} should raise ValueError")
      - name: does not modify the input
        hidden: true
        code: |
          import copy
          settings = {"db": {"host": "h", "pool": {"size": 5}}, "debug": True}
          before = copy.deepcopy(settings)
          flatten(settings)
          assert settings == before

  - slug: recursion-merge-sort-base-case-debug
    skill: algo-recursion
    kind: debugging
    difficulty: 3
    minutes: 8
    tags: [interview]
    title: A merge sort that never bottoms out
    objective: Find a base case that misses an irreducible input, and explain why the recursion makes no progress.
    prompt: |
      This hand-rolled merge sort orders events from several feeds by
      timestamp. `merge(left, right)` is tested and correct. Calling
      `merge_sort` on any non-empty list fails with
      `RecursionError: maximum recursion depth exceeded`.

      Select the line with the defect and explain the fix.
    hints:
      - Trace `merge_sort` by hand on a list with exactly one element.
      - What are `events[:mid]` and `events[mid:]` when `mid` is 0?
    explanation: |
      For a one-element list, `mid = 1 // 2 = 0`, so `events[:0]` is `[]` and
      `events[0:]` is the same one-element list. That call receives exactly
      the input it was given and recurses again forever. Every non-empty list
      is eventually split down to length 1, so every call fails. The base case
      must cover **every** input that can't be reduced further:
      `if len(events) <= 1`. The general rule: each recursive call must make
      progress towards a base case.
    solution: |
      Line 3 only treats the empty list as a base case. For a one-element list
      `mid = 1 // 2 = 0`, so `events[:mid]` is `[]` and `events[mid:]` is the
      same one-element list again. The recursive call gets the same input,
      never shrinks, and recurses until Python's limit. Every non-empty input
      eventually splits down to length 1, so every call fails.

      Fix: make the base case cover lists of length 0 or 1.

      ```python
      if len(events) <= 1:
          return list(events)
      ```

      Every recursive call then works on a strictly smaller list.
    content:
      language: python
      code: |
        def merge_sort(events):
            """Stable sort of events by timestamp; merge() is tested and correct."""
            if len(events) == 0:
                return events
            mid = len(events) // 2
            left = merge_sort(events[:mid])
            right = merge_sort(events[mid:])
            return merge(left, right)
      bug_lines: [3]
      line_weight: 0.4
      min_words: 12
      max_words: 200
      criteria:
