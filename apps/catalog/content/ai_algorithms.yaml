  - slug: binary-search-first-bad-release-mcq
    skill: algo-binary-search
    kind: multiple_choice
    difficulty: 2
    minutes: 3
    diagnostic: true
    tags: [interview]
    title: How many checks to find the first broken release?
    objective: Estimate binary search cost and identify the monotonic property that makes it valid.
    prompt: |
      Releases are numbered 1 to 1,000. One release introduced a bug, and every
      later release also has it. Checking whether a release is broken takes
      10 minutes, and release 1,000 is known to be broken.

      Using binary search, how many checks do you need in the worst case to
      find the first broken release, and what makes binary search valid here?
    hints:
      - Each check splits the remaining candidates in two. How many halvings take 1,000 down to 1?
      - Binary search needs every "not broken" release to come before every "broken" one. Does it here?
    explanation: |
      Each check halves the candidate range, so you need ⌈log₂ 1000⌉ = 10
      checks (2¹⁰ = 1024 ≥ 1000), which is under two hours instead of up to a
      week of linear checking. What makes this valid is **monotonicity**: the
      answers run false, false, …, true, true, so any check tells you which
      half contains the boundary. Sorted indices alone are not enough. If the
      bug came and went, a check in the middle would tell you nothing about
      either side.
    content:
      options:
        - id: a
          text: About 10, because ⌈log₂ 1000⌉ = 10, and it works because "broken" is monotonic, with every release after the first broken one also broken.
          correct: true
          feedback: Right. Monotonicity lets each check discard half of the remaining releases.
        - id: b
          text: About 500, because binary search halves the work compared with a linear scan.
          feedback: Binary search halves the *remaining range* at every step, not the total work once. 1000 → 500 → 250 → … reaches 1 after 10 checks.
          misconception:
            code: halves-total-work
            label: Thinks binary search does half the work of a linear scan
            category: conceptual
        - id: c
          text: About 10, and it works simply because release numbers are sorted, whether or not the bug persists in later releases.
          feedback: The count is right, but the reason isn't. Sorted indices are not enough. If the bug could disappear and reappear, a check in the middle wouldn't tell you which side the first broken release is on.
          misconception:
            code: sorted-keys-suffice
            label: Thinks sorted positions alone make binary search valid, ignoring monotonicity
            category: conceptual
        - id: d
          text: About 32, because binary search takes about √n steps.
          feedback: That's √1000. Binary search is O(log n), and log₂ 1000 ≈ 10.
          misconception:
            code: confuses-log-with-sqrt
            label: Confuses logarithmic growth with square-root growth
            category: conceptual

  - slug: binary-search-log-window
    skill: algo-binary-search
    kind: python_code
    difficulty: 3
    minutes: 20
    tags: [interview]
    title: Count requests in a time window
    objective: Implement a lower-bound binary search and use it to count values in a half-open range in O(log n).
    prompt: |
      An incident dashboard keeps request timestamps in memory (integers,
      sorted ascending, duplicates allowed) and needs to count requests in
      arbitrary time windows. Scanning millions of entries per query is too
      slow.

      1. Write `first_at_or_after(timestamps, t)`, which returns the index of
         the first timestamp `>= t`, or `len(timestamps)` if there is none, in
         O(log n). Implement the search yourself rather than using `bisect`.
      2. Write `count_in_range(timestamps, start, end)`, which returns how many
         timestamps satisfy `start <= ts < end` (0 if `end <= start`), using
         `first_at_or_after`.

      The starter's search returns *a* matching index, not necessarily the
      first one.
    hints:
      - Instead of stopping when you find `t`, keep narrowing towards the leftmost position that could still be the answer.
      - Use a half-open range `lo, hi = 0, len(timestamps)`. If `timestamps[mid] < t` the answer is right of `mid`, otherwise `mid` itself might be the answer.
      - The count in `[start, end)` is the difference between two lower bounds.
    explanation: |
      A lower-bound search maintains the invariant "everything before `lo` is
      `< t`, everything from `hi` onwards is `>= t`". When
      `timestamps[mid] < t`, set `lo = mid + 1`. Otherwise set `hi = mid`,
      because `mid` may be the answer. The range shrinks on every iteration
      and the loop stops when `lo == hi`, which is the first index `>= t`. Two
      lower bounds give a half-open window count in O(log n), with no special
      cases for duplicates. In production code, `bisect.bisect_left` does
      exactly this.
    solution: |
      ```python
      def first_at_or_after(timestamps, t):
          lo, hi = 0, len(timestamps)        # answer is in [lo, hi]
          while lo < hi:
              mid = (lo + hi) // 2
              if timestamps[mid] < t:
                  lo = mid + 1               # mid and everything left of it are too small
              else:
                  hi = mid                   # mid might be the first match
          return lo

      def count_in_range(timestamps, start, end):
          if end <= start:
              return 0
          return first_at_or_after(timestamps, end) - first_at_or_after(timestamps, start)
      ```
    content:
      starter_code: |
        def first_at_or_after(timestamps, t):
            """Index of the first timestamp >= t, or len(timestamps) if there is none."""
            lo, hi = 0, len(timestamps) - 1
            while lo <= hi:
                mid = (lo + hi) // 2
                if timestamps[mid] == t:
                    return mid
                if timestamps[mid] < t:
                    lo = mid + 1
                else:
                    hi = mid - 1
            return lo


        def count_in_range(timestamps, start, end):
            """Number of timestamps with start <= ts < end."""
            raise NotImplementedError
      reference_solution: |
        def first_at_or_after(timestamps, t):
            lo, hi = 0, len(timestamps)
            while lo < hi:
                mid = (lo + hi) // 2
                if timestamps[mid] < t:
                    lo = mid + 1
                else:
                    hi = mid
            return lo


        def count_in_range(timestamps, start, end):
            if end <= start:
                return 0
            return first_at_or_after(timestamps, end) - first_at_or_after(timestamps, start)
    tests:
      - name: finds the first of several equal timestamps
        code: |
          assert first_at_or_after([10, 20, 20, 20, 30], 20) == 1
      - name: returns the insertion point when t is missing
        code: |
          timestamps = [10, 20, 30]
          assert first_at_or_after(timestamps, 25) == 2
          assert first_at_or_after(timestamps, 5) == 0
          assert first_at_or_after(timestamps, 31) == 3
      - name: counts a half-open window
        code: |
          assert count_in_range([10, 20, 20, 30, 40], 20, 40) == 3
      - name: handles empty lists and empty windows
        hidden: true
        code: |
          assert first_at_or_after([], 5) == 0
          assert count_in_range([], 0, 100) == 0
          assert count_in_range([1, 2, 3], 5, 5) == 0
          assert count_in_range([1, 2, 3], 3, 1) == 0
          assert count_in_range([5, 5, 5], 5, 6) == 3
      - name: matches bisect_left on many inputs
        hidden: true
        code: |
          import bisect
          import random
          rng = random.Random(1234)
          for _ in range(300):
              data = sorted(rng.randint(0, 20) for _ in range(rng.randint(0, 15)))
              t = rng.randint(-2, 22)
              assert first_at_or_after(data, t) == bisect.bisect_left(data, t), (data, t)
      - name: is fast on a million timestamps
        hidden: true
        code: |
          data = list(range(0, 2_000_000, 2))
          for t in range(0, 2_000_000, 1_999):
              assert first_at_or_after(data, t) == (t + 1) // 2
          assert count_in_range(data, 1_000, 3_000) == 1_000

  - slug: binary-search-last-before-debug
    skill: algo-binary-search
    kind: debugging
    difficulty: 3
    minutes: 8
    tags: [interview]
    title: A binary search that hangs on two candidates
    objective: Diagnose a non-terminating binary search caused by rounding mid in the wrong direction.
    prompt: |
      This helper finds the last log entry at or before a timestamp.
      `last_at_or_before([10, 20, 30], 25)` never returns, and the worker sits
      at 100% CPU.

      Select the line with the defect and explain the fix.
    hints:
      - Trace the loop for the example. Write down `lo`, `hi` and `mid` on each iteration.
      - What happens when `hi == lo + 1` and the update is `lo = mid`?
    explanation: |
      With `lo = 1, hi = 2`, `mid = (1 + 2) // 2 = 1`, which equals `lo`.
      `timestamps[1] = 20 <= 25`, so `lo = mid` leaves `lo` at 1, the range
      never shrinks and the loop spins forever. When the update is `lo = mid`,
      `mid` must be rounded **up**: `mid = (lo + hi + 1) // 2`, so it is
      always greater than `lo`. That also avoids `mid = -1` when `lo` is -1,
      which would silently read the last element. Rule of thumb: pair
      `lo = mid` with an upper middle and `hi = mid` with a lower middle.
    solution: |
      Line 5 rounds mid down. Once `hi == lo + 1` (for example lo = 1,
      hi = 2), `mid = (1 + 2) // 2 = 1`, which equals lo. `timestamps[1] = 20`
      is `<= 25`, so line 7 sets `lo = mid = 1` again. There is no progress,
      and the loop spins forever.

      Because the update is `lo = mid`, mid must round up so it is always
      greater than lo:

      ```python
      mid = (lo + hi + 1) // 2
      ```

      That also stops mid from being -1 (which would silently read the last
      element) when lo is -1. With this change the range shrinks on every
      iteration and the example returns 1.
    content:
      language: python
      code: |
        def last_at_or_before(timestamps, t):
            """Index of the last timestamp <= t, or -1 if there is none."""
            lo, hi = -1, len(timestamps) - 1
            while lo < hi:
                mid = (lo + hi) // 2
                if timestamps[mid] <= t:
                    lo = mid
                else:
                    hi = mid - 1
            return lo
      bug_lines: [5, 7]
      line_weight: 0.4
      min_words: 12
      max_words: 220
      criteria:
        - id: no-progress
          label: Explains that with two candidates mid equals lo, so `lo = mid` makes no progress
          weight: 2
          required: true
          any: ["no progress", "never shrink", "doesn't shrink", "does not shrink", 're:\bdoesn.t\s+(shrink|change|move)', "does not change", "does not move", "never changes", "never moves", "mid equals lo", "mid == lo", "mid = lo", "mid is lo", "mid is equal to lo", "mid stays", "equal to lo", "equals lo", 're:\blo\b.{0,40}\b(never|stays|remains|stuck|unchanged)', 're:\b(adjacent|next to each other|differ by (one|1)|one apart|1 apart)\b', 're:\bhi\s*==\s*lo\s*\+\s*1', 're:\blo\s*\+\s*1\s*==\s*hi', "rounds down", "round down", "rounding down", "floor"]
          missing_feedback: Trace the loop when `hi == lo + 1` and `timestamps[mid] <= t`. What is `mid`, and does the range shrink?
          misconception:
            code: binary-search-no-progress
            label: Doesn't check that every iteration shrinks the search range
            category: logic
        - id: round-up
          label: Rounds mid up, for example `mid = (lo + hi + 1) // 2`
          weight: 2
          any: ['re:\+\s*1\s*\)\s*//\s*2', 're:\bhi\s*\+\s*1\b', 're:\+\s*1\b.{0,15}//', "round up", "rounds up", "rounding up", "ceil", "upper middle", "upper mid", 're:\blo\s*=\s*mid\s*\+\s*1']
          missing_feedback: How should `mid` be computed when the update is `lo = mid`, so that it always differs from `lo`?
          misconception:
            code: mid-rounding-mismatch
            label: Rounds mid in a direction that can't make progress with the chosen update
            category: logic

