            category: conceptual
        - id: d
          text: Re-run the same five questions at temperature 0 to confirm the answers are stable, then ship.
          feedback: Stable answers can be stably wrong. Repeatability says nothing about quality or about questions you didn't try.
          misconception:
            code: consistency-is-correctness
