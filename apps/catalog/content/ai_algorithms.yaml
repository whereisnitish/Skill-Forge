  - slug: two-pointers-sorted-pair-mcq
    skill: algo-two-pointers
    kind: multiple_choice
    difficulty: 2
    minutes: 3
    diagnostic: true
    tags: [interview]
    title: Why is moving the left pointer safe?
    objective: Justify a two-pointer move on sorted data with an invariant that rules out skipped pairs.
    prompt: |
      ```python
      def has_pair_with_sum(sorted_nums, target):
          left, right = 0, len(sorted_nums) - 1
          while left < right:
              total = sorted_nums[left] + sorted_nums[right]
              if total == target:
                  return True
              if total < target:
                  left += 1
              else:
                  right -= 1
          return False
      ```

      `sorted_nums` is sorted in non-decreasing order. Why is it safe to move
      `left` forward when `total < target`?
    hints:
      - Which pairs involving index `left` have not been ruled out yet?
      - In a sorted list, how does `sorted_nums[k]` compare with `sorted_nums[right]` for every k up to `right`?
    explanation: |
      Any pair still in play that uses `left` has its partner at some index
      k with `left < k <= right` (partners beyond `right` were ruled out by
      earlier moves). Because the list is sorted,
      `sorted_nums[k] <= sorted_nums[right]`, so each such pair sums to at
      most `total`, which is below the target. None of them can work, so
      discarding `left` loses nothing. The symmetric argument justifies
      `right -= 1`. Each step discards a whole set of pairs, which is why the
      loop is O(n) rather than O(n²), and duplicates don't affect the argument.
    content:
      options:
        - id: a
          text: Because the list is sorted, pairing `sorted_nums[left]` with any remaining partner (index up to `right`) gives a sum of at most `total`, which is below the target, so `left` can't be part of any pair not yet ruled out.
          correct: true
          feedback: Exactly. Each move discards only pairs that provably can't reach the target.
        - id: b
          text: Moving `left` always increases the sum, so the loop is guaranteed to reach the target eventually.
          feedback: With duplicates the sum may stay the same, and the target may not be reachable at all. The move is safe because it discards only impossible pairs, not because it converges on the target.
          misconception:
            code: misreads-pointer-invariant
            label: Justifies pointer moves by hoping to reach the target rather than by ruling out candidates
            category: logic
        - id: c
          text: It isn't safe in general. With duplicate values the function can miss a valid pair.
          feedback: Duplicates are fine. The argument only needs `sorted_nums[k] <= sorted_nums[right]` for every k up to `right`, which holds for any non-decreasing list.
          misconception:
            code: duplicates-break-two-pointers
            label: Thinks duplicates break the sorted two-pointer search
            category: edge_case
        - id: d
          text: It's safe because the loop still examines every pair, just in a smarter order.
          feedback: The loop runs at most n − 1 times, while there are n(n − 1)/2 pairs. It is correct because each move rules out a whole group of pairs without examining them.
          misconception:
            code: two-pointers-checks-all-pairs
            label: Thinks the two-pointer scan still examines every pair
            category: conceptual

  - slug: two-pointers-cost-budget-window
    skill: algo-two-pointers
    kind: python_code
    difficulty: 3
    minutes: 20
    tags: [interview]
    title: Longest replay that fits the budget
    objective: Implement a variable-size sliding window that finds the longest contiguous run within a budget in O(n).
    prompt: |
      A batch job replays recorded requests against staging. Each request has
      a non-negative cost in credits, and a replay run has a fixed budget. You
      want the longest **contiguous** stretch of requests that fits.

      Write `longest_within_budget(costs, budget)`:

      - Return `(start, length)` for the longest contiguous run of `costs`
        whose sum is `<= budget`.
      - On ties, return the earliest start.
      - If no single request fits (or `costs` is empty), return `(0, 0)`.
      - `costs` holds non-negative integers and `budget` is a non-negative
        integer. Inputs can have 200,000 entries, so aim for O(n).

      ```python
      longest_within_budget([3, 1, 2, 1, 5, 1], 4)   # (1, 3), because 1 + 2 + 1 == 4
      ```
    hints:
      - Grow a window by moving its right edge one step at a time and keep the window's sum up to date.
      - When the sum exceeds the budget, shrink from the left until it fits again. Costs are non-negative, so shrinking can only lower the sum.
      - Record the best window only after it fits again, and only replace the best on a strictly longer window, so ties keep the earliest start.
    explanation: |
      Because costs are non-negative, extending a window never lowers its sum
      and shrinking never raises it. That monotonicity is what makes the
      sliding window correct. Move `right` forward, add its cost, then move
      `left` forward while the sum is over budget. Each index enters and
      leaves the window at most once, so the total work is O(n) even though
      there is a `while` inside the `for`. If costs could be negative, the
      window would no longer be valid, and you would need prefix sums with a
      different technique.
    solution: |
      ```python
      def longest_within_budget(costs, budget):
          best_start, best_len = 0, 0
          window_sum = 0
          left = 0
          for right, cost in enumerate(costs):
              window_sum += cost
              while window_sum > budget:
                  window_sum -= costs[left]
                  left += 1
              if right - left + 1 > best_len:
                  best_start, best_len = left, right - left + 1
          return (best_start, best_len)
      ```

      When a single cost exceeds the budget, the window shrinks to empty
      (`left == right + 1`, sum 0) and its length is 0, so it never replaces
      the best. The strict `>` keeps the earliest window on ties.
    content:
      starter_code: |
        def longest_within_budget(costs, budget):
            """Return (start, length) of the longest contiguous run with sum <= budget."""
            return (0, 0)
      reference_solution: |
        def longest_within_budget(costs, budget):
            best_start, best_len = 0, 0
            window_sum = 0
            left = 0
            for right, cost in enumerate(costs):
                window_sum += cost
                while window_sum > budget:
                    window_sum -= costs[left]
                    left += 1
                if right - left + 1 > best_len:
                    best_start, best_len = left, right - left + 1
            return (best_start, best_len)
    tests:
      - name: finds the longest run within budget
        code: |
          assert longest_within_budget([3, 1, 2, 1, 5, 1], 4) == (1, 3)
      - name: everything fits
        code: |
          assert longest_within_budget([1, 1, 1], 10) == (0, 3)
      - name: empty input
        code: |
          assert longest_within_budget([], 5) == (0, 0)
      - name: nothing fits, ties and zero costs
        hidden: true
        code: |
          assert longest_within_budget([7, 8], 5) == (0, 0)
          assert longest_within_budget([2, 2, 9, 2, 2], 4) == (0, 2)
          assert longest_within_budget([0, 0, 5, 0], 0) == (0, 2)
          assert longest_within_budget([9, 1, 1, 9, 1, 1, 1], 3) == (4, 3)
      - name: handles 200,000 requests quickly
        hidden: true
        code: |
          assert longest_within_budget([1] * 200_000, 1_000) == (0, 1_000)
          costs = [5] * 50_000 + [0] * 50_000
          assert longest_within_budget(costs, 10) == (49_998, 50_002)

  - slug: two-pointers-window-complexity-short
    skill: algo-two-pointers
    secondary_skills: [algo-complexity]
    kind: short_answer
    difficulty: 3
    minutes: 3
    tags: [interview]
    title: How fast is this sliding window?
    objective: Explain why a sliding window with a nested while loop is linear.
    prompt: |
      This function finds the length of the longest stretch of a browsing
      session with no repeated page:

      ```python
      def longest_unique_run(pages):
          seen = set()
          best = left = 0
          for right, page in enumerate(pages):
              while page in seen:
                  seen.remove(pages[left])
                  left += 1
              seen.add(page)
              best = max(best, right - left + 1)
          return best
      ```

      Assuming set operations are O(1) on average, what is its time
      complexity in terms of n = `len(pages)`?
    hints:
      - Don't count loop nesting. Count how many times each page can be added to and removed from `seen` over the whole run.
      - "`left` never moves backwards. How far can it travel in total?"
    explanation: |
      **O(n).** The inner `while` doesn't start over for each `right`. It
      continues from where `left` stopped, and `left` only moves forward, so
      across the entire run it advances at most n times. Every page is added to
      `seen` once and removed at most once, so the inner loop body runs at most
      n times in total and the whole function does O(n) set operations. This
      amortised argument, counting the total moves of each pointer, is how you
      analyse every sliding window.
    content:
      placeholder: e.g. O(n²)
      ignore_spaces: true
      accepted: ["O(n)", "linear", "linear time", "O(n) average", "O(n) amortized", "O(n) amortised", "Θ(n)", "theta(n)", "n"]
      patterns: ['(o|θ|theta)\(n\)(average|amortized|amortised|onaverage)?']
      wrong:
        - answers: ["O(n^2)", "O(n2)", "O(n²)", "O(n*n)", "n^2", "quadratic"]
          feedback: The inner `while` doesn't restart for each `right`. `left` only moves forward, so across the whole run it advances at most n times. Each page is added once and removed at most once.
          misconception:
            code: window-nested-loop-quadratic
            label: Assumes a while loop inside a for loop makes a sliding window quadratic
            category: performance
        - answers: ["O(n log n)", "O(nlogn)", "n log n"]
          feedback: Nothing here sorts or halves anything. Each step does O(1) average work on the set, and the pointers move at most n times each.

