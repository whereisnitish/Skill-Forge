  - slug: tx-savepoint-integrityerror-explain
    skill: dj-transactions
    kind: concept_explanation
    difficulty: 4
    minutes: 10
    title: Why does the import crash after the first duplicate?
    objective: Explain aborted transactions, savepoints and nested atomic blocks when handling database errors.
    prompt: |
      ```python
      @transaction.atomic
      def import_contacts(rows):
          for row in rows:
              try:
                  Contact.objects.create(email=row["email"], name=row["name"])
              except IntegrityError:
                  logger.info("Skipping duplicate %s", row["email"])
          ImportLog.objects.create(count=len(rows))
      ```

      `Contact.email` is unique. After the first duplicate, the next query
      raises `TransactionManagementError: An error occurred in the current
      transaction. You can't execute queries until the end of the 'atomic'
      block.` Explain why catching the exception is not enough, how to fix
      the function so the import continues, and what a nested `atomic` block
      does on PostgreSQL.
    hints:
      - After a failed statement, what state is the PostgreSQL transaction in?
      - A nested `atomic` block is not a new transaction. What does Django create instead?
      - Where must the `try`/`except` sit relative to the nested block for the rollback to happen?
    explanation: |
      When a statement fails, PostgreSQL marks the whole transaction as
      **aborted**: every later statement fails until a rollback, and Django
      also marks the `atomic` block as needing rollback. Catching the Python
      exception does not repair the transaction. Wrapping each insert in its
      own `with transaction.atomic():` creates a **savepoint**; when the insert
      fails, Django rolls back to that savepoint, so only that insert is undone
      and the outer transaction stays usable. The `try`/`except` must be
      *outside* the inner block so the exception leaves it and triggers the
      savepoint rollback.

      ```python
      for row in rows:
          try:
              with transaction.atomic():
                  Contact.objects.create(email=row["email"], name=row["name"])
          except IntegrityError:
              logger.info("Skipping duplicate %s", row["email"])
      ```
    solution: |
      When the `INSERT` violates the unique constraint, PostgreSQL marks the
      whole transaction as aborted: every further statement fails with
      "current transaction is aborted" until a rollback, and Django flags the
      atomic block (`needs_rollback`) and raises `TransactionManagementError`
      on the next query. Catching `IntegrityError` in Python does not undo
      that.

      The fix is a nested atomic block around each insert:
      `with transaction.atomic(): Contact.objects.create(...)`. A nested
      `atomic` creates a savepoint. If the insert fails, Django rolls back to
      the savepoint, so only that insert is undone and the outer transaction
      continues with the other rows and commits at the end. The `try`/`except`
      must sit outside the inner atomic block, so that the exception leaves
      the block and triggers the rollback to the savepoint.

      For large imports, `bulk_create(objs, ignore_conflicts=True)` (which
      uses `ON CONFLICT DO NOTHING`) avoids raising per-row errors at all.
    content:
      min_words: 50
      max_words: 350
      placeholder: Explain what PostgreSQL and Django do after the failed insert…
      criteria:
        - id: aborted-transaction
          label: Explains that a failed statement leaves the transaction aborted until rollback
          weight: 2
          required: true
          any: ["abort", "broken", "unusable", "poisoned", "invalid state", "bad state", "failed state", "error state", "failed transaction", "re:transaction (is|becomes|gets|stays) (dead|broken|invalid|unusable|poisoned|failed)", "current transaction is aborted", "needs_rollback", "needs rollback", "marked for rollback", "must be rolled back", "has to be rolled back", "re:(any|every|all) (further|subsequent|following|later|other) (query|queries|statement|statements)"]
          missing_feedback: What state is the PostgreSQL transaction in after the failed `INSERT`, and why doesn't catching the exception fix it?
          misconception: {code: catching-repairs-transaction, label: Thinks catching a database exception keeps the transaction usable, category: conceptual}
        - id: nested-atomic
          label: Wraps each insert in a nested atomic block, which creates a savepoint
          weight: 1
          any: ["savepoint", "save point", "nested atomic", "inner atomic", "atomic block inside", "atomic() inside", "atomic inside", "re:with\\s+transaction\\.atomic\\(\\)", "re:wrap[^.]{0,40}(in|with) (its own|a|an) (nested |inner |separate )?(atomic|transaction)"]
          missing_feedback: Show how to isolate each insert so that a failure doesn't poison the outer transaction.
        - id: partial-rollback
          label: Only the failed insert is rolled back and the outer transaction continues
          weight: 1
          any: ["rolls back to the savepoint", "roll back to the savepoint", "rolled back to the savepoint", "rollback to the savepoint", "rollback to savepoint", "roll back to savepoint", "only the inner", "just the inner", "only that insert", "only the failed", "only that row", "just that row", "just that insert", "rest of the import", "other rows", "remaining rows", "re:outer (transaction|block) (continues|carries on|survives|is preserved|stays usable|remains usable|can continue|keeps going)"]
          missing_feedback: Explain what is rolled back when an insert inside the nested block fails, and what happens to the rest of the import.
        - id: except-outside
          label: Places the try/except outside the nested atomic block
          weight: 1
          any: ["outside the atomic", "outside the inner", "outside the nested", "around the atomic", "around the inner", "around the nested", "re:(try|except|catch)[^.]{0,60}(outside|around|wrap)", "re:atomic[^.]{0,40}inside (the )?try"]
          missing_feedback: Where must the `try`/`except` be placed relative to the nested block, and why?
          misconception: {code: catching-repairs-transaction, label: Thinks catching a database exception keeps the transaction usable, category: conceptual}

  # ================================================= dj-auth-permissions
  - slug: auth-model-vs-object-permission-mcq
    skill: dj-auth-permissions
    kind: multiple_choice
    difficulty: 3
    minutes: 3
    diagnostic: true
    title: What does permission_required actually guarantee?
    objective: Distinguish model-level permissions from object-level authorisation.
    prompt: |
      Every customer account is granted the `billing.view_invoice` permission
      so customers can see their own invoices.

      ```python
      @permission_required("billing.view_invoice")
      def invoice_detail(request, pk):
          invoice = get_object_or_404(Invoice, pk=pk)
          return render(request, "billing/invoice.html", {"invoice": invoice})
      ```

      What does this view guarantee?
    hints:
      - The decorator runs before the view, so it never sees which invoice will be loaded.
      - Model permissions answer "may this user view invoices?", not "may this user view *this* invoice?".
    explanation: |
      Django's model permissions are **model-level**: `billing.view_invoice`
      means "may view invoices", and the decorator checks it without knowing
      which invoice will be loaded. Any customer holding the permission can
      read any invoice by changing `pk` in the URL, an insecure direct object
      reference (IDOR). Object-level authorisation must be enforced in the
      query itself, for example
      `get_object_or_404(Invoice, pk=pk, account=request.user.account)`.
      Anonymous users are redirected to the login page, because they hold no
      permissions.
    content:
      multiple: false
      options:
        - id: a
          text: Only that the user holds the model-level permission; any such user can open any invoice by changing pk.
          correct: true
          feedback: Correct. Nothing ties the invoice to the user, so this is an IDOR. Scope the lookup to the user's account.
        - id: b
          text: Users can only open invoices they own, because the permission is checked against the loaded invoice.
          feedback: The decorator runs before the view and never sees the invoice. Django's default `ModelBackend` has no notion of ownership.
          misconception: {code: model-perm-is-object-perm, label: Thinks model permissions are checked per object, category: security}
        - id: c
          text: Only staff users can open the view.
          feedback: "`is_staff` only controls access to the admin site. `permission_required` checks the named permission, which these customers hold."
          misconception: {code: is-staff-means-permission, label: Confuses is_staff with permissions, category: conceptual}
        - id: d
          text: Nothing, because permission_required does not check that the user is logged in.
          feedback: Anonymous users have no permissions, so the decorator redirects them to the login page. The real gap is ownership, not authentication.
          misconception: {code: perm-required-skips-auth, label: Thinks permission checks do not cover anonymous users, category: conceptual}

  - slug: auth-invoice-idor-review
