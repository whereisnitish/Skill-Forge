# Django and backend curriculum: 8 skills in category `django`, 5 in `backend`.
# Targets Django 5.2 and PostgreSQL. Skill graph: docs/curriculum-map.md.

skills:
  # ---------------------------------------------------------------- django
  - slug: dj-models-orm
    name: Models & the ORM
    category: django
    difficulty: 2
    review_interval_days: 2
    summary: Model data with Django fields and relations, and query it with lazy, chainable QuerySets.
    description: |
      Django models map Python classes to database tables, and the ORM turns
      chained `QuerySet` calls such as `filter()`, `exclude()` and `order_by()`
      into SQL. QuerySets are **lazy**: building one costs nothing, and the
      query only runs when the result is needed (iteration, `len()`, `bool()`,
      slicing with a step, `list()`). Each chained call returns a *new*
      QuerySet rather than modifying the original.

      Almost every Django feature (admin, forms, serializers, migrations) is
      driven by model definitions, so modelling choices matter: which relation
      type to use, what `on_delete` should do, which constraints belong in the
      database, and how to update rows safely with `F()` expressions or
      `update()`.

      Common pitfalls: discarding the result of `filter()`, using mutable
      defaults such as `default=[]` instead of a callable, choosing
      `on_delete=CASCADE` without thinking about what disappears, and
      accidentally evaluating a QuerySet several times.
    objectives:
      - Define models with appropriate field types, relations and `on_delete` behaviour.
      - Explain when a QuerySet is evaluated and when its result cache is reused.
      - Chain `filter()`, `exclude()` and `order_by()` correctly, knowing each returns a new QuerySet.
      - Use `F()` expressions and `update()` to change rows without read-modify-write races.
    prerequisites:
      - py-oop-dataclasses
    related: [sql-joins]

  - slug: dj-views-urls
    name: Views, URLs & templates
    category: django
    difficulty: 2
    review_interval_days: 2
    summary: Route requests to function- and class-based views, return the right responses and render templates.
    description: |
      A Django view is a callable that takes an `HttpRequest` and **must return
      an `HttpResponse`**. The URL resolver walks `urlpatterns` in order and
      dispatches to the first pattern that matches, passing captured path
      converter values as keyword arguments. Templates render context data with
      automatic HTML escaping.

      Getting this layer right is what makes an app predictable: named URLs
      with `reverse()` and `{% url %}` instead of hard-coded paths,
      `get_object_or_404` so missing objects return 404 rather than 500, and
      the Post/Redirect/Get pattern so refreshing a page never resubmits a
      form.

      Common pitfalls: pattern ordering that lets a generic `<slug:slug>` route
      swallow a specific one, forgetting to `return` a redirect, and putting
      business logic in templates.
    objectives:
      - Explain how the URL resolver picks a view and passes captured arguments.
      - Use named URLs with `reverse()` and the `{% url %}` tag instead of hard-coded paths.
      - Return correct responses, including 404s via `get_object_or_404` and redirects after POST.
      - Choose between function-based views and generic class-based views.
    prerequisites:
      - py-functions

  - slug: dj-forms-validation
    name: Forms & validation
    category: django
    difficulty: 2
    review_interval_days: 2
    summary: Validate and clean user input with Django forms and ModelForms, and surface errors properly.
    description: |
      Django forms turn untrusted request data into validated Python values.
      Validation runs in a defined order: each field's `to_python()` and
      validators, then `clean_<field>()` methods, then the form-wide `clean()`.
      Only fields that passed their own validation appear in `cleaned_data`.
      `ModelForm` adds model-level validation, including unique checks, and a
      `save()` method.

      Forms are the first line of defence against bad data and an important
      part of security: they whitelist fields, coerce types and give users
      actionable error messages. Knowing the validation lifecycle is what lets
      you write cross-field checks without crashing on partially invalid input.

      Common pitfalls: forgetting `request.FILES` for uploads, reading
      `self.cleaned_data["x"]` in `clean()` when `x` already failed, forgetting
      to return the value from `clean_<field>()`, and using `fields = "__all__"`
      on a ModelForm, which exposes fields users should not control.
    objectives:
      - Describe the order in which field validation, `clean_<field>()` and `clean()` run.
      - Write cross-field validation that tolerates fields missing from `cleaned_data`.
      - Use `save(commit=False)` to set server-controlled fields before saving a ModelForm.
      - Handle file uploads by binding both `request.POST` and `request.FILES`.
    prerequisites:
      - dj-views-urls

  - slug: dj-query-optimization
    name: ORM query optimisation
    category: django
    difficulty: 3
    review_interval_days: 2
    summary: Find and fix N+1 queries and wasteful ORM usage with select_related, prefetch_related, annotations and only().
    description: |
      The ORM makes it easy to write code that is correct but issues hundreds
      of queries. The classic case is the **N+1 problem**: one query for a list,
      then one more per row when a template touches a related object.
      `select_related()` follows forward foreign keys and one-to-one relations
      with a SQL JOIN; `prefetch_related()` runs one extra query per relation and
      joins the results in Python, which works for reverse foreign keys and
      many-to-many relations.

      In production, query count and the amount of data transferred dominate
      response time far more than Python code does. Aggregating in the database
      with `annotate(Count(...))`, using `exists()` and `count()` instead of
      loading rows, and fetching only needed columns keep pages fast as data
      grows.

      Common pitfalls: calling `.filter()` or `.count()` on a prefetched
      relation (which bypasses the prefetch cache), using `select_related` on
      many-valued relations, and only measuring with tiny development data sets.
    objectives:
      - Detect N+1 queries using query counts, logging or django-debug-toolbar.
      - Choose correctly between `select_related()` and `prefetch_related()`.
      - Use `Prefetch` objects and annotations to filter or aggregate related data in the database.
      - Predict the number of queries a piece of ORM code will execute.
    prerequisites:
      - dj-models-orm
      - skill: sql-joins
        strength: recommended
    related: [sql-indexes]

  - slug: dj-transactions
    name: Transactions & data integrity
    category: django
    difficulty: 4
    review_interval_days: 3
    summary: Keep data consistent under concurrency with atomic(), row locks, constraints and on_commit hooks.
    description: |
      By default Django runs in autocommit mode: each query is committed
      immediately. `transaction.atomic()` groups statements so they commit or
      roll back together, and nested `atomic` blocks become savepoints.
      Atomicity alone does not prevent races, though: two requests can read the
      same balance and both write back a stale value. Row locks with
      `select_for_update()`, atomic `F()` updates and database constraints are
      what make concurrent writes safe.

      Integrity bugs are expensive: double-spent credits, oversold stock and
      orphaned records rarely show up in tests because they need concurrent
      traffic. Side effects outside the database (emails, payments, task
      queues) are not rolled back with the transaction, so they belong in
      `transaction.on_commit()` callbacks.

      Common pitfalls: `select_for_update()` outside a transaction (Django raises
      `TransactionManagementError`), catching exceptions *inside* an `atomic`
      block, enqueuing Celery tasks before the data they need is committed,
      and relying on application checks where a unique constraint is needed.
    objectives:
      - Use `transaction.atomic()` and explain how nested blocks become savepoints.
      - Prevent lost updates with `select_for_update()` or `F()` expressions.
      - Defer external side effects with `transaction.on_commit()`.
      - Enforce invariants with database constraints rather than only Python checks.
    prerequisites:
      - dj-models-orm
    related: [background-jobs]

  - slug: dj-auth-permissions
    name: Authentication & permissions
    category: django
    difficulty: 3
    review_interval_days: 2
    summary: Authenticate users and enforce model and object-level permissions so users only reach their own data.
    description: |
      Authentication answers *who is this?*; authorisation answers *may they do
      this?*. Django provides sessions, `login_required` / `LoginRequiredMixin`,
      groups and model permissions checked with `user.has_perm("app_label.codename")`.
      Model permissions are coarse ("can change any article"), so most apps also
      need **object-level** checks: scoping querysets to the current user or
      tenant.

      Broken access control is the most common serious web vulnerability. An
      endpoint that fetches `Invoice.objects.get(pk=pk)` for any logged-in user
      is an insecure direct object reference (IDOR): changing the ID in the URL
      exposes another customer's data.

      Common pitfalls: checking permissions in templates but not in views,
      testing only as a superuser (who passes every `has_perm` check), relying
      on hidden form fields for ownership, and confusing `is_staff` with real
      permissions.
    objectives:
      - Protect views with `login_required`, `LoginRequiredMixin` and permission checks.
      - Explain the difference between model-level and object-level authorisation.
      - Prevent IDOR by scoping querysets to the requesting user or tenant.
      - Use `has_perm` with the correct `app_label.codename` format.
    prerequisites:
      - dj-views-urls
      - dj-models-orm
    related: [dj-security]

  - slug: dj-migrations
    name: Migrations
    category: django
    difficulty: 3
    review_interval_days: 3
    summary: Evolve database schemas safely with schema and data migrations, including zero-downtime changes.
    description: |
      Migrations are versioned, ordered descriptions of schema changes that
      Django generates from model diffs and applies with `migrate`. Data
      migrations use `RunPython` and must use **historical models** from
      `apps.get_model()`, because the real model class reflects today's code,
      not the schema at that point in history.

      In production the hard part is not generating migrations but applying
      them while the old version of the code is still serving traffic. Adding a
      `NOT NULL` column, renaming a field or building an index on a large table
      can lock it or break running servers unless the change is split into
      backwards-compatible steps (expand, migrate data, contract).

      Common pitfalls: importing models directly in data migrations, editing
      migrations that have already been applied elsewhere, renames that break
      old code mid-deploy, and long-running data migrations inside a single
      transaction.
    objectives:
      - Write data migrations with `RunPython` using `apps.get_model()` and a reverse function.
      - Plan expand/contract migrations for renames and new non-nullable columns.
      - Explain migration dependencies and how conflicting migrations are resolved.
      - Build indexes on large PostgreSQL tables without blocking writes.
    prerequisites:
      - dj-models-orm

  - slug: dj-security
    name: Django security essentials
    category: django
    difficulty: 3
    review_interval_days: 2
    summary: Use Django's built-in defences against XSS, CSRF, SQL injection and clickjacking, and avoid bypassing them.
    description: |
      Django ships strong defaults: templates auto-escape output, the CSRF
      middleware protects state-changing requests, the ORM parameterises
      queries, and `SecurityMiddleware` and `XFrameOptionsMiddleware` set
      protective headers. Most real vulnerabilities come from code that
      **bypasses** those defaults: `mark_safe()` around user input, f-strings
      in `raw()` or `cursor.execute()`, `csrf_exempt` on a cookie-authenticated
      endpoint, or `DEBUG = True` in production.

      Security reviews of Django code are therefore largely about spotting the
      escape hatches and checking that each one is justified. Settings such as
      `SECURE_SSL_REDIRECT`, `SESSION_COOKIE_SECURE`, `CSRF_COOKIE_SECURE` and
      HSTS round out a production deployment; `manage.py check --deploy`
      reports the obvious gaps.

      Common pitfalls: building HTML with string formatting instead of
      `format_html()`, trusting the `Host` header or `ALLOWED_HOSTS = ["*"]`,
      leaking secrets through debug pages, and unsafe redirects to
      user-supplied URLs.
    objectives:
      - Explain how auto-escaping, `mark_safe()` and `format_html()` interact.
      - Write raw SQL safely with query parameters instead of string formatting.
      - Describe what CSRF protection defends against and when `csrf_exempt` is dangerous.
      - Configure production security settings and validate them with `check --deploy`.
    prerequisites:
      - dj-forms-validation
      - dj-auth-permissions

  # --------------------------------------------------------------- backend
  - slug: sql-joins
    name: SQL joins & aggregation
    category: backend
    difficulty: 2
    review_interval_days: 2
    summary: Combine tables with inner and outer joins and summarise data with GROUP BY, aggregates and HAVING.
    description: |
      Joins combine rows from several tables: an `INNER JOIN` keeps only
      matching pairs, while a `LEFT JOIN` keeps every row from the left table
      and fills the right side with `NULL` when nothing matches. Aggregation
      with `GROUP BY`, `COUNT`, `SUM` and `HAVING` turns those rows into
      reports.

      Every ORM query is ultimately SQL, and reading the generated SQL is the
      fastest way to understand surprising results or slow pages. Reporting,
      analytics and debugging production data all depend on writing these
      queries correctly by hand.

      Common pitfalls: filtering the right-hand table of a `LEFT JOIN` in
      `WHERE` (which silently turns it into an inner join), `COUNT(*)` counting
      the NULL-padded rows of an outer join, and joining two one-to-many tables
      at once so that sums are multiplied (fan-out).
    objectives:
      - Choose between inner and left joins and predict which rows each returns.
      - Place conditions correctly in `ON`, `WHERE` or `HAVING`.
      - Use `COUNT(*)` versus `COUNT(column)` correctly with outer joins.
      - Recognise and fix fan-out when aggregating across several one-to-many joins.
    prerequisites: []

  - slug: sql-indexes
    name: Indexes & query plans
    category: backend
    difficulty: 3
    review_interval_days: 3
    summary: Design B-tree and composite indexes that match real queries and read PostgreSQL EXPLAIN plans.
    description: |
      An index is a separate, sorted data structure that lets the database find
      rows without scanning the whole table. PostgreSQL's default B-tree index
      supports equality, range and ordering queries, and a composite index on
      `(a, b)` can serve queries that filter on `a`, or on `a` and `b`, but not
      efficiently on `b` alone. `EXPLAIN ANALYZE` shows whether the planner
      chose a sequential scan, an index scan or a bitmap scan, and how long
      each step really took.

      Missing indexes are one of the most common causes of slow endpoints as
      tables grow; unnecessary indexes slow every write and consume memory.
      Good index design starts from the queries the application actually runs,
      including their `WHERE`, `ORDER BY` and `LIMIT` clauses.

      Common pitfalls: assuming foreign keys are indexed in raw SQL schemas
      (PostgreSQL does not index them automatically; Django does create an
      index for `ForeignKey` by default), wrapping indexed columns in functions
      such as `lower()`, putting composite-index columns in the wrong order, and
      creating indexes on large tables without `CONCURRENTLY`.
    objectives:
      - Explain how a B-tree index speeds up equality, range and ORDER BY queries.
      - Order composite index columns to match filter and sort patterns.
      - Read EXPLAIN ANALYZE output and identify sequential scans and misestimates.
      - Declare indexes in Django with `Meta.indexes`, including expression and partial indexes.
    prerequisites:
      - sql-joins

  - slug: http-api-design
    name: HTTP & REST API design
    category: backend
    difficulty: 2
    review_interval_days: 2
    summary: Design predictable HTTP APIs with correct methods, status codes, pagination and conditional requests.
    description: |
      A well-designed HTTP API uses methods for their defined semantics (`GET`
      is safe, `PUT` and `DELETE` are idempotent, `POST` is neither), returns
      status codes that clients can act on, and represents resources with
      stable URLs. Conditional requests with `ETag`, `If-None-Match` and
      `If-Match` enable caching and optimistic concurrency control.

      APIs outlive the code behind them: mobile apps and partners keep calling
      old endpoints for years. Consistent error formats, stable pagination and
      clear versioning make an API cheap to evolve, while ambiguous semantics
      cause retries that create duplicates and clients that cannot recover
      from errors.

      Common pitfalls: returning `200` with an error body, offset pagination
      that skips or repeats items when data changes, using `GET` for actions
      with side effects, and ignoring idempotency for retried `POST` requests.
    objectives:
      - Choose methods and status codes according to their HTTP semantics.
      - Explain safety and idempotency, and why they matter for retries.
      - Implement cursor-based pagination and compare it with offset pagination.
      - Use ETags for conditional GETs and optimistic concurrency with `If-Match`.
    prerequisites: []

  - slug: caching-strategies
    name: Caching strategies
    category: backend
    difficulty: 3
    review_interval_days: 3
    summary: Speed up systems with cache-aside, TTLs and HTTP caching while keeping data correct and private.
    description: |
      Caching trades freshness for speed by keeping the result of expensive
      work (queries, rendered fragments, API responses) somewhere faster.
      The most common pattern is **cache-aside**: read from the cache, fall
      back to the source on a miss, then populate the cache with a TTL.
      Eviction policies such as LRU bound memory use, and HTTP caching headers
      (`Cache-Control`, `ETag`, `Vary`) push caching out to browsers and CDNs.

      A cache is only useful if it is correct. The hard problems are
      invalidation when the source changes, keys that accidentally share data
      between users or tenants, and stampedes when a hot key expires and many
      requests recompute it at once.

      Common pitfalls: cache keys that omit the user, locale or permissions
      that shaped the response, caching without a TTL, treating cached falsy
      values as misses, and caching authenticated pages in a shared proxy.
    objectives:
      - Implement cache-aside reads with sensible TTLs and invalidation.
      - Build cache keys that include every input that shapes the cached value.
      - Explain LRU eviction and implement an LRU cache with TTL expiry.
      - Mitigate cache stampedes and choose HTTP cache headers for private data.
    prerequisites:
      - http-api-design
    related: [sd-rate-limiting]

  - slug: background-jobs
    name: Background jobs & idempotency
    category: backend
    difficulty: 4
    review_interval_days: 3
    summary: Run work asynchronously with task queues, retries with backoff, and idempotent handlers that survive redelivery.
    description: |
      Background jobs move slow or unreliable work (emails, payments, report
      generation, webhooks) out of the request cycle into workers fed by a
      queue such as Celery with Redis or RabbitMQ. Real queues deliver messages
      **at least once**: a worker can crash after doing the work but before
      acknowledging it, so the same job may run twice.

      That makes **idempotency** the core design principle: running a job, or
      handling a retried API request, twice must have the same effect as
      running it once. Idempotency keys, unique constraints and state checks
      make duplicates harmless, and retries with exponential backoff and jitter
      handle transient failures without overwhelming a struggling dependency.

      Common pitfalls: enqueuing a job before the transaction that created its
      data has committed, passing whole model instances instead of IDs,
      retrying non-transient errors forever, and retrying without backoff so
      every worker hammers a recovering service at the same moment.
    objectives:
      - Explain at-least-once delivery and why handlers must be idempotent.
      - Implement idempotency keys for retried requests and jobs.
      - Compute exponential backoff schedules with caps and jitter.
      - Enqueue jobs safely after commit and pass identifiers rather than objects.
    prerequisites:
      - py-exceptions
      - skill: http-api-design
        strength: recommended

challenges:
  # ======================================================= dj-models-orm
  - slug: orm-on-delete-protect-mcq
    skill: dj-models-orm
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    title: What happens when you delete a protected parent?
    objective: Predict the effect of on_delete=PROTECT when deleting a referenced row.
    prompt: |
      ```python
      class Customer(models.Model):
          name = models.CharField(max_length=100)


      class Order(models.Model):
          customer = models.ForeignKey(
              Customer, on_delete=models.PROTECT, related_name="orders"
          )
      ```

      A customer has three orders. What does `customer.delete()` do?
    hints:
      - "`on_delete` describes what Django should do with rows that *point to* the deleted object."
      - The option name describes its intent quite literally.
    explanation: |
      `on_delete=models.PROTECT` makes Django's deletion collector refuse to
      delete an object that is still referenced. It raises
      `django.db.models.ProtectedError` (a subclass of `IntegrityError`) before
      any `DELETE` is issued, so the customer and the orders are left untouched.
      Use `PROTECT` (or `RESTRICT`) for data that must never vanish as a side
      effect, such as orders or invoices; `CASCADE` deletes dependants and
      `SET_NULL` requires `null=True` on the foreign key.
    content:
      multiple: false
      options:
        - id: a
          text: It raises ProtectedError and nothing is deleted.
          correct: true
          feedback: Correct. Django finds the referencing orders, refuses the delete and raises `ProtectedError` before running any `DELETE`.
        - id: b
          text: It deletes the customer and its three orders.
          feedback: That is `on_delete=models.CASCADE`. `PROTECT` exists precisely to stop dependants disappearing as a side effect.
          misconception: {code: on-delete-default-cascade, label: Assumes deleting a parent always cascades to its children, category: conceptual}
        - id: c
          text: It deletes the customer and sets order.customer to NULL.
          feedback: That is `on_delete=models.SET_NULL`, which also requires `null=True` on the field. This field is neither.
          misconception: {code: on-delete-set-null, label: Confuses PROTECT with SET_NULL, category: conceptual}
        - id: d
          text: It deletes the customer and leaves the orders pointing at an ID that no longer exists.
          feedback: Django never leaves dangling references silently; `on_delete` is enforced, and PostgreSQL also has a foreign key constraint on `customer_id`.
          misconception: {code: fk-not-enforced, label: Thinks foreign keys are not enforced, category: conceptual}

  - slug: orm-discarded-filter-debug
    skill: dj-models-orm
    kind: debugging
    difficulty: 2
    minutes: 5
    title: The status filter on order history does nothing
    objective: Identify why a chained QuerySet filter has no effect and fix it.
    prompt: |
      Support reports that choosing a status on the order history page has no
      effect: every order is still listed. The view calls this helper. Pick the
      line with the defect and explain the fix.
    hints:
      - The SQL that eventually runs contains the customer filter and the ordering, but no status condition.
      - Compare how lines 7 and 9 use the value returned by the QuerySet method.
      - What does `filter()` return, and what happens to that return value on line 7?
    explanation: |
      QuerySet methods such as `filter()`, `exclude()` and `order_by()` never
      modify the QuerySet they are called on: they return a **new** QuerySet.
      Line 7 builds a filtered QuerySet and throws it away, so `orders` still
      only filters by customer. Reassign the result, exactly as line 9 does:
      `orders = orders.filter(status=status)`.
    solution: |
      `filter()` returns a new QuerySet and does not modify `orders` in place,
      so the result on line 7 is discarded. Reassign it:

      ```python
      if status is not None:
          orders = orders.filter(status=status)
      ```
    content:
      language: python
      code: |
        from shop.models import Order


        def orders_for_customer(customer_id, status=None, newest_first=True):
            orders = Order.objects.filter(customer_id=customer_id)
            if status is not None:
                orders.filter(status=status)
            if newest_first:
                orders = orders.order_by("-created_at")
            return orders
      bug_lines: [7]
      line_weight: 0.4
      min_words: 8
      max_words: 200
      criteria:
        - id: returns-new-queryset
          label: Explains that filter() returns a new QuerySet instead of modifying the existing one
          weight: 2
          required: true
          any: ["returns a new", "return a new", "new queryset", "new query set", "new object", "discard", "thrown away", "throws away", "throw away", "ignored", "not assigned", "never assigned", "isn't assigned", "is not assigned", "not stored", "isn't stored", "never stored", "doesn't modify", "does not modify", "doesn't mutate", "does not mutate", "doesn't change", "does not change", "not in place", "in place", "immutable", "copy", "clone", "not saved", "isn't saved", "doesn't save", "does not save", "re:return value (is|was) (lost|unused|not used)"]
          missing_feedback: Explain what `filter()` returns and why calling it on its own line has no effect.
          misconception: {code: queryset-mutated-in-place, label: Thinks filter() modifies the QuerySet in place, category: conceptual}
        - id: reassign
          label: Fixes it by reassigning the filtered QuerySet
          weight: 1
          any: ["re:orders\\s*=\\s*orders\\s*\\.\\s*filter", "reassign", "re-assign", "assign the result", "assign it back", "assign back", "assigning the result", "store the result", "save the result", "keep the result"]
          missing_feedback: Show the corrected line, for example `orders = orders.filter(status=status)`.

  - slug: orm-queryset-cache-count-short
    skill: dj-models-orm
    kind: short_answer
    difficulty: 2
    minutes: 3
    tags: [interview]
    title: How many queries does this code run?
    objective: Predict when a QuerySet is evaluated and when its result cache is reused.
    prompt: |
      Assume at least one book matches. How many SQL queries does this code
      execute in total? Answer with a number.

      ```python
      books = Book.objects.filter(published_year__gte=2020)
      books = books.exclude(author__isnull=True).order_by("title")
      if books:
          for book in books:
              print(book.title)
      print(len(books))
      ```
    hints:
      - Building and chaining a QuerySet does not touch the database.
      - Find the first line that needs actual rows, then ask what the QuerySet keeps afterwards.
    explanation: |
      Lines 1 and 2 only build a query. `if books:` calls `bool()`, which
      evaluates the QuerySet and stores every row in its **result cache**.
      The `for` loop and `len(books)` both reuse that cache, and `book.title`
      is an ordinary column that is already loaded, so exactly **one** query
      runs. A new query only happens if you build a new QuerySet (for example
      by calling `filter()` again) or use a method that always queries, such
      as `exists()` or `iterator()`.
    solution: |
      **1.** `if books:` evaluates the QuerySet once and fills its result
      cache; iterating and `len()` reuse the cached rows.
    content:
      placeholder: e.g. 2
      accepted: ["1", "one", "1 query", "one query", "a single query", "single query"]
      wrong:
        - answers: ["3", "three", "4", "four", "3 queries", "4 queries"]
          feedback: Using the same QuerySet again does not repeat the query. Once `if books:` has evaluated it, the loop and `len()` read the cached rows.
          misconception: {code: queryset-reevaluated, label: Thinks every use of a QuerySet runs a new query, category: conceptual}
        - answers: ["2", "two", "2 queries"]
          feedback: Chaining `filter()`, `exclude()` and `order_by()` is lazy and runs no SQL, and `len()` on an already evaluated QuerySet uses its cache.
          misconception: {code: queryset-reevaluated, label: Thinks every use of a QuerySet runs a new query, category: conceptual}
        - answers: ["0", "zero", "none", "0 queries"]
