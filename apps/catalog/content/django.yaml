  - slug: jobs-enqueue-before-commit-mcq
    skill: background-jobs
    secondary_skills: [dj-transactions]
    kind: multiple_choice
    difficulty: 3
    minutes: 3
    diagnostic: true
    tags: [scenario]
    title: The welcome email task can't find the new user
    objective: Explain why a task enqueued inside a transaction can run before its data is committed.
    prompt: |
      ```python
      @transaction.atomic
      def register(request):
          form = SignupForm(request.POST)
          if not form.is_valid():
              return render(request, "signup.html", {"form": form})
          user = form.save()
          send_welcome_email.delay(user.pk)
          return redirect("onboarding")
      ```

      A few times a day the Celery task fails with `User.DoesNotExist`, even
      though every user is created successfully. What is the root cause, and
      the best fix?
    hints:
      - The task is published to the broker at the moment `.delay()` is called. When does the `INSERT` become visible to other connections?
      - Django has a hook for running code only after the current transaction commits.
    explanation: |
      `.delay()` publishes the message immediately, but the `INSERT` only
      becomes visible to other database connections when the surrounding
      transaction **commits**, after the view returns. A fast worker can
      query for the user before that moment and find nothing; if the
      transaction rolls back, the task refers to a user who never existed.
      Enqueue after commit:
      `transaction.on_commit(lambda: send_welcome_email.delay(user.pk))`, or
      with Celery 5.4+'s Django task class, `send_welcome_email.delay_on_commit(user.pk)`.
    content:
      multiple: false
      options:
        - id: a
          text: The worker can run before the transaction commits, so it cannot see the row yet; enqueue the task with transaction.on_commit().
          correct: true
          feedback: Correct. The message is published immediately, but the row only becomes visible at commit. `on_commit` publishes after the data is durable, and never after a rollback.
        - id: b
          text: Celery cannot serialise the primary key correctly; pass the User instance to the task instead.
          feedback: The ID serialises fine. Passing model instances is worse, because they must be pickled (the JSON serializer rejects them) and they go stale. Always pass IDs.
          misconception: {code: pass-model-instances, label: Passes model instances to tasks instead of IDs, category: conceptual}
        - id: c
          text: Add autoretry with a countdown so the task waits until the row exists.
          feedback: Retries hide the race instead of removing it, add delay to every affected email, and still run (and fail) for transactions that were rolled back.
          misconception: {code: retry-masks-race, label: Uses retries to paper over a race condition, category: logic}
        - id: d
          text: ".delay() runs the task synchronously inside the request, before form.save() has written the row."
          feedback: "`.delay()` only publishes a message; a separate worker process runs the task. And `form.save()` has already executed by the time `.delay()` is called."
          misconception: {code: delay-runs-sync, label: Thinks delay() runs the task inside the request, category: conceptual}

  - slug: jobs-idempotency-key-code
    skill: background-jobs
    secondary_skills: [http-api-design]
    kind: python_code
    difficulty: 4
    minutes: 25
    tags: [interview]
    title: Implement an idempotency-key store
    objective: Implement idempotency keys that replay stored results, reject conflicting reuse and expire after a TTL.
    prompt: |
      Clients of your payments API send an `Idempotency-Key` header so that a
      retried `POST /charges` never charges a card twice. Implement the store
      behind it (standard library only; single-threaded is fine).

      ```python
      store = IdempotencyStore(ttl=24 * 3600)
      response = store.execute(key, payload, charge_card)
      ```

      * `execute(key, payload, handler)`: on the first call for `key`, call
        `handler(payload)`, remember the result and return it.
      * A later call with the same key and an **equal** payload returns the
        stored result **without** calling the handler again. Payloads are
        JSON-compatible dicts; key order does not matter.
      * Reusing a key with a **different** payload raises
        `IdempotencyConflict`. The stored payload must not change if the
        caller mutates its dict afterwards.
      * If the handler raises, the exception propagates and nothing is
        stored, so the client can retry.
      * An entry stored at time `t` expires once `clock() >= t + ttl`; after
        that the key is treated as new.
    hints:
      - Store a fingerprint of the payload next to the response, not a reference to the caller's dict.
      - "`json.dumps(payload, sort_keys=True)` gives the same string for dicts that differ only in key order."
      - Only write to the store after the handler has returned successfully.
    explanation: |
      Retries are unavoidable: a client that times out cannot tell whether
      the charge happened. An idempotency key turns "maybe twice" into
      "exactly once" from the client's point of view: the first request does
      the work and stores the response, retries replay it. Fingerprinting the
      payload catches clients that reuse a key for a different operation,
      which would otherwise silently return the wrong result. In production
      the store is a database table with a unique constraint on the key and an
      "in progress" state, so that two concurrent requests with the same key
      cannot both run the handler.
    solution: |
      Keep `key -> (expires_at, fingerprint, response)`. The fingerprint is
      canonical JSON (`sort_keys=True`), which ignores key order and is
      immune to later mutation of the caller's dict. On each call, drop the
      entry if it has expired; replay or raise `IdempotencyConflict` if it
      exists; otherwise run the handler and store the result only after it
      succeeds.

      ```python
      def execute(self, key, payload, handler):
          now = self._clock()
          fingerprint = json.dumps(payload, sort_keys=True, separators=(",", ":"))
          entry = self._entries.get(key)
          if entry is not None and entry[0] <= now:
              del self._entries[key]
              entry = None
          if entry is not None:
              if entry[1] != fingerprint:
                  raise IdempotencyConflict(key)
              return entry[2]
          response = handler(payload)
          self._entries[key] = (now + self.ttl, fingerprint, response)
          return response
      ```
    content:
      starter_code: |
        import json
        import time


        class IdempotencyConflict(Exception):
            """The key was already used with a different payload."""


        class IdempotencyStore:
            def __init__(self, ttl=24 * 3600, clock=time.monotonic):
                self.ttl = ttl
                self._clock = clock
                self._entries = {}

            def execute(self, key, payload, handler):
                # TODO: replay stored responses, detect conflicting payloads, expire keys
                return handler(payload)
      reference_solution: |
        import json
        import time


        class IdempotencyConflict(Exception):
            """The key was already used with a different payload."""


        class IdempotencyStore:
            def __init__(self, ttl=24 * 3600, clock=time.monotonic):
                self.ttl = ttl
                self._clock = clock
                self._entries = {}  # key -> (expires_at, fingerprint, response)

            @staticmethod
            def _fingerprint(payload):
                return json.dumps(payload, sort_keys=True, separators=(",", ":"))

            def execute(self, key, payload, handler):
                now = self._clock()
                fingerprint = self._fingerprint(payload)
                entry = self._entries.get(key)
                if entry is not None and entry[0] <= now:
                    del self._entries[key]
                    entry = None
                if entry is not None:
                    _, stored_fingerprint, response = entry
                    if stored_fingerprint != fingerprint:
                        raise IdempotencyConflict(f"key {key!r} was used with a different payload")
                    return response
                response = handler(payload)
                self._entries[key] = (now + self.ttl, fingerprint, response)
                return response
    tests:
      - name: the first request runs the handler
        code: |
          calls = []
          def charge(payload):
              calls.append(payload)
              return {"status": "charged", "amount": payload["amount"]}
          store = IdempotencyStore(clock=lambda: 0.0)
          assert store.execute("key-1", {"amount": 500}, charge) == {"status": "charged", "amount": 500}
          assert len(calls) == 1
      - name: a retried request replays the stored response without charging again
        code: |
          calls = []
          def charge(payload):
              calls.append(payload)
              return {"charge_id": f"ch_{len(calls)}"}
          store = IdempotencyStore(clock=lambda: 0.0)
          first = store.execute("key-1", {"amount": 500}, charge)
          second = store.execute("key-1", {"amount": 500}, charge)
          assert first == second == {"charge_id": "ch_1"}, (first, second)
          assert len(calls) == 1
          assert store.execute("key-2", {"amount": 500}, charge) == {"charge_id": "ch_2"}
      - name: reusing a key with a different payload is rejected, key order is irrelevant
        hidden: true
        code: |
          store = IdempotencyStore(clock=lambda: 0.0)
          handler = lambda payload: {"ok": True}
          store.execute("k", {"amount": 500, "currency": "EUR"}, handler)
          assert store.execute("k", {"currency": "EUR", "amount": 500}, handler) == {"ok": True}
          try:
              store.execute("k", {"amount": 900, "currency": "EUR"}, handler)
          except IdempotencyConflict:
              pass
          else:
              raise AssertionError("expected IdempotencyConflict")
      - name: failed attempts are not stored, so a retry runs the handler again
        hidden: true
        code: |
          attempts = []
          def flaky(payload):
              attempts.append(1)
              if len(attempts) == 1:
                  raise ConnectionError("gateway timeout")
              return {"status": "charged"}
          store = IdempotencyStore(clock=lambda: 0.0)
          try:
              store.execute("k", {"amount": 1}, flaky)
          except ConnectionError:
              pass
          else:
              raise AssertionError("expected the handler's error to propagate")
          assert store.execute("k", {"amount": 1}, flaky) == {"status": "charged"}
          assert len(attempts) == 2
      - name: keys expire after the TTL, and later mutation of the payload is not trusted
        hidden: true
        code: |
          class FakeClock:
              now = 0.0
              def __call__(self):
                  return self.now
          clock = FakeClock()
          calls = []
          def handler(payload):
              calls.append(dict(payload))
              return len(calls)
          store = IdempotencyStore(ttl=60, clock=clock)
          payload = {"amount": 500}
          assert store.execute("k", payload, handler) == 1
          payload["amount"] = 900
          try:
              store.execute("k", payload, handler)
          except IdempotencyConflict:
              pass
          else:
              raise AssertionError("the stored payload changed when the caller mutated its dict")
          clock.now = 59.9
          assert store.execute("k", {"amount": 500}, handler) == 1
          clock.now = 60.0
          assert store.execute("k", {"amount": 900}, handler) == 2

  - slug: jobs-delivery-guarantee-short
    skill: background-jobs
    kind: short_answer
    difficulty: 3
    minutes: 2
    tags: [interview]
    title: Which delivery guarantee forces idempotent tasks?
    objective: Name the delivery guarantee of acknowledge-after-processing queues and connect it to idempotency.
    prompt: |
      Your Celery workers run with `acks_late=True`: a message is acknowledged
      only after its task finishes. A worker machine loses power right after
      charging a card but before acknowledging the message, so the broker
      redelivers the message to another worker, which runs the task again.

      Which delivery guarantee does this setup provide? (It is the reason
      every task must be idempotent.)
    hints:
      - Can a message be lost in this setup? Can it be processed more than once?
      - The guarantee is usually written as "at ___ once".
    explanation: |
      Acknowledging after processing means a message is never lost, but it
      can be delivered and processed **more than once**: **at-least-once**
      delivery. Acknowledging on receipt gives at-most-once (a crash loses
      the job). End-to-end exactly-once *processing* is not something the
      queue can give you; you build it from at-least-once delivery plus
      idempotent handlers (idempotency keys, unique constraints, state checks).
    solution: |
      **At-least-once delivery.** Messages are only acknowledged after
      processing, so none are lost, but crashes cause redeliveries, and the
      handler must make duplicates harmless.
    content:
      placeholder: e.g. best-effort
      accepted: ["at-least-once", "at least once", "at-least-once delivery", "at least once delivery", "at-least once"]
      wrong:
        - answers: ["exactly-once", "exactly once", "exactly-once delivery", "exactly once delivery"]
          feedback: The redelivery in the scenario is exactly what exactly-once would forbid. Queues cannot guarantee exactly-once processing; you get there with idempotent handlers.
          misconception: {code: exactly-once-delivery, label: Believes message queues deliver exactly once, category: conceptual}
        - answers: ["at-most-once", "at most once", "at-most-once delivery", "at most once delivery"]
          feedback: At-most-once is what you get when messages are acknowledged on receipt, so a crash loses the job. Here the message was redelivered, so it can be processed more than once.
          misconception: {code: delivery-guarantee-confusion, label: Confuses acknowledgement timing with delivery guarantees, category: conceptual}

