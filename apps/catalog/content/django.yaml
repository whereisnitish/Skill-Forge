  - slug: urls-resolution-reverse-explain
    skill: dj-views-urls
    kind: concept_explanation
    difficulty: 2
    minutes: 8
    title: How does a URL reach its view?
    objective: Explain URL resolution, include(), path converters and why named URLs are reversed.
    prompt: |
      A colleague new to Django asks how a request for `/shop/products/42/`
      reaches a view, and why the team insists on `reverse()` and `{% url %}`
      instead of writing paths by hand.

      ```python
      # config/urls.py (ROOT_URLCONF)
      urlpatterns = [
          path("shop/", include("shop.urls")),
      ]

      # shop/urls.py
      app_name = "shop"
      urlpatterns = [
          path("products/<int:pk>/", views.product_detail, name="product-detail"),
      ]
      ```

      Explain how Django chooses the view, what `include()` does with the
      path, what happens to `42`, and why named URLs are worth it.
    hints:
      - Start from `ROOT_URLCONF` and describe how the list is searched.
      - "`include()` hands only part of the path to the next URLconf. Which part?"
      - Think about what happens to every hard-coded link when a path changes.
    explanation: |
      Django loads `ROOT_URLCONF` and tries each pattern **in order**; the first
      match wins, and no match means a 404. `include()` matches the prefix
      (`shop/`), strips it and resolves the remainder (`products/42/`) against
      the included URLconf. Path converters such as `<int:pk>` both restrict
      what matches and convert the value, so the view is called as
      `product_detail(request, pk=42)` with an `int`. Naming patterns lets
      `reverse("shop:product-detail", kwargs={"pk": 42})` and
      `{% url "shop:product-detail" pk=42 %}` generate URLs, so paths can change
      in one place without breaking hard-coded links, and `app_name`
      namespaces stop names from clashing between apps.
    solution: |
      Django starts at `ROOT_URLCONF` and tests the `urlpatterns` in order, top
      to bottom; the first pattern that matches wins and nothing after it is
      tried. If nothing matches, Django returns a 404.

      `path("shop/", include("shop.urls"))` matches the leading `shop/`, strips
      that matched prefix and passes the remainder, `products/42/`, to the
      patterns in `shop/urls.py`. There `<int:pk>` uses the `int` converter: it
      only matches digits and converts the captured text to the integer 42,
      which is passed as the keyword argument `pk=42`, so Django calls
      `product_detail(request, pk=42)`.

      Named URLs matter because `reverse("shop:product-detail", kwargs={"pk": 42})`
      and `{% url "shop:product-detail" pk=42 %}` build the URL from the
      pattern. We can change a path in one place without hunting down
      hard-coded links that would otherwise break, and the `app_name`
      namespace avoids clashes between apps that reuse a name.
    content:
      min_words: 50
      max_words: 350
      placeholder: Walk through the request step by step…
      criteria:
        - id: ordered-first-match
          label: Patterns are tried in order and the first match wins
          weight: 2
          required: true
          any: ["in order", "first match", "first matching", "first pattern", "first one that matches", "first that matches", "top to bottom", "top down", "sequentially", "one by one", "in turn", "in sequence", "order of the list", "list order"]
          missing_feedback: Explain how Django searches `urlpatterns` and which pattern wins.
          misconception: {code: url-most-specific-wins, label: Thinks the URL resolver picks the most specific pattern, category: conceptual}
        - id: include-strips-prefix
          label: include() strips the matched prefix and resolves the remainder
          weight: 1
          any: ["strip", "remaining", "remainder", "rest of the", "chop", "removes the matched", "remove the matched", "removes the prefix", "cuts off", "passes the rest", "hands the rest", "re:(passes|hands|forwards|sends|leaves)[^.]{0,40}products/42", "re:matched (part|portion|prefix)", "re:prefix (is|gets) (removed|stripped|consumed)"]
          missing_feedback: Describe which part of the path `include()` passes to `shop/urls.py`.
        - id: converter-kwarg
          label: The converter converts 42 to an int passed as a keyword argument
          weight: 1
          any: ["keyword argument", "keyword arg", "kwarg", "pk=42", "pk = 42", "as an int", "as an integer", "to an int", "into an int", "an integer", "converted", "converts", "convert"]
          missing_feedback: Explain what `<int:pk>` does to the captured `42` and how the view receives it.
        - id: named-urls
          label: Named URLs avoid hard-coded paths that break when routes change
          weight: 1
          any: ["hard-cod", "hard cod", "hardcod", "one place", "single place", "change the path", "change a path", "change the url", "changing the path", "changing the url", "rename", "break", "namespac", "decoupl", "in sync"]
          missing_feedback: Explain what `reverse()` and `{% url %}` buy you when a path changes.

  # ================================================= dj-forms-validation
  - slug: forms-clean-missing-field-mcq
    skill: dj-forms-validation
    kind: multiple_choice
    difficulty: 2
    minutes: 3
    diagnostic: true
    title: Why does clean() raise KeyError?
    objective: Explain why a field can be missing from cleaned_data inside Form.clean().
    prompt: |
      ```python
      class BookingForm(forms.Form):
          start = forms.DateField()
          end = forms.DateField()

          def clean(self):
              cleaned = super().clean()
              if cleaned["end"] < cleaned["start"]:
                  raise forms.ValidationError("End must be after start.")
              return cleaned
      ```

      Submitting `start=2026-03-01&end=2026-02-31` crashes with
      `KeyError: 'end'` instead of showing a validation error. Why?
    hints:
      - February has no 31st day. Which validation step rejects that value?
      - Think about the order in which field validation and `clean()` run, and what happens to fields that fail.
    explanation: |
      Field validation runs first: each field's `clean()` (`to_python()`,
      `validate()`, validators), then `clean_<field>()`. A field that fails is
      recorded in `form.errors` and **left out of `cleaned_data`**. The
      form-wide `clean()` still runs afterwards, so it must cope with missing
      keys:

      ```python
      start, end = cleaned.get("start"), cleaned.get("end")
      if start and end and end < start:
          raise forms.ValidationError("End must be after start.")
      ```
    content:
      multiple: false
      options:
        - id: a
          text: The end field already failed its own validation, so it is not in cleaned_data when clean() runs.
          correct: true
          feedback: Correct. Invalid fields are removed from `cleaned_data`, but `clean()` still runs, so use `.get()` and skip the comparison when a value is missing.
        - id: b
          text: Form.clean() runs before the individual fields are validated, so cleaned_data is still empty.
          feedback: The order is the opposite. Fields are cleaned first; `clean()` runs last and sees only the fields that passed.
          misconception: {code: form-clean-order, label: Misunderstands the order of form validation steps, category: conceptual}
        - id: c
          text: Calling super().clean() first resets cleaned_data; it must be called at the end of the method.
          feedback: "`super().clean()` simply returns `self.cleaned_data`; calling it first is the documented pattern. The key is missing because the field was invalid."
          misconception: {code: form-clean-order, label: Misunderstands the order of form validation steps, category: conceptual}
        - id: d
          text: cleaned_data only contains fields whose values differ from their initial values.
          feedback: That describes `form.changed_data`. `cleaned_data` contains every field that validated successfully, changed or not.
          misconception: {code: cleaned-data-changed-only, label: Confuses cleaned_data with changed_data, category: conceptual}

