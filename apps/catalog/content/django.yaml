  - slug: auth-has-perm-app-label-debug
    skill: dj-auth-permissions
    kind: debugging
    difficulty: 3
    minutes: 6
    tags: [scenario]
    title: Editors get 403 when publishing, but admins don't
    objective: Diagnose a has_perm check that silently fails because of the permission string format.
    prompt: |
      The `Article` model in the `newsroom` app declares
      `permissions = [("publish_article", "Can publish articles")]`, and the
      Editors group has been granted it. Editors still get **403 Forbidden**
      from this view. It worked when the developer tested it while logged in
      as the admin user. Pick the defective line and explain both symptoms.
    hints:
      - The group, the permission and the user's membership are all set up correctly in the database.
      - Look at the exact string passed to the permission check, and compare it with how Django names permissions.
      - Why would the same check pass for the admin account regardless of the string?
    explanation: |
      `has_perm()` expects `"<app_label>.<codename>"`. `"publish_article"`
      matches no permission, so the check returns `False` for every normal
      user. Active superusers short-circuit every `has_perm()` call to `True`,
      which is why the developer never saw the bug. Use
      `has_perm("newsroom.publish_article")`, and always test permission code
      with a non-superuser account.
    solution: |
      Line 13 passes the codename without the app label. `has_perm()` expects
      `"newsroom.publish_article"` (`<app_label>.<codename>`), so the check is
      always false for editors. It passed in testing because an active
      superuser is granted every permission, whatever the string.

      ```python
      if not request.user.has_perm("newsroom.publish_article"):
          raise PermissionDenied
      ```
    content:
      language: python
      code: |
        from django.contrib.auth.decorators import login_required
        from django.core.exceptions import PermissionDenied
        from django.shortcuts import get_object_or_404, redirect
        from django.views.decorators.http import require_POST

        from .models import Article


        @login_required
        @require_POST
        def publish_article(request, pk):
            article = get_object_or_404(Article, pk=pk, newsroom=request.user.newsroom)
            if not request.user.has_perm("publish_article"):
                raise PermissionDenied
            article.status = Article.Status.PUBLISHED
            article.save(update_fields=["status"])
            return redirect("article-detail", pk=article.pk)
      bug_lines: [13]
      line_weight: 0.4
      min_words: 10
      max_words: 200
      criteria:
