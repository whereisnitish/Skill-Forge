      A page lists 50 authors and, under each one, the titles of their books
      (`{% for book in author.books.all %}`). Which queryset avoids running a
      query per author?
    hints:
      - Each author has *many* books. How would a single SQL JOIN represent that?
      - One of the two relation-loading methods only follows single-valued relations.
    explanation: |
      `select_related()` follows **single-valued** relations (forward foreign
      keys and one-to-one) with a SQL JOIN. A reverse foreign key is
      many-valued, so `select_related("books")` raises `FieldError`.
      `prefetch_related("books")` runs one extra query
      (`... WHERE author_id IN (...)`) and attaches the books to each author in
      Python: 2 queries in total, whatever the number of authors.
    content:
      multiple: false
      options:
        - id: a
          text: Author.objects.prefetch_related("books")
          correct: true
          feedback: Correct. Two queries in total, one for authors and one for all of their books, matched up in Python.
        - id: b
          text: Author.objects.select_related("books")
          feedback: "`select_related()` only follows single-valued relations (forward ForeignKey and OneToOne). For a reverse foreign key Django raises `FieldError: Invalid field name(s) given in select_related`."
          misconception: {code: select-related-many, label: Thinks select_related works for many-valued relations, category: conceptual}
        - id: c
          text: Author.objects.all(), because Django caches each related manager after the first access
          feedback: Without prefetching, every `author.books.all` in the template runs its own query, giving 1 + 50 queries.
          misconception: {code: orm-auto-prefetch, label: Thinks the ORM loads or caches related objects automatically, category: performance}
        - id: d
          text: Author.objects.annotate(book_count=Count("books"))
          feedback: "`annotate()` adds an aggregate column such as a count; it does not load the related `Book` rows, so their titles would still be fetched per author."
          misconception: {code: annotate-loads-related, label: Thinks annotate() loads related rows, category: conceptual}

  - slug: queryopt-order-list-n-plus-one-review
    skill: dj-query-optimization
    kind: code_review
    difficulty: 3
    minutes: 12
    tags: [scenario]
    title: Review a slow recent-orders page
    objective: Spot N+1 queries, per-row aggregation and unbounded querysets in a Django view.
    prompt: |
      This view powers the "Recent orders" page. Large shops report that it
      takes several seconds to load and the database CPU spikes whenever it is
      opened. Review the code: list each problem, why it hurts, and how you
      would fix it with the ORM.
    hints:
      - Count the queries for a shop with N orders. Which lines run a query on every loop iteration?
      - Each line inside the loop that touches a relation is a separate problem with its own fix.
      - Also ask how many orders this page loads for a shop that has been trading for five years.
    explanation: |
      For N orders this view runs **3N + 1** queries: one for the orders, then
      a customer lookup, a `COUNT` and an items query per order. Fix them with
      `select_related("customer")` (a JOIN), and compute the item count and
      total in the database with `annotate(item_count=Count("items"),
      total=Sum(F("items__price") * F("items__quantity")))`. Both annotations
      use the same single join, so they do not inflate each other. Finally,
      "recent" orders should be a bounded slice or a paginated page: the
      current queryset loads the shop's entire history on every request.
    solution: |
      1. **N+1 on customers**: `order.customer.name` runs one query per order.
         Add `select_related("customer")` so the customer is joined in the main
         query.
      2. **COUNT per order**: `order.items.count()` runs a separate
         `SELECT COUNT(*)` for each order. Use
         `.annotate(item_count=Count("items"))` instead.
      3. **Items fetched per order to add up totals in Python**:
         `order.items.all()` is yet another query per order. Compute the total
         in the database with
         `.annotate(total=Sum(F("items__price") * F("items__quantity")))`
         (or `prefetch_related("items")` if the items are displayed).
      4. **Unbounded queryset**: the page loads every order the shop has ever
         had. Slice it (`[:50]`) or paginate, and use `.count()` for the total.

      ```python
      orders = (
          Order.objects.filter(shop=request.user.shop)
          .select_related("customer")
          .annotate(
              item_count=Count("items"),
              total=Sum(F("items__price") * F("items__quantity")),
          )
          .order_by("-created_at")[:50]
      )
      ```

      The page now runs one query instead of 3N + 1.
    content:
      language: python
      min_words: 40
      max_words: 400
      placeholder: List each issue, its impact and the fix…
      code: |
        from django.shortcuts import render

        from .models import Order


        def recent_orders(request):
            orders = Order.objects.filter(shop=request.user.shop).order_by("-created_at")
            rows = []
            for order in orders:
                rows.append({
                    "number": order.number,
                    "customer": order.customer.name,
                    "items": order.items.count(),
                    "total": sum(i.price * i.quantity for i in order.items.all()),
                })
            return render(request, "orders/recent.html", {"rows": rows, "total_orders": len(orders)})
      criteria:
        - id: customer-n-plus-one
          label: Spots the per-order customer query (N+1) and fixes it with select_related
          weight: 2
