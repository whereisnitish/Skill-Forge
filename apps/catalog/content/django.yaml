          misconception: {code: left-join-drops-unmatched, label: Thinks a LEFT JOIN drops unmatched left rows, category: conceptual}

  - slug: sql-left-join-where-filter-debug
    skill: sql-joins
    kind: debugging
    difficulty: 2
    minutes: 5
    title: Customers without 2026 orders vanish from the report
    objective: Diagnose a WHERE condition that silently turns a LEFT JOIN into an inner join.
    prompt: |
      The report should list **every** customer with the number of orders
      they placed in 2026, showing 0 for customers without any. Customers with
      no 2026 orders are missing from the output entirely. Pick the line that
      causes this and explain the fix.
    hints:
      - Which rows does the LEFT JOIN produce for a customer with no 2026 orders?
      - "What is the value of `o.created_at` in those rows, and what does the comparison evaluate to?"
    explanation: |
      For a customer without matching orders the `LEFT JOIN` produces a row
      whose `o.*` columns are `NULL`. `WHERE o.created_at >= '2026-01-01'`
      evaluates to NULL (unknown) for that row, so it is filtered out, which
      makes the outer join behave like an inner join. Conditions on the
      right-hand table belong in the `ON` clause, so they restrict which
      orders match without removing customers:

      ```sql
      LEFT JOIN orders AS o
        ON o.customer_id = c.id
       AND o.created_at >= '2026-01-01'
       AND o.created_at <  '2027-01-01'
      ```
    solution: |
      The `WHERE` clause on lines 6–7 filters on the right-hand table. For
      customers without 2026 orders `o.created_at` is NULL, the comparison is
      not true, and those rows are discarded, effectively an inner join. Move
      the date conditions into the `ON` clause (the join condition) so that
      unmatched customers keep their NULL-padded row and `COUNT(o.id)`
      reports 0.
    content:
      language: sql
      code: |
        -- Every customer with the number of orders placed in 2026 (0 if none)
        SELECT c.id, c.name, COUNT(o.id) AS orders_2026
        FROM customers AS c
        LEFT JOIN orders AS o
          ON o.customer_id = c.id
        WHERE o.created_at >= '2026-01-01'
          AND o.created_at < '2027-01-01'
        GROUP BY c.id, c.name
        ORDER BY orders_2026 DESC;
      bug_lines: [6, 7]
      line_weight: 0.4
      min_words: 10
      max_words: 200
      criteria:
        - id: move-to-on
          label: Moves the date conditions into the ON clause
          weight: 2
          required: true
          any: ["on clause", "join condition", "into the on", "in the on", "to the on", "move the condition", "move the date", "move the filter", "moving the condition", "moving the date", "moving the filter", "in the join", "into the join", "to the join", "part of the join", "join clause", "join predicate", "re:\\bon\\b[^.]{0,30}(clause|condition)"]
          missing_feedback: Where should conditions on the right-hand table of a LEFT JOIN go?
          misconception: {code: where-on-outer-join, label: Filters the right-hand table of a LEFT JOIN in WHERE, category: logic}
        - id: nulls-filtered
          label: Explains that the NULL-padded rows fail the WHERE condition, effectively an inner join
          weight: 1
          any: ["null", "inner join", "effectively an inner", "turns it into", "turns the left join", "discard", "filters out", "filtered out", "removes the unmatched", "removes unmatched", "unmatched rows", "unmatched customers"]
          missing_feedback: Explain what happens to customers without 2026 orders when the WHERE clause is evaluated.
          misconception: {code: where-on-outer-join, label: Filters the right-hand table of a LEFT JOIN in WHERE, category: logic}

  - slug: sql-join-fan-out-explain
    skill: sql-joins
    secondary_skills: [dj-query-optimization]
    kind: concept_explanation
    difficulty: 3
    minutes: 10
    tags: [interview]
    title: Why are the totals multiplied?
    objective: Explain join fan-out when aggregating over two one-to-many relations, and how to fix it.
    prompt: |
      A customer has 3 payments of 100 each and 2 support tickets. This query
      reports `paid = 600` and `tickets = 6` for them:

      ```sql
      SELECT c.id, SUM(p.amount) AS paid, COUNT(t.id) AS tickets
      FROM customers AS c
      LEFT JOIN payments AS p ON p.customer_id = c.id
      LEFT JOIN support_tickets AS t ON t.customer_id = c.id
      GROUP BY c.id;
      ```

      Explain why, how to fix the query, and whether `DISTINCT` is a valid
      fix. Does the Django ORM have the same problem?
    hints:
      - Write out the rows for this customer after the first join, then after the second.
      - Each child table needs to be reduced to one row per customer before it meets the other.
      - Would `SUM(DISTINCT p.amount)` give 300 for three payments of 100?
    explanation: |
      Joining two independent one-to-many tables pairs every payment with
      every ticket: 3 × 2 = 6 rows per customer (**fan-out**). Each payment is
      repeated twice and each ticket three times, so the sum and the count are
      inflated. Aggregate each child table separately (subqueries, CTEs or
      `LATERAL`) and join the one-row-per-customer results.
      `COUNT(DISTINCT t.id)` happens to fix the count, but `SUM(DISTINCT
      p.amount)` is wrong: it collapses equal amounts, giving 100. Django's
      `annotate(Sum("payments__amount"), Count("tickets"))` generates the same
      joins and the same wrong numbers; use `Subquery` annotations instead.
    solution: |
      Each join multiplies rows. Joining payments gives 3 rows for the
      customer; joining tickets then pairs each of those with both tickets, so
      the group has 3 × 2 = 6 rows, a fan-out (effectively a cross product per
      customer). Each payment is repeated twice, so `SUM` gives 600, and each
      ticket three times, so `COUNT` gives 6.

      Fix it by aggregating each child table separately before joining:
      compute payments per customer and tickets per customer in subqueries or
      CTEs, then `LEFT JOIN` those one-row-per-customer results (or use
      correlated subqueries or `LATERAL`).

      `COUNT(DISTINCT t.id)` would repair the ticket count, but
      `SUM(DISTINCT p.amount)` is not a fix: it collapses the three equal
      amounts of 100 into a single 100.

      The Django ORM has the same trap: `annotate(paid=Sum("payments__amount"),
      tickets=Count("tickets"))` joins both relations and returns the same
      inflated numbers, so use `Subquery` annotations instead.
    content:
      language: sql
      min_words: 50
      max_words: 350
      placeholder: Walk through the rows produced by each join…
      criteria:
        - id: row-multiplication
          label: Explains that the two joins multiply rows (3 × 2 = 6)
          weight: 2
          required: true
          any: ["cartesian", "cross product", "cross join", "every combination", "each combination", "all combinations", "multipl", "3 x 2", "3 × 2", "3*2", "3 * 2", "six rows", "6 rows", "fan out", "fanout", "duplicat", "repeated", "counted twice", "counted multiple"]
          missing_feedback: Write out how many rows this customer has after both joins, and why.
          misconception: {code: join-fan-out, label: Does not see that joining several one-to-many tables multiplies rows, category: logic}
        - id: aggregate-separately
          label: Aggregates each child table separately before joining
          weight: 1
          any: ["subquer", "sub-quer", "cte", "with clause", "derived table", "pre-aggregat", "preaggregat", "aggregate each", "aggregate separately", "aggregate them separately", "aggregating each", "aggregating separately", "separately", "before joining", "before the join", "lateral"]
          missing_feedback: How can each child table be reduced to one row per customer before the tables are combined?
        - id: distinct-pitfall
          label: Explains that SUM(DISTINCT) is not a valid fix
          weight: 1
          any: ["sum(distinct", "re:distinct[^.]{0,80}(equal|same|identical|duplicate) (amount|value|payment)", "re:(equal|same|identical) (amount|value|payment)s?[^.]{0,80}distinct", "re:distinct[^.]{0,60}(wrong|incorrect|not (a |the )?(valid )?fix|doesn't work|does not work|breaks|collapse)"]
          missing_feedback: Would `SUM(DISTINCT p.amount)` return 300 here?
          misconception: {code: distinct-fixes-fan-out, label: Thinks DISTINCT reliably fixes inflated aggregates, category: logic}
        - id: orm-same-problem
          label: Notes that Django annotations across two multi-valued relations have the same problem
          weight: 1
          any: ["annotate", "re:subquery\\(", "re:(django|orm)[^.]{0,80}(same|also|too|as well|identical|inflat|wrong|double|multipl|join)", "re:(same|also|too|as well|identical)[^.]{0,80}(django|orm)"]
          missing_feedback: What SQL does `annotate(Sum("payments__amount"), Count("tickets"))` generate?

  # ========================================================= sql-indexes
  - slug: indexes-composite-order-mcq
    skill: sql-indexes
    kind: multiple_choice
    difficulty: 3
    minutes: 3
    diagnostic: true
    tags: [interview]
    title: Which query does this composite index serve?
    objective: Predict which queries a composite B-tree index can serve efficiently.
    prompt: |
      ```sql
      CREATE INDEX orders_customer_created_idx ON orders (customer_id, created_at);
      ```

      `orders` has 50 million rows spread over 2 million customers. Which
      query can use this index **efficiently**, reading only a small part of
      it?
    hints:
      - A composite B-tree is sorted by the first column, then by the second within each value of the first.
      - Think of a phone book sorted by surname, then first name. Which lookups are fast?
    explanation: |
      A B-tree on `(customer_id, created_at)` is sorted by customer first and,
      within each customer, by date. `WHERE customer_id = 42 ORDER BY
      created_at DESC LIMIT 20` jumps straight to customer 42, reads that
      customer's entries already in date order (backwards) and stops after 20:
      no sort, no scan. A condition on `created_at` alone matches entries
      scattered across 2 million customer groups (PostgreSQL 18's skip scan
      only pays off when the leading column has few distinct values), and a
      condition matching almost every row is cheaper as a sequential scan, so
      the planner will not use the index for it.
    content:
      multiple: false
      options:
        - id: a
          text: "WHERE customer_id = 42 ORDER BY created_at DESC LIMIT 20"
          correct: true
          feedback: Correct. Equality on the leading column plus ordering by the second column lets PostgreSQL read 20 index entries in order and stop.
        - id: b
          text: "WHERE created_at >= '2026-01-01'"
          feedback: The index is ordered by `customer_id` first, so matching dates are scattered across every customer's section of the index. Filtering on `created_at` alone needs its own index (or `created_at` first).
          misconception: {code: composite-any-column, label: Thinks a composite index helps queries on any of its columns, category: performance}
        - id: c
          text: "WHERE customer_id > 0 (matches 99% of rows)"
          feedback: The planner estimates that almost every row matches, so reading the table sequentially is cheaper than millions of index lookups. An index is only chosen when it is expected to be cheaper.
          misconception: {code: index-always-used, label: Thinks the planner always uses an available index, category: performance}
        - id: d
          text: None of them; a composite index is only used when every indexed column is in the WHERE clause.
          feedback: Queries that constrain a leading prefix of the columns (here `customer_id`) can use the index, and the remaining columns can still provide ordering.
          misconception: {code: composite-needs-all-columns, label: Thinks a composite index is only used when all its columns are filtered, category: conceptual}

  - slug: indexes-events-model-review
    skill: sql-indexes
    secondary_skills: [dj-migrations]
    kind: code_review
    difficulty: 3
    minutes: 12
    tags: [scenario]
    title: Review the indexes on a 400-million-row table
    objective: Match index definitions to real queries, spot unusable and unused indexes, and build indexes safely.
    prompt: |
      `Event` has 400 million rows and receives thousands of inserts per
      second; `Customer` has 30 million rows. The two functions below are the
      **only** queries that touch these tables, and both are slow. A teammate
      opened a PR that adds the `indexes` shown. Review the models, the
      queries and how the PR should be rolled out (PostgreSQL).
    hints:
      - For each query, write down which columns use equality, which use a range and which are sorted.
      - Look at the SQL Django generates for `__iexact` on PostgreSQL. Can a plain B-tree on `email` serve it?
      - Ask what each index costs on every insert, and what a plain `CREATE INDEX` locks.
    explanation: |
      Design indexes from the queries: equality columns first, then the range
      or sort column, so `(account, created_at)` serves "this account's events
      from the last week, newest first". Lookups that wrap a column in a
      function, as `__iexact` does with `UPPER()`, need a matching expression
      index or normalised data. Every index slows every write, so drop indexes
      no query uses. On large tables build indexes with
      `CREATE INDEX CONCURRENTLY` (`AddIndexConcurrently` in a non-atomic
      migration) so writes are not blocked during the build.
    solution: |
      1. **Wrong column order.** The query filters `account` by equality,
         `created_at` by range and sorts by `created_at`, so the index should be
         `(account, created_at)`: equality column first, then the range/sort
         column. With `created_at` first, PostgreSQL has to walk a week of
         *every* account's events.
      2. **`email__iexact` cannot use the unique index.** On PostgreSQL it
         compiles to `UPPER("email"::text) = UPPER(...)`, so the B-tree on
         `email` is not used and every lookup scans the table. Add an
         expression index `Index(Upper("email"), name="customer_email_upper_idx")`,
         or store emails normalised to lowercase and use an exact lookup.
      3. **Unused index on `kind`.** No query filters on it, and with a handful
         of distinct values it is low selectivity anyway; it only slows down
         every insert on a write-heavy table. Drop it.
      4. **Rollout.** A plain `CREATE INDEX` on 400 million rows blocks writes
         for the whole build. Use `AddIndexConcurrently`
         (`CREATE INDEX CONCURRENTLY`) in a migration with `atomic = False`.
    content:
      language: python
      min_words: 40
      max_words: 400
      placeholder: List each issue, why it matters and the fix…
      code: |
        class Event(models.Model):
            account = models.ForeignKey(Account, on_delete=models.CASCADE)
            kind = models.CharField(max_length=40)  # 6 distinct values
            created_at = models.DateTimeField(auto_now_add=True)
            payload = models.JSONField()

            class Meta:
                indexes = [
                    models.Index(fields=["created_at", "account"]),
                    models.Index(fields=["kind"]),
                ]


        class Customer(models.Model):
            email = models.EmailField(unique=True)


        def recent_events(account):
            week_ago = timezone.now() - timedelta(days=7)
            return Event.objects.filter(
                account=account, created_at__gte=week_ago
            ).order_by("-created_at")[:50]


        def find_customer(email):
            return Customer.objects.filter(email__iexact=email).first()
      criteria:
        - id: column-order
          label: Puts the equality column first, indexing (account, created_at)
          weight: 2
          required: true
          any: ["re:[\"'\\[(]\\s*account(_id)?[\"']?\\s*,\\s*[\"']?created_at\\b(?!__)", "account and created_at", "account then created_at", "account before created_at", "account followed by created_at", "account first", "account_id first", "equality column first", "equality first", "re:equality[^.]{0,40}\\bfirst\\b", "re:\\bfirst\\b[^.]{0,30}equality", "leading column", "first column", "column order", "order of the columns", "wrong order", "reverse the order", "reversed", "swap", "leftmost", "left-most"]
          missing_feedback: Compare the column order of the composite index with how `recent_events` filters and sorts.
          misconception: {code: composite-any-column, label: Thinks a composite index helps queries on any of its columns, category: performance}
        - id: iexact-expression
          label: Explains that __iexact (UPPER) cannot use the plain index and adds an expression index or normalises emails
          weight: 1
          any: ["upper(", "lower(", "expression index", "functional index", "function-based", "index on an expression", "index on upper", "index on lower", "iexact", "case-insensitive collation", "citext", "db_collation", "normalis", "normaliz", "lowercase"]
          missing_feedback: What SQL does `email__iexact` produce on PostgreSQL, and can the unique index on `email` serve it?
        - id: unused-index
          label: Removes the unused, low-selectivity index on kind
          weight: 1
          any: ["index on kind", "re:\\bkind\\b[^.]{0,80}\\b(unused|never|not used|isn't used|no query|drop|remove|useless|unnecessary|low)", "re:\\b(drop|remove|delete|unused|unnecessary|useless)\\w*[^.]{0,60}\\bkind\\b", "unused", "low cardinality", "few distinct", "selectiv", "write overhead", "slows writes", "slows down writes", "slows down every", "slower inserts", "slower writes", "write amplification", "every insert"]
          missing_feedback: Which index does no query need, and what does it cost on a write-heavy table?
          misconception: {code: more-indexes-always-faster, label: Thinks adding indexes has no cost, category: performance}
        - id: concurrently
          label: Builds the indexes concurrently so writes are not blocked
          weight: 1
          any: ["concurrently", "addindexconcurrently", "lock", "block", "atomic = false", "atomic=false", "non-atomic"]
          missing_feedback: What happens to the thousands of inserts per second while a plain `CREATE INDEX` builds?

  - slug: indexes-explain-seq-scan-explain
    skill: sql-indexes
    kind: concept_explanation
    difficulty: 3
    minutes: 10
    title: Read this query plan and fix the query
    objective: Read an EXPLAIN ANALYZE plan, identify the bottleneck and design an index that removes it.
    prompt: |
      ```sql
      EXPLAIN ANALYZE
      SELECT * FROM orders WHERE status = 'pending' ORDER BY created_at LIMIT 20;
      ```

      ```text
      Limit  (cost=180234.12..180234.17 rows=20 width=96) (actual time=912.40..912.41 rows=20 loops=1)
        ->  Sort  (cost=180234.12..180250.62 rows=6600 width=96) (actual time=912.39..912.40 rows=20 loops=1)
              Sort Key: created_at
              Sort Method: top-N heapsort  Memory: 30kB
              ->  Seq Scan on orders  (cost=0.00..180058.50 rows=6600 width=96) (actual time=0.02..911.80 rows=6512 loops=1)
                    Filter: ((status)::text = 'pending'::text)
                    Rows Removed by Filter: 8993488
      Planning Time: 0.15 ms
      Execution Time: 912.47 ms
      ```

      Explain what this plan tells you, whether the planner's estimates are
      the problem, and which index you would add and why it helps.
    hints:
      - Read the plan from the innermost node outwards. Where is almost all of the time spent?
      - Compare the estimated `rows=` with the actual `rows=` on the scan node.
      - An index can do more than filter. Can it also hand rows back in `created_at` order?
    explanation: |
      Almost all 912 ms are spent in a **sequential scan** that reads about 9
      million rows and discards all but 6,512, which are then sorted to return
      20. The estimate (6,600 rows) matches reality (6,512), so statistics are
      fine; the problem is a missing index. An index on
      `(status, created_at)` lets PostgreSQL jump to the pending entries, read
      them already ordered by `created_at` and stop after 20 rows, removing
      both the scan and the sort. Since pending orders are a tiny fraction, a
      **partial index** `ON orders (created_at) WHERE status = 'pending'` is
      even smaller. Build it with `CREATE INDEX CONCURRENTLY`.
    solution: |
      The plan does a Seq Scan on `orders`: it reads all of the roughly 9
      million rows, and the filter throws away 8,993,488 of them
      (Rows Removed by Filter) to find 6,512 pending orders, which are then
      sorted by `created_at` only to return 20. Nearly all of the 912 ms is in
      that scan.

      The row estimate (6600) is close to the actual 6512, so the statistics
      are accurate; this is a missing index, not a misestimate.

      Add a composite index on `(status, created_at)`: the equality column
      first, then the sort column. PostgreSQL can then jump to the pending
      entries, read them already in `created_at` order, skip the sort and stop
      after 20 rows, so the query takes milliseconds. Because pending orders
      are a tiny fraction, a partial index on `(created_at) WHERE status =
      'pending'` is even smaller. Build it with `CREATE INDEX CONCURRENTLY` to
      avoid blocking writes.
    content:
      language: sql
      min_words: 50
      max_words: 350
      placeholder: Walk through the plan node by node…
      criteria:
        - id: seq-scan
          label: Identifies the sequential scan that discards almost every row as the bottleneck
          weight: 2
          required: true
          any: ["seq scan", "sequential scan", "full table scan", "full scan", "table scan", "scans the whole", "scans the entire", "reads every row", "reads the whole", "reads all", "every row", "all rows", "9 million", "nine million", "almost every row", "discards", "throws away", "re:(filter|it)[^.]{0,20}(throws|throw|discards|discard) away"]
          missing_feedback: Which node takes almost all of the 912 ms, and how many rows does it read to return 6,512?
        - id: index-design
          label: Proposes an index covering the filter and the sort, (status, created_at) or a partial index
          weight: 1
          any: ["(status, created_at)", "status, created_at", "status and created_at", "composite", "multi-column", "multicolumn", "two-column", "partial index", "re:index[^.]{0,80}where status", "re:\\(\\s*created_at\\s*\\)\\s*where"]
          missing_feedback: Which index serves both `WHERE status = 'pending'` and `ORDER BY created_at`?
          misconception: {code: index-filter-only, label: Designs indexes for filtering only and ignores sorting, category: performance}
        - id: avoids-sort
          label: Explains that the index returns rows in order, so the sort disappears and the scan stops after 20 rows
          weight: 1
          any: ["no sort", "without a sort", "without sorting", "avoid the sort", "avoids the sort", "skip the sort", "skips the sort", "remove the sort", "removes the sort", "already sorted", "already ordered", "already in", "in order", "sorted order", "index order", "stop after", "stops after", "first 20", "20 rows", "early"]
          missing_feedback: Besides filtering, what does a B-tree on `created_at` give the `ORDER BY ... LIMIT 20`?
        - id: estimates
          label: Notes that the row estimates are accurate, so statistics are not the problem
          weight: 1
          any: ["estimate", "statistic", "misestimat", "accurate", "re:6,?600[^.]{0,40}6,?512", "re:6,?512[^.]{0,40}6,?600"]
          missing_feedback: Compare `rows=6600` with `actual ... rows=6512`. What does that tell you?

  # ===================================================== http-api-design
  - slug: http-safe-retry-idempotent-mcq
    skill: http-api-design
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    tags: [interview]
    title: Which request can a client retry blindly?
    objective: Identify which HTTP requests are idempotent and therefore safe to retry after a timeout.
    prompt: |
      A mobile client's request times out: it does not know whether the
      server processed it. According to HTTP semantics, which request can it
      safely retry without any extra mechanism?
    hints:
      - Idempotent means that sending the same request twice has the same effect on the server as sending it once.
      - Compare "set this to X" with "add X" or "create another one".
    explanation: |
      `PUT` replaces the target resource with the representation sent, so
      repeating it leaves the same final state: it is **idempotent**, as are
      `GET`, `HEAD`, `OPTIONS` and `DELETE`. `POST` is not: each call may create
      another resource. `PATCH` is not guaranteed to be idempotent, and an
      "increment" patch clearly is not. Non-idempotent operations need an
      idempotency key so the server can recognise and deduplicate retries.
    content:
      multiple: false
      options:
        - id: a
          text: PUT /users/7/avatar with the complete new avatar image
          correct: true
          feedback: Correct. PUT replaces the resource, so applying it twice leaves the same state as applying it once.
        - id: b
          text: POST /orders with the basket contents
          feedback: POST is not idempotent. If the first attempt succeeded, a retry creates a second order unless the API supports idempotency keys.
          misconception: {code: post-is-idempotent, label: Thinks POST requests can be retried safely, category: conceptual}
        - id: c
          text: "PATCH /accounts/7 with {\"op\": \"increment\", \"credits\": 10}"
          feedback: PATCH is not guaranteed to be idempotent, and an increment certainly is not. A retry would add another 10 credits.
          misconception: {code: patch-is-idempotent, label: Assumes PATCH is always idempotent, category: conceptual}
        - id: d
          text: None of them; a retry is never safe because the first attempt may already have succeeded.
          feedback: That is exactly the situation idempotency covers. If repeating a request has the same effect as sending it once, the client can retry without knowing what happened.
          misconception: {code: retry-never-safe, label: Does not know that idempotent requests can be retried safely, category: conceptual}

  - slug: http-cursor-pagination-code
    skill: http-api-design
    kind: python_code
    difficulty: 3
