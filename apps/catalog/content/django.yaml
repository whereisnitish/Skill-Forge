    tags: [interview]
    title: Implement keyset (cursor) pagination
    objective: Implement opaque cursor encoding and keyset pagination that stays stable when new items arrive.
    prompt: |
      Your activity feed API uses offset pagination, and users see duplicates
      when new items are posted while they scroll. Replace it with **keyset
      pagination** behind an opaque cursor.

      Implement three functions (standard library only):

      * `encode_cursor(created_at, item_id)` returns an opaque, URL-safe
        string (letters, digits, `-`, `_`, optionally `=`).
      * `decode_cursor(cursor)` is its inverse and returns
        `(created_at, item_id)` as a tuple of ints. It raises `ValueError` for
        anything that is not a valid cursor.
      * `paginate(items, limit, cursor=None)` returns `(page, next_cursor)`.

      `items` is a list of dicts with integer `"id"` and `"created_at"`,
      already sorted **newest first**: by `created_at` descending, then `id`
      descending (several items can share a `created_at`). A page contains up
      to `limit` items that come strictly *after* the cursor position in that
      order. `next_cursor` identifies the last item on the page, and is `None`
      when there are no further items.

      ```python
      page, cursor = paginate(items, 20)
      page, cursor = paginate(items, 20, cursor)   # next page
      ```
    hints:
      - "The cursor must identify a *position*, not an offset: encode the sort key of the last item returned."
      - Because `created_at` values can repeat, compare the pair `(created_at, id)`. Python compares tuples lexicographically, just like SQL row comparison `(created_at, id) < (%s, %s)`.
      - To know whether another page exists without an extra query, fetch `limit + 1` items and only return `limit`.
    explanation: |
      Offset pagination (`LIMIT 20 OFFSET 40`) counts rows, so inserts and
      deletes shift every later page, causing duplicates and gaps, and large
      offsets get slower. Keyset pagination remembers the sort key of the last
      item and asks for rows strictly after it:
      `WHERE (created_at, id) < (%s, %s) ORDER BY created_at DESC, id DESC LIMIT 21`.
      Including the unique `id` breaks ties, so items sharing a timestamp are
      never skipped, and with an index on `(created_at, id)` every page costs
      the same. Encoding the key as an opaque base64 token keeps clients from
      depending on its structure, and validating it on decode turns tampered
      cursors into a clean 400 response instead of a 500.
    solution: |
      Encode the sort key `(created_at, id)` of the last item as JSON and
      base64url, without padding. On decode, reverse it and validate the
      shape, converting every failure into `ValueError`. To paginate, keep
      the items whose `(created_at, id)` tuple is strictly smaller than the
      cursor (the list is sorted descending), take `limit + 1`, and only emit
      a cursor if that extra item exists.

      ```python
      def paginate(items, limit, cursor=None):
          remaining = items
          if cursor is not None:
              after = decode_cursor(cursor)
              remaining = [it for it in items if (it["created_at"], it["id"]) < after]
          page = remaining[: limit + 1]
          if len(page) > limit:
              last = page[limit - 1]
              return page[:limit], encode_cursor(last["created_at"], last["id"])
          return page, None
      ```
    content:
      starter_code: |
        import base64
        import json


        def encode_cursor(created_at, item_id):
            """Return an opaque, URL-safe string for the position (created_at, item_id)."""
            raise NotImplementedError


        def decode_cursor(cursor):
            """Return (created_at, item_id). Raise ValueError for invalid cursors."""
            raise NotImplementedError


        def paginate(items, limit, cursor=None):
            """Return (page, next_cursor) for items sorted by (created_at, id) descending."""
            raise NotImplementedError
      reference_solution: |
        import base64
        import binascii
        import json


        def encode_cursor(created_at, item_id):
            raw = json.dumps([created_at, item_id], separators=(",", ":")).encode("utf-8")
            return base64.urlsafe_b64encode(raw).decode("ascii").rstrip("=")


        def decode_cursor(cursor):
            if not isinstance(cursor, str) or not cursor:
                raise ValueError("invalid cursor")
            padded = cursor + "=" * (-len(cursor) % 4)
            try:
                raw = base64.urlsafe_b64decode(padded.encode("ascii"))
                value = json.loads(raw)
            except (binascii.Error, ValueError) as exc:
                raise ValueError("invalid cursor") from exc
            if (
                not isinstance(value, list)
                or len(value) != 2
                or not all(isinstance(v, int) and not isinstance(v, bool) for v in value)
            ):
                raise ValueError("invalid cursor")
            return value[0], value[1]


        def paginate(items, limit, cursor=None):
            if limit < 1:
                raise ValueError("limit must be positive")
            remaining = items
            if cursor is not None:
                after = decode_cursor(cursor)
                remaining = [it for it in items if (it["created_at"], it["id"]) < after]
            page = remaining[: limit + 1]
            if len(page) > limit:
                last = page[limit - 1]
                return page[:limit], encode_cursor(last["created_at"], last["id"])
            return page, None
    tests:
      - name: cursor round-trips and is URL-safe
        code: |
          import string
          cursor = encode_cursor(1767225600, 42)
          assert isinstance(cursor, str) and cursor
          assert set(cursor) <= set(string.ascii_letters + string.digits + "-_="), cursor
          assert decode_cursor(cursor) == (1767225600, 42)
      - name: walks every page without gaps or duplicates when timestamps tie
        code: |
          pairs = [(9, 500), (8, 500), (7, 400), (6, 300), (5, 300), (4, 300), (3, 200), (2, 100), (1, 100)]
          items = [{"id": i, "created_at": t} for i, t in pairs]
          seen, cursor = [], None
          for _ in range(10):
              page, cursor = paginate(items, 2, cursor)
              seen.extend(item["id"] for item in page)
              if cursor is None:
                  break
          assert seen == [9, 8, 7, 6, 5, 4, 3, 2, 1], seen
      - name: an exactly full last page returns no cursor
        hidden: true
        code: |
          items = [{"id": i, "created_at": 100 * i} for i in (4, 3, 2, 1)]
          page, cursor = paginate(items, 4)
          assert [item["id"] for item in page] == [4, 3, 2, 1]
          assert cursor is None
          page, cursor = paginate(items, 2)
          page, cursor = paginate(items, 2, cursor)
          assert [item["id"] for item in page] == [2, 1]
          assert cursor is None
      - name: new items posted between requests do not shift the next page
        hidden: true
        code: |
          pairs = [(9, 500), (8, 500), (7, 400), (6, 300), (5, 300), (4, 300), (3, 200)]
          items = [{"id": i, "created_at": t} for i, t in pairs]
          first, cursor = paginate(items, 3)
          assert [item["id"] for item in first] == [9, 8, 7]
          items = [{"id": 11, "created_at": 700}, {"id": 10, "created_at": 600}] + items
          second, _ = paginate(items, 3, cursor)
          assert [item["id"] for item in second] == [6, 5, 4]
      - name: rejects malformed or tampered cursors with ValueError
        hidden: true
        code: |
          import base64
          bad_cursors = [
              "",
              "not-a-cursor",
              base64.urlsafe_b64encode(b'"hello"').decode(),
              base64.urlsafe_b64encode(b"[1]").decode(),
          ]
          for bad in bad_cursors:
              try:
                  decode_cursor(bad)
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"accepted invalid cursor {bad!r}")

  - slug: http-if-match-conflict-short
    skill: http-api-design
    kind: short_answer
    difficulty: 2
    minutes: 2
    title: The document changed since the client read it
    objective: Choose the status code for a failed If-Match precondition in optimistic concurrency control.
    prompt: |
      Clients edit documents using optimistic concurrency. A client fetched
      `GET /docs/7` and received `ETag: "v3"`. Meanwhile another user saved
      the document, which is now at `"v4"`. The client sends:

      ```http
      PUT /docs/7 HTTP/1.1
      If-Match: "v3"
      Content-Type: application/json
      ```

      Which status code should the server return? Answer with the number.
    hints:
      - The client attached a condition to the request. Is the condition true?
      - There is a status code dedicated to "the precondition you sent evaluated to false".
    explanation: |
      `If-Match` makes the request conditional: "apply this only if the
      current ETag is still `"v3"`". It is not, so the server must not apply
      the change and responds **412 Precondition Failed**; the client should
      re-fetch, merge and retry. This prevents lost updates without locks.
      `428 Precondition Required` is for servers that *require* `If-Match`
      when the client omitted it, and `304 Not Modified` answers a conditional
      `GET` with `If-None-Match`.
    solution: |
      **412 Precondition Failed**: the `If-Match` condition evaluated to
      false because the current ETag is `"v4"`.
    content:
      placeholder: e.g. 200
      accepted: ["412", "412 precondition failed", "precondition failed", "http 412"]
      partial:
        - answers: ["409", "409 conflict", "conflict"]
          score: 0.4
          feedback: 409 is often used for edit conflicts when no precondition is sent, but here the client sent `If-Match`, and HTTP defines a specific status for a failed precondition.
      wrong:
        - answers: ["304", "304 not modified", "not modified"]
          feedback: 304 answers a conditional *GET* (`If-None-Match`) when the client's cached copy is still current. This is a write whose precondition failed.
          misconception: {code: etag-status-confusion, label: Confuses the status codes used with conditional requests, category: conceptual}
        - answers: ["428", "428 precondition required"]
          feedback: 428 tells a client that it *must* send a precondition such as `If-Match`. This client did send one; it just no longer holds.
          misconception: {code: etag-status-confusion, label: Confuses the status codes used with conditional requests, category: conceptual}
        - answers: ["200", "204", "200 ok", "204 no content"]
          feedback: Applying the PUT would silently overwrite the other user's changes, a lost update. The whole point of `If-Match` is to refuse this.
          misconception: {code: last-write-wins, label: Silently overwrites concurrent edits, category: logic}
        - answers: ["400", "422", "400 bad request", "422 unprocessable entity"]
          feedback: The request is well-formed and valid; what failed is the condition attached to it.
          misconception: {code: etag-status-confusion, label: Confuses the status codes used with conditional requests, category: conceptual}

  # ================================================== caching-strategies
  - slug: caching-stampede-mcq
    skill: caching-strategies
    kind: multiple_choice
    difficulty: 3
    minutes: 3
    diagnostic: true
    tags: [scenario]
    title: Why does the database spike every five minutes?
    objective: Recognise a cache stampede caused by a hot key expiring under concurrent load.
    prompt: |
      The homepage "trending" widget takes 3 seconds of heavy SQL to compute,
      so it is cached with cache-aside and a 5-minute TTL. The site serves
      about 400 requests per second. Every 5 minutes, database CPU jumps to
      100% for a few seconds and response times spike. What is the most
      likely cause?
    hints:
      - The spikes are perfectly periodic, and the period matches the TTL.
      - How many requests arrive during the 3 seconds after the key expires, and what does each of them do?
    explanation: |
      When a hot key expires, every request in the next few seconds misses
      at the same time, and with cache-aside **each one** recomputes the value:
      here about 1,200 concurrent copies of a 3-second query. This is a
      **cache stampede** (dogpile). Mitigations: let only one worker recompute
      (a lock or "single flight", e.g. `cache.add()` as a mutex) while others
      serve the stale value, refresh the value *before* it expires, and add
      jitter to TTLs so many keys do not expire together.
    content:
      multiple: false
      options:
        - id: a
          text: When the key expires, hundreds of concurrent requests miss at once and all recompute the widget.
          correct: true
          feedback: Correct. That is a cache stampede. Let one request recompute while the others serve the old value, or refresh the key before it expires.
        - id: b
          text: The cache is evicting the key under memory pressure with its LRU policy.
          feedback: Eviction under memory pressure happens irregularly, and LRU keeps hot keys. Spikes that line up exactly with the TTL point to expiry.
          misconception: {code: eviction-vs-expiry, label: Confuses TTL expiry with eviction, category: conceptual}
        - id: c
          text: The TTL is too long; lowering it to 30 seconds would spread the load.
          feedback: A shorter TTL means the key expires ten times as often, so stampedes become more frequent, not smaller.
          misconception: {code: shorter-ttl-reduces-load, label: Thinks shorter TTLs reduce load on the source, category: performance}
        - id: d
          text: Cache-aside writes every cache hit back to the database.
          feedback: Cache-aside only touches the source on a miss. Writing on every hit would cause constant load, not periodic spikes.
          misconception: {code: cache-aside-writes-through, label: Confuses cache-aside with write-through caching, category: conceptual}

  - slug: caching-unsafe-keys-review
    skill: caching-strategies
    secondary_skills: [dj-security]
    kind: code_review
    difficulty: 3
    minutes: 12
    tags: [scenario]
    title: Review the dashboard caching
    objective: Spot cache keys that leak data across tenants, falsy-miss bugs, unbounded keys and unsafe HTTP caching.
    prompt: |
      Both views run behind login middleware in a multi-tenant SaaS, and the
      site is served through a CDN. A customer has reported seeing *another
      company's* numbers on their dashboard. Review the caching in this code.
    hints:
      - Write down two different requests that produce the same cache key.
      - What happens on every request for a new account whose dashboard is `{}`?
      - Who else, besides the user's browser, may store a response marked `public`?
    explanation: |
      A cache key must include **every input that shapes the value**: here the
      account, as well as the period. Otherwise one tenant's data is served to
      another. Test for misses with `is None` (or a sentinel), not
      truthiness, or empty results are never cached. Validate user-supplied
      key parts so attackers cannot create unlimited keys and evict useful
      entries. For per-user HTTP responses, use `Cache-Control: private` (or
      `no-store`) so CDNs and shared proxies never store them.
    solution: |
      1. **Key leaks data across tenants.** The dashboard cache key contains
         only the period, so every account shares one entry: whichever
         account loads `dashboard:30d` first has its data served to other
         customers for five minutes. Include the tenant in the key:
         `f"dashboard:{request.user.account.pk}:{period}"`.
      2. **Falsy values treated as misses.** `if not data` treats a cached
         empty dict (new accounts) as a miss, so those dashboards are never
         cached and are recomputed on every request. Check `if data is None`.
      3. **Unvalidated key input.** `range` is user-controlled, so anyone can
         create an unbounded number of keys and evict useful entries, and
         `build_dashboard` receives arbitrary input. Validate it against the
         allowed values.
      4. **`Cache-Control: public` on private data.** Shared caches such as
         the CDN may store the account summary and serve it to other users.
         Use `private` (or `no-store`) for per-user responses.
    content:
      language: python
      min_words: 40
      max_words: 400
      placeholder: List each issue, its impact and the fix…
      code: |
        from django.core.cache import cache
        from django.http import JsonResponse
        from django.shortcuts import render


        def dashboard(request):
            period = request.GET.get("range", "30d")
            key = f"dashboard:{period}"
            data = cache.get(key)
            if not data:
                # build_dashboard returns {} for brand-new accounts
                data = build_dashboard(request.user.account, period)
                cache.set(key, data, timeout=300)
            return render(request, "dashboard.html", {"data": data})


        def account_summary_api(request):
            summary = build_summary(request.user.account)
            response = JsonResponse(summary)
            response["Cache-Control"] = "public, max-age=600"
            return response
      criteria:
        - id: key-missing-tenant
          label: The cache key omits the account, leaking data between tenants
          weight: 2
          required: true
          any: ["re:\\bkey\\b[^.]{0,60}\\b(lacks|omits|is missing|missing|doesn't include|does not include|without|only contains|only has|only uses|only includes|ignores|needs|should include|must include)\\b", "re:(account|tenant|user)\\w*[^.]{0,40}\\b(in|into|to|from) the (cache )?key", "cross-tenant", "per tenant", "other tenants", "another tenant", "tenant id", "tenant_id", "re:(include|add|missing|omit)\\w*[^.]{0,40}\\btenant", "per user", "per account", "another user", "other users", "another account", "other accounts", "another customer", "other customers", "someone else", "leak", "shared between", "shared across", "same key", "same cache entry", "one entry", "single entry"]
          missing_feedback: Which input to `build_dashboard` is missing from the cache key, and what does that mean for other customers?
          misconception: {code: cache-key-missing-inputs, label: Builds cache keys that omit inputs that shape the value, category: security}
        - id: falsy-miss
          label: Treating falsy cached values as misses means empty dashboards are never cached
          weight: 1
          any: ["is none", "is not none", "sentinel", "falsy", "falsey", "empty dict", "empty dashboard", "empty result", "empty value", "never cached", "recomputed every", "recompute every", "recomputes every", "every request"]
          missing_feedback: What does `if not data` do when the cached value is `{}`?
          misconception: {code: falsy-cache-miss, label: Treats cached falsy values as cache misses, category: edge_case}
        - id: unbounded-keys
          label: Validates the user-controlled range so the key space is bounded
          weight: 1
          any: ["validat", "allowed values", "allowlist", "whitelist", "unbounded", "arbitrary", "any value", "cardinality", "pollut", "flood", "fill the cache", "fills the cache", "evict", "user-controlled", "user controlled", "untrusted"]
          missing_feedback: The `range` value comes straight from the query string into the key. What can a client do with that?
        - id: cache-control-private
          label: Uses Cache-Control private or no-store for per-user responses
          weight: 1
          any: ["private", "no-store", "no store", "shared cache", "proxy", "proxies", "intermediar", "re:cdn[^.]{0,60}(store|cache|serve)"]
          missing_feedback: Which caches may store a response marked `public`, and who might they serve it to?
          misconception: {code: public-cache-private-data, label: Lets shared caches store per-user responses, category: security}

  - slug: caching-ttl-lru-code
    skill: caching-strategies
    kind: python_code
    difficulty: 3
    minutes: 25
    tags: [interview]
    title: Build an LRU cache with TTL expiry
    objective: Implement an in-memory cache that combines LRU eviction with per-entry TTL expiry.
    prompt: |
      Implement `TTLCache`, an in-process cache used in front of a slow
      pricing service:

      ```python
      cache = TTLCache(capacity=1000, ttl=30.0)   # clock defaults to time.monotonic
      cache.set("sku-1", 9.99)
      cache.get("sku-1")              # 9.99
      cache.get("missing", "n/a")     # "n/a"
      ```

      Requirements:

      * `TTLCache(capacity, ttl, clock=time.monotonic)`: raise `ValueError` if
        `capacity < 1` or `ttl <= 0`. `clock()` returns the current time in
        seconds (tests pass a fake clock).
      * An entry stored at time `t` is valid while `clock() < t + ttl`.
      * `get(key, default=None)` returns the value, or `default` for missing
        or expired keys. A successful `get` makes the key the most recently
        used. Falsy values such as `0` or `""` are valid cached values.
      * `set(key, value)` stores the value and resets its expiry. Overwriting
        an existing key also makes it the most recently used.
      * When a **new** key is set and the cache is full, expired entries are
        removed first; if it is still full, the least recently used entry is
        evicted.
      * `len(cache)` returns the number of entries that have not expired.
    hints:
      - "`collections.OrderedDict` keeps insertion order and has `move_to_end()` and `popitem(last=False)`."
      - Store the expiry timestamp next to each value rather than the time it was set.
      - An expired entry can be the *most* recently used one, so plain LRU eviction is not enough to keep capacity for live entries.
    explanation: |
      An `OrderedDict` ordered from least to most recently used gives O(1)
      lookups, recency updates (`move_to_end`) and LRU eviction
      (`popitem(last=False)`). Storing an absolute `expires_at` per entry makes
      expiry checks a single comparison, and checking it lazily on `get` avoids
      a background sweeper. Injecting the clock makes TTL logic testable
      without sleeping, and `time.monotonic` is the right default because it
      never jumps backwards when the wall clock is adjusted.
    solution: |
      Keep `key -> (expires_at, value)` in an `OrderedDict`, least recently
      used first. `get` deletes expired entries lazily and calls
      `move_to_end` on hits. `set` removes an existing key before
      re-inserting it (so it moves to the end with a fresh expiry); for a new
      key in a full cache it first purges expired entries and only then
      evicts with `popitem(last=False)`.

      ```python
      def set(self, key, value):
          now = self._clock()
          if key in self._data:
              del self._data[key]
          elif len(self._data) >= self.capacity:
              self._purge_expired(now)
              if len(self._data) >= self.capacity:
                  self._data.popitem(last=False)
          self._data[key] = (now + self.ttl, value)
      ```
    content:
      starter_code: |
        import time
        from collections import OrderedDict


        class TTLCache:
            def __init__(self, capacity, ttl, clock=time.monotonic):
                self.capacity = capacity
                self.ttl = ttl
                self._clock = clock
                self._data = OrderedDict()

            def get(self, key, default=None):
                raise NotImplementedError

            def set(self, key, value):
                raise NotImplementedError

            def __len__(self):
                raise NotImplementedError
      reference_solution: |
        import time
        from collections import OrderedDict


        class TTLCache:
            def __init__(self, capacity, ttl, clock=time.monotonic):
                if capacity < 1:
                    raise ValueError("capacity must be at least 1")
                if ttl <= 0:
                    raise ValueError("ttl must be positive")
                self.capacity = capacity
                self.ttl = ttl
                self._clock = clock
                self._data = OrderedDict()  # key -> (expires_at, value), least recently used first

            def _purge_expired(self, now):
                expired = [key for key, (expires_at, _) in self._data.items() if expires_at <= now]
                for key in expired:
                    del self._data[key]

            def get(self, key, default=None):
                entry = self._data.get(key)
                if entry is None:
                    return default
                expires_at, value = entry
                if expires_at <= self._clock():
                    del self._data[key]
                    return default
                self._data.move_to_end(key)
                return value

            def set(self, key, value):
                now = self._clock()
                if key in self._data:
                    del self._data[key]
                elif len(self._data) >= self.capacity:
                    self._purge_expired(now)
                    if len(self._data) >= self.capacity:
                        self._data.popitem(last=False)
                self._data[key] = (now + self.ttl, value)

            def __len__(self):
                self._purge_expired(self._clock())
                return len(self._data)
    tests:
      - name: stores values and returns the default on a miss
        code: |
          cache = TTLCache(capacity=2, ttl=10, clock=lambda: 0.0)
          cache.set("a", 1)
          assert cache.get("a") == 1
          assert cache.get("missing") is None
          assert cache.get("missing", "n/a") == "n/a"
      - name: evicts the least recently used key, counting get() as a use
        code: |
          cache = TTLCache(capacity=2, ttl=100, clock=lambda: 0.0)
          cache.set("a", "A")
          cache.set("b", "B")
          assert cache.get("a") == "A"
          cache.set("c", "C")
          assert cache.get("b") is None
          assert cache.get("a") == "A" and cache.get("c") == "C"
      - name: entries expire exactly ttl seconds after being set
        code: |
          class FakeClock:
              now = 0.0
              def __call__(self):
                  return self.now
          clock = FakeClock()
          cache = TTLCache(capacity=5, ttl=10, clock=clock)
          cache.set("k", "v")
          clock.now = 9.999
          assert cache.get("k") == "v"
          clock.now = 10.0
          assert cache.get("k") is None
      - name: overwriting refreshes the expiry and recency without growing the cache
        hidden: true
        code: |
          class FakeClock:
              now = 0.0
              def __call__(self):
                  return self.now
          clock = FakeClock()
          cache = TTLCache(capacity=2, ttl=10, clock=clock)
          cache.set("a", 1)
          cache.set("b", 2)
          clock.now = 8.0
          cache.set("a", 3)
          assert len(cache) == 2
          cache.set("c", 4)
          assert cache.get("b") is None
          clock.now = 15.0
          assert cache.get("a") == 3
      - name: expired entries are purged before a live entry is evicted
        hidden: true
        code: |
          class FakeClock:
              now = 0.0
              def __call__(self):
                  return self.now
          clock = FakeClock()
          cache = TTLCache(capacity=2, ttl=10, clock=clock)
          cache.set("b", "B")        # expires at 10
          clock.now = 1.0
          cache.set("a", "A")        # expires at 11
          clock.now = 8.0
          assert cache.get("b") == "B"   # b is now the most recently used
          clock.now = 10.5           # b has expired, a is still valid
          cache.set("c", "C")
          assert cache.get("a") == "A"
          assert cache.get("c") == "C"
          assert len(cache) == 2
      - name: caches falsy values and validates its arguments
        hidden: true
        code: |
          cache = TTLCache(capacity=3, ttl=5, clock=lambda: 0.0)
          cache.set("zero", 0)
          cache.set("empty", "")
          assert cache.get("zero", "miss") == 0
          assert cache.get("empty", "miss") == ""
          for bad in ({"capacity": 0, "ttl": 5}, {"capacity": 2, "ttl": 0}):
              try:
                  TTLCache(**bad)
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"accepted {bad}")

