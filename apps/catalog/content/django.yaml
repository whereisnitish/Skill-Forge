      The resolver tries `urlpatterns` **in order** and dispatches to the first
      pattern that matches. `new` is a valid slug (letters, digits, hyphens and
      underscores), so the detail pattern matches first and `article_detail`
      runs with `slug="new"`, typically returning a 404 for a missing article.
      Put specific, static routes before generic converter routes, or give the
      create view a path that cannot collide.
