  - slug: forms-save-commit-false-short
    skill: dj-forms-validation
    kind: short_answer
    difficulty: 2
    minutes: 2
    title: Set the author before saving a ModelForm
    objective: Use save(commit=False) to set server-controlled fields on a ModelForm instance.
    prompt: |
      `ArticleForm` is a ModelForm that deliberately excludes the `author`
      field so users cannot choose it. In the view you want to set
      `author = request.user` before the row is inserted.

      ```python
      if form.is_valid():
          article = ...            # what goes here?
          article.author = request.user
          article.save()
      ```

      Which `ModelForm` method call returns the model instance **without**
      writing it to the database?
    hints:
      - It is the same method you would normally call to save the form.
      - The method takes a keyword argument that controls whether the database write happens.
    explanation: |
      `form.save(commit=False)` builds the instance from `cleaned_data` but
      skips the `INSERT`, so you can set server-controlled fields such as the
      author or tenant and then call `article.save()`. If the form has
      many-to-many fields, call `form.save_m2m()` afterwards, because those
      relations can only be saved once the row exists.
    solution: |
      ```python
      article = form.save(commit=False)
      article.author = request.user
      article.save()
      form.save_m2m()   # only needed if the form has many-to-many fields
      ```
    content:
      placeholder: e.g. form.something(...)
      ignore_spaces: true
      accepted: ["form.save(commit=False)", "save(commit=False)", ".save(commit=False)", "commit=False", "form.save(False)", "save(False)"]
      patterns: ["(form\\.|\\.)?save\\(\\s*(commit\\s*=\\s*)?false\\s*\\)"]
      partial:
        - answers: ["form.instance", "instance"]
          score: 0.5
          feedback: "After `is_valid()`, `form.instance` does hold the unsaved, populated instance, and class-based views often set `form.instance.author` in `form_valid()`. But it is an attribute, not a method call: the call designed for this is `form.save(commit=False)`."
      wrong:
        - answers: ["form.save()", "save()", "save", "form.save"]
          feedback: "`form.save()` inserts the row immediately, before you have set the author, so the insert fails with an IntegrityError on the NOT NULL `author_id` column."
          misconception: {code: modelform-save-immediate, label: Does not know save() writes immediately unless commit=False, category: conceptual}
        - answers: ["form.cleaned_data", "cleaned_data"]
          feedback: "`cleaned_data` is a plain dictionary of validated values, not a model instance."
          misconception: {code: modelform-save-immediate, label: Does not know save() writes immediately unless commit=False, category: conceptual}
        - answers: ["form.save_m2m()", "save_m2m()", "save_m2m"]
          feedback: "`save_m2m()` saves many-to-many data *after* a `commit=False` save; it does not return the instance."
          misconception: {code: modelform-save-immediate, label: Does not know save() writes immediately unless commit=False, category: conceptual}

