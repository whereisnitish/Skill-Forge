        from .models import Product, Reservation
        from .tasks import send_confirmation_email


        @require_POST
        @transaction.atomic
        def reserve(request, product_id):
            quantity = int(request.POST["quantity"])
            product = Product.objects.get(pk=product_id)
            if product.stock < quantity:
                return JsonResponse({"error": "Not enough stock"}, status=409)
            product.stock -= quantity
            product.save(update_fields=["stock"])
            reservation = Reservation.objects.create(
                product=product, user=request.user, quantity=quantity
            )
            send_confirmation_email.delay(reservation.id)
            return JsonResponse({"id": reservation.id}, status=201)
