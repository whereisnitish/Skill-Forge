  # ======================================================= dj-migrations
  - slug: migrations-fix-applied-mcq
    skill: dj-migrations
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    title: Fixing a migration that is already in production
    objective: Choose the safe way to correct a migration that has already been applied.
    prompt: |
      Migration `0014_add_invoice_due_date` has been applied in production
      and on your teammates' machines. You notice that it set the wrong
      default for `due_date`. What should you do?
    hints:
      - How does Django know which migrations a database has already run?
      - Think about every environment where `0014` is already recorded as applied.
    explanation: |
      Django records applied migrations by app and name in the
      `django_migrations` table and never re-runs them, even if the file
      changes. Editing or deleting an applied migration makes environments
      silently diverge: databases that already ran it keep the old schema.
      Correct mistakes with a **new** migration (`0015_...`) so every
      environment converges on the same state. Only edit migrations that have
      never left your machine.
    content:
      multiple: false
      options:
        - id: a
          text: Change the model and create a new migration (0015) that corrects it.
          correct: true
          feedback: Correct. A new migration runs everywhere exactly once, so every database ends up in the same state.
        - id: b
          text: Edit 0014 in place; migrate notices the change and applies it again.
          feedback: Django tracks migrations by name, not by content. An edited, already applied migration is never re-run, so databases diverge.
          misconception: {code: migrations-rerun-on-edit, label: Thinks Django re-applies edited migrations, category: conceptual}
        - id: c
          text: Delete 0014 and run makemigrations again so the history stays clean.
          feedback: Databases that applied the old 0014 still have it recorded and keep its schema, while fresh databases get the new one. Histories must never be rewritten once shared.
          misconception: {code: rewrite-applied-migrations, label: Thinks migration history can be rewritten after it has been applied, category: conceptual}
        - id: d
          text: Edit 0014 and run migrate --fake so the change takes effect.
          feedback: "`--fake` only marks migrations as applied in `django_migrations` without running any SQL, so it changes nothing in the schema."
          misconception: {code: fake-applies-changes, label: Thinks migrate --fake changes the schema, category: conceptual}

  - slug: migrations-historical-model-debug
    skill: dj-migrations
    kind: debugging
    difficulty: 3
    minutes: 6
    tags: [scenario]
    title: An old data migration breaks fresh databases
    objective: Diagnose a data migration that imports the real model instead of the historical one.
    prompt: |
      Migration `0008_fill_product_slugs` worked fine when it was written.
      Six months later, after migration `0012` added a `discount` field to
      `Product`, CI starts failing while building a fresh test database:

      ```text
      Applying shop.0008_fill_product_slugs...
      django.db.utils.ProgrammingError: column shop_product.discount does not exist
      ```

      Pick the line that causes this and explain the fix.
    hints:
      - At migration 0008, the `discount` column has not been created yet. Who is asking for it?
      - "Which `Product` class does this migration use: the one that existed at 0008, or today's?"
      - The `apps` argument of the function is there for a reason.
    explanation: |
      Importing `shop.models.Product` gives you **today's** model class,
      including fields added by later migrations, so its query selects a
      `discount` column that does not exist yet at 0008. Data migrations must
      use the **historical model** for that point in the migration graph:
      `Product = apps.get_model("shop", "Product")`. Historical models have the
      fields of that moment but none of your custom methods or `save()`
      overrides (and only managers marked `use_in_migrations = True`), so keep
      the logic self-contained, as `slugify()` is here.
    solution: |
      The module-level import on line 4 (used on line 8) loads the current
      `Product` model, whose query selects the `discount` column added later in
      0012. Use the historical model passed in via `apps`:

      ```python
      def fill_slugs(apps, schema_editor):
          Product = apps.get_model("shop", "Product")
          for product in Product.objects.filter(slug=""):
              product.slug = slugify(product.name)
              product.save(update_fields=["slug"])
      ```
    content:
      language: python
      code: |
        from django.db import migrations
        from django.utils.text import slugify

        from shop.models import Product


        def fill_slugs(apps, schema_editor):
            for product in Product.objects.filter(slug=""):
                product.slug = slugify(product.name)
                product.save(update_fields=["slug"])


        class Migration(migrations.Migration):
            dependencies = [("shop", "0007_product_slug")]
            operations = [migrations.RunPython(fill_slugs, migrations.RunPython.noop)]
      bug_lines: [4, 8]
      line_weight: 0.4
      min_words: 10
      max_words: 200
      criteria:
        - id: historical-model
          label: Uses the historical model from apps.get_model()
          weight: 2
          required: true
          any: ["apps.get_model", "get_model", "historical model", "historical version", "historical state", "historic model", "state at that point", "at that point in", "frozen"]
          missing_feedback: How should a data migration obtain the `Product` model?
          misconception: {code: import-model-in-migration, label: Imports real models in data migrations, category: conceptual}
        - id: current-schema
          label: Explains that the imported class reflects the current code, including later columns
          weight: 1
          any: ["current model", "current code", "current version", "current schema", "current state", "latest", "today's", "future", "newer", "new column", "new field", "doesn't exist yet", "does not exist yet", "not exist yet", "not yet exist", "added later", "later migration"]
          missing_feedback: Explain why the query asks for a column that does not exist at this point in the migration history.

  - slug: migrations-zero-downtime-rename-explain
    skill: dj-migrations
    kind: concept_explanation
    difficulty: 3
    minutes: 10
    tags: [scenario]
    title: Renaming a column without downtime
    objective: Plan an expand/contract migration for a column rename during rolling deploys.
    prompt: |
      You need to rename the column `customer.phone` to `phone_number` on a
      busy PostgreSQL database. The column itself must change name because
      the data team queries it directly. Deploys are rolling: old and new app
      versions serve traffic side by side for several minutes.

      Explain why shipping a single `RenameField` migration with the code
      change is dangerous, and describe a safe sequence of deploys.
    hints:
      - On PostgreSQL the rename itself is fast. The problem is which code is running at that moment.
      - Split the change so that every intermediate state works with both the old and the new code.
      - Think "expand, migrate data, contract".
    explanation: |
      `RenameField` becomes `ALTER TABLE ... RENAME COLUMN`, which is a quick
      metadata change on PostgreSQL, but during a rolling deploy old code is
      still running. The moment the column is renamed, every old instance
      querying `phone` fails. The safe pattern is **expand/contract**: add the
      new nullable column and write to both; backfill existing rows in
      batches; switch reads to the new column; and only in a later deploy,
      when no running code uses it, drop the old column. Every step is
      compatible with the version deployed before and after it.
    solution: |
      `RenameField` runs `ALTER TABLE ... RENAME COLUMN`, which is quick on
      PostgreSQL, but during a rolling deploy the old version of the code is
      still running side by side with the new one. As soon as the column is
      renamed, every query from the old servers that selects `phone` fails
      with "column does not exist"; if the code ships first, the new code
      fails instead.

      Use expand/contract:

      1. **Expand**: add a new nullable column `phone_number` and deploy code
         that writes to both columns.
      2. **Backfill**: copy the data from `phone` to `phone_number` in
         batches with a data migration or management command.
      3. **Switch reads** to `phone_number`, and add `NOT NULL` once every row
         is filled.
      4. **Contract**: in a later deploy, once no running code uses `phone`,
         stop writing it and drop the old column.
    content:
      min_words: 50
      max_words: 350
      placeholder: Explain the risk, then the sequence of deploys…
      criteria:
        - id: old-code-breaks
          label: Explains that old code still running during the deploy breaks when the column is renamed
          weight: 2
          required: true
          any: ["old code", "old version", "old servers", "old instances", "old app", "previous version", "running instances", "still running", "both versions", "mid-deploy", "during the deploy", "during deployment", "during a rolling", "column does not exist", "no longer exists", "no longer exist"]
          missing_feedback: Which code is still serving requests at the moment the column is renamed, and what happens to it?
          misconception: {code: migrations-ignore-running-code, label: Ignores code that is still running during a deploy, category: conceptual}
        - id: expand
          label: Adds the new column first and writes to both
          weight: 1
          any: ["expand", "add a new", "add the new", "adds a new", "adding a new", "new nullable", "nullable column", "null=true", "dual write", "dual-write", "write to both", "writes to both", "writing to both", "both columns"]
          missing_feedback: What is the first, backwards-compatible schema change?
        - id: backfill
          label: Backfills existing data, ideally in batches
          weight: 1
          any: ["backfill", "back-fill", "copy the data", "copy data", "copies the data", "copy existing", "migrate the data", "data migration", "batch", "chunk"]
          missing_feedback: How do existing rows get a value in the new column?
        - id: contract
          label: Drops the old column only in a later deploy
          weight: 1
          any: ["contract", "drop the old", "remove the old", "drops the old", "dropping the old", "later deploy", "later release", "subsequent deploy", "subsequent release", "next deploy", "next release", "separate deploy", "separate release", "final deploy"]
          missing_feedback: When is it safe to remove `phone`, and why not in the same deploy?

  # ======================================================== dj-security
  - slug: security-csrf-exempt-fetch-mcq
    skill: dj-security
    kind: multiple_choice
    difficulty: 3
    minutes: 3
    diagnostic: true
    title: The fetch() call gets a 403. Is csrf_exempt the fix?
    objective: Explain why CSRF protection is needed for cookie-authenticated views and how to send the token from JavaScript.
    prompt: |
      A view that changes the logged-in user's email is authenticated with
      Django's session cookie. Front-end `fetch()` POSTs to it fail with
      **403 Forbidden (CSRF verification failed)**, so a colleague adds
      `@csrf_exempt` to the view. What is the right call?
    hints:
      - A forged request from another site carries the victim's cookies too. What does the attacker *not* have?
      - The 403 means the protection works; the JavaScript just isn't sending something Django expects.
    explanation: |
      CSRF attacks abuse the fact that the browser attaches the victim's
      session cookie to requests triggered by *other* sites, so being logged
      in is exactly what makes the victim vulnerable. Django blocks this by
      requiring a secret token that a cross-site page cannot read. The fix is
      to send it, not to remove the check: read the token (from the
      `csrftoken` cookie or a `{% csrf_token %}` input) and send it in the
      `X-CSRFToken` header. `csrf_exempt` is only appropriate for endpoints
      that are not authenticated by cookies, such as webhooks verified by a
      signature.
    content:
      multiple: false
      options:
        - id: a
          text: Remove csrf_exempt and send the CSRF token from JavaScript in the X-CSRFToken header.
          correct: true
          feedback: Correct. The 403 shows the protection is working; the client just has to send the token Django expects.
        - id: b
          text: Keep csrf_exempt; the view requires login, so attackers cannot call it.
          feedback: CSRF exploits the victim's own logged-in session. The forged request arrives with the victim's cookies, so `login_required` passes.
          misconception: {code: login-prevents-csrf, label: Thinks authentication protects against CSRF, category: security}
        - id: c
          text: Keep csrf_exempt; CORS and the same-origin policy stop other sites from sending requests to our API.
          feedback: The same-origin policy and CORS stop other sites from *reading* responses; they do not stop a browser from *sending* a cross-site form POST.
          misconception: {code: cors-blocks-csrf, label: Thinks CORS or the same-origin policy stops cross-site requests from being sent, category: security}
        - id: d
          text: Change the view to accept GET requests, which CSRF checks do not apply to.
          feedback: State-changing actions must not use GET. A GET can be triggered by an image tag or a link, so this makes the attack even easier.
          misconception: {code: get-for-state-change, label: Uses GET for state-changing actions to avoid CSRF checks, category: security}

  - slug: security-raw-sql-report-review
    skill: dj-security
    secondary_skills: [sql-joins]
    kind: code_review
    difficulty: 3
    minutes: 12
    tags: [scenario]
    title: Review a staff-only sales report
    objective: Find SQL injection, unsafe ORDER BY input and insecure production settings.
    prompt: |
      A teammate wrote a quick sales report for staff and adjusted the
      production settings while deploying it. "It's staff-only, so security
      isn't a concern." Review both excerpts.
    hints:
      - Follow each value from `request.GET` until it reaches the database.
      - Query parameters can replace values, but can they replace a column name in `ORDER BY`?
      - For each setting, ask what happens when the environment is misconfigured or a request arrives with an unexpected `Host` header.
    explanation: |
      Never build SQL with string formatting: pass values as parameters
      (`cursor.execute(sql, [region])`) so the driver sends them separately
      from the SQL text. Identifiers such as `ORDER BY` columns cannot be
      parameterised, so map user choices onto a whitelist. "Staff-only" does
      not excuse injection: staff accounts get phished, and a reflected link
      can be sent to a staff member. In settings, fail safe: `DEBUG` must
      default to `False`, and `ALLOWED_HOSTS` must list real domains so that
      forged `Host` headers cannot poison password-reset links or caches.
    solution: |
      1. **SQL injection**: `region` from the query string is interpolated
         into the SQL with an f-string, so `?region=' OR '1'='1` (or a
         `UNION SELECT`) rewrites the query. Use placeholders and pass
         parameters: `cursor.execute("... WHERE o.region = %s ...", [region])`,
         or better, the ORM with `values("customer__name").annotate(revenue=Sum("total"))`.
      2. **ORDER BY injection**: `sort` is also injected. Placeholders cannot
         be used for identifiers, so map the choice through a whitelist such
         as `{"total": "total", "name": "c.name"}` and reject anything else.
      3. **DEBUG defaults to True**: if the environment variable is missing in
         production, Django serves debug pages with stack traces, settings and
         SQL. Use a fail-safe `default=False`.
      4. **`ALLOWED_HOSTS = ["*"]`** disables Host header validation, enabling
         host header poisoning of password-reset links and caches. List the
         real domains.
    content:
      language: python
      min_words: 40
      max_words: 400
      placeholder: List each issue, how it could be exploited and the fix…
      code: |
        # reports/views.py
        @staff_member_required
        def sales_report(request):
            region = request.GET.get("region", "EU")
            sort = request.GET.get("sort", "total")
            with connection.cursor() as cursor:
                cursor.execute(
                    "SELECT c.name, SUM(o.total) AS total "
                    "FROM shop_order o JOIN shop_customer c ON c.id = o.customer_id "
                    f"WHERE o.region = '{region}' "
                    f"GROUP BY c.name ORDER BY {sort} DESC"
                )
                rows = cursor.fetchall()
            return render(request, "reports/sales.html", {"rows": rows})


        # settings/production.py (excerpt)
        DEBUG = env.bool("DEBUG", default=True)
        ALLOWED_HOSTS = ["*"]
      criteria:
        - id: sql-injection
          label: Spots SQL injection through region and fixes it with query parameters
          weight: 2
          required: true
          any: ["sql injection", "inject", "parameteri", "parametri", "placeholder", "%s", "params", "bind variable", "bound parameter", "query parameter", "re:cursor\\.execute\\([^)]*,\\s*\\[", "f-string", "string formatting", "string interpolation", "interpolat", "concatenat"]
          missing_feedback: What can an attacker put in `?region=` given how it reaches the SQL?
          misconception: {code: raw-sql-is-escaped, label: Thinks values interpolated into raw SQL are escaped automatically, category: security}
        - id: order-by-whitelist
          label: Validates the sort column against a whitelist because identifiers cannot be parameterised
          weight: 1
          any: ["whitelist", "allowlist", "allow-list", "allow list", "allowed columns", "allowed values", "allowed fields", "known columns", "fixed set", "mapping", "dict of", "dictionary", "identifier", "column name", "re:\\bsort\\b[^.]{0,80}(inject|validat|whitelist|allow|untrusted|user controlled|attacker)", "re:order by[^.]{0,80}(inject|validat|whitelist|allow|untrusted|placeholder|parameter)"]
          missing_feedback: The `sort` value lands in `ORDER BY`. Can a placeholder protect it, and if not, what can?
          misconception: {code: raw-sql-is-escaped, label: Thinks values interpolated into raw SQL are escaped automatically, category: security}
        - id: debug-default
          label: Flags DEBUG defaulting to True in production
          weight: 1
          any: ["stack trace", "traceback", "debug page", "default=false", "default false", "default to false", "defaults to false", "fail safe", "fail-safe", "fail open", "fail closed", "secure default", "re:\\bdebug\\b[^.\"'(]{0,80}\\b(default|true|leak|expos|production|prod|on)", "re:\\b(default|true)\\b[^.\"']{0,40}\\bfor debug"]
          missing_feedback: What happens in production if the `DEBUG` environment variable is not set?
          misconception: {code: insecure-defaults, label: Chooses defaults that fail open in production, category: security}
        - id: allowed-hosts
          label: Flags the wildcard ALLOWED_HOSTS and Host header attacks
          weight: 1
          any: ["host header", "host poisoning", "wildcard", "any host", "every host", "all hosts", "re:allowed.hosts[^.\"'\\[]{0,60}\\b(any|every|all|disable|accept|should|must|list|real|domain|validat)"]
          missing_feedback: What does `ALLOWED_HOSTS = ["*"]` stop Django from checking?
          misconception: {code: insecure-defaults, label: Chooses defaults that fail open in production, category: security}

  - slug: security-mark-safe-xss-debug
    skill: dj-security
    kind: debugging
    difficulty: 3
    minutes: 6
    tags: [scenario]
    title: A display name pops up alerts on the forum
    objective: Diagnose an XSS hole caused by mark_safe() and fix it with format_html().
    prompt: |
      A user changed their display name to
      `<img src=x onerror=alert(document.cookie)>`, and now every visitor to
      the forum sees a popup. Badges are rendered with this template tag
      (`{% user_badge post.author %}`). The developer added `mark_safe()`
      because the `<span>` was showing up as literal text. Pick the defective
      line and explain the fix.
    hints:
      - Django escapes `simple_tag` output automatically unless it is marked safe.
      - What exactly is being marked safe on line 10, and where does part of it come from?
      - Django has a helper that builds HTML from a template string and escapes each argument.
    explanation: |
      `mark_safe()` does not sanitise anything: it tells Django that the
      **whole string** is trusted HTML and must not be escaped. Interpolating
      `user.display_name` into it first means attacker-controlled markup is
      rendered as-is: stored XSS. `format_html()` is the right tool: it treats
      the template string as safe and escapes every argument
      (`format_html('<span class="{}">{}</span>', css_class, user.display_name)`).
    solution: |
      Line 10 interpolates `user.display_name` into an f-string and then
      marks the whole result safe, so Django skips escaping and the
      attacker's HTML runs in every visitor's browser (stored XSS). Use
      `format_html()`, which escapes each argument:

      ```python
      return format_html('<span class="{}">{}</span>', css_class, user.display_name)
      ```
    content:
      language: python
      code: |
        from django import template
        from django.utils.safestring import mark_safe

        register = template.Library()


        @register.simple_tag
        def user_badge(user):
            css_class = "badge badge-staff" if user.is_staff else "badge"
            return mark_safe(f'<span class="{css_class}">{user.display_name}</span>')
      bug_lines: [10]
      line_weight: 0.4
      min_words: 10
      max_words: 200
      criteria:
        - id: unescaped-user-input
          label: Explains that mark_safe disables escaping for the user-controlled display name
          weight: 2
          required: true
          any: ["marks the whole", "marked safe", "marks it safe", "marks the string", "marks the result", "trusted html", "bypass", "disables escaping", "disables auto", "turns off escaping", "turns off auto", "skips escaping", "skip escaping", "no escaping", "not escaped", "isn't escaped", "unescaped", "without escaping", "never escaped", "trust"]
          missing_feedback: What does `mark_safe()` tell Django about the string, and which part of it is controlled by users?
          misconception: {code: mark-safe-escapes, label: Thinks mark_safe sanitises or escapes its content, category: security}
        - id: format-html
          label: Fixes it with format_html() or by escaping the argument
          weight: 1
          any: ["format_html", "conditional_escape", "escape(", "escape the", "escapes the", "escaping the", "escape user", "escape display_name", "escape each", "escapes each", "html escape"]
          missing_feedback: Show how to build the HTML so that the display name is escaped.
        - id: xss
          label: Names the vulnerability as cross-site scripting
          weight: 1
          any: ["xss", "cross site scripting", "cross-site scripting", "script injection", "html injection", "inject", "javascript", "arbitrary html", "arbitrary script", "runs in", "executes in", "steal"]
