    title: Review the invoice download and update views
    objective: Find IDOR, mass assignment and missing validation in authenticated views.
    prompt: |
      In this multi-tenant SaaS, every user belongs to one
      `Account` (`request.user.account`), and every `Invoice` has an
      `account` foreign key. Invoice IDs are sequential integers. Review these
      two views before they ship.
    hints:
      - "`@login_required` answers *who* the user is. What answers whether this invoice is theirs?"
      - Look at every value the update view copies from `request.POST`.
      - What happens if `email` is missing or is not an email address?
    explanation: |
      Authentication is not authorisation. Both views load invoices by
      primary key alone, so any logged-in user can read or modify any
      tenant's invoice by changing the ID (IDOR); sequential IDs make that
      trivial to enumerate. Always scope lookups to the requester's tenant,
      which also returns a 404 instead of revealing that the invoice exists.
      Never accept ownership fields such as `account_id` from the client, and
      validate input with a form that whitelists the editable fields.
    solution: |
      1. **IDOR / missing object-level authorisation.** Both views look up the
         invoice by primary key only, so any logged-in user can download or
         edit another customer's invoice by changing the ID in the URL; the IDs
         are sequential, so enumerating them is trivial. Scope the lookup:
         `get_object_or_404(Invoice, pk=invoice_id, account=request.user.account)`.
      2. **Mass assignment of ownership.** The update view copies `account_id`
         from the POST data, so a user can move an invoice into or out of any
         account. Ownership must come from the server, never from the client.
      3. **No validation.** `request.POST["email"]` raises `KeyError` (a 500)
         when the field is missing, and any arbitrary string is stored. Use a
         `ModelForm` with `fields = ["billing_email"]` so the email is
         validated and only that field can change.
