  - slug: sql-left-join-count-star-mcq
    skill: sql-joins
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    tags: [interview]
    title: What does COUNT(*) report for a customer with no orders?
    objective: Predict how COUNT(*) behaves over the NULL-padded rows of a LEFT JOIN.
    prompt: |
      ```sql
      SELECT c.name, COUNT(*) AS order_count
      FROM customers AS c
      LEFT JOIN orders AS o ON o.customer_id = c.id
      GROUP BY c.id, c.name;
      ```

      The customer Ada has never placed an order. What does the query report
      for Ada?
    hints:
      - First work out which rows the `LEFT JOIN` produces for Ada, before any grouping.
      - "`COUNT(*)` and `COUNT(o.id)` count different things."
    explanation: |
      A `LEFT JOIN` keeps every customer: Ada gets **one** row whose `orders`
      columns are all `NULL`. `COUNT(*)` counts rows, so it reports **1**.
      `COUNT(o.id)` counts non-NULL values and would correctly report 0. When
      counting the right-hand side of an outer join, count one of its
      non-nullable columns, typically its primary key.
    content:
      multiple: false
      options:
        - id: a
          text: "1"
          correct: true
