          label: Explains that has_perm needs the "app_label.codename" format
          weight: 2
          required: true
          any: ["app label", "app_label", "newsroom.publish_article", "app name", "app prefix", "application label", "application name", "namespac", "full permission name", "fully qualified", "full name", "re:\\bapp\\b[^.]{0,30}(label|name|prefix)", "dotted"]
          missing_feedback: Compare the string passed to `has_perm()` with the full name Django gives the permission.
          misconception: {code: perm-without-app-label, label: Calls has_perm without the app_label prefix, category: syntax}
        - id: superuser-bypass
          label: Explains that superusers pass every permission check
          weight: 1
          any: ["superuser", "super user", "is_superuser", "every permission", "all permissions", "any permission", "always true", "always returns true", "re:admin[^.]{0,40}\\b(bypass|every|all|any|always)\\b"]
