  - slug: queryopt-filter-bypasses-prefetch-short
    skill: dj-query-optimization
    kind: short_answer
    difficulty: 3
    minutes: 3
    tags: [interview]
    title: Does filtering a prefetched relation use the prefetch?
    objective: Predict query counts when a prefetched relation is filtered and counted.
    prompt: |
      Ten authors match the filter. How many SQL queries does this code run in
      total? Answer with a number.

      ```python
      authors = Author.objects.filter(country="NL").prefetch_related("books")
      for author in authors:
          published = author.books.filter(is_published=True)
          print(author.name, published.count())
      ```
    hints:
      - Starting the loop evaluates `authors`. How many queries does that take with `prefetch_related`?
      - The prefetch cache is only used by `author.books.all()`. What does `.filter()` create?
    explanation: |
      Evaluating `authors` runs **2** queries: the authors, then the prefetch of
      all their books. But `author.books.filter(...)` builds a **new** QuerySet
      that ignores the prefetch cache, and `.count()` sends a `SELECT COUNT(*)`
      for each author: 2 + 10 = **12** queries, and the prefetched books are
      never used. Filter inside the prefetch instead
      (`Prefetch("books", queryset=Book.objects.filter(is_published=True), to_attr="published_books")`
      and `len(author.published_books)`: 2 queries) or aggregate in SQL
      (`annotate(published=Count("books", filter=Q(books__is_published=True)))`: 1 query).
    solution: |
      **12** queries: 1 for authors + 1 prefetch for books + 10 `COUNT`
      queries, because `.filter()` on a prefetched relation creates a new
      QuerySet that bypasses the prefetch cache.
    content:
      placeholder: e.g. 3
      accepted: ["12", "twelve", "12 queries"]
      wrong:
        - answers: ["2", "two", "2 queries"]
          feedback: The prefetch cache is only used by `.all()`. Calling `.filter()` creates a new QuerySet, so each author triggers its own `COUNT` query.
          misconception: {code: filter-uses-prefetch, label: Thinks filtering a prefetched relation uses the prefetch cache, category: performance}
        - answers: ["11", "eleven", "11 queries"]
          feedback: The prefetch query still runs when `authors` is evaluated, even though its results are never used. Count it as well.
          misconception: {code: prefetch-runs-on-access, label: Thinks prefetch queries only run when the relation is accessed, category: conceptual}
        - answers: ["1", "one", "1 query"]
          feedback: "`prefetch_related` is not a JOIN: it always issues a separate query per relation. And the filtered counts add more queries."
          misconception: {code: prefetch-is-join, label: Thinks prefetch_related uses a SQL JOIN, category: conceptual}
        - answers: ["21", "22", "twenty-one", "twenty-two"]
          feedback: "`published.count()` on an unevaluated QuerySet is a single `SELECT COUNT(*)`; it does not fetch the rows first."
          misconception: {code: filter-uses-prefetch, label: Thinks filtering a prefetched relation uses the prefetch cache, category: performance}

  # ===================================================== dj-transactions
  - slug: tx-atomic-lost-update-mcq
    skill: dj-transactions
    kind: multiple_choice
    difficulty: 3
    minutes: 3
    diagnostic: true
    tags: [interview]
    title: Does atomic() stop a double withdrawal?
    objective: Recognise that atomic() alone does not prevent lost updates under concurrency.
    prompt: |
      ```python
      def withdraw(account_id, amount):
          with transaction.atomic():
              account = Account.objects.get(pk=account_id)
              if account.balance < amount:
                  raise InsufficientFunds()
              account.balance -= amount
              account.save()
      ```

      The balance is 100. Two requests call `withdraw(account_id, 80)` at the
      same moment on PostgreSQL with Django's default settings
      (`READ COMMITTED`). What can happen?
    hints:
      - Does a plain `SELECT` inside a transaction lock the row it reads?
      - "`save()` writes the value computed in Python. Which value did each request compute?"
    explanation: |
      `atomic()` makes a group of statements commit or roll back together; it
      does **not** lock rows read with a plain `SELECT`. Both requests read
      100, both pass the check and both write `balance = 20`. The second
      `UPDATE` waits for the first transaction's row lock, then simply
      overwrites the row: a **lost update**, and 160 has been withdrawn from
      100. Fix it with `select_for_update()` (lock the row before reading) or
      a conditional atomic update:
      `Account.objects.filter(pk=account_id, balance__gte=amount).update(balance=F("balance") - amount)`.
    content:
      multiple: false
      options:
        - id: a
          text: Both withdrawals succeed and the final balance is 20.
          correct: true
          feedback: Correct. Both read 100 and both write 20, so one update is lost and 160 has left an account that held 100.
        - id: b
          text: The second request waits until the first commits, then raises InsufficientFunds.
          feedback: That only happens if the row is locked before it is read, using `select_for_update()`. A plain `get()` inside `atomic()` takes no lock.
          misconception: {code: atomic-locks-rows, label: Thinks atomic() locks the rows it reads, category: conceptual}
        - id: c
          text: PostgreSQL detects the conflict and aborts one transaction with a serialization error.
          feedback: Serialization failures happen under `REPEATABLE READ` or `SERIALIZABLE`. Under the default `READ COMMITTED`, the second update waits and then overwrites the row without any error.
          misconception: {code: default-isolation-prevents-races, label: Assumes the default isolation level prevents concurrent anomalies, category: conceptual}
        - id: d
          text: Both withdrawals succeed and the final balance is -60.
          feedback: "`save()` writes the absolute value each request computed in Python (20), not a delta. You would only reach -60 with `F(\"balance\") - amount` updates and no balance check."
          misconception: {code: save-writes-delta, label: Thinks save() applies changes as a delta, category: logic}

  - slug: tx-stock-reservation-review
    skill: dj-transactions
    secondary_skills: [background-jobs]
    kind: code_review
    difficulty: 4
    minutes: 12
    tags: [scenario]
    title: Review a stock reservation endpoint
    objective: Spot missing row locks, side effects inside a transaction and unvalidated input in a write path.
    prompt: |
      During a flash sale this endpoint oversold a product, some customers
      received confirmation emails for reservations that do not exist, and
      the stock count of one product went *up*. Authentication is enforced by
      middleware. Review the view: name each problem, explain how it happens
      and how you would fix it.
    hints:
      - Imagine two requests for the last unit arriving at the same millisecond.
      - When exactly does the Celery worker see the reservation row?
      - What does the stock check do with `quantity = -5`?
    explanation: |
      `atomic()` alone does not prevent races: two requests can both read the
      same stock and both pass the check. Lock the row with
      `select_for_update()` (or use a conditional `F()` update and check the
      affected row count). Side effects such as task enqueues must run in
      `transaction.on_commit()`, otherwise a worker may run before the commit
      (and fail to find the row) or after a rollback (emailing about data that
      never existed). Finally, request data is untrusted: validate `quantity`
      as a positive integer with a form before using it.
    solution: |
      1. **Race condition / overselling.** Two concurrent requests both read
         `stock = 1`, both pass the check and both save, so the product is
         oversold (a lost update). `atomic()` does not lock the row. Use
         `Product.objects.select_for_update().get(pk=product_id)` inside the
         transaction, or a conditional update:
         `Product.objects.filter(pk=product_id, stock__gte=quantity).update(stock=F("stock") - quantity)`
         and check that one row was updated.
      2. **Task enqueued inside the transaction.** The worker can pick up the
         job before the transaction commits and fail with
         `Reservation.DoesNotExist`, and if the transaction rolls back the
         email is still sent. Use
         `transaction.on_commit(lambda: send_confirmation_email.delay(reservation.id))`.
      3. **Unvalidated quantity.** A negative quantity passes the stock check
         and *increases* the stock, and a non-numeric value raises `ValueError`
         (a 500). Validate it with a form field such as
         `forms.IntegerField(min_value=1)`.
    content:
