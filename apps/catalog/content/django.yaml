    title: Saving a profile leaves users on the edit page
    objective: Recognise that a view must return its redirect response, and explain Post/Redirect/Get.
    prompt: |
      After saving their profile, users stay on the edit form instead of being
      sent to their profile page. When they press refresh, the browser offers
      to resubmit the form, and some profiles have been saved twice. Pick the
      defective line and explain the fix.
    hints:
      - The data is saved correctly; the problem is what the browser receives afterwards.
      - Trace what the function does after `form.save()` finishes.
      - "`redirect()` builds a response object. Who sends it to the browser?"
    explanation: |
      `redirect()` only *creates* an `HttpResponseRedirect`; Django sends
      whatever the view **returns**. Without `return`, the response is
      discarded, execution falls through to the final `render()`, and the user
      gets the edit page as the response to their POST. Refreshing that page
      re-sends the POST. Returning the redirect implements Post/Redirect/Get:
      the browser follows the redirect with a GET, so refreshing is harmless.
    solution: |
      Line 12 builds a redirect response but never returns it, so execution
      falls through and the form is rendered again as the response to the
      POST. Returning the redirect implements Post/Redirect/Get: the browser
      follows it with a GET, so a refresh no longer resubmits the form.

      ```python
      if form.is_valid():
          form.save()
          return redirect("profile-detail")
      ```
