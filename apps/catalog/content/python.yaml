          missing_feedback: Say what happens to `fetch_profile` and `fetch_recommendations` after `fetch_orders` fails under `gather`.
          misconception: {code: gather-cancels-on-error, label: Thinks gather cancels the other awaitables when one fails, category: conceptual}
        - id: taskgroup-cancels
          label: Explains that a TaskGroup cancels the remaining tasks when one fails and waits for them
          weight: 2
          required: true
          any: ["cancels the", "cancels all", "cancels any", "cancels every", "cancels remaining", "cancels its", "cancels sibling", "cancel the other", "cancel the remaining", "cancel the rest", "cancels the rest", "cancel all", "cancel every", "remaining tasks are cancel", "other tasks are cancel", "others are cancel", "rest are cancel", "get cancelled", "gets cancelled", "get canceled", "gets canceled", "structured concurrency"]
