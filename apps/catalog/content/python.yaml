  - slug: scope-unboundlocal-mcq
    skill: py-closures-scope
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    title: Incrementing a module-level counter
    objective: Predict how an assignment inside a function makes a name local for the whole function body.
    prompt: |
      ```python
      count = 0

      def increment():
          count += 1
          return count

      increment()
      ```

      What happens when the last line runs?
    hints:
      - "`count += 1` both reads and assigns `count`. What does an assignment inside a function do to a name?"
      - Python decides which names are local when it compiles the function, not line by line as it runs.
    explanation: |
      Because `increment` assigns to `count`, the compiler treats `count` as a
      local variable for the entire function body. `count += 1` then has to
      read that local before anything has been assigned to it, so Python
      raises `UnboundLocalError: cannot access local variable 'count' where it
      is not associated with a value`. Declaring `global count` (or, for a
      variable of an enclosing function, `nonlocal count`) makes the
      assignment rebind the outer variable instead; better still, keep
      mutable state in an object or pass it as an argument.
    content:
      multiple: false
      options:
        - id: a
          text: It raises `UnboundLocalError`
          correct: true
          feedback: Correct. The assignment makes `count` local throughout `increment`, and `count += 1` reads that local before it has a value.
        - id: b
          text: It returns 1 and the module-level `count` becomes 1
          feedback: An assignment inside a function creates or rebinds a local name unless you declare `global count`. Without that, the module-level variable is never touched here.
          misconception: {code: assignment-updates-global, label: Thinks assigning to a global name inside a function updates it without a declaration, category: conceptual}
        - id: c
          text: It returns 1, but the module-level `count` stays 0
          feedback: Python does not copy globals into locals. Once `count` is local, reading it before assignment fails instead of falling back to the global value.
          misconception: {code: local-copy-of-global, label: Thinks a local variable starts as a copy of the global with the same name, category: conceptual}
        - id: d
          text: It raises `SyntaxError` before the module runs, because `count` is not declared
          feedback: The code is valid syntax, and Python has no variable declarations. The error happens at run time, when `increment()` is called.
          misconception: {code: variables-need-declaration, label: Thinks Python requires variables to be declared before use, category: syntax}

  - slug: scope-late-binding-debug
    skill: py-closures-scope
    kind: debugging
    difficulty: 3
    minutes: 6
    tags: [interview]
    secondary_skills: [py-functions]
    title: Every alert check uses the disk limit
    objective: Diagnose late binding in closures created in a loop and bind the current value instead.
    prompt: |
      `make_checks` builds one threshold check per metric for an alerting job,
      but every check behaves like the disk check. Pick the line that
      contains the defect and explain both the cause and a fix.
    hints:
      - All three checks behave identically. What do the three lambdas share?
      - When does a lambda read `limit`, when it is created or when it is called? What value does the loop variable hold by then?
    explanation: |
      Closures capture variables, not values. Each lambda refers to the same
      `limit` variable of `make_checks` and looks it up only when it is
      called. By then the loop has finished and `limit` is `90`, so every
      check compares against 90, and 85 passes all of them. Binding the
      current value at creation time fixes it: a default argument
      (`lambda value, limit=limit: value <= limit`) is evaluated when the
      lambda is created, and `functools.partial` or a small factory function
      gives each closure its own variable.
    solution: |
      **Model answer.** The defect is on line 5. The lambda does not store the
      value of `limit`; it closes over the variable and looks it up when the
      lambda is called (late binding). By the time any check runs, the loop
      has finished and `limit` holds its final value, 90, so every check
      compares against 90. Fix: bind the current value when each lambda is
      created, for example with a default argument.

      ```python
      def make_checks(limits):
          checks = {}
          for metric, limit in limits.items():
              checks[metric] = lambda value, limit=limit: value <= limit
          return checks
      ```

      Alternatives: `functools.partial(operator.ge, limit)`, or a helper
      `def make_check(limit): return lambda value: value <= limit`, which
      creates a fresh variable on every call.
