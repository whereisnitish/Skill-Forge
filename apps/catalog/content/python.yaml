  - slug: fn-keyword-only-call-mcq
    skill: py-functions
    kind: multiple_choice
    difficulty: 1
    minutes: 2
    diagnostic: true
    title: Which call breaks this signature?
    objective: Identify keyword-only parameters and how defaults let callers skip arguments.
    prompt: |
      ```python
      def connect(host, port=5432, *, timeout=10):
          ...
      ```

      Which call raises a `TypeError`?
    hints:
      - Look at what the bare `*` in the signature does to the parameters after it.
      - Parameters after `*` can be supplied in only one way.
    explanation: |
      A bare `*` in a signature ends the positional parameters: everything
      after it is keyword-only. `connect("db", 5433, 5)` passes three
      positional arguments to a function that accepts at most two, so Python
      raises `TypeError: connect() takes from 1 to 2 positional arguments but
      3 were given`. Keyword-only parameters are a deliberate API design tool:
      they force call sites such as `connect("db", timeout=5)` to say what
      each value means.
    content:
      multiple: false
      options:
        - id: a
          text: '`connect("db", 5433, 5)`'
          correct: true
          feedback: Correct. `timeout` comes after the `*`, so it can only be passed by keyword, and a third positional argument is rejected.
        - id: b
          text: '`connect("db", timeout=5)`'
          feedback: This call is fine. `port` falls back to its default; keyword arguments let you skip over parameters that have defaults.
          misconception: {code: cannot-skip-defaults, label: Thinks earlier defaulted parameters must be passed before later ones, category: conceptual}
        - id: c
          text: '`connect(host="db", port=1)`'
          feedback: This call is fine. Ordinary parameters can always be passed by keyword; only parameters before a `/` are positional-only.
          misconception: {code: positional-params-not-by-name, label: Thinks ordinary parameters cannot be passed by keyword, category: conceptual}
        - id: d
          text: '`connect("db")`'
          feedback: This call is fine. `port` and `timeout` both have defaults, so only `host` is required.
          misconception: {code: keyword-only-means-required, label: Thinks keyword-only parameters are always mandatory, category: conceptual}

  - slug: fn-mutable-default-debug
    skill: py-functions
    kind: debugging
    difficulty: 2
    minutes: 6
    tags: [interview]
    title: Admin header leaks into public requests
    objective: Diagnose a mutable default argument shared between calls and fix it with a None sentinel.
    prompt: |
      This helper builds outgoing HTTP requests. A security review noticed
      that public requests sometimes carry the `X-Admin` header. Pick the line
      that contains the defect and explain what goes wrong and how to fix it.
    hints:
      - Trace the two calls. Which dictionary object does each call modify?
      - When is the expression `{}` in the signature evaluated?
    explanation: |
      Default values are evaluated once, when the `def` statement executes,
      and stored on the function object (`build_request.__defaults__`). A
      mutable default is therefore shared by every call that relies on it:
      the admin call adds `X-Admin` to that one dict, and the public call
      receives the same dict with the header still in it. Use `None` as the
      default and create a new dict inside the function.
    solution: |
      **Model answer.** Line 1 uses a mutable default argument. The `{}` is
      evaluated only once, when the function is defined, so every call that
      omits `headers` shares the same dictionary. The admin call adds
      `X-Admin` to that shared dict and the next public call sees it. Fix it by
      defaulting to `None` and creating a new dict on each call; copying a
      caller-supplied dict also stops the function from mutating its
      argument.

      ```python
      def build_request(path, headers=None):
          headers = {} if headers is None else dict(headers)
          headers["Accept"] = "application/json"
          if path.startswith("/admin"):
              headers["X-Admin"] = "1"
          return {"path": path, "headers": headers}
      ```
    content:
      language: python
      code: |
        def build_request(path, headers={}):
            headers["Accept"] = "application/json"
            if path.startswith("/admin"):
                headers["X-Admin"] = "1"
            return {"path": path, "headers": headers}


        admin = build_request("/admin/users")
        public = build_request("/products")
        print(public["headers"])
        # {'Accept': 'application/json', 'X-Admin': '1'}   <- why is X-Admin here?
      bug_lines: [1]
      line_weight: 0.4
      min_words: 12
      max_words: 200
      criteria:
        - id: default-evaluated-once
          label: Explains that the default dict is created once and shared between calls
          weight: 2
          required: true
          any: ["once", "single time", "definition time", "when the function is defined", "when it is defined", "when the def", "def statement", "mutable default", "function object", "stored on the function", "lives on", "shared", "share", "same dict", "same dictionary", "same object", "single dict", "one dict", "reused", "persist", "leak", "between calls", "across calls", "previous call", "earlier call", "next call", "later call", "subsequent call", "one call to the next", "__defaults__"]
          missing_feedback: Explain when the default `{}` is created and why every call ends up using the same dictionary.
          misconception: {code: mutable-default-fresh-per-call, label: Thinks default argument values are re-created on every call, category: conceptual}
        - id: none-sentinel-fix
          label: Fixes it with a None default and a fresh dict per call
          weight: 1
          any: ["none", "new dict", "fresh dict", "new dictionary", "fresh dictionary", "new empty dict", "inside the function", "in the function body", "in the body", "copy", "dict(headers", 're:\{\s*\*\*\s*headers', "headers or {"]
          missing_feedback: Show the idiomatic fix, for example `headers=None` and `headers = {} if headers is None else dict(headers)`.

  - slug: fn-merge-config-code
    skill: py-functions
    kind: python_code
    difficulty: 2
    minutes: 10
    title: Merge configuration layers with *args and **kwargs
    objective: Collect a variable number of positional and keyword arguments and merge them without mutating the inputs.
    prompt: |
      Write `merge_config(*layers, **overrides)` that merges configuration
      dictionaries:

      - Apply each dict in `layers` from left to right, then the keyword
        `overrides`; later values win.
      - A value of `None` never sets or overrides a key (it means "not
        configured").
      - Return a new dict and never mutate the arguments.
      - With no arguments at all, return `{}`.

      ```python
      >>> merge_config({"host": "localhost", "port": 5432}, {"port": 6543}, debug=True)
      {'host': 'localhost', 'port': 6543, 'debug': True}
      ```
    hints:
      - "`layers` arrives as a tuple of dicts and `overrides` as a dict. Could you treat `overrides` as one final layer?"
      - Loop over each layer's `.items()` and skip `None` values before assigning into a fresh result dict.
    explanation: |
      `*layers` collects any number of positional arguments into a tuple and
      `**overrides` collects keyword arguments into a dict, so the function
      can treat the overrides as the last layer. Building a fresh `result`
      and copying keys into it leaves the inputs untouched; starting with
      `result = layers[0]` and calling `update()` would mutate the caller's
      dict (and crash when no layers are passed). `{**a, **b}` and `a | b`
      merge dicts too, but they cannot skip `None` values, so an explicit loop
      or a filtered comprehension is needed.
    solution: |
      ```python
      def merge_config(*layers, **overrides):
          result = {}
          for layer in (*layers, overrides):
              for key, value in layer.items():
                  if value is not None:
                      result[key] = value
          return result
      ```

      `(*layers, overrides)` builds one tuple containing every positional
      layer followed by the keyword overrides, so a single loop applies them
      in priority order. Assigning into a new `result` dict means no input is
      ever modified, and the `value is not None` check (not just
      `if value`) keeps legitimate falsy values such as `False` and `0`.
    content:
      starter_code: |
        def merge_config(*layers, **overrides):
            """Merge config dicts left to right, then keyword overrides; None values are ignored."""
            result = {}
            # Apply each layer, then the overrides.
            return result
      reference_solution: |
        def merge_config(*layers, **overrides):
            result = {}
            for layer in (*layers, overrides):
                for key, value in layer.items():
                    if value is not None:
                        result[key] = value
            return result
    tests:
      - name: later layers win
        code: |
          assert merge_config({"a": 1, "b": 2}, {"b": 3}) == {"a": 1, "b": 3}
      - name: keyword overrides beat every layer
        code: |
          assert merge_config({"debug": False}, {"debug": False}, debug=True) == {"debug": True}
      - name: no arguments gives an empty dict
        code: |
          assert merge_config() == {}
      - name: None never sets or overrides a key
        hidden: true
        code: |
          assert merge_config({"host": "db", "retries": 0}, {"host": None, "port": None}, user=None) == {
              "host": "db",
              "retries": 0,
          }
      - name: does not mutate its inputs
        hidden: true
        code: |
          base = {"a": 1}
          extra = {"a": 2, "b": 3}
          result = merge_config(base, extra)
          assert result == {"a": 2, "b": 3}
          assert base == {"a": 1} and extra == {"a": 2, "b": 3}
          assert result is not base and result is not extra

