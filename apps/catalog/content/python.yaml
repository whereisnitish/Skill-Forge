      - That assignment runs straight after the `def` statement. When is that, relative to `print("start")`?
    explanation: |
      `@register` is equivalent to `handler = register(handler)`, executed
      immediately after the `def` statement, which here means while the module
      is being executed (for a library, at import time). So
      `registering handler` prints first, then `start`, and the call to
      `handler()` runs the original function, which `register` returned
      unchanged. A decorator may return any object; returning the original
      function after recording it is the common registration pattern used by
      Flask's `app.route` and many plugin systems.
