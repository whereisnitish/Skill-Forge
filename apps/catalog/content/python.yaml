          weight: 2
          any: ["shared", "global cache", "single cache", "one cache", "same cache", "module level", "module-level", "all functions", "all decorated", "every function", "every decorated", "across functions", "different functions", "between functions", "other function", "collide", "collision", "clash", "function name", "include the function", "include func", "per function", "per-function", "get_user(42)", 're:get_user\b[^.]*\bget_permissions', 're:get_permissions\b[^.]*\bget_user']
          missing_feedback: Consider what `get_permissions(42)` returns after `get_user(42)` has been cached.
          misconception: {code: shared-decorator-state, label: Overlooks module-level state shared by every decorated function, category: logic}
