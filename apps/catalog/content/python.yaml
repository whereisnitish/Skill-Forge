  - slug: gen-sliding-windows-code
    skill: py-iterators-generators
    kind: python_code
    difficulty: 3
    minutes: 15
    title: Stream sliding windows over an endless iterator
    objective: Write a generator that pulls items lazily from any iterable, including infinite ones, using a bounded deque.
    prompt: |
      Monitoring code computes moving averages over a stream of metrics that
      may never end. Write a generator `sliding_windows(iterable, n)` that
      yields tuples of `n` consecutive items:

      ```python
      >>> list(sliding_windows([1, 2, 3, 4], 2))
      [(1, 2), (2, 3), (3, 4)]
      ```

      Requirements:

      - Work with any iterable, including infinite iterators, and pull items
        lazily: producing the first window must read only `n` items.
      - Yield nothing if the input has fewer than `n` items.
      - Raise `ValueError` if `n < 1`.

      (`itertools.pairwise` only covers `n = 2`, and Python 3.12's
      `itertools.batched` produces non-overlapping chunks, so neither solves
      this directly.)
    hints:
      - You only ever need the last `n` items you have seen. Which `collections` type can hold exactly that for you?
      - "`deque(maxlen=n)` discards the oldest item automatically when you append. Fill it first with `islice(iterator, n)`."
      - Call `iter()` once on the input, so that the initial fill and the following loop share the same iterator.
    explanation: |
      A generator function runs only as far as the consumer asks, so the
      window can be produced lazily, one item at a time. Calling `iter()` once
      and sharing that iterator between the initial `islice` fill and the
      main loop makes sure no item is read twice or skipped, and
      `deque(maxlen=n)` drops the oldest item on each append, so every step
      costs O(n) for the tuple copy and memory stays bounded. Calling
      `list()` on the input instead would never finish for an infinite
      stream.
    solution: |
      ```python
      from collections import deque
      from itertools import islice


      def sliding_windows(iterable, n):
          if n < 1:
              raise ValueError("n must be at least 1")
          iterator = iter(iterable)
          window = deque(islice(iterator, n), maxlen=n)
          if len(window) < n:
              return
          yield tuple(window)
          for item in iterator:
              window.append(item)
              yield tuple(window)
      ```

      Because this is a generator function, even the `ValueError` is raised
      lazily, on the first `next()` call. If you want invalid arguments to
      fail at call time, validate in a plain function and return an inner
      generator.
    content:
      starter_code: |
        from collections import deque
        from itertools import islice


        def sliding_windows(iterable, n):
            """Yield tuples of `n` consecutive items from `iterable`, lazily."""
            raise NotImplementedError
      reference_solution: |
        from collections import deque
        from itertools import islice


        def sliding_windows(iterable, n):
            if n < 1:
                raise ValueError("n must be at least 1")
            iterator = iter(iterable)
            window = deque(islice(iterator, n), maxlen=n)
            if len(window) < n:
                return
            yield tuple(window)
            for item in iterator:
                window.append(item)
                yield tuple(window)
    tests:
      - name: yields overlapping windows
        code: |
          assert list(sliding_windows([1, 2, 3, 4], 2)) == [(1, 2), (2, 3), (3, 4)]
      - name: a window as long as the input
        code: |
          assert list(sliding_windows("abc", 3)) == [("a", "b", "c")]
      - name: fewer items than n yields nothing
        code: |
          assert list(sliding_windows([1, 2], 3)) == []
      - name: works on an infinite iterator
        hidden: true
        code: |
          from itertools import count, islice
          assert list(islice(sliding_windows(count(), 3), 2)) == [(0, 1, 2), (1, 2, 3)]
      - name: reads only n items for the first window
        hidden: true
        code: |
          pulled = []

          def source():
              for i in range(100):
                  pulled.append(i)
                  yield i

          windows = sliding_windows(source(), 3)
          assert next(windows) == (0, 1, 2)
          assert len(pulled) == 3, f"read {len(pulled)} items to build the first window"
      - name: rejects n below 1
        hidden: true
        code: |
          try:
              list(sliding_windows([1, 2, 3], 0))
          except ValueError:
              pass
          else:
              raise AssertionError("expected ValueError for n=0")

  - slug: gen-single-pass-explain
