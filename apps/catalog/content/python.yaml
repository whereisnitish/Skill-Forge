  - slug: pytest-raises-block-mcq
    skill: py-testing-pytest
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    title: What is wrong with this pytest.raises block?
    objective: Recognise that code after the raising line inside pytest.raises never runs.
    prompt: |
      ```python
      import pytest

      from bank import Account, InsufficientFunds


      def test_withdraw_rejects_overdraft():
          account = Account(balance=10)
          with pytest.raises(InsufficientFunds):
              account.withdraw(50)
              assert account.balance == 10
      ```

      Assume `withdraw` raises `InsufficientFunds` correctly. What is wrong
      with this test?
    hints:
      - What happens to the remaining lines of a block when an exception is raised inside it?
      - "`pytest.raises` catches the exception at the end of the `with` block."
    explanation: |
      When `account.withdraw(50)` raises, control leaves the `with` block
      immediately and `pytest.raises` catches the exception at its end. The
      `assert` on the next line is dead code, so the test would still pass if
      `withdraw` had deducted the money before raising. Put only the call
      that should raise inside the block and check state afterwards:

      ```python
      with pytest.raises(InsufficientFunds):
          account.withdraw(50)
      assert account.balance == 10
      ```

      `pytest.raises(..., match=r"...")` can also check the message.
    content:
      multiple: false
      options:
        - id: a
          text: "The balance assertion never runs: the `with` block is left as soon as `withdraw` raises"
          correct: true
          feedback: Correct. The exception ends the block, so the assertion is dead code. Move it after the `with` block.
        - id: b
          text: Nothing. It checks both the exception and that the balance is unchanged
          feedback: Code after the raising line inside the block never executes, so the balance is never checked.
          misconception: {code: raises-block-continues, label: Thinks code after the raising line inside pytest.raises still runs, category: conceptual}
        - id: c
