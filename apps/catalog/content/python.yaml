          weight: 2
          required: true
          any: ["where it is looked up", "where it's looked up", "where it is used", "where it's used", "looked up", "imported into", "own reference", "own name", "own copy", "already bound", "bound at import", "binds the name", "bound the name", "at import time", "import time", "already imported", "local name", "namespace", "module's global", "notifications module", "copies a reference", "copy of the reference"]
