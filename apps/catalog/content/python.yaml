  - slug: exc-try-else-finally-mcq
    skill: py-exceptions
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    title: Order of try, else and finally
    objective: Predict the execution order of try, except, else and finally when a block returns.
    prompt: |
      ```python
      def load(raw):
          try:
              value = int(raw)
          except ValueError:
              print("bad input")
              return None
          else:
              print("parsed")
              return value
          finally:
              print("cleanup")


      result = load("42")
      ```

      What does `load("42")` print?
    hints:
      - Does `int("42")` raise? That decides between `except` and `else`.
      - "`finally` is the clause that runs whatever happens, even when an earlier clause returns."
    explanation: |
      `int("42")` succeeds, so the `except` clause is skipped and `else` runs:
      it prints `parsed` and evaluates `return value`. Before the function
      actually returns, `finally` runs and prints `cleanup`; then `42` is
      returned. `finally` runs whether the block completes, returns, raises or
      breaks out of a loop. Putting the success path in `else` keeps the `try`
      block narrow, so an unexpected error in the success code is not caught
      by `except ValueError` by accident.
    content:
      multiple: false
      options:
        - id: a
          text: '`parsed`, then `cleanup`'
          correct: true
          feedback: Correct. No exception occurs, so `else` runs; its `return` is prepared, and `finally` runs before the function returns 42.
        - id: b
          text: '`parsed` only; `finally` is skipped because `else` already returned'
          feedback: A `return` does not skip `finally`. Python runs the `finally` clause on the way out of the `try` statement, however it is left.
          misconception: {code: return-skips-finally, label: Thinks a return statement skips the finally clause, category: conceptual}
        - id: c
          text: '`cleanup`, then `parsed`'
          feedback: "`finally` runs last, after the `try` body and then `except` or `else` have finished (or returned)."
          misconception: {code: finally-runs-first, label: Thinks finally runs before the else clause, category: conceptual}
        - id: d
          text: '`cleanup` only; `else` runs only after an exception was caught'
          feedback: It is the other way round. `else` runs only when the `try` body raised *no* exception.
          misconception: {code: else-means-error, label: Confuses the else clause of try with an exception handler, category: conceptual}

  - slug: exc-except-order-debug
    skill: py-exceptions
    kind: debugging
    difficulty: 2
    minutes: 6
    title: A missing key reported as invalid JSON
    objective: Diagnose an except clause that shadows a more specific handler and fix it with specific, chained exceptions.
    prompt: |
      An on-call engineer reports that a config file containing
      `{"host": "db"}` produced the error *config is not valid JSON*, although
      the JSON is perfectly valid. Pick the line that contains the defect and
      explain the fix.
    hints:
      - Which exception does `config["port"]` raise for this input?
      - Python checks `except` clauses from top to bottom. Which one matches that exception first?
    explanation: |
      Python tries `except` clauses in order and uses the first one that
      matches. `KeyError` is a subclass of `Exception`, so the broad
      `except Exception` handles the missing key and reports it as invalid
      JSON, and the `except KeyError` clause can never run. Catch the specific
      exceptions you expect (`json.JSONDecodeError` for parse errors,
      `KeyError` for the missing key, `TypeError`/`ValueError` for a bad port
      value), put specific handlers before broad ones, and keep the original
      error attached with `raise ... from exc`.
    solution: |
      **Model answer.** The defect is the `except Exception:` on line 12.
      `except` clauses are tried in order and the first match wins; `KeyError`
      is a subclass of `Exception`, so the broad handler catches the missing
      `port` key and reports it as invalid JSON, and the `except KeyError`
      clause is unreachable. Catch `json.JSONDecodeError` for parse failures
      instead, keep specific handlers before any broad one, and chain the
      cause with `raise ConfigError(...) from exc`.

      ```python
      def load_port(text):
          try:
              config = json.loads(text)
          except json.JSONDecodeError as exc:
              raise ConfigError("config is not valid JSON") from exc
          try:
              port = int(config["port"])
          except KeyError as exc:
              raise ConfigError("config is missing 'port'") from exc
          except (TypeError, ValueError) as exc:
              raise ConfigError("port must be an integer") from exc
          if not 1 <= port <= 65535:
              raise ConfigError(f"port {port} is out of range")
          return port
      ```
    content:
      language: python
      code: |
        import json


        class ConfigError(Exception):
            pass


        def load_port(text):
            try:
                config = json.loads(text)
                port = int(config["port"])
            except Exception:
                raise ConfigError("config is not valid JSON")
            except KeyError:
                raise ConfigError("config is missing 'port'")
            if not 1 <= port <= 65535:
                raise ConfigError(f"port {port} is out of range")
            return port
