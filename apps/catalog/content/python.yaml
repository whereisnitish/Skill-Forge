  - slug: oop-dataclass-mutable-default-mcq
    skill: py-oop-dataclasses
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    title: A dataclass with a list default
    objective: Recognise that dataclasses reject mutable defaults and require default_factory.
    prompt: |
      ```python
      from dataclasses import dataclass


      @dataclass
      class Cart:
          owner: str
          items: list[str] = []
      ```

      What happens when this module is imported?
    hints:
      - Remember the mutable default argument trap for functions. Dataclasses know about it too.
      - The `@dataclass` decorator runs when the class statement executes, not when you create an instance.
    explanation: |
      `@dataclass` inspects the fields when the class is created and refuses
      unhashable defaults such as lists, dicts and sets, raising
      `ValueError: mutable default <class 'list'> for field items is not
      allowed: use default_factory`. A plain `[]` default would otherwise be
      shared by every instance, exactly like a mutable default argument. The
      fix is `items: list[str] = field(default_factory=list)`, which calls
      `list()` to create a new list for each instance.
    content:
      multiple: false
      options:
        - id: a
          text: "A `ValueError` is raised when the class is defined: mutable defaults are rejected in favour of `field(default_factory=list)`"
          correct: true
          feedback: Correct. The check happens as soon as `@dataclass` processes the class, so the module fails to import.
        - id: b
          text: It works, but every `Cart` shares the same `items` list
          feedback: That is the bug dataclasses protect you from. Instead of silently sharing the list, `@dataclass` refuses the default.
          misconception: {code: dataclass-shares-mutable-default, label: Expects dataclasses to share mutable defaults like function defaults, category: conceptual}
        - id: c
          text: It works, and each `Cart` gets its own fresh empty list
          feedback: Dataclasses do not copy default values. That behaviour needs `field(default_factory=list)`; a bare `[]` is rejected.
          misconception: {code: dataclass-copies-default, label: Thinks dataclasses copy mutable default values per instance, category: conceptual}
        - id: d
          text: The import works, and a `TypeError` is raised only when you call `Cart("ada")`
          feedback: The field check happens when the class is created, at import time, not when an instance is built.
          misconception: {code: dataclass-validates-at-call, label: Thinks dataclass field checks happen at instantiation, category: conceptual}

  - slug: oop-unhashable-dataclass-debug
    skill: py-oop-dataclasses
    kind: debugging
    difficulty: 2
    minutes: 6
    tags: [scenario]
    secondary_skills: [py-data-structures]
    title: Dataclass instances refuse to go into a set
    objective: Diagnose why a default dataclass is unhashable and fix it with frozen=True.
    prompt: |
      Calling `unique_locations(rows)` raises
      `TypeError: unhashable type: 'Location'`, and the traceback points at
      the `if location not in seen` line. Pick the line that contains the
      actual defect and explain the fix.
    hints:
      - The traceback shows where the error surfaced, not necessarily where the mistake is.
      - Which methods does `@dataclass` generate by default, and what does it do to `__hash__` as a result?
    explanation: |
      A plain `@dataclass` generates `__eq__` (because `eq=True` is the
      default) and, since the class is not frozen, sets `__hash__` to `None`.
      Objects that compare by value but can still be mutated must not be
      hashable, because their hash could change while they sit in a set or
      dict. `@dataclass(frozen=True)` makes instances immutable and generates
      a field-based `__hash__`, so equal locations deduplicate correctly.
      `unsafe_hash=True` also works but lets you mutate hashed objects, which
      is rarely what you want.
    solution: |
      **Model answer.** The defect is the decorator on line 4, even though the
      error surfaces on line 16. A plain `@dataclass` generates `__eq__`
      (`eq=True` is the default) and, because the class is not frozen, sets
      `__hash__` to `None`: mutable objects that compare by value must not be
      hashable, or their hash could change while they sit in a set. So
      `location not in seen` raises `TypeError`. Fix it with
      `@dataclass(frozen=True)`, which makes instances immutable and generates
      a `__hash__` from the fields, so equal locations deduplicate correctly.

      ```python
      @dataclass(frozen=True)
      class Location:
          city: str
          country: str
      ```
    content:
      language: python
      code: |
        from dataclasses import dataclass


        @dataclass
        class Location:
            city: str
            country: str


        def unique_locations(rows):
            """Return the distinct locations in `rows`, preserving first-seen order."""
            seen = set()
            result = []
            for row in rows:
                location = Location(row["city"], row["country"])
                if location not in seen:
                    seen.add(location)
                    result.append(location)
            return result
      bug_lines: [4]
      line_weight: 0.4
      min_words: 12
      max_words: 200
      criteria:
        - id: eq-disables-hash
          label: Explains that a default @dataclass (eq=True, not frozen) sets __hash__ to None
          weight: 2
          required: true
          any: ["__hash__", "hash to none", "hash = none", "hash is none", "hash method", "no hash", "not hashable", "isn't hashable", "is not hashable", "__eq__", "eq=true", "eq is true", "generates eq", "defines eq", "equality", "mutable", "not frozen", "isn't frozen"]
          missing_feedback: Explain why a default `@dataclass` instance cannot be hashed even though ordinary objects can.
          misconception: {code: dataclass-hashable-by-default, label: Expects a default dataclass to be hashable, category: conceptual}
        - id: frozen-fix
          label: Fixes it with frozen=True (or unsafe_hash=True, or a tuple key)
          weight: 1
          any: ["frozen", "unsafe_hash", "namedtuple", "tuple", "define a hash", "implement __hash__", "add __hash__", "add a __hash__"]
          missing_feedback: Show how to make `Location` hashable, for example `@dataclass(frozen=True)`.

  - slug: oop-dataclass-order-short
    skill: py-oop-dataclasses
    kind: short_answer
    difficulty: 3
    minutes: 3
    title: Sorting dataclasses with order=True
    objective: Predict how order=True and compare=False determine the sort order of dataclass instances.
    prompt: |
      ```python
      from dataclasses import dataclass, field


      @dataclass(order=True)
      class Job:
          priority: int
          name: str = field(compare=False)


      jobs = [Job(2, "backup"), Job(1, "email"), Job(1, "alert")]
      print([job.name for job in sorted(jobs)])
      ```

      What does this print?
    hints:
      - "`order=True` generates `<`, `<=`, `>` and `>=`. Which fields take part in those comparisons here?"
      - Two jobs that compare equal keep their relative order. Which property of Python's sort guarantees that?
    explanation: |
      With `order=True`, `@dataclass` generates comparison methods that
      compare instances as tuples of their fields in definition order,
      leaving out fields declared with `compare=False`. Jobs are therefore
      compared by `(priority,)` alone. `Job(1, "email")` and `Job(1, "alert")`
      compare equal, and because Python's sort is stable they keep their
      input order, giving `['email', 'alert', 'backup']`. This is the pattern
      the `heapq` documentation recommends for priority-queue entries whose
      payload is not comparable.
    content:
      placeholder: "e.g. ['a', 'b', 'c']"
      ignore_spaces: true
      accepted:
        - "['email', 'alert', 'backup']"
        - '["email", "alert", "backup"]'
        - "[email, alert, backup]"
        - "email, alert, backup"
      wrong:
        - answers: ["['alert', 'email', 'backup']", '["alert", "email", "backup"]', "[alert, email, backup]", "alert, email, backup"]
          feedback: "`name` has `compare=False`, so it plays no part in the ordering. The two priority-1 jobs compare equal, and the stable sort keeps them in input order."
          misconception: {code: compare-false-ignored, label: Thinks fields with compare=False still take part in ordering, category: conceptual}
        - answers: ["['backup', 'email', 'alert']", '["backup", "email", "alert"]', "[backup, email, alert]", "backup, email, alert"]
          feedback: "`sorted()` does reorder the jobs: `order=True` generates comparison methods that compare by `priority` first, so priority 1 comes before priority 2."
          misconception: {code: dataclass-order-ignored, label: Does not know order=True generates comparison methods, category: conceptual}
        - answers: ["TypeError"]
          feedback: "`order=True` is exactly what makes instances sortable: it generates `__lt__` and the other comparison methods."
          misconception: {code: dataclass-order-ignored, label: Does not know order=True generates comparison methods, category: conceptual}

