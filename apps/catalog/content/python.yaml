  - slug: async-gather-vs-taskgroup-explain
    skill: py-asyncio
    kind: concept_explanation
    difficulty: 4
    minutes: 12
    tags: [scenario]
    secondary_skills: [py-exceptions]
    title: Failure handling with gather and TaskGroup
    objective: Explain how gather and TaskGroup propagate failures and cancel work, and how to add optional calls and an overall timeout.
    prompt: |
      ```python
      async def load_dashboard(user_id):
          profile, orders, recs = await asyncio.gather(
              fetch_profile(user_id),
              fetch_orders(user_id),
              fetch_recommendations(user_id),
          )
          return {"profile": profile, "orders": orders, "recs": recs}
      ```

      `fetch_orders` raises an exception after 50 ms, while the other two
      calls take 2 s. Explain:

      1. what happens to the caller, and to the other two calls, with this
         `gather`;
      2. how the behaviour changes if you rewrite it with `asyncio.TaskGroup`,
         and how the error then reaches the caller;
      3. how you would let the dashboard render without recommendations when
         only `fetch_recommendations` fails;
      4. how you would cap the whole operation at 3 seconds.
    hints:
      - With `gather`, does the first failure stop the other awaitables?
      - "`TaskGroup` implements structured concurrency. What does it do with the remaining tasks when one fails, and what kind of exception does it raise?"
      - Python 3.11 added a context manager for deadlines in the `asyncio` module.
    explanation: |
      With the default `return_exceptions=False`, `gather` propagates the
      first exception to the awaiting caller immediately but does not cancel
      the other awaitables; they keep running in the background and their
      results are discarded. `asyncio.TaskGroup` cancels the remaining tasks
      as soon as one fails, waits for them to finish, and then raises an
      `ExceptionGroup` that you handle with `except*`. Optional work should
      catch its own errors (a wrapper returning a fallback), or, with
      `gather`, use `return_exceptions=True` and inspect the results.
      `async with asyncio.timeout(3):` cancels everything inside the block and
      raises `TimeoutError` when the deadline passes.
    solution: |
      **Model answer.** With `gather` (default `return_exceptions=False`), the
      exception from `fetch_orders` propagates to `load_dashboard` as soon as
      it happens, after about 50 ms, so the caller gets the error quickly.
      But `gather` does not cancel the other awaitables: `fetch_profile` and
      `fetch_recommendations` keep running in the background for the full
      2 s, holding connections, and their results are thrown away.

      With `async with asyncio.TaskGroup() as tg:` and `tg.create_task(...)`
      for each call, the first failure makes the group cancel the remaining
      tasks and wait for them to finish. The error then reaches the caller
      wrapped in an `ExceptionGroup`, which you handle with `except*` (for
      example `except* OrdersError`). Nothing is left running when
      `load_dashboard` exits; this is structured concurrency.

      To make recommendations optional, catch the error inside a small
      wrapper coroutine so it never fails the group, for example
      `try: return await fetch_recommendations(uid)` with
      `except RecsError: return []`; with `gather` you could instead pass
      `return_exceptions=True` and replace an exception result with a
      fallback. To cap everything at 3 seconds, wrap the block in
      `async with asyncio.timeout(3):`, which cancels the outstanding work and
      raises `TimeoutError`, or use `asyncio.wait_for`.
    content:
      min_words: 80
      max_words: 450
      placeholder: Explain failure propagation, cancellation, optional work and timeouts...
