  - slug: async-sequential-await-mcq
    skill: py-asyncio
    kind: multiple_choice
    difficulty: 3
    minutes: 3
    diagnostic: true
    title: How long do three awaited sleeps take?
    objective: Recognise that awaiting coroutines one after another runs them sequentially.
    prompt: |
      ```python
      import asyncio
      import time


      async def fetch(i):
          await asyncio.sleep(1)
          return i


      async def main():
          start = time.perf_counter()
          results = [await fetch(i) for i in range(3)]
          print(results, round(time.perf_counter() - start))


      asyncio.run(main())
      ```

      What does this print?
    hints:
      - Work out when each `fetch(i)` starts relative to the one before it.
      - "`await` suspends `main` until the awaited coroutine has finished, and no tasks are created here. Can the sleeps overlap?"
    explanation: |
      Each `await fetch(i)` suspends `main` until that coroutine finishes, and
      nothing else has been scheduled, so the three one-second sleeps happen
      one after another and the output is `[0, 1, 2] 3`. Awaiting a coroutine
      directly does not create a task. To overlap the waits, schedule them
      together, with `await asyncio.gather(*(fetch(i) for i in range(3)))` or
      an `asyncio.TaskGroup`, and the total drops to about one second. asyncio
      is single-threaded: its concurrency comes from overlapping waits, not
      from using more CPU cores.
    content:
      multiple: false
      options:
        - id: a
          text: '`[0, 1, 2] 3`'
          correct: true
          feedback: Correct. Each `await` waits for one coroutine to finish before the next one starts, so the sleeps add up.
        - id: b
          text: '`[0, 1, 2] 1`'
          feedback: That needs the coroutines to run concurrently, for example via `asyncio.gather` or a `TaskGroup`. Awaiting them one by one runs them in sequence.
          misconception: {code: sequential-await-is-concurrent, label: Thinks awaiting coroutines one after another runs them concurrently, category: conceptual}
        - id: c
          text: "`SyntaxError`: `await` is not allowed inside a list comprehension"
          feedback: Inside an `async def`, comprehensions may contain `await`. The code runs; it is just sequential.
          misconception: {code: await-in-comprehension-illegal, label: Thinks await cannot be used in comprehensions inside async functions, category: syntax}
        - id: d
          text: It depends on the number of CPU cores
          feedback: The event loop runs coroutines on a single thread. Core count is irrelevant; what matters is whether waits overlap.
          misconception: {code: asyncio-uses-cores, label: Thinks asyncio runs coroutines in parallel across CPU cores, category: conceptual}

  - slug: async-blocking-call-debug
    skill: py-asyncio
    kind: debugging
    difficulty: 4
    minutes: 8
    tags: [scenario]
    title: Sign-ups freeze the whole API
    objective: Diagnose CPU-bound synchronous work that blocks the event loop and move it off the loop.
    prompt: |
      This handler runs in a busy async web API. Whenever someone signs up,
      every other request, even the `/health` check, stalls until the sign-up
      has been processed. Pick the line that contains the defect and explain
      the fix.
    hints:
      - Which line does a lot of work without ever reaching an `await`?
      - Does putting code inside an `async def` make it non-blocking?
    explanation: |
      An event loop can switch between coroutines only at an `await`.
      `hashlib.pbkdf2_hmac` with 600,000 iterations is a synchronous,
      CPU-bound call that takes from a fraction of a second to a few seconds,
      and while it runs the loop's thread is busy, so no other request makes
      progress. `async def` does not change that. Move such work off the loop
      with `await asyncio.to_thread(...)`, which is effective here because
      CPython's OpenSSL-backed `hashlib` releases the GIL while hashing, or
      with `loop.run_in_executor` and a `ProcessPoolExecutor` for pure-Python
      CPU work.
    solution: |
      **Model answer.** The defect is line 8. `hashlib.pbkdf2_hmac` with
      600,000 iterations is a synchronous, CPU-bound call. Putting it inside an
      `async def` does not make it asynchronous: there is no `await` while it
      runs, so it blocks the event loop thread and no other coroutine,
      including the health check, can run until it returns. Offload it to a
      worker thread:

      ```python
      async def hash_password(password: str) -> bytes:
          salt = os.urandom(16)
          digest = await asyncio.to_thread(
              hashlib.pbkdf2_hmac, "sha256", password.encode(), salt, 600_000
          )
          return salt + digest
      ```

      `hashlib` releases the GIL during the computation, so a thread works
      well; for pure-Python CPU work use a `ProcessPoolExecutor` via
      `loop.run_in_executor`.
    content:
      language: python
      code: |
        import asyncio
        import hashlib
        import os


        async def hash_password(password: str) -> bytes:
            salt = os.urandom(16)
            digest = hashlib.pbkdf2_hmac("sha256", password.encode(), salt, 600_000)
            return salt + digest


        async def handle_signup(request):
            payload = await request.json()
            hashed = await hash_password(payload["password"])
            await save_user(payload["email"], hashed)
            return {"status": "created"}
