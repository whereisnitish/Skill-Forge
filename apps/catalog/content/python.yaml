  - slug: exc-checkout-review
    skill: py-exceptions
    kind: code_review
    difficulty: 3
    minutes: 10
    tags: [scenario]
    title: Review error handling in a checkout function
    objective: Review a payment function for an over-broad handler, an over-wide try block, useless logging and a missing exception cause.
    prompt: |
      The payment gateway client raises `GatewayError` (with subclasses such
      as `CardDeclined`) when a charge fails. Review `checkout`: identify the
      problems with its error handling and explain how you would fix each
      one.
    hints:
      - Which exceptions does a bare `except:` catch, besides `GatewayError`?
      - Suppose `gateway.charge` succeeds but `order.save()` fails. What does the customer experience, and what does the log say?
      - Imagine debugging a production incident from this log line alone.
    explanation: |
      Error handling should catch the exceptions you expect, around the code
      that raises them, and leave enough evidence to debug what happened. A
      bare `except:` also catches `KeyboardInterrupt`, `SystemExit`,
      `asyncio.CancelledError` and our own bugs; a `try` around the charge
      *and* the bookkeeping turns "charged but not recorded" into a
      misleading "payment failed"; a log line without traceback or order id
      is useless during an incident; and `raise ... from exc` records the
      real cause explicitly, so callers can tell a declined card from an
      outage.
    solution: |
      **Model answer.**

      1. **Bare `except:`.** It catches everything, including
         `KeyboardInterrupt`, `SystemExit` and asyncio cancellation, plus
         programming errors such as an `AttributeError` in our own code, and
         reports them all as payment failures. Catch `GatewayError`
         specifically.
      2. **The `try` block is too wide.** If `charge` succeeds but
         `mark_paid()` or `save()` fails, the customer has been charged while
         we report "Payment failed" and the order stays unpaid; a retry would
         charge them twice. Wrap only the gateway call and handle persistence
         failures separately (record the receipt, reconcile, use an
         idempotency key).
      3. **The log line has no details.** `logger.error("Payment failed")`
         records no traceback and no order id. Use
         `logger.exception("Payment failed for order %s", order.id)`.
      4. **The cause is not chained explicitly.** Raise
         `PaymentError(...) from exc`, so the original gateway error (for
         example `CardDeclined`) is attached as `__cause__` and callers can
         tell a decline from an outage.

      ```python
      def checkout(gateway, order):
          try:
              receipt = gateway.charge(order.customer_id, order.total_cents)
          except GatewayError as exc:
              logger.exception("Payment failed for order %s", order.id)
              raise PaymentError(f"Payment failed for order {order.id}") from exc
          order.mark_paid(receipt.id)
          order.save()
          return receipt
      ```
    content:
      language: python
      code: |
        import logging

        logger = logging.getLogger(__name__)


        class PaymentError(Exception):
            """Raised when an order could not be paid."""


        def checkout(gateway, order):
            try:
                receipt = gateway.charge(order.customer_id, order.total_cents)
                order.mark_paid(receipt.id)
                order.save()
            except:
                logger.error("Payment failed")
                raise PaymentError("Payment failed")
            return receipt
      min_words: 40
      max_words: 400
      placeholder: List each problem you find and how you would fix it...
      criteria:
