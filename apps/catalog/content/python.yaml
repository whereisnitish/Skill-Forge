    objective: Replace a quadratic list-based membership check with a set while preserving first-seen order.
    prompt: |
      `unique_by` is used in an import pipeline to drop duplicate records. It
      is correct, but a profile shows it dominating the run time on large
      files. Rewrite it so that it runs in linear time on average, with the
      same behaviour:

      - Return the items with duplicates removed, keeping the **first**
        occurrence of each and preserving order.
      - `key`, if given, is a function computing the value used to detect
        duplicates; otherwise items are compared directly.
      - Accept any iterable, including generators. You may assume keys are
        hashable.

      ```python
      >>> unique_by([3, 1, 3, 2, 1])
      [3, 1, 2]
      >>> unique_by(["Ada", "ada", "Bob"], key=str.lower)
      ['Ada', 'Bob']
      ```

      One hidden test counts equality comparisons to check that your solution
      scales.
    hints:
      - What does `marker not in seen` cost when `seen` is a list holding k items?
      - Which built-in container answers "have I seen this before?" in O(1) on average?
      - Keep the `result` list for the output order, but track the keys you have seen in a `set`.
    explanation: |
      Checking `marker not in seen` against a list compares the marker with
      every element seen so far, so n items cost about n²/2 comparisons. A
      set finds an item by its hash and only calls `__eq__` when the hashes
      match, so each check is O(1) on average and the whole function is O(n).
      Keeping a separate `result` list preserves first-seen order. Counting
      operations, as the hidden test does with `__eq__` calls, is a
      deterministic way to test complexity without flaky timing assertions.
    solution: |
      ```python
      def unique_by(items, key=None):
          seen = set()
          result = []
          for item in items:
              marker = item if key is None else key(item)
              if marker not in seen:
                  seen.add(marker)
                  result.append(item)
          return result
      ```

      The only change from the original is `seen = set()` and `seen.add`, yet
      it turns O(n²) into O(n). When there is no key function and the items
      themselves are hashable, `list(dict.fromkeys(items))` is an idiomatic
      one-liner with the same behaviour, since dicts keep the first-inserted
      key and preserve insertion order.
    content:
      starter_code: |
        def unique_by(items, key=None):
            """Return items with duplicates (by key) removed, keeping first occurrences in order."""
            seen = []
            result = []
            for item in items:
                marker = item if key is None else key(item)
                if marker not in seen:
                    seen.append(marker)
                    result.append(item)
            return result
      reference_solution: |
        def unique_by(items, key=None):
            seen = set()
            result = []
            for item in items:
                marker = item if key is None else key(item)
                if marker not in seen:
                    seen.add(marker)
                    result.append(item)
            return result
    tests:
      - name: removes duplicates and keeps first-seen order
        code: |
          assert unique_by([3, 1, 3, 2, 1]) == [3, 1, 2]
      - name: uses the key function to detect duplicates
        code: |
          assert unique_by(["Ada", "ada", "Bob", "ADA", "bob"], key=str.lower) == ["Ada", "Bob"]
      - name: empty input gives an empty list
        code: |
          assert unique_by([]) == []
      - name: accepts a generator
        hidden: true
        code: |
          assert unique_by(x % 3 for x in range(10)) == [0, 1, 2]
      - name: scales linearly (counts equality checks)
        hidden: true
        code: |
          class Probe:
              eq_calls = 0

              def __init__(self, value):
                  self.value = value

              def __hash__(self):
                  return hash(self.value)

              def __eq__(self, other):
                  Probe.eq_calls += 1
                  return isinstance(other, Probe) and self.value == other.value


          items = [Probe(i % 300) for i in range(600)]
          result = unique_by(items)
          assert [p.value for p in result] == list(range(300))
          assert all(kept is original for kept, original in zip(result, items))
          assert Probe.eq_calls <= 2 * len(items), (
              f"{Probe.eq_calls} equality checks for {len(items)} items; is membership O(1)?"
          )

  - slug: perf-list-insert-front-short
    skill: py-performance
    kind: short_answer
    difficulty: 3
    minutes: 3
    tags: [interview]
    title: The hidden cost of inserting at the front
    objective: Determine the time complexity of repeatedly inserting at the front of a list.
    prompt: |
      ```python
      def newest_first(events):
          """Return the events with the most recent first (input is oldest first)."""
          result = []
          for event in events:
              result.insert(0, event)
          return result
      ```

      What is the time complexity of `newest_first` for `n` events? Answer in
      Big-O notation.
    hints:
      - A Python list is a dynamic array. What has to happen to the existing elements when you insert at index 0?
      - The i-th insert moves i elements. Add that up over all n inserts.
    explanation: |
      A Python list stores its elements in one contiguous array. `append` is
      amortised O(1), but `insert(0, x)` must shift every existing element
      one slot to the right. The i-th insert moves i elements, so n inserts
      cost 0 + 1 + … + (n − 1) ≈ n²/2 moves: O(n²). The shifting is a fast
      memory move, which is why this goes unnoticed on small inputs and then
      dominates on large ones. `events[::-1]` or `list(reversed(events))` is
      O(n), and `collections.deque.appendleft` is O(1) per call.
    content:
      placeholder: e.g. O(log n)
      ignore_spaces: true
      accepted: ["O(n^2)", "O(n²)", "O(n**2)", "O(n*n)", "O(n * n)", "quadratic", "quadratic time", "n^2", "n²"]
      patterns: ['o\(\s*n\s*(\^|\*\*)\s*2\s*\)', 'o\(\s*n\s*\*\s*n\s*\)']
      wrong:
        - answers: ["O(n)", "linear", "linear time", "n"]
          feedback: Each `insert(0, ...)` shifts every element already in the list, so the i-th insert costs O(i). Summed over n inserts, that is about n²/2 moves.
          misconception: {code: list-insert-front-constant, label: Assumes inserting at the front of a list is O(1), category: performance}
        - answers: ["O(1)", "constant", "constant time"]
          feedback: Even a single `insert(0, ...)` is O(n) for a list of n elements, and the function performs n of them.
          misconception: {code: list-insert-front-constant, label: Assumes inserting at the front of a list is O(1), category: performance}
        - answers: ["O(n log n)", "O(nlogn)", "n log n"]
          feedback: Nothing is sorted or halved here. The cost comes from shifting the existing elements on every insert, which adds up to O(n²).
