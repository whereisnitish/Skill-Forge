  - slug: comp-nested-clause-order-mcq
    skill: py-comprehensions
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    title: Read a comprehension with two for clauses
    objective: Predict the result of a nested comprehension by reading its clauses left to right.
    prompt: |
      ```python
      pairs = [(x, y) for x in range(3) for y in range(x)]
      ```

      What is the value of `pairs`?
    hints:
      - Rewrite the comprehension as ordinary nested `for` loops, keeping the clauses in the same order.
      - "`range(x)` stops before `x`. What does it produce when `x` is 0?"
    explanation: |
      Multiple `for` clauses nest from left to right, in the same order you
      would write the loops:

      ```python
      pairs = []
      for x in range(3):
          for y in range(x):
              pairs.append((x, y))
      ```

      For `x = 0`, `range(0)` is empty; `x = 1` adds `(1, 0)`; `x = 2` adds
      `(2, 0)` and `(2, 1)`. The result is a single flat list. To build nested
      lists you would put one comprehension inside another's expression:
      `[[(x, y) for y in range(x)] for x in range(3)]`.
    content:
      multiple: false
      options:
        - id: a
          text: '`[(1, 0), (2, 0), (2, 1)]`'
          correct: true
          feedback: Correct. The left `for` is the outer loop, and `range(x)` excludes `x` itself, so `x = 0` contributes nothing.
        - id: b
          text: '`[(0, 0), (1, 0), (1, 1), (2, 0), (2, 1), (2, 2)]`'
          feedback: This treats `range(x)` as if it included `x`. `range(x)` produces `0` up to `x - 1`, so `range(0)` is empty.
          misconception: {code: range-includes-stop, label: Thinks range(n) includes n, category: edge_case}
        - id: c
          text: '`NameError`, because `x` is not defined yet when `range(x)` runs'
          feedback: The clauses run left to right, so `x` is already bound by the outer loop when `range(x)` is evaluated.
          misconception: {code: nested-clause-order, label: Reads nested comprehension clauses from right to left, category: conceptual}
        - id: d
          text: '`[[], [(1, 0)], [(2, 0), (2, 1)]]`'
          feedback: Several `for` clauses in one comprehension still build one flat list. Nested lists need a comprehension inside the expression part.
          misconception: {code: multiple-for-builds-nested-lists, label: Thinks extra for clauses create nested lists, category: conceptual}

  - slug: comp-parse-query-code
    skill: py-comprehensions
    kind: python_code
    difficulty: 2
    minutes: 10
    tags: [scenario]
    title: Make a one-line query-string parser robust
    objective: Write a dict comprehension with a filter and safe unpacking that handles real-world edge cases.
    prompt: |
      An internal service receives query strings such as `"page=2&sort=name"`.
      The current one-line parser crashes or returns wrong data on some real
      inputs. Fix `parse_query(query)` so that it returns a dict and:

      - splits pairs on `&`, and each pair on the **first** `=` only (values
        may themselves contain `=`);
      - maps a key without any `=` (like `"debug"`) to `""`;
      - skips empty segments, as in `"a=1&&b=2"`;
      - keeps the last value when a key repeats.

      Try to keep it a single comprehension. No percent-decoding is needed
      here; in production you would reach for `urllib.parse.parse_qsl`.
    hints:
      - Run the current version in your head on `""` and on `"debug"`. What does `.split("=")` return, and what happens when you index `[1]`?
      - "`str.partition(\"=\")` always returns a 3-tuple `(before, separator, after)` and splits on the first separator only."
      - Add an `if pair` filter to drop the empty segments.
    explanation: |
      `str.split("=")` returns a list of variable length, so indexing `[1]`
      crashes when there is no `=` and truncates values that contain `=`.
      `partition` always returns exactly three parts, splitting at the first
      separator, which makes it safe to unpack inside a comprehension.
      Filtering with `if pair` removes the empty strings produced by `""` or
      `&&`. A dict comprehension assigns keys in order, so a repeated key
      naturally keeps its last value.
    solution: |
      ```python
      def parse_query(query):
          return {
              key: value
              for key, _, value in (pair.partition("=") for pair in query.split("&") if pair)
          }
      ```

      The inner generator expression splits on `&`, drops empty segments and
      partitions each pair once; the outer dict comprehension unpacks the
      three parts and ignores the separator. `"debug".partition("=")` is
      `("debug", "", "")`, so a bare key maps to `""`, and
      `"token=abc==".partition("=")` keeps `"abc=="` intact. For real HTTP
      traffic, `dict(urllib.parse.parse_qsl(query, keep_blank_values=True))`
      gives the same results here and also decodes `%20` and `+`.
    content:
      starter_code: |
        def parse_query(query):
            """Parse 'a=1&b=2' into {'a': '1', 'b': '2'}."""
            return {pair.split("=")[0]: pair.split("=")[1] for pair in query.split("&")}
      reference_solution: |
        def parse_query(query):
            return {
                key: value
                for key, _, value in (pair.partition("=") for pair in query.split("&") if pair)
            }
    tests:
      - name: parses simple pairs
        code: |
          assert parse_query("page=2&sort=name") == {"page": "2", "sort": "name"}
      - name: empty string gives an empty dict
        code: |
          assert parse_query("") == {}
      - name: a key without = maps to an empty string
        code: |
          assert parse_query("debug") == {"debug": ""}
      - name: skips empty segments and keeps blank values
        hidden: true
        code: |
          assert parse_query("a=1&&b=") == {"a": "1", "b": ""}
      - name: splits on the first = only
        hidden: true
        code: |
          assert parse_query("token=abc==&x=1") == {"token": "abc==", "x": "1"}
      - name: the last value wins for repeated keys
        hidden: true
        code: |
          assert parse_query("x=1&x=2") == {"x": "2"}

  - slug: comp-dict-key-collision-short
    skill: py-comprehensions
    kind: short_answer
    difficulty: 2
    minutes: 3
    title: Predict a dict comprehension with repeated keys
    objective: Predict how a dict comprehension handles several items that produce the same key.
    prompt: |
      ```python
      words = ["a", "bb", "cc", "d"]
      by_length = {len(w): w for w in words}
      ```

      What is the value of `by_length`? Write it as Python would print it.
    hints:
      - A dict comprehension behaves like a loop that runs `by_length[len(w)] = w` for each word.
      - What happens when you assign to a key that already exists in a dict?
    explanation: |
      Dict keys are unique. Assigning to an existing key replaces its value
      but keeps the key's original position. `"a"` and then `"d"` both have
      length 1, so `1` ends up mapped to `"d"`; `"bb"` and then `"cc"` have
      length 2, so `2` maps to `"cc"`: `{1: 'd', 2: 'cc'}`. This silent
      overwrite is easy to miss when building lookup tables from data with
      duplicate keys. When duplicates are possible, group with
      `defaultdict(list)` or check that `len(by_length) == len(words)`.
    content:
      placeholder: "e.g. {1: 'x'}"
      ignore_spaces: true
      accepted:
        - "{1: 'd', 2: 'cc'}"
        - '{1: "d", 2: "cc"}'
        - "{2: 'cc', 1: 'd'}"
        - '{2: "cc", 1: "d"}'
        - "{1: d, 2: cc}"
      wrong:
        - answers: ["{1: 'a', 2: 'bb'}", '{1: "a", 2: "bb"}', "{1: a, 2: bb}"]
          feedback: The comprehension assigns keys in order, exactly like a loop doing `by_length[len(w)] = w`, so later words overwrite earlier ones with the same length.
          misconception: {code: dict-comp-first-wins, label: Thinks a dict comprehension keeps the first value for a repeated key, category: logic}
        - answers: ["{1: ['a', 'd'], 2: ['bb', 'cc']}", '{1: ["a", "d"], 2: ["bb", "cc"]}']
          feedback: A dict comprehension never groups values; each key holds exactly one value. Grouping needs `defaultdict(list)` and an explicit loop.
          misconception: {code: dict-comp-groups-values, label: Thinks a dict comprehension groups values that share a key, category: conceptual}

