  - slug: dec-retry-decorator-code
    skill: py-decorators
    kind: python_code
    difficulty: 3
    minutes: 15
    tags: [scenario]
    secondary_skills: [py-exceptions]
    title: Write a retry decorator factory
    objective: Build a parameterised decorator that forwards arguments, re-raises correctly and preserves metadata with functools.wraps.
    prompt: |
      Write a decorator factory `retry(times, exceptions=(Exception,))` for
      flaky network calls:

      ```python
      @retry(times=3, exceptions=(ConnectionError, TimeoutError))
      def fetch_rates(currency):
          ...
      ```

      - The decorated function is attempted up to `times` times in total.
      - Only exceptions that are instances of `exceptions` trigger another
        attempt; any other exception propagates immediately.
      - If every attempt fails, re-raise the last exception unchanged.
      - Return the result as soon as an attempt succeeds, and forward all
        positional and keyword arguments.
      - Preserve the wrapped function's `__name__` and `__doc__`.
      - Raise `ValueError` straight away, when `retry(...)` itself is called,
        if `times < 1`.

      Do not sleep between attempts; a production version would add
      exponential back-off with jitter.
    hints:
      - "`@retry(times=3)` first calls `retry(times=3)`, and whatever that returns is then applied to the function. How many nested functions does that imply?"
      - Inside the wrapper, loop over the attempts and put the call in `try` / `except exceptions:`. On the last attempt, re-raise with a bare `raise`.
      - Decorate the wrapper with `@functools.wraps(func)` to copy `__name__`, `__doc__` and friends.
    explanation: |
      A decorator that takes arguments has three layers: `retry(times)` runs
      first and returns `decorator`, `decorator(func)` runs once at definition
      time and returns `wrapper`, and `wrapper(*args, **kwargs)` runs on every
      call. Validating `times` in the outermost layer makes bad configuration
      fail immediately. `except exceptions:` accepts a tuple of classes, and a
      bare `raise` re-raises the current exception with its original
      traceback. `functools.wraps` copies the metadata (and sets
      `__wrapped__`), so logs, debuggers and `help()` still see the real
      function.
    solution: |
      ```python
      import functools


      def retry(times, exceptions=(Exception,)):
          if times < 1:
              raise ValueError("times must be at least 1")

          def decorator(func):
              @functools.wraps(func)
              def wrapper(*args, **kwargs):
                  for attempt in range(1, times + 1):
                      try:
                          return func(*args, **kwargs)
                      except exceptions:
                          if attempt == times:
                              raise

              return wrapper

          return decorator
      ```

      Exceptions outside `exceptions` are not caught at all, so they escape
      on the first attempt. In production, retry only idempotent operations,
      add back-off between attempts and log each failure.
    content:
      starter_code: |
        import functools


        def retry(times, exceptions=(Exception,)):
            """Retry the decorated function up to `times` attempts on the given exceptions."""

            def decorator(func):
                def wrapper(*args, **kwargs):
                    return func(*args, **kwargs)

                return wrapper

            return decorator
      reference_solution: |
        import functools


        def retry(times, exceptions=(Exception,)):
            if times < 1:
                raise ValueError("times must be at least 1")

            def decorator(func):
                @functools.wraps(func)
                def wrapper(*args, **kwargs):
                    for attempt in range(1, times + 1):
                        try:
                            return func(*args, **kwargs)
                        except exceptions:
                            if attempt == times:
                                raise

                return wrapper

            return decorator
    tests:
      - name: succeeds after transient failures
        code: |
          calls = []

          @retry(times=3, exceptions=(ValueError,))
          def flaky():
              calls.append(1)
              if len(calls) < 3:
                  raise ValueError("not yet")
              return "ok"

          assert flaky() == "ok"
          assert len(calls) == 3
      - name: re-raises the last error after the final attempt
        code: |
          attempts = []

          @retry(times=2, exceptions=(ValueError,))
          def always_fails():
              attempts.append(1)
              raise ValueError("boom")

          try:
              always_fails()
          except ValueError as exc:
              assert str(exc) == "boom"
          else:
              raise AssertionError("expected ValueError")
          assert len(attempts) == 2, f"made {len(attempts)} attempts"
      - name: preserves metadata and forwards arguments
        code: |
          @retry(times=2)
          def fetch(url, *, timeout=5):
              """Fetch a URL."""
              return (url, timeout)

          assert fetch.__name__ == "fetch"
          assert fetch.__doc__ == "Fetch a URL."
          assert fetch("x", timeout=1) == ("x", 1)
      - name: does not retry other exception types
        hidden: true
        code: |
          attempts = []

          @retry(times=5, exceptions=(ValueError,))
          def wrong_type():
              attempts.append(1)
              raise KeyError("missing")

          try:
              wrong_type()
          except KeyError:
              pass
          else:
