  - slug: dec-cache-decorator-review
    skill: py-decorators
    kind: code_review
    difficulty: 3
    minutes: 10
    tags: [scenario]
    title: Review a home-made caching decorator
    objective: Review a caching decorator for incorrect cache keys, shared state, unbounded growth and lost metadata.
    prompt: |
      A teammate added this caching decorator to speed up two slow lookups
      in a web service. Review it before it ships: identify the problems and
      explain how you would fix each one.
    hints:
      - Call `get_permissions(42)` and then `get_permissions(42, include_inherited=True)`. What does the second call return?
      - How many cache dictionaries exist, and what happens after `get_user(42)` has been cached?
      - Think about the cache's lifetime, and about what `get_permissions.__name__` returns now.
    explanation: |
      Caching decorators are easy to get subtly wrong. The key must capture
      *everything* that affects the result (all positional and keyword
      arguments, and which function is being called), the cache needs a size
      limit and an invalidation story, and the wrapper should preserve the
      function's identity with `functools.wraps`. For pure functions,
      `functools.lru_cache(maxsize=...)` or `functools.cache` already gets the
      key and metadata right; data that changes, such as permissions, needs
      a TTL or explicit invalidation.
    solution: |
      **Model answer.**

      1. **Keyword arguments are ignored.** The key is only `args`, and
         `func(*args)` does not even pass `**kwargs` on, so
         `get_permissions(42, include_inherited=True)` silently runs with the
         default and returns whatever was cached for `(42,)`. Build the key
         from `args` and `tuple(sorted(kwargs.items()))`, and call
         `func(*args, **kwargs)`.
      2. **One cache is shared by every decorated function.** `_cache` lives
         at module level and the key does not include the function, so
         `get_user(42)` and `get_permissions(42)` collide and one returns the
         other's result. Create the dict inside `cached` so each function
         gets its own cache.
      3. **Unbounded and never invalidated.** Memory grows forever, and
         revoked permissions stay cached until the process restarts, which is
         a security problem. Use `functools.lru_cache(maxsize=...)` or a TTL
         cache, and invalidate entries when permissions change.
      4. **No `functools.wraps`.** The wrapper hides the original `__name__`
         and docstring, which hurts logging, debugging and introspection.

      Smaller points: use `logging` instead of `print`, and
      `time.perf_counter()` rather than `time.time()` for durations.
    content:
      language: python
      code: |
        import time

        _cache = {}


        def cached(func):
            def wrapper(*args, **kwargs):
                key = args
                if key in _cache:
                    return _cache[key]
                start = time.time()
                result = func(*args)
                print(f"{func.__name__} took {time.time() - start:.2f}s")
                _cache[key] = result
                return result
            return wrapper


        @cached
        def get_user(user_id):
            """Load a user record from the database."""
            ...


        @cached
        def get_permissions(user_id, *, include_inherited=False):
            """Load the permission set for a user."""
            ...
      min_words: 40
      max_words: 400
      placeholder: List each problem you find and how you would fix it...
