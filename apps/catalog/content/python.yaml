  - slug: cm-exit-suppresses-mcq
    skill: py-context-managers
    kind: multiple_choice
    difficulty: 3
    minutes: 2
    diagnostic: true
    title: What does a truthy __exit__ return value do?
    objective: Predict how the return value of __exit__ affects an exception raised inside a with block.
    prompt: |
      ```python
      class Quiet:
          def __enter__(self):
              return self

          def __exit__(self, exc_type, exc, tb):
              print("cleanup")
              return True


      with Quiet():
          raise ValueError("boom")
      print("after")
      ```

      What happens when this runs?
    hints:
      - Is `__exit__` called when the block raises?
      - "`__exit__` receives the exception. What could its return value tell Python about it?"
    explanation: |
      `__exit__` always runs when the `with` block is left, and it receives the
      exception type, value and traceback if the block raised. A truthy return
      value tells Python the exception has been handled, so it is suppressed
      and execution continues after the `with` statement: the output is
      `cleanup` and then `after`. This is how `contextlib.suppress` works, and
      why accidentally returning a truthy value from `__exit__` is a nasty bug.
      Return `None` or `False` to let exceptions propagate.
    content:
      multiple: false
      options:
        - id: a
          text: It prints `cleanup`, then `after`; the `ValueError` is suppressed
          correct: true
          feedback: Correct. `__exit__` returned `True`, which tells Python to swallow the exception and carry on after the block.
        - id: b
          text: It prints `cleanup`, then shows a `ValueError` traceback; `after` is never printed
          feedback: That is what happens when `__exit__` returns `None` or `False`. A truthy return value suppresses the exception.
          misconception: {code: exit-return-ignored, label: Does not know a truthy __exit__ return value suppresses the exception, category: conceptual}
        - id: c
          text: It shows only a `ValueError` traceback, because `__exit__` is skipped when the block raises
          feedback: Running `__exit__` even when the block raises is the whole point of a context manager. It is called with the exception details.
          misconception: {code: exit-skipped-on-error, label: Thinks __exit__ is skipped when the with block raises, category: conceptual}
        - id: d
          text: It prints `after`, then `cleanup` when the object is garbage-collected
          feedback: "`__exit__` runs deterministically when the `with` block ends, not whenever the object happens to be garbage-collected."
          misconception: {code: cleanup-at-gc, label: Thinks with-statement cleanup happens at garbage collection, category: conceptual}

  - slug: cm-temporary-attr-code
    skill: py-context-managers
    kind: python_code
    difficulty: 3
    minutes: 12
    tags: [scenario]
    secondary_skills: [py-iterators-generators]
    title: Fix a context manager that patches an attribute
    objective: Write a generator-based context manager that restores state even when the block raises, using try/finally and a sentinel.
    prompt: |
      Tests and maintenance scripts often need to change an attribute
      temporarily, such as a client's `timeout`, and put it back afterwards:

      ```python
      with temporary_attr(client, "timeout", 0.1):
          run_smoke_test(client)
      ```

      The starter version works in the happy path but has bugs. Fix
      `temporary_attr(obj, name, value)` so that:

      - inside the `with` block, `getattr(obj, name) == value`;
      - afterwards the original value is restored, **even if the block
        raised**, and the exception still propagates;
      - if `obj` had no such attribute before, it is removed again
        afterwards;
      - an original value of `None` is restored like any other value.
    hints:
      - In a `@contextmanager` generator, an exception raised inside the `with` block is re-raised at the `yield`. What happens to the code after `yield` then?
      - Wrap the `yield` in `try` / `finally` so the restore always runs, and do not catch the exception.
      - "`getattr(obj, name, None)` cannot tell \"missing\" apart from \"set to None\". Use a unique sentinel such as `_MISSING = object()`."
    explanation: |
      `@contextmanager` runs the generator up to `yield` on entry. On exit it
      resumes the generator, normally with `next()`, or, if the block raised,
      by throwing the exception in at the `yield`. Without `try/finally`, the
      restore code after `yield` is skipped exactly when you need it most. A
      private sentinel object distinguishes "attribute absent" from
      "attribute is `None`", so the original state is restored precisely.
      `unittest.mock.patch.object` implements the same pattern.
    solution: |
      ```python
      from contextlib import contextmanager

      _MISSING = object()


      @contextmanager
      def temporary_attr(obj, name, value):
          original = getattr(obj, name, _MISSING)
          setattr(obj, name, value)
          try:
              yield obj
          finally:
              if original is _MISSING:
                  delattr(obj, name)
              else:
                  setattr(obj, name, original)
      ```

      The `finally` clause runs both on normal exit and when an exception is
      thrown in at the `yield`; since nothing catches the exception, it still
      propagates to the caller. Comparing with `is _MISSING` (instead of
      `is None`) keeps attributes that were legitimately `None`.
    content:
      starter_code: |
        from contextlib import contextmanager


        @contextmanager
        def temporary_attr(obj, name, value):
            """Temporarily set obj.<name> = value, restoring the original state on exit."""
            original = getattr(obj, name, None)
            setattr(obj, name, value)
            yield
            setattr(obj, name, original)
      reference_solution: |
        from contextlib import contextmanager

        _MISSING = object()


        @contextmanager
        def temporary_attr(obj, name, value):
            original = getattr(obj, name, _MISSING)
            setattr(obj, name, value)
            try:
                yield obj
            finally:
                if original is _MISSING:
                    delattr(obj, name)
                else:
                    setattr(obj, name, original)
    tests:
      - name: sets the value inside the block and restores it after
        code: |
          from types import SimpleNamespace

          settings = SimpleNamespace(debug=False)
          with temporary_attr(settings, "debug", True):
              assert settings.debug is True
          assert settings.debug is False
      - name: removes an attribute that did not exist before
        code: |
          from types import SimpleNamespace

          obj = SimpleNamespace()
          with temporary_attr(obj, "token", "abc"):
              assert obj.token == "abc"
          assert not hasattr(obj, "token")
      - name: restores after an exception and lets it propagate
        hidden: true
        code: |
          from types import SimpleNamespace

          obj = SimpleNamespace(level=1)
          try:
              with temporary_attr(obj, "level", 99):
                  raise RuntimeError("boom")
          except RuntimeError:
              pass
          else:
              raise AssertionError("the exception was swallowed")
          assert obj.level == 1
      - name: nested uses unwind in order
        hidden: true
        code: |
          from types import SimpleNamespace

          obj = SimpleNamespace(x=1)
          with temporary_attr(obj, "x", 2):
              with temporary_attr(obj, "x", 3):
                  assert obj.x == 3
              assert obj.x == 2
          assert obj.x == 1
      - name: restores an original value of None
        hidden: true
        code: |
          from types import SimpleNamespace

          obj = SimpleNamespace(x=None)
          with temporary_attr(obj, "x", 5):
              assert obj.x == 5
          assert hasattr(obj, "x") and obj.x is None

  - slug: cm-with-guarantee-explain
    skill: py-context-managers
    kind: concept_explanation
    difficulty: 3
    minutes: 8
    title: Explain what the with statement guarantees
    objective: Explain the with statement's cleanup guarantee, the __enter__/__exit__ protocol and why generator-based context managers need try/finally.
    prompt: |
      Compare these two ways of writing a file:

      ```python
      # Version A
      f = open("report.csv", "w")
      write_rows(f, rows)
      f.close()

      # Version B
      with open("report.csv", "w") as f:
          write_rows(f, rows)
      ```

      and this home-made context manager:

      ```python
      from contextlib import contextmanager


      @contextmanager
      def acquired(lock):
          lock.acquire()
          try:
              yield
          finally:
              lock.release()
      ```

      Explain what the `with` statement guarantees that Version A does not,
      which methods Python calls and when, and why `acquired` needs
      `try/finally` around its `yield`.
    hints:
      - What happens in Version A if `write_rows` raises halfway through?
      - Which two special methods make an object usable in a `with` statement?
      - Where does an exception from the body of the `with` block reappear inside the generator?
    explanation: |
      `with` guarantees that cleanup runs however the block is left: normally,
      through `return` or `break`, or by an exception. Python calls
      `__enter__` at the start (binding its result to the `as` target) and
      `__exit__` at the end, passing in any exception. `@contextmanager` builds
      those two methods from a generator: the code before `yield` is the
      setup, the `with` body runs while the generator is paused at the
      `yield`, and an exception from the body is thrown back in at the
      `yield`. That is why the cleanup must sit in a `finally` clause:
      otherwise an exception skips it and, here, leaves the lock held
      forever.
    solution: |
      **Model answer.** In Version A, if `write_rows` raises, `f.close()`
      never runs: the file is left open, and buffered data is not flushed
      until the garbage collector happens to close it. The `with` statement
      guarantees cleanup. Python calls the object's `__enter__` method when
      the block starts (its return value is bound to `f`) and always calls
      `__exit__` when the block ends, whether it finishes normally, returns
      early or raises an exception; for a file, `__exit__` closes it.
      `@contextmanager` builds `__enter__` and `__exit__` from a generator:
      the code before `yield` runs on entry, the body of the `with` block runs
      while the generator is paused at the `yield`, and on exit the generator
      is resumed. If the block raised, the exception is re-raised inside the
      generator at the `yield`. Without `try/finally` that exception would
      skip `lock.release()` and the lock would stay locked forever,
      deadlocking every other thread that needs it. The `finally` clause makes
      the release run either way while still letting the exception
      propagate.
    content:
      min_words: 50
      max_words: 350
      placeholder: Explain the guarantee, the protocol and the role of try/finally...
      criteria:
        - id: cleanup-guaranteed
          label: Explains that cleanup runs even when the block raises, whereas Version A leaks the file on an exception
          weight: 2
          required: true
          any: ["even if", "even when", "regardless", "no matter", "guarantee", "always", "on exception", "on error", "if an exception", "if write_rows raises", "if write_rows fails", "exception is raised", "exception occurs", "error occurs", "never closed", "never be closed", "not closed", "left open", "stays open", "leak"]
          missing_feedback: Explain what happens to the file in Version A when `write_rows` raises, and what `with` does differently.
          misconception: {code: with-is-just-syntax, label: Thinks with is only shorter syntax with no extra guarantee, category: conceptual}
        - id: enter-exit-protocol
          label: Names the __enter__ / __exit__ protocol and when each method runs
          weight: 1
          any: ["__enter__", "__exit__", "enter method", "exit method", "dunder enter", "dunder exit", 're:\benter\b[^.]{0,30}\bexit\b']
          missing_feedback: Name the two methods Python calls on a context manager, and when it calls each.
        - id: exception-at-yield
          label: Explains that the with body runs at the yield and an exception from it is re-raised at the yield
          weight: 1
          any: ["re-raised at", "reraised at", "raised at the yield", "raised at yield", "at the yield", "at the point of the yield", "from the yield", "thrown into", "throws the exception", "throw(", "throw it", "inside the generator", "into the generator", 're:\byield\b[^.]*\b(raise|exception|error)', 're:\b(raise|exception|error)\w*\b[^.]*\byield\b']
          missing_feedback: Describe where an exception from the `with` body shows up inside the generator.
        - id: finally-needed
          label: Explains that without try/finally the release would be skipped when the block raises
          weight: 1
          any: ["try/finally", "try finally", "try...finally", "finally block", "finally clause", "finally:", 're:\bfinally\b[^.]*\b(run|runs|execute|executes|always|release|even)', "skipped", "never released", "never be released", "not released", "stay locked", "stays locked", "remains locked", "held forever", "deadlock"]
          missing_feedback: Explain what would happen to the lock if the `with` body raised and there were no `try/finally`.
          misconception: {code: contextmanager-auto-cleanup, label: Thinks contextmanager runs the code after yield even when the block raises, category: conceptual}

