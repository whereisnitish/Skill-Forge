  - slug: pytest-patch-target-debug
    skill: py-testing-pytest
    kind: debugging
    difficulty: 3
    minutes: 7
    tags: [interview]
    title: The patched SMTP class still hits the network
    objective: Diagnose a mock patch applied where a name is defined rather than where it is looked up.
    prompt: |
      In CI this test errors with `socket.gaierror` while trying to resolve
      `mail.internal`: it is talking to the network even though `SMTP` is
      patched. Pick the line that contains the defect and explain the fix.
    hints:
      - "`from smtplib import SMTP` creates a name in which module's namespace?"
      - When `send_welcome` runs, where does Python look up the name `SMTP`?
    explanation: |
      `from smtplib import SMTP` binds a second reference to the class in the
      `notifications` module's namespace at import time. `mock.patch` replaces
      an attribute on one object, here `smtplib.SMTP`, but `send_welcome`
      looks up `SMTP` in `notifications`, which still points at the real
      class. The rule is "patch where the name is looked up, not where it is
      defined": `mock.patch("notifications.SMTP")`, or
      `monkeypatch.setattr(notifications, "SMTP", FakeSMTP)` with pytest's
      fixture. Had the module used `import smtplib` and `smtplib.SMTP(...)`,
      patching `smtplib.SMTP` would have worked.
    solution: |
      **Model answer.** The defect is the patch target on line 17.
      `from smtplib import SMTP` copies a reference to the class into the
      `notifications` module's namespace at import time.
      `mock.patch("smtplib.SMTP")` replaces the attribute on the `smtplib`
      module, but `send_welcome` looks the name up in `notifications`, which
      still points at the real class, so the real `SMTP` tries to connect to
      `mail.internal`. Patch the name where it is looked up:

      ```python
      def test_send_welcome():
          with mock.patch("notifications.SMTP") as fake_smtp:
              notifications.send_welcome("ada@example.com")
          fake_smtp.return_value.__enter__.return_value.sendmail.assert_called_once()
      ```

      `mock.patch.object(notifications, "SMTP")` is equivalent and survives
      renames better.
    content:
      language: python
      code: |
        # notifications.py
        from smtplib import SMTP


        def send_welcome(email):
            with SMTP("mail.internal") as smtp:
                smtp.sendmail("noreply@example.com", [email], "Welcome!")


        # test_notifications.py
        from unittest import mock

        import notifications


        def test_send_welcome():
            with mock.patch("smtplib.SMTP") as fake_smtp:
                notifications.send_welcome("ada@example.com")
            fake_smtp.return_value.__enter__.return_value.sendmail.assert_called_once()
      bug_lines: [17]
      line_weight: 0.4
      min_words: 12
      max_words: 200
