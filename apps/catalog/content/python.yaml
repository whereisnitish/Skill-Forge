          weight: 2
          required: true
          any: ["bare except", "except:", "baseexception", "keyboardinterrupt", "systemexit", "cancellederror", "catches everything", "catches all", "catch everything", "catch all", "too broad", "overly broad", "broad", "specific exception", "catch gatewayerror", "except gatewayerror", "only gatewayerror", "programming error", "attributeerror", "hides bugs", "masks bugs", "hide bugs", "mask bugs"]
          missing_feedback: Look at which exceptions the bare `except:` catches besides gateway failures.
          misconception: {code: broad-except-is-safe, label: Treats catching every exception as defensive and safe, category: conceptual}
        - id: try-too-wide
