    title: Why does normalise return nothing for a generator?
    objective: Explain the difference between iterables and single-pass iterators and how to make a two-pass function safe.
    prompt: |
      ```python
      def normalise(values):
          total = sum(values)
          return [v / total for v in values]


      normalise([1, 2, 3])               # [0.1666..., 0.3333..., 0.5]
      normalise(x for x in [1, 2, 3])    # ?
      ```

      Explain what the second call returns and why. Cover the difference
      between an iterable such as a list and an iterator such as a generator,
      and how you would make `normalise` work for both.
    hints:
      - How many times does `normalise` loop over `values`?
      - What happens when you loop over a generator for the second time?
    explanation: |
      The second call returns `[]`. A generator is an iterator: it produces
      each value once and is then exhausted. `sum(values)` consumes all three
      numbers, so the comprehension that follows finds nothing to iterate
      over. A list is an iterable rather than an iterator: each loop calls
      `iter()` on it and gets a fresh iterator that starts from the
      beginning. Functions that need two passes should materialise the input
      once (`values = list(values)`) or be typed to accept a `Sequence`; the
      silent empty result is what makes this bug dangerous.
    solution: |
      **Model answer.** The second call returns an empty list. A generator is
      an iterator: it produces each value once and is then exhausted.
      `sum(values)` consumes all three numbers to compute the total (6), so
      when the list comprehension iterates over `values` again there is
      nothing left and it builds `[]`. A list is an iterable rather than an
      iterator: every `for` loop calls `iter()` on it and gets a fresh
      iterator starting from the beginning, which is why the first call
      works. To support both, materialise the input once at the top of the
      function with `values = list(values)` and then iterate over that list
      twice, or declare the parameter as a `Sequence` so callers know a
      generator is not accepted.
