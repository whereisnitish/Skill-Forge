  - slug: typing-runtime-hints-mcq
    skill: py-typing
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    title: Are type hints enforced at runtime?
    objective: Recognise that the interpreter does not enforce type annotations.
    prompt: |
      ```python
      def double(n: int) -> int:
          return n * 2


      print(double("ab"))
      ```

      What happens when you run this file with plain `python`, without any
      type checker involved?
    hints:
      - What does `"ab" * 2` evaluate to?
      - Who reads annotations? The interpreter, a separate tool, or both?
    explanation: |
      CPython stores annotations (in `double.__annotations__`) but never checks
      them, so `double("ab")` evaluates `"ab" * 2` and prints `abab`. A static
      checker such as mypy or pyright would flag the call before the code
      runs, reporting that a `str` was passed where an `int` was expected.
      Runtime validation, as in pydantic or FastAPI, is something libraries
      build on top of annotations; it is not a language feature.
    content:
      multiple: false
      options:
        - id: a
          text: It prints `abab`
          correct: true
          feedback: Correct. Annotations are not enforced at runtime, and multiplying a string by 2 repeats it.
        - id: b
          text: It raises `TypeError`, because `"ab"` is not an `int`
          feedback: The interpreter does not check annotations. Only a static type checker, run as a separate step, would report this call.
          misconception: {code: hints-enforced-at-runtime, label: Thinks the interpreter enforces type hints at runtime, category: conceptual}
        - id: c
          text: "Python refuses to run the file: annotations are type-checked when the module is compiled"
          feedback: Compiling a module only checks syntax. Type errors are found by separate tools such as mypy or pyright.
          misconception: {code: hints-checked-at-compile, label: Thinks type errors are detected when Python compiles a module, category: conceptual}
        - id: d
          text: It converts `"ab"` with `int()` and raises `ValueError`
          feedback: Plain annotations never convert values. Coercion is something libraries such as pydantic do explicitly.
          misconception: {code: hints-coerce-values, label: Thinks annotations convert values the way pydantic does, category: conceptual}

  - slug: typing-protocol-vs-abc-explain
    skill: py-typing
    kind: concept_explanation
    difficulty: 3
    minutes: 10
    tags: [interview]
    secondary_skills: [py-oop-dataclasses]
    title: Protocols versus abstract base classes
    objective: Explain structural typing with Protocol, contrast it with nominal ABCs, and choose between them.
    prompt: |
      ```python
      from collections.abc import Iterable
      from typing import Protocol


      class SupportsClose(Protocol):
          def close(self) -> None: ...


      def shutdown(resources: Iterable[SupportsClose]) -> None:
          for resource in resources:
              resource.close()
      ```

      `shutdown` should accept file objects, connections from a third-party
      database driver and your own classes. Explain:

      - how a type checker decides whether an object can be passed to
        `shutdown`;
      - how that differs from declaring `class Closeable(abc.ABC)` with an
        `@abstractmethod` named `close`;
      - what each approach does at runtime;
      - when you would choose each.
    hints:
      - Does `io.StringIO` inherit from `SupportsClose`? Does it need to?
      - What happens when you instantiate an ABC subclass that forgot to implement an abstract method?
      - Think about classes you cannot edit, such as those in third-party libraries.
    explanation: |
      `Protocol` gives structural typing ("static duck typing"): a type
      matches if it has the required members with compatible signatures,
      whatever it inherits from, and the check is done by the type checker.
      An ABC is nominal: only classes that inherit from it, or are registered
      with it, count, and Python enforces it at runtime by refusing to
      instantiate subclasses with unimplemented abstract methods. Protocols
      are ideal for describing what a function needs from types you do not
      own; ABCs suit class hierarchies where you want to share implementation
      or require an explicit opt-in. `@runtime_checkable` lets `isinstance`
      work with a protocol, but it only checks that the members exist, not
      their signatures.
    solution: |
      **Model answer.** A protocol is structural: a type checker such as mypy
      or pyright accepts any object whose type has a compatible
      `close(self) -> None` method, without that class inheriting from, or
      even knowing about, `SupportsClose`. So `io.StringIO`, a third-party
      connection class and your own classes all qualify as long as they have
      the right method shape. An `abc.ABC` is nominal: only classes that
      explicitly inherit from `Closeable` (or are registered with
      `Closeable.register`) count, so you could not pass a driver's
      connection class you do not control without wrapping it. At runtime,
      a subclass of the ABC that does not implement every `@abstractmethod`
      raises `TypeError` when you try to instantiate it, and `isinstance`
      works. A protocol does nothing at runtime unless you decorate it with
      `@runtime_checkable`, and even then `isinstance` only checks that a
      `close` attribute exists, not its signature. Choose a protocol to
      describe what you need from types you don't own, which is the typical
      case for function parameters; choose an ABC when you want to share
      implementation through concrete helper methods or force implementers
      to opt in explicitly.
    content:
      min_words: 60
      max_words: 400
      placeholder: Explain structural versus nominal typing, runtime behaviour and when to use each...
      criteria:
        - id: structural-typing
          label: Explains that Protocol is structural, so any object with a matching close() method qualifies without inheriting
          weight: 2
          required: true
          any: ["structural", "duck typing", "duck typed", "shape", "matching method", "matching signature", "compatible method", "compatible signature", "has a close", "has close", "has the method", "has the right method", "has the required method", "provides close", "implements close", "defines close", "without inherit", "no inheritance", "not inherit", "doesn't need to inherit", "does not need to inherit", "don't need to inherit", "without subclassing", "doesn't subclass", "no need to subclass", "implicitly"]
          missing_feedback: Explain what makes an object acceptable to `shutdown` as far as the type checker is concerned. Does it need to inherit from `SupportsClose`?
          misconception: {code: protocol-requires-inheritance, label: Thinks classes must inherit from a Protocol to satisfy it, category: conceptual}
        - id: nominal-abc
          label: Explains that an ABC is nominal, so classes must inherit from it or be registered
          weight: 1
          any: ["nominal", "explicitly inherit", "explicit inherit", "explicit subclass", "must inherit", "must subclass", "have to inherit", "have to subclass", "needs to inherit", "need to inherit", "inherit from closeable", "subclass closeable", "subclass of closeable", "register"]
          missing_feedback: Explain what a class has to do to count as a `Closeable` when you use an ABC.
        - id: static-checking
          label: Notes that protocol conformance is checked statically by a type checker
          weight: 1
          any: ["static", "type checker", "mypy", "pyright", "type check", "before runtime", "before the code runs", "at check time"]
          missing_feedback: Say which tool verifies that an argument satisfies `SupportsClose`, and when.
        - id: runtime-behaviour
          label: Describes runtime behaviour (ABCs refuse to instantiate incomplete subclasses; protocols are not checked unless runtime_checkable)
          weight: 1
          any: ["runtime_checkable", "instantiat", "typeerror", "can't create", "cannot create", "isinstance", "nothing at runtime", "no runtime", "not enforced", "not checked at runtime", "ignored at runtime"]
          missing_feedback: Describe what each approach actually does when the program runs.
          misconception: {code: hints-enforced-at-runtime, label: Thinks the interpreter enforces type hints at runtime, category: conceptual}
        - id: when-to-choose
          label: Gives a sensible rule for choosing (protocol for types you don't control, ABC for shared behaviour or explicit opt-in)
          weight: 1
          any: ["third party", "can't modify", "cannot modify", "can't change", "cannot change", "don't control", "do not control", "don't own", "do not own", "external", "library", "share implementation", "shared implementation", "default implementation", "share code", "share behaviour", "share behavior", "mixin", "concrete method", "concrete helper", "reuse", "template method", "opt in"]
          missing_feedback: Give a rule of thumb for when each approach is the better choice.

  - slug: typing-generic-return-short
    skill: py-typing
    kind: short_answer
    difficulty: 3
    minutes: 3
    title: What type does a generic function return?
    objective: Predict how a type checker solves a type variable at a call site.
    prompt: |
      ```python
      from collections.abc import Sequence
      from typing import reveal_type


      def first[T](items: Sequence[T]) -> T | None:
          return items[0] if items else None


      name = first(["ada", "grace"])
      reveal_type(name)
      ```

      Which type does a checker such as mypy or pyright reveal for `name`?
      Answer with a type expression.
    hints:
      - "`[\"ada\", \"grace\"]` is inferred as `list[str]`. What does that make `T`?"
      - Substitute `T` into the declared return type; do not drop any part of it.
    explanation: |
      At each call the checker solves the type variable from the arguments:
      `list[str]` matches `Sequence[T]` with `T = str`. Substituting into the
      declared return type `T | None` gives `str | None` (depending on its
      version, mypy spells it `builtins.str | None` or
      `Union[builtins.str, None]`).
      The `None` matters: the checker will insist that you narrow `name`, for
      example with `if name is not None:`, before using it as a string.
      The `def first[T]` syntax is Python 3.12's PEP 695 shorthand for
      declaring `T = TypeVar("T")`.
    content:
      placeholder: e.g. list[int]
      ignore_spaces: true
      accepted:
        - "str | None"
        - "None | str"
        - "Optional[str]"
        - "Union[str, None]"
        - "builtins.str | None"
        - "Union[builtins.str, None]"
      partial:
        - answers: ["str"]
          score: 0.5
          feedback: "Close: `T` is solved as `str`, but the declared return type is `T | None`, so the checker keeps the `None` as well."
      wrong:
        - answers: ["T | None", "T", "Optional[T]"]
          feedback: The checker solves the type variable at each call site. Here the argument is a `list[str]`, so `T` is bound to `str`.
          misconception: {code: typevar-not-solved, label: Thinks type variables stay unsolved at call sites, category: conceptual}
        - answers: ["list[str] | None", "list[str]", "Sequence[str] | None", "Sequence[str]"]
          feedback: "`T` stands for the element type, not the whole sequence: matching `list[str]` against `Sequence[T]` gives `T = str`."
          misconception: {code: typevar-binds-container, label: Binds a type variable to the container instead of its element type, category: logic}
        - answers: ["Any", "object"]
          feedback: Nothing here is untyped. The list literal is inferred as `list[str]`, so `T` is solved precisely.
          misconception: {code: generics-return-any, label: Thinks generic functions lose type information and return Any, category: conceptual}

