  - slug: pytest-flaky-suite-review
    skill: py-testing-pytest
    kind: code_review
    difficulty: 3
    minutes: 10
    tags: [scenario]
    title: Review an intermittently failing test module
    objective: Review tests for order dependence through shared state, reliance on the real clock and a check that can never fail.
    prompt: |
      This test module for the billing code passes locally but fails
      intermittently in CI. `make_invoice` sets `due_date` to 30 days after
      `date.today()`, and `apply_discount` should raise `ValueError` for a
      negative percentage. Review the tests: identify the problems and explain
      how you would fix each one.
    hints:
      - What happens if you run `pytest -k discount`, or the tests run in a random order?
      - The test and `make_invoice` each call `date.today()`. Can they ever disagree?
      - What would the last test do if `apply_discount` accepted -5 without complaint?
    explanation: |
      Reliable tests are independent, deterministic and able to fail. Sharing
      objects through module-level state couples tests to execution order;
      fixtures give each test fresh data. Reading the real clock in both the
      code and the test makes the result depend on when the suite runs; freeze
      or inject the clock instead. And a `try/except ... pass` test passes
      whether or not the exception happens, so it checks nothing:
      `pytest.raises` fails the test when the expected exception is missing.
    solution: |
      **Model answer.**

      1. **Order dependence through shared state.** `test_discount` depends on
         `test_create_invoice` having run first and appended to the
         module-level `INVOICES` list. Run it alone (`pytest -k discount`), in
         random order or in parallel with xdist and it fails with an
         `IndexError`; it also mutates an object another test created. Build
         the invoice in a fixture so each test gets its own.
      2. **The real clock.** The due-date assertion calls `date.today()`
         separately from `make_invoice`; if the test runs across midnight the
         two dates differ and the test fails. Freeze the clock (freezegun,
         time-machine) or inject a `today` parameter.
      3. **A test that cannot fail.** `test_discount_rejects_negative_percent`
         passes even if `apply_discount` accepts -5, because nothing fails
         when no exception is raised. Use `with pytest.raises(ValueError):`.

      ```python
      @pytest.fixture
      def invoice():
          return make_invoice(customer="acme", amount=100)


      def test_discount(invoice):
          apply_discount(invoice, percent=10)
          assert invoice.amount == 90


      def test_discount_rejects_negative_percent(invoice):
          with pytest.raises(ValueError):
              apply_discount(invoice, percent=-5)
      ```
    content:
      language: python
      code: |
        import datetime

        from billing import apply_discount, make_invoice

        INVOICES = []


        def test_create_invoice():
            invoice = make_invoice(customer="acme", amount=100)
            INVOICES.append(invoice)
            assert invoice.due_date == datetime.date.today() + datetime.timedelta(days=30)


        def test_discount():
            invoice = INVOICES[0]
            apply_discount(invoice, percent=10)
            assert invoice.amount == 90


        def test_discount_rejects_negative_percent():
            try:
                apply_discount(make_invoice(customer="acme", amount=100), percent=-5)
            except ValueError:
                pass
      min_words: 40
      max_words: 400
