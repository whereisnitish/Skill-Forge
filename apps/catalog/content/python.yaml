  - slug: perf-set-membership-mcq
    skill: py-performance
    kind: multiple_choice
    difficulty: 3
    minutes: 3
    diagnostic: true
    secondary_skills: [py-data-structures]
    title: Make a slow intersection scale
    objective: Identify the change that turns a quadratic membership loop into a linear one.
    prompt: |
      ```python
      def common_ids(a: list[int], b: list[int]) -> list[int]:
          """Return the IDs in `a` that also appear in `b`, in `a`'s order."""
          return [x for x in a if x in b]
      ```

      Both lists hold about 100,000 IDs and the function takes minutes. Which
      change makes it scale linearly while returning the same result?
    hints:
      - What does `x in b` cost when `b` is a list, and how many times does it run?
      - Look for work that is repeated on every iteration but could be done once.
    explanation: |
      `x in b` on a list scans up to all m elements, and it runs for each of
      the n elements of `a`: O(n · m), up to ten billion comparisons here.
      Building `set(b)` once costs O(m), after which each lookup is O(1) on
      average, so the whole function is O(n + m) and keeps `a`'s order and
      duplicates. Writing `set(b)` *inside* the condition rebuilds it on every
      iteration, which keeps the quadratic cost. Loop syntax and sorting do
      not change the complexity of `in` on a list.
    content:
      multiple: false
      options:
        - id: a
          text: Build `b_set = set(b)` once before the comprehension and test `x in b_set`
          correct: true
          feedback: Correct. One O(m) set construction plus O(1) average lookups gives O(n + m) overall, with the same result.
        - id: b
          text: Write the condition as `if x in set(b)`
          feedback: The condition runs once per element of `a`, so `set(b)` is rebuilt 100,000 times. That is still O(n · m), and slower than before.
          misconception: {code: rebuilds-structure-in-loop, label: Rebuilds an expensive structure inside a loop, category: performance}
        - id: c
          text: Sort `b` first so that `in` can stop early
          feedback: "`in` does not know a list is sorted and still scans it linearly. Sorted data needs `bisect`, and a set is simpler still."
          misconception: {code: in-uses-sorted-order, label: Assumes the in operator exploits sorted order, category: performance}
        - id: d
          text: Replace the comprehension with an explicit `for` loop and `append`
          feedback: A loop does the same work as the comprehension (usually slightly slower). The O(n · m) cost comes from `x in b`, not from the syntax.
          misconception: {code: syntax-changes-complexity, label: Thinks loop syntax changes asymptotic complexity, category: performance}

