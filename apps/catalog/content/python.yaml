  - slug: scope-closure-counter-explain
    skill: py-closures-scope
    kind: concept_explanation
    difficulty: 3
    minutes: 7
    title: Explain how a counter closure works
    objective: Explain what makes a closure, why its captured variable outlives the outer call, and why nonlocal is needed to rebind it.
    prompt: |
      ```python
      def make_counter():
          count = 0

          def increment():
              nonlocal count
              count += 1
              return count

          return increment


      tick = make_counter()
      tick()  # 1
      tick()  # 2
      ```

      Explain in your own words:

      1. what makes `increment` a closure;
      2. why `count` still exists after `make_counter()` has returned;
      3. why the `nonlocal count` line is needed, and what would happen
         without it.
    hints:
      - Which variables does `increment` use that it did not define itself?
      - "`count += 1` is an assignment. Think about what an assignment does to a name's scope by default."
      - Without `nonlocal`, the program fails on the first `tick()`. Which error would you see?
    explanation: |
      A closure is a function together with the variables it uses from the
      scope it was defined in. `increment` refers to `count`, a local variable
      of `make_counter`, so Python stores that variable in a cell that the
      inner function keeps a reference to (visible as `tick.__closure__`).
      That is why `count` lives on after `make_counter` returns and keeps its
      value between calls. Reading an enclosing variable needs no declaration,
      but rebinding it does: `count += 1` is an assignment, which by default
      makes `count` local to `increment` and raises `UnboundLocalError`.
      `nonlocal count` tells Python to rebind the enclosing variable instead.
      Mutating a captured object, such as `items.append(x)`, needs no
      `nonlocal` because the name itself is not rebound.
    solution: |
      **Model answer.** `increment` is a closure because it is a nested
      function that uses `count`, a variable from the enclosing scope of
      `make_counter`. Python stores that variable in a cell that the inner
      function keeps a reference to (`tick.__closure__`), so `count` stays
      alive after `make_counter()` has returned and persists between calls to
      `tick()`. `count += 1` is an assignment, and any assignment inside a
      function makes the name local by default. `nonlocal count` tells Python
      to rebind the variable in the enclosing scope instead. Without it,
      `count` would be treated as a local variable of `increment`, and
      `count += 1` would raise `UnboundLocalError`, because it reads the local
      before anything has been assigned to it.
    content:
