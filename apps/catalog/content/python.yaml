    title: Using a map object twice
    objective: Recognise that iterators such as map objects are exhausted after a single pass.
    prompt: |
      ```python
      numbers = map(int, ["1", "2", "3"])
      total = sum(numbers)
      count = len(list(numbers))
      print(total, count)
      ```

      What does this print?
    hints:
      - "`map` does not return a list. What kind of object is it?"
      - What is left in an iterator after something has looped over all of it?
    explanation: |
      `map` returns an iterator that produces each converted value once.
      `sum(numbers)` consumes all three values, so `list(numbers)` finds the
      iterator already exhausted and builds an empty list, and the output is
      `6 0`. Lists are iterables that hand out a fresh iterator every time you
      loop over them, but `map`, `filter`, `zip`, generators and file objects
      are single-pass. If you need the values twice, materialise them once:
      `numbers = list(map(int, ...))`.
