# System design and technical communication curriculum.
# Skill graph: docs/curriculum-map.md, section "systems.yaml".
# Schema: docs/content-authoring.md.

skills:
  # ------------------------------------------------------------------ system design
  - slug: sd-scalability
    name: Scalability fundamentals
    category: system-design
    difficulty: 2
    review_interval_days: 3
    summary: "Grow capacity by finding the real bottleneck, keeping app servers stateless so they can scale out, and adding caches and read replicas where the load is."
    description: |
      **Scalability** is a system's ability to handle more load — users, requests, data — by adding resources rather than redesigning it. You can *scale up* (a bigger machine: simple, but capped by the largest machine you can buy and still a single point of failure) or *scale out* (more machines behind a load balancer). Scaling out only works when any instance can serve any request, so per-user state such as sessions, uploaded files and local caches has to move to shared stores (a database, Redis, object storage) or to the client.

      Real systems are rarely limited everywhere at once. Back-of-the-envelope estimates (users × requests per user ÷ seconds per day, times a peak factor) tell you whether one database will last for years or needs a plan now, and measurements tell you *which* tier is saturated. Because most products are read-heavy, caching and read replicas often buy more headroom than adding application servers.

      Common pitfalls: scaling before measuring; sizing for the average instead of the peak; keeping state in server memory or on local disk, so a second server breaks logins and uploads; adding app servers until the database runs out of connections (use a connection pooler); and forgetting that caches and replicas serve slightly stale data.
    objectives:
      - Distinguish vertical from horizontal scaling and say when each is appropriate.
      - Identify state that stops an application tier from scaling out and move it to shared storage.
      - Estimate average and peak request rates from user numbers with back-of-the-envelope arithmetic.
      - Propose a staged scaling plan (measure, scale out the app tier, cache, add read replicas) for a read-heavy service.
    prerequisites:
      - skill: http-api-design
        strength: required

  - slug: sd-load-balancing
    name: Load balancing
    category: system-design
    difficulty: 3
    review_interval_days: 3
    summary: "Spread traffic across healthy instances: choose a balancing algorithm, tune health checks and timeouts, and know when retries and session affinity help or hurt."
    description: |
      A **load balancer** sits in front of a pool of servers and decides which one handles each connection or request. A layer-4 balancer works on TCP/UDP connections and never looks inside them; a layer-7 balancer understands HTTP, so it can route by host, path or header, balance individual requests over keep-alive connections and run HTTP health checks. The algorithm matters as much as the layer: round robin spreads request *counts*, least connections (or least outstanding requests) follows the work actually in flight, and hash-based schemes give affinity — the same client or key keeps landing on the same server.

      Load balancing is what makes horizontal scaling, failover and zero-downtime deploys possible. Health checks take failed instances out of rotation, connection draining removes an instance without cutting off in-flight requests, and the balancer itself must be redundant or it becomes the single point of failure it was meant to remove.

      Common pitfalls: health checks so slow that a dead server keeps receiving traffic for minutes, or so "deep" (querying a shared database) that one dependency blip ejects every instance at once; retrying non-idempotent requests and creating duplicates; immediate retries that multiply the load during an overload; and round robin in front of long-lived connections such as WebSockets, where request counts say little about load.
    objectives:
      - Compare round robin, least connections and hash-based balancing and choose one for a given workload.
      - Explain what layer-4 and layer-7 load balancers can see and do.
      - Configure health checks that detect failures quickly without cascading on shared dependencies.
      - Decide when retries through a load balancer are safe, and drain instances cleanly during deploys.
    prerequisites:
      - skill: sd-scalability
        strength: required

  - slug: sd-data-partitioning
    name: Replication & partitioning
    category: system-design
    difficulty: 4
    review_interval_days: 2
    summary: "Replicate data for availability and read throughput, and partition (shard) it for write and storage scale, choosing keys that keep queries local and avoid hot spots."
    description: |
      **Replication** keeps copies of the same data on several nodes. With single-leader replication, writes go to the leader and stream to followers; asynchronous followers can lag behind, so a read from a replica may not show a write that has just succeeded. Synchronous replication avoids that, but makes every write slower and dependent on the replicas being reachable. **Partitioning** (sharding) instead splits the data so each node stores only a subset: by key range (efficient range scans, but sequential keys create hot spots), by a hash of the key (an even spread, but range queries must ask every shard), or through a lookup directory. Consistent hashing, or a fixed set of many logical shards, lets you add nodes while moving only a small fraction of the data.

      A single database eventually runs out of write throughput, storage or acceptable failover time, and the partition key is one of the hardest design decisions to reverse: it decides which queries touch a single shard, where load concentrates and how painful resharding will be. Replication decides what survives a node failure and how stale reads can be.

      Common pitfalls: `hash(key) % N`, which remaps most keys whenever N changes; range-partitioning on timestamps or auto-increment IDs, so every insert lands on one partition; a few very large tenants or celebrity keys overloading their shard; cross-shard joins and transactions; reading your own write from a lagging replica; and treating replicas as backups — they replicate an accidental `DELETE` just as faithfully.
    objectives:
      - Explain single-leader replication and how asynchronous replication lag affects reads.
      - Compare range and hash partitioning and predict where hot spots will appear.
      - Choose a partition key from a workload's access patterns and justify it.
      - Implement a consistent-hashing ring and explain why it moves fewer keys than hash-mod-N.
    prerequisites:
      - skill: sd-scalability
        strength: required
      - skill: sql-indexes
        strength: required
    related: [sd-consistency]

  - slug: sd-consistency
    name: Consistency & CAP trade-offs
    category: system-design
    difficulty: 4
    review_interval_days: 2
    summary: "Reason about what readers can observe in replicated systems: strong vs. eventual consistency, read-your-writes, quorums, and what CAP actually says about network partitions."
    description: |
      A **consistency model** says which values a read may return when data is replicated. *Linearizable* (strong) consistency makes the system behave like a single copy: once a write completes, every later read sees it. *Eventual* consistency only promises that replicas converge once writes stop, so reads in between can be stale. Between the two sit session guarantees such as *read-your-writes* (you always see your own changes) and *monotonic reads* (you never see data go back in time), and causal consistency. Leaderless stores tune this with quorums: with N replicas, W write acknowledgements and R replicas per read, R + W > N makes every read quorum overlap every write quorum.

      The **CAP theorem** says that when a network partition separates replicas, each side must either refuse or delay some requests (keeping consistency) or keep answering with possibly stale data (keeping availability). It is not a free choice of "two out of three": partitions happen whether you choose them or not. When there is no partition, the trade-off is latency versus consistency (the PACELC framing). Real products mix levels: seat reservations and account balances need strong guarantees, while like counts and feeds tolerate staleness.

      Common pitfalls: the "pick two" misreading; assuming a database is strongly consistent in every configuration (reads from asynchronous replicas are not); quorum off-by-one errors (R + W = N does not guarantee overlap) and forgetting caveats such as sloppy quorums; and paying the latency and availability cost of strong consistency for data that never needed it.
    objectives:
      - Distinguish linearizable, eventual and read-your-writes consistency with concrete examples.
      - State what the CAP theorem does and does not claim, including why its trade-off applies during a network partition.
      - Use quorum arithmetic (R + W > N) to decide whether reads are guaranteed to see the latest write.
      - Choose a consistency level per feature of a product and justify it with the business rules.
    prerequisites:
      - skill: sd-data-partitioning
        strength: required

  - slug: sd-rate-limiting
    name: Rate limiting & backpressure
    category: system-design
    difficulty: 3
    review_interval_days: 3
    summary: "Protect services from overload with token-bucket and window rate limiters, clear 429 responses, and backpressure: bounded queues, load shedding and clients that back off."
    description: |
      **Rate limiting** caps how many requests a client — a user, API key or IP address — may make in a period. A *token bucket* holds up to `capacity` tokens and refills at a steady rate, so it allows short bursts while enforcing an average; a *fixed-window counter* is the simplest, but lets a client send up to twice the limit around a window boundary; *sliding-window* logs or counters smooth that out. **Backpressure** is the broader principle: when a component can't keep up, it signals upstream to slow down instead of buffering work without limit.

      Limits protect shared resources from buggy or abusive clients, enforce fair use and pricing tiers, and keep latency predictable under load. Across a fleet of servers the counters must live in a shared store with atomic operations (for example Redis `INCR` or a Lua script), or be approximated per instance. When a client exceeds its limit, respond with `429 Too Many Requests` — or `503 Service Unavailable` when the whole service is shedding load — plus a `Retry-After` header, so well-behaved clients know when to come back.

      Common pitfalls: non-atomic read-modify-write counters that let concurrent requests slip through; limiting by IP when many users share one address behind NAT, or trusting a client-supplied `X-Forwarded-For` header; unbounded in-memory queues that turn a traffic spike into an out-of-memory crash; and clients that retry immediately, multiplying the load exactly when the service is struggling.
    objectives:
      - Implement a token-bucket limiter and explain how capacity and refill rate shape bursts.
      - Compare fixed-window, sliding-window and token-bucket limiters, including the fixed-window boundary burst.
      - Reject excess requests correctly (429 or 503 with Retry-After) and design clients that back off with jitter.
      - Apply backpressure with bounded queues and load shedding instead of unbounded buffering.
    prerequisites:
      - skill: sd-scalability
        strength: required
      - skill: caching-strategies
        strength: required

  # ------------------------------------------------------------------ communication
  - slug: comm-pr-descriptions
    name: Writing clear PR descriptions
    category: communication
    difficulty: 1
    review_interval_days: 4
    summary: "Write pull-request descriptions that tell a reviewer why a change exists, what it does, how it was tested and what could go wrong, before they read a line of the diff."
    description: |
      A **pull-request description** is the reviewer's map of a change. It explains the problem and why it matters (with a link to the ticket or incident), summarises the approach and what changed, shows how the change was verified, and calls out risk: migrations, configuration or behaviour changes, rollout and rollback. A specific title ("Move order exports to a background job to stop timeouts") tells reviewers and future readers what the change does before they open it.

      Reviewers who understand the intent review faster and catch real problems instead of reverse-engineering the diff. The description also outlives the review: months later, someone running `git blame` during an incident relies on it to understand why the code is the way it is.

      Common pitfalls: titles like "fix" or "updates"; describing only *what* changed — which the diff already shows — and never *why*; "tests pass" with no detail; burying a risky change among routine edits; mixing unrelated changes in one PR; and walls of unstructured text where a few short headed sections would do.
    objectives:
      - Write a specific title that summarises the effect of a change.
      - State the problem or motivation and link the relevant ticket or incident.
      - Summarise what changed and point reviewers to the parts that need the most care.
      - Describe how the change was tested and how to verify it.
      - Flag risks, rollout steps and how to roll back.

  - slug: comm-code-review-feedback
    name: Giving code review feedback
    category: communication
    difficulty: 2
    review_interval_days: 3
    summary: "Write review comments that are specific, respectful and actionable: explain the impact, suggest a fix, separate blocking issues from nits, and critique the code rather than the person."
    description: |
      Code review feedback catches defects and spreads knowledge, but only if the author can act on it. An effective comment points at specific code, explains the impact (a bug, a security hole, a performance or maintainability cost), suggests a concrete alternative or asks a genuine question, and signals severity — *blocking*, *suggestion* or *nit* — so the author knows what must change before merging.

      Tone has a real engineering cost. Harsh or vague comments make authors defensive, drag out threads and teach people to avoid asking for review, while rubber-stamp approvals let bugs through. Critiquing the code rather than the person, and saying what is good, keeps reviews fast and honest.

      Common pitfalls: comments about the author ("did you even test this?"); "this is wrong" with no reason or alternative; marking a security issue as a nit, or a personal preference as blocking; burying one critical problem under twenty style nits that a linter or formatter should enforce; and long back-and-forth threads that a five-minute call would settle.
    objectives:
      - Rewrite a harsh or vague review comment so it is specific, respectful and actionable.
      - Explain the impact behind a requested change and offer a concrete alternative.
      - Label comments by severity (blocking, suggestion, nit) and prioritise what matters.
      - Critique the code and its behaviour, not the author.
    prerequisites:
      - skill: comm-pr-descriptions
        strength: required

  - slug: comm-explaining-tradeoffs
    name: Explaining technical trade-offs
    category: communication
    difficulty: 2
    review_interval_days: 3
    summary: "Explain technical options to any audience: frame them by user and business impact, compare cost, risk and time in plain language, and make a clear recommendation."
    description: |
      Almost every engineering decision is a trade-off: ship sooner or build it properly, buy or build, strong consistency or lower latency. Explaining one well means stating the decision that is needed, the realistic options, what each costs and risks in terms the audience cares about — users, revenue, deadlines, risk — and a clear recommendation with its reasoning and what would change it.

      Product managers, executives and customers make or approve many of these decisions. When they can't follow the explanation they delay, decide on gut feeling, or are surprised by costs later; when they can, decisions get made quickly and engineering earns trust.

      Common pitfalls: jargon such as "replica lag" or "p99" without translation; presenting a single option as if there were no choice, or listing options without recommending one; burying the answer under background detail; arguing from technical elegance instead of impact; and false precision — an exact date when the honest answer is a range with conditions.
    objectives:
      - Translate a technical constraint into its impact on users and the business.
      - Present at least two realistic options with their cost, risk and timeline.
      - Make a clear recommendation and explain the reasoning behind it.
      - Adapt vocabulary and level of detail to a non-technical audience.
      - State what is uncertain and what would change the recommendation.
    related: [sd-consistency]

  - slug: comm-incident-updates
    name: Incident communication
    category: communication
    difficulty: 3
    review_interval_days: 3
    summary: "Write incident updates people can act on: what is affected, current status, what is being done, any workaround and when the next update will come, for engineers and customers alike."
    description: |
      During an incident, communication runs in parallel with the fix. Someone — often the incident commander or a dedicated communications lead — posts regular updates to an internal channel and, for customer-facing problems, to a status page. A useful update states the impact (who and what is affected, since when), the current status (investigating, identified, monitoring, resolved), what is being done, any workaround, and when the next update will come.

      Silence or vague updates create a flood of "any news?" messages, duplicated investigations and anxious customers. Precise, regular updates let support answer customers, let account managers warn key customers and let leaders make decisions — and they build trust even when the news is bad.

      Common pitfalls: speculating about a cause that isn't confirmed; naming or blaming individuals (save cause analysis for a blameless post-incident review); downplaying impact ("minor slowness" for a widespread outage); promising fix times nobody can back; internal jargon on a public status page; and going quiet because there is nothing new — "no change, next update at 15:30 UTC" is still an update.
    objectives:
      - Write an incident update that states impact, status, actions, workaround and the next update time.
      - Tailor an incident update to its audience, from the internal incident channel to a public status page.
      - Avoid speculation, blame and unfounded fix-time promises in live updates.
      - Keep a predictable update cadence, including when there is no new information.
    prerequisites:
      - skill: comm-explaining-tradeoffs
        strength: required


challenges:
  # ================================================================== sd-scalability
  - slug: sd-scalability-stateless-sessions-mcq
    skill: sd-scalability
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    title: Users get logged out after adding a second server
    objective: Recognise that scaling out needs a stateless application tier and pick the fix for server-local sessions.
    prompt: |
      A Django app stores sessions as files on each server's local disk:

      ```python
      SESSION_ENGINE = "django.contrib.sessions.backends.file"  # files in the server's temp directory
      ```

      Traffic grew, so you added a second app server behind a round-robin load balancer. Users now report being logged out at random.

      Which change fixes the root cause **and** lets you keep adding servers?
    hints:
      - Ask where a user's session lives, and which server handles that user's next request.
      - A fix that only works while each user keeps hitting the same machine won't survive a deploy or a crashed server.
    explanation: |
      Round robin sends consecutive requests from the same user to different servers, and each server can only read the session files on its own disk — so about half the time the user looks logged out. Scaling out requires that **any instance can serve any request**: per-user state must live somewhere every instance can reach (the database, Redis) or in the client (signed cookies). Sticky sessions and bigger machines hide the symptom but keep the state tied to one machine.
    content:
      multiple: false
      options:
        - id: a
          text: "Store sessions where every server can reach them (the database or Redis), or in signed cookies, so any server can handle any request."
          correct: true
          feedback: "Right — once the app servers are stateless you can add, remove or restart them freely, and the load balancer can send each request anywhere."
        - id: b
          text: "Enable sticky sessions on the load balancer so each user always reaches the same server."
          feedback: "That hides the symptom, but sessions are still lost whenever that server restarts, is redeployed or fails, and a few heavy users can pin their load onto one machine."
          misconception: {code: sticky-sessions-fix-state, label: "Treats sticky sessions as a fix for server-local state", category: conceptual}
        - id: c
          text: "Replace both servers with one larger server."
          feedback: "Scaling up avoids the problem by going back to one machine, but growth is then capped by the biggest machine you can buy, and that machine is a single point of failure."
          misconception: {code: vertical-scaling-only, label: "Reaches for a bigger machine instead of removing what blocks scaling out", category: conceptual}
        - id: d
          text: "Increase the session expiry time."
          feedback: "The sessions aren't expiring — the request reached a server that never had that session file. A longer expiry changes nothing."
          misconception: {code: misreads-session-loss, label: "Misreads lost server-local sessions as expired sessions", category: misread}

  - slug: sd-scalability-peak-rps-estimate
    skill: sd-scalability
    kind: short_answer
    difficulty: 2
    minutes: 4
    tags: [interview]
    title: Estimate peak requests per second
    objective: Convert daily active users and per-user activity into average and peak request rates.
    prompt: |
      A social app has **10 million daily active users**. Each user makes on average **20 API requests per day**. Traffic isn't spread evenly: in the busiest hour the request rate is **3× the daily average**.

      Estimate the **peak** request rate in requests per second, rounded to the nearest thousand. (A day has 86,400 seconds.)
    hints:
      - Work out the total number of requests per day first, then turn it into a per-second rate.
      - The daily average is about 200,000,000 ÷ 86,400 requests per second. Capacity has to cover the busiest hour, not the average.
    explanation: |
      10,000,000 users × 20 requests = 200,000,000 requests per day. Divided by 86,400 seconds that is about **2,315 requests per second on average**; the peak is 3× that, about **6,944 ≈ 7,000 requests per second**.

      Always size capacity for the peak, then add headroom for failures and growth. The popular shortcut "a day is about 100,000 seconds" gives 6,000 — fine for an order of magnitude, but about 14% low.
    solution: |
      ```text
      requests per day = 10,000,000 × 20       = 200,000,000
      average          = 200,000,000 / 86,400  ≈ 2,315 req/s
      peak             = 3 × 2,315             ≈ 6,944 req/s   →  about 7,000 req/s
      ```
    content:
      placeholder: e.g. 12000
      accepted: ["7000", "7,000", "7 000", "7k", "7000 rps", "7,000 rps", "7k rps", "7000 req/s", "7,000 req/s", "7000 requests per second", "7,000 requests per second", "~7000", "~7,000", "~7k", "about 7000", "about 7,000", "approximately 7000", "approximately 7,000"]
      patterns:
        - "(~ ?|about |around |roughly |approx\\.? |approximately )?(7,?000|7 000|7 ?k|6,?9[0-9][0-9](\\.[0-9]+)?)( ?(rps|qps|req/s|requests/s|requests/sec|requests per second|requests a second|per second|/s))?"
      partial:
        - answers: ["6000", "6,000", "6k", "~6000", "~6,000", "~6k", "6000 rps", "6,000 rps", "about 6000", "about 6,000"]
          score: 0.5
          feedback: "Close — that's what the 'a day is about 100,000 seconds' shortcut gives. It undercounts by about 14%: with 86,400 seconds the peak is about 6,900 req/s, which rounds to 7,000."
      wrong:
        - answers: ["2000", "2,000", "2k", "2300", "2,300", "2315", "2,315", "2314", "2,314", "2314.8", "2,314.8", "2.3k", "~2300", "~2,300", "~2k"]
          feedback: "That's the daily average (about 2,315 req/s). Capacity has to cover the busiest hour, so multiply by the 3× peak factor."
          misconception: {code: plans-for-average, label: "Sizes capacity for the average rather than the peak load", category: conceptual}
        - answers: ["167000", "167,000", "166667", "166,667", "166666", "166,666", "167k"]
          feedback: "You divided by 3,600 (the seconds in an hour) instead of 86,400 (the seconds in a day)."
          misconception: {code: estimate-unit-error, label: "Mixes up time units in back-of-the-envelope estimates", category: logic}
        - answers: ["70000", "70,000", "70k", "700", "694", "69444", "69,444"]
          feedback: "Check the order of magnitude: 200 million requests a day is a little over 2,000 per second on average, so the peak is in the thousands."
          misconception: {code: estimate-unit-error, label: "Mixes up time units in back-of-the-envelope estimates", category: logic}

  - slug: sd-scalability-read-heavy-plan
    skill: sd-scalability
    kind: concept_explanation
    difficulty: 3
    minutes: 12
    tags: [interview]
    title: Scale a read-heavy catalogue API for a 5× peak
    objective: Propose an ordered scaling plan for a read-heavy service and name the trade-offs it introduces.
    prompt: |
      You own a product-catalogue API. Today **one VM runs both the Django app and PostgreSQL**. About **95% of requests are reads** (product pages, category listings, search); writes come from a small team of admins editing products.

      The VM already reaches 90% CPU at peak, and the Black Friday sale is expected to bring **5× today's peak traffic**.

      Describe, in order, how you would scale this system. Say what you would do first, why, and what trade-offs your changes introduce.
    hints:
      - Before changing the architecture, how would you find out which part is actually using the CPU?
      - Think separately about the application tier and the database tier — and about what a 95% read share makes cheap.
      - Every copy of the data you add (caches, replicas) can be slightly out of date. How would you handle that?
    explanation: |
      A good plan starts by **measuring** where the CPU goes, then separates the tiers so the app and database stop competing for one machine. The **app tier scales out** once it is stateless (sessions and files in shared storage) behind a load balancer. With 95% reads, **caching** (a CDN for pages and images, Redis for hot queries) usually removes most of the load, and **read replicas** spread the remaining reads. The price is **staleness**: caches and asynchronous replicas can serve old data, so you bound it with TTLs, invalidate on writes, and read from the primary right after a write when it matters.
    solution: |
      1. **Measure first.** Use metrics, APM and `pg_stat_statements` (or a load test that replays production traffic) to see whether the CPU is spent in Django or in PostgreSQL and which endpoints and queries dominate. Fix obviously slow queries (missing indexes, N+1 queries) before buying hardware.
      2. **Separate the tiers.** Move PostgreSQL to its own server (or a managed database) so the app and the database stop competing for CPU.
      3. **Scale the app tier out.** Make the Django servers stateless (sessions and uploads in shared storage) and run several instances behind a load balancer, with autoscaling for the sale.
      4. **Cache the reads.** Put a CDN in front of product pages and images with sensible `Cache-Control` headers, and cache hot catalogue queries in Redis. With 95% reads, this takes most of the load off the database.
      5. **Add read replicas** if the database is still the bottleneck: route read-only queries to replicas and keep writes on the primary, with a connection pooler such as PgBouncer in front.

      **Trade-offs:** cached pages and replicas can serve stale data (TTL expiry, replica lag), so I would invalidate cache entries when admins edit a product and read from the primary straight after a write. There are also more moving parts to monitor and pay for, so I would load-test the new setup at 5× before the sale.
    content:
      min_words: 60
      max_words: 450
      placeholder: "1. First I would … because …"
      criteria:
        - id: measure-first
          label: Measures to find the actual bottleneck before changing the architecture
          weight: 1
          any: ["measur", "metric", "profil", "bottleneck", "monitor", "load test", "benchmark", "apm", "observab", "flame graph", "slow quer", "pg_stat_statements", "explain analy", "find out where", "find out which", "re:\\bwhich (part|component|tier|query|queries|endpoint)"]
          missing_feedback: "Start by finding out where the CPU goes (app or database, which endpoints and queries) with metrics, profiling or a load test — otherwise you may scale the wrong tier."
          misconception: {code: scale-before-measuring, label: "Scales components without identifying the bottleneck", category: incomplete}
        - id: scale-out-app-tier
          label: Separates the database and scales the stateless app tier horizontally behind a load balancer
          weight: 2
          required: true
          any: ["horizontal", "scale out", "scaling out", "scale it out", "load balanc", "more app servers", "more application servers", "more servers", "more web servers", "additional servers", "additional app", "multiple app", "multiple servers", "multiple instances", "several instances", "several app", "more instances", "stateless", "autoscal", "auto scal", "separate the database", "separate database", "separate server", "own server", "own machine", "dedicated database", "move the database", "move postgres", "managed database"]
          missing_feedback: "Move the database onto its own machine and run several stateless app instances behind a load balancer, so the app tier can grow horizontally instead of being capped by one VM."
          misconception: {code: vertical-scaling-only, label: "Reaches for a bigger machine instead of removing what blocks scaling out", category: conceptual}
        - id: caching
          label: Caches read-heavy responses (CDN, HTTP caching or an in-memory cache such as Redis)
          weight: 2
          any: ["cach", "cdn", "redis", "memcache", "varnish", "content delivery"]
          missing_feedback: "With 95% reads, caching — a CDN for product pages and images, Redis or memcached for hot queries — is usually the biggest and cheapest win."
        - id: read-replicas
          label: Offloads database reads to read replicas
          weight: 1
          any: ["replica", "replicat", "follower", "secondary", "secondaries", "standby"]
          missing_feedback: "If the database is still the bottleneck, read replicas spread the read load over several copies while writes stay on the primary."
        - id: staleness-tradeoff
          label: Names the cost of the extra copies — stale data from caches or replica lag — and how to manage it
          weight: 1
          any: ["stale", "lag", "invalidat", "eventual", "out of date", "outdated", "ttl", "expir", "consisten", "old data", "older data", "behind the primary"]
          missing_feedback: "Caches and replicas serve slightly old data. Say how you would bound the staleness: TTLs, invalidating on writes, reading from the primary right after a write."
          misconception: {code: ignores-staleness, label: "Ignores the staleness that caches and replicas introduce", category: incomplete}

  # ================================================================== sd-load-balancing
  - slug: sd-load-balancing-algorithm-mcq
    skill: sd-load-balancing
    kind: multiple_choice
    difficulty: 3
    minutes: 3
    diagnostic: true
    title: Pick a balancing algorithm for mixed request costs
    objective: Choose a load-balancing algorithm that accounts for requests of very different cost.
    prompt: |
      An API runs on **6 identical servers** behind a load balancer. Most requests finish in about 20 ms, but report exports take 20–60 seconds.

      With round-robin balancing, some servers end up with several slow exports in progress while others are almost idle, and p99 latency spikes.

      Which balancing strategy fits this workload best?
    hints:
      - Round robin balances the *number* of requests. Is that the same as balancing the work?
      - Look for a strategy that reacts to what each server is doing right now.
    explanation: |
      Round robin and random selection distribute request **counts**, not **work**. When request costs vary widely, a strategy that tracks in-flight load — least connections, least outstanding requests, or "power of two choices" — steers new requests away from servers busy with slow exports. The structural fix is to move long-running exports to a background job queue so they don't share capacity with fast requests at all.
    content:
      multiple: false
      options:
        - id: a
          text: "Least connections (least outstanding requests): send each new request to the server with the fewest requests in flight."
          correct: true
          feedback: "Right — a server stuck on long exports has more requests in flight, so it receives fewer new ones. Moving exports to a background queue would be the long-term fix."
        - id: b
          text: "Weighted round robin, with each server's weight set from its CPU count."
          feedback: "The servers are identical, so every weight would be the same — that is plain round robin, which still ignores how much work each server is doing."
          misconception: {code: rr-assumes-equal-cost, label: "Assumes round robin balances load when request costs vary", category: conceptual}
        - id: c
          text: "IP hash, so each client always reaches the same server."
          feedback: "Hashing gives affinity, not balance: a client that runs many exports keeps landing on the same server, and the choice still ignores in-flight work."
          misconception: {code: affinity-is-balancing, label: "Confuses session affinity with load balancing", category: conceptual}
        - id: d
          text: "Random selection, so the load evens out statistically."
          feedback: "Random selection evens out request counts on average, just like round robin, so it is just as blind to which servers are busy with slow requests."
          misconception: {code: rr-assumes-equal-cost, label: "Assumes round robin balances load when request costs vary", category: conceptual}

  - slug: sd-load-balancing-config-review
    skill: sd-load-balancing
    kind: code_review
    difficulty: 3
    minutes: 12
    tags: [scenario]
    title: Review a load-balancer config for the checkout service
    objective: Identify health-check and retry settings that cause slow recovery, cascading outages or duplicate side effects.
    prompt: |
      A teammate opened a PR adding this load-balancer configuration for the **checkout service** (three app servers sharing one PostgreSQL primary; checkout calls a payment provider). The file uses a vendor-neutral format.

      Review it. Identify the settings that could cause outages, duplicate side effects or slow recovery, explain the impact of each, and say what you would change.
    hints:
      - Work out how long a crashed backend keeps receiving traffic with these health-check settings.
      - What happens to the whole pool if the shared database has a 30-second blip?
      - A timeout tells you that you didn't get an answer — not that nothing happened.
    explanation: |
      Four problems stand out. **Detection is slow**: 120 s × 10 failures leaves a dead backend in rotation for up to 20 minutes. **The health check is deep**: it depends on the shared database and the payment provider, so one dependency blip fails the check on every backend at once and the balancer ejects the whole pool. **POST is retried**: a timed-out POST may already have created the order or charged the card, so retrying can duplicate it — retry only idempotent requests or require idempotency keys. **Retries amplify overload**: five immediate retries can multiply the load up to six-fold exactly when backends are struggling; use few retries with exponential backoff and jitter, or a retry budget.
    solution: |
      1. **Failed backends stay in rotation for ~20 minutes.** `interval_seconds: 120` × `unhealthy_threshold: 10` means a dead server keeps receiving traffic for up to 20 minutes. Use a 5–10 s interval with a threshold of 2–3, plus passive outlier detection on real traffic.
      2. **The health check depends on shared dependencies.** `/health` queries the shared primary and calls the payment provider, so a brief database or provider blip fails the check on all three backends at once and the load balancer ejects the whole pool — a total outage instead of a degraded checkout. Make the balancer's check test the instance itself (process up, able to serve requests) and monitor dependencies separately, so a dependency problem degrades checkout instead of removing every server.
      3. **POST is retried on timeout.** A timeout doesn't mean the request failed — the first attempt may already have created the order or charged the card, so retrying POST can duplicate side effects. Only retry idempotent requests (GET, and PUT/DELETE only if our handlers really are idempotent), or require an idempotency key before POST can be retried.
      4. **Five immediate retries amplify an overload.** Timeouts and 5xx responses often mean the backends are overloaded; up to six attempts per request multiplies the load exactly when they are struggling (a retry storm). Allow one or two retries at most, with exponential backoff and jitter or a retry budget, and don't retry 503s that signal overload.
    content:
      language: yaml
      code: |
        # checkout-service load balancer
        listener:
          port: 443
          tls: terminate
        algorithm: least_outstanding_requests
        backends:
          - checkout-1:8000
          - checkout-2:8000
          - checkout-3:8000
        health_check:
          path: /health          # handler runs SELECT 1 on the shared primary DB
                                 # and calls the payment provider's status API;
                                 # returns 500 if either fails
          interval_seconds: 120
          unhealthy_threshold: 10
        retries:
          attempts: 5            # retried immediately, no backoff
          on: [timeout, connect_failure, 5xx]
          methods: [GET, POST, PUT, DELETE]
        timeouts:
          backend_seconds: 30
      min_words: 40
      max_words: 450
      placeholder: List each problem, its impact and your fix…
      criteria:
        - id: slow-detection
          label: Notices that a failed backend stays in rotation for up to 20 minutes (120 s × 10)
          weight: 1
          any: ["20 min", "twenty min", "1200", "1,200", "too slow", "slow to detect", "slow detection", "detect", "interval", "threshold", "too long", "takes too long", "minutes before"]
          missing_feedback: "Work out how long a dead backend stays in rotation: 120 s × 10 failed checks = 20 minutes. Use a short interval (seconds) and a small threshold."
          misconception: {code: slow-health-checks, label: "Accepts health checks that take minutes to remove a failed backend", category: logic}
        - id: deep-health-check
          label: Spots that the health check depends on shared dependencies, so one database or provider blip marks every backend unhealthy at once
          weight: 2
          any: ["shared", "dependenc", "depends on", "all three", "all backends", "all the backends", "every backend", "all servers", "all the servers", "every server", "all instances", "every instance", "whole pool", "entire pool", "cascad", "deep health", "deep check", "liveness", "readiness", "database blip", "db blip", "database is down", "db is down", "database goes down", "db goes down"]
          missing_feedback: "What happens to the pool if the shared database or the payment provider has a 30-second blip? A health check should test the instance itself, not shared dependencies, or every backend fails together."
          misconception: {code: deep-health-check-cascade, label: "Makes health checks depend on shared dependencies", category: conceptual}
        - id: non-idempotent-retry
          label: Flags that retrying POST on timeout can duplicate side effects such as orders or charges
          weight: 2
          required: true
          any: ["idempoten", "duplicat", "double charg", "double order", "charged twice", "charge twice", "charging twice", "twice", "re:\\bposts?\\b", "side effect"]
          missing_feedback: "A timed-out POST may already have charged the card. Only retry idempotent requests, or require idempotency keys before a POST can be retried."
          misconception: {code: retries-always-safe, label: "Assumes retrying a failed request is always safe", category: conceptual}
        - id: retry-amplification
          label: Notes that five immediate retries amplify load on struggling backends (needs backoff, jitter or a retry budget)
          weight: 1
          any: ["backoff", "back off", "jitter", "retry storm", "storm", "amplif", "budget", "thundering", "overload", "re:\\bmultipl(y|ies|ied|ying)\\b", "6x", "6×", "6 times", "six times", "5x", "five times", "exponential", "hammer"]
          missing_feedback: "When backends time out because they're overloaded, five immediate retries multiply the load. Use fewer attempts with exponential backoff and jitter, or a retry budget."
          misconception: {code: retry-amplification, label: "Overlooks how retries amplify load during an overload", category: performance}

  - slug: sd-load-balancing-websocket-deploys
    skill: sd-load-balancing
    kind: concept_explanation
    difficulty: 3
    minutes: 12
    tags: [interview]
    title: Load-balance a chat service with WebSockets and rolling deploys
    objective: Choose a load-balancer layer and algorithm for mixed HTTP and WebSocket traffic, and explain how to deploy without dropping users.
    prompt: |
      A chat service runs on 8 servers. It serves a REST API under `/api` (short HTTPS requests) and real-time messaging under `/ws` (WebSocket connections that stay open for hours). The team deploys several times a day with a rolling deploy.

      Explain:

      1. whether you would use a layer-4 or a layer-7 load balancer, and why;
      2. how you would balance the WebSocket connections;
      3. how you would deploy without dropping users or overloading the remaining servers.
    hints:
      - Which layer can see the URL path?
      - A WebSocket is one long connection. What does "load" mean for a server holding thousands of them?
      - Think about what happens to the clients connected to a server you are about to stop — and what they all do next.
    explanation: |
      Routing `/api` and `/ws` differently needs a **layer-7** balancer, because only an HTTP-aware balancer can see the path. WebSockets are balanced **per connection**, and each connection stays on its server for hours, so **least connections** tracks the real load far better than round robin; expect new servers to start empty after a deploy. For deploys, **drain** each instance (stop sending it new connections, let in-flight requests finish, close WebSockets gracefully), make clients **reconnect with exponential backoff and jitter** so they don't stampede the remaining servers, and only admit new instances once their **readiness** check passes.
    solution: |
      **Layer 7.** I'd use an HTTP-aware (layer 7) load balancer: it can see the path, so it routes `/api` and `/ws` to the right target groups, handles the WebSocket upgrade and runs HTTP health checks. A layer-4 balancer only sees TCP connections and can't route by path.

      **Balancing WebSockets.** Each WebSocket is a long-lived connection that stays on the server that accepted it, so a server's load is its number of open connections, not its request count. I'd use least connections for `/ws`; round robin would leave servers unbalanced. After a deploy or scale-out the new servers start empty, so balance only recovers as clients reconnect.

      **Deploys.** Roll one server (or a small batch) at a time. For each one, deregister it and drain it: the balancer stops sending it new connections, in-flight API requests finish, and the server closes its WebSockets gracefully with a close frame. Clients reconnect with exponential backoff plus random jitter, so thousands of them don't stampede the remaining servers at the same instant. The new version only joins the pool once its readiness check passes.
    content:
      min_words: 60
      max_words: 450
      placeholder: "1. Layer … because …"
      criteria:
        - id: layer-7-routing
          label: Chooses a layer-7 (HTTP-aware) balancer because it can route by path
          weight: 2
          required: true
          any: ["l7", "layer 7", "layer seven", "re:\\blayer\\s*7\\b", "application layer", "application load balancer", "http aware", "http level", "path based", "by path", "url path", "the path", "routing rule", "host based"]
          missing_feedback: "Only a layer-7 (HTTP-aware) balancer can see the path, so it can send /api and /ws to the right place and run HTTP health checks; a layer-4 balancer just forwards TCP connections."
          misconception: {code: l4-l7-confusion, label: "Confuses what layer-4 and layer-7 load balancers can see", category: conceptual}
        - id: long-lived-connections
          label: Explains that WebSockets are balanced per long-lived connection, so least connections fits and imbalance appears after deploys
          weight: 2
          any: ["least conn", "least connection", "fewest conn", "fewest open", "fewest active", "connection count", "open connections", "number of connections", "long lived", "long running", "persistent", "per connection", "imbalanc", "unbalanc", "uneven", "rebalanc"]
          missing_feedback: "A WebSocket stays on the server that accepted it for hours, so balance by open connections (least connections) and expect new servers to start empty after a deploy."
          misconception: {code: rr-assumes-equal-cost, label: "Assumes round robin balances load when request costs vary", category: conceptual}
        - id: connection-draining
          label: Drains instances before stopping them so in-flight requests finish and WebSockets close gracefully
          weight: 2
          any: ["drain", "deregist", "graceful", "in flight", "inflight", "in progress", "stop sending new", "no new connections", "no new requests", "stop accepting", "stops accepting", "remove it from the pool", "take it out of", "close frame", "finish their", "let them finish", "let existing"]
          missing_feedback: "Before stopping an instance, take it out of rotation and drain it: no new connections, in-flight requests finish, WebSockets are closed gracefully."
          misconception: {code: hard-stop-deploys, label: "Stops instances without draining in-flight work", category: incomplete}
        - id: reconnect-stampede
          label: Avoids a reconnection stampede (client backoff with jitter, small deploy batches)
          weight: 1
          any: ["jitter", "backoff", "back off", "stagger", "thundering", "stampede", "herd", "reconnect storm", "spread out", "spread the reconnect", "random delay", "randomi", "one at a time", "one server at a time", "a few at a time", "small batch", "in batches"]
          missing_feedback: "When a server closes thousands of WebSockets at once, clients should reconnect with exponential backoff and random jitter, and you should restart only a few servers at a time."
          misconception: {code: retry-amplification, label: "Overlooks how retries amplify load during an overload", category: performance}
        - id: readiness-checks
          label: Only adds new instances to the pool after they pass a health or readiness check
          weight: 1
          any: ["health check", "healthcheck", "health probe", "readiness", "ready", "warm up", "warmed up", "warm"]
          missing_feedback: "Let new instances join the pool only after they pass a readiness check, so the deploy never routes users to a server that can't serve yet."

