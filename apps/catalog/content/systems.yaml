  - slug: sd-partitioning-mod-n-mcq
    skill: sd-data-partitioning
    kind: multiple_choice
    difficulty: 3
    minutes: 3
    diagnostic: true
    title: What happens when hash-mod-N gets one more node?
    objective: Predict how many keys move when a hash-mod-N cluster grows by one node.
    prompt: |
      A cache cluster picks the node for each key with:

      ```python
      node = nodes[hash(key) % len(nodes)]
      ```

      It has **4 nodes** and you add a **5th**. Assuming the hash spreads keys uniformly, roughly what fraction of the keys now map to a **different node** than before?
    hints:
      - A key stays where it is only if `hash % 4` and `hash % 5` happen to be equal.
      - Try the hash values 0 to 19. For how many of them are the two remainders the same?
    explanation: |
      A key keeps its node only when `h % 4 == h % 5`. Out of every 20 consecutive hash values that happens for just 4 of them (those congruent to 0, 1, 2 or 3 modulo 20, by the Chinese remainder theorem), so about **20% of keys stay and 80% move** — in a cache, that is a sudden mass of misses hitting the database. **Consistent hashing** (or a fixed number of logical partitions mapped to nodes) moves only about 1/N of the keys — here about 20% — and all of them to the new node.
    content:
      multiple: false
      options:
        - id: a
          text: "About 80%: almost every key's `hash % 5` differs from its `hash % 4`."
          correct: true
          feedback: "Right — only hash values whose remainders mod 4 and mod 5 agree (4 out of every 20) stay put. This is why hash-mod-N clusters are painful to resize."
        - id: b
          text: "About 20%: only the keys that belong on the new node move."
          feedback: "That's what consistent hashing achieves — about 1/N of keys move, all to the new node. With modulo placement, changing N reshuffles almost everything."
          misconception: {code: mod-n-rehash, label: "Assumes hash-mod-N only moves the new node's share of keys", category: conceptual}
        - id: c
          text: "None: existing keys stay where they are and only new keys use the 5th node."
          feedback: "The formula is recomputed on every lookup, so existing keys immediately map elsewhere — and lookups miss until the data is moved or refilled."
          misconception: {code: placement-is-sticky, label: "Thinks existing keys keep their placement when the node count changes", category: conceptual}
        - id: d
          text: "It depends mainly on the quality of the hash function; a good one keeps movement small."
          feedback: "A good hash makes the remapping *uniform*, not small: the modulus itself changed, so most keys get a different remainder whatever hash you use."
          misconception: {code: hash-quality-fixes-remap, label: "Thinks a better hash function avoids remapping when nodes change", category: conceptual}

  - slug: sd-partitioning-consistent-hash-ring
    skill: sd-data-partitioning
    kind: python_code
    difficulty: 4
    minutes: 25
    tags: [interview]
    title: Build a consistent-hashing ring with virtual nodes
    objective: Implement consistent hashing with virtual nodes so that membership changes move only a small share of keys.
    prompt: |
      A cache cluster currently picks a node with `hash(key) % len(nodes)`, so adding a single node reshuffles most keys. Replace it with a **consistent-hashing ring** with virtual nodes.

      Implement `HashRing`:

      - `HashRing(nodes=(), vnodes=100)` places each node at `vnodes` points on the ring: virtual node `i` of node `n` sits at position `stable_hash(f"{n}#{i}")`, for `i` in `range(vnodes)`.
      - `get_node(key)` returns the node that owns the first position **clockwise** from the key: the smallest position `>= stable_hash(key)`, wrapping around to the smallest position on the ring when there is none. Return `None` if the ring is empty.
      - `add_node(node)` and `remove_node(node)` change membership. Adding a node that is already on the ring, or removing one that isn't, does nothing.

      Use the provided `stable_hash` (Python's built-in `hash()` of a string changes from one process to the next) and keep lookups fast with `bisect` rather than scanning every position.
    hints:
      - Keep the ring as a sorted list of positions, plus a way to find which node owns each position.
      - "`bisect.bisect_left(positions, h)` gives the index of the first position `>= h`. What should happen when it returns `len(positions)`?"
      - When removing a node, recompute its `vnodes` positions with the same formula and delete exactly those.
    explanation: |
      Consistent hashing puts nodes and keys on the same hash ring and gives each key to the next node clockwise. Adding or removing a node only affects the keys on the arcs next to that node's positions — about 1/N of all keys — whereas `hash(key) % N` remaps most keys whenever N changes. Virtual nodes give every physical node many small arcs, which evens out the load and spreads a departing node's keys over all the survivors instead of dumping them on one neighbour.
    solution: |
      Keep a dictionary from ring position to node plus a sorted list of the positions. Adding a node inserts its `vnodes` positions; removing it deletes them. A lookup hashes the key and uses `bisect_left` to find the first position `>=` the hash — `bisect_left` rather than `bisect_right`, so a key that hashes exactly onto a position belongs to that position — and wraps to index 0 past the end of the list.

      ```python
      import bisect
      import hashlib


      def stable_hash(value):
          return int.from_bytes(hashlib.md5(value.encode("utf-8")).digest()[:8], "big")


      class HashRing:
          def __init__(self, nodes=(), vnodes=100):
              self.vnodes = vnodes
              self._owners = {}      # ring position -> node
              self._positions = []   # sorted ring positions
              self._nodes = set()
              for node in nodes:
                  self.add_node(node)

          def _node_positions(self, node):
              return [stable_hash(f"{node}#{i}") for i in range(self.vnodes)]

          def add_node(self, node):
              if node in self._nodes:
                  return
              self._nodes.add(node)
              for position in self._node_positions(node):
                  self._owners[position] = node
              self._positions = sorted(self._owners)

          def remove_node(self, node):
              if node not in self._nodes:
                  return
              self._nodes.discard(node)
              for position in self._node_positions(node):
                  if self._owners.get(position) == node:
                      del self._owners[position]
              self._positions = sorted(self._owners)

          def get_node(self, key):
              if not self._positions:
                  return None
              index = bisect.bisect_left(self._positions, stable_hash(key))
              if index == len(self._positions):
                  index = 0  # wrap around the ring
              return self._owners[self._positions[index]]
      ```

      When a node joins, it takes over only the arcs just before its own positions, so roughly 1/N of the keys move — all of them to the new node. Re-sorting on every membership change is fine because changes are rare and lookups are O(log n).
    content:
      starter_code: |
        import bisect
        import hashlib


        def stable_hash(value):
            """Deterministic 64-bit hash of a string (do not change)."""
            return int.from_bytes(hashlib.md5(value.encode("utf-8")).digest()[:8], "big")


        class HashRing:
            def __init__(self, nodes=(), vnodes=100):
                self.vnodes = vnodes
                self.nodes = []
                for node in nodes:
                    self.add_node(node)

            def add_node(self, node):
                if node not in self.nodes:
                    self.nodes.append(node)

            def remove_node(self, node):
                if node in self.nodes:
                    self.nodes.remove(node)

            def get_node(self, key):
                # TODO: replace hash-mod-N with a consistent-hashing ring.
                if not self.nodes:
                    return None
                return self.nodes[stable_hash(key) % len(self.nodes)]
      reference_solution: |
        import bisect
        import hashlib


        def stable_hash(value):
            """Deterministic 64-bit hash of a string (do not change)."""
            return int.from_bytes(hashlib.md5(value.encode("utf-8")).digest()[:8], "big")


        class HashRing:
            def __init__(self, nodes=(), vnodes=100):
                if vnodes < 1:
                    raise ValueError("vnodes must be at least 1")
                self.vnodes = vnodes
                self._owners = {}      # ring position -> node
                self._positions = []   # sorted ring positions
                self._nodes = set()
                for node in nodes:
                    self.add_node(node)

            def _node_positions(self, node):
                return [stable_hash(f"{node}#{i}") for i in range(self.vnodes)]

            def add_node(self, node):
                if node in self._nodes:
                    return
                self._nodes.add(node)
                for position in self._node_positions(node):
                    self._owners[position] = node
                self._positions = sorted(self._owners)

            def remove_node(self, node):
                if node not in self._nodes:
                    return
                self._nodes.discard(node)
                for position in self._node_positions(node):
                    if self._owners.get(position) == node:
                        del self._owners[position]
                self._positions = sorted(self._owners)

            def get_node(self, key):
                if not self._positions:
                    return None
                index = bisect.bisect_left(self._positions, stable_hash(key))
                if index == len(self._positions):
                    index = 0  # wrap around the ring
                return self._owners[self._positions[index]]
    tests:
      - name: an empty ring returns None
        code: |
          assert HashRing().get_node("user:1") is None
          ring = HashRing(["a"])
          ring.remove_node("a")
          assert ring.get_node("user:1") is None
      - name: keys go to the first virtual node clockwise
        code: |
          def expected(nodes, vnodes, key):
              points = sorted((stable_hash(f"{n}#{i}"), n) for n in nodes for i in range(vnodes))
              h = stable_hash(key)
              for position, node in points:
                  if position >= h:
                      return node
              return points[0][1]

          ring = HashRing(["a", "b", "c"], vnodes=10)
          for i in range(200):
              key = f"key-{i}"
              assert ring.get_node(key) == expected(["a", "b", "c"], 10, key), key
      - name: adding a node only moves keys onto the new node
        code: |
          ring = HashRing(["a", "b", "c", "d"])
          keys = [f"user:{i}" for i in range(2000)]
          before = {k: ring.get_node(k) for k in keys}
          ring.add_node("e")
          moved = [k for k in keys if ring.get_node(k) != before[k]]
          assert all(ring.get_node(k) == "e" for k in moved), "keys may only move to the new node"
          share = len(moved) / len(keys)
          assert 0.1 < share < 0.35, f"{share:.0%} of keys moved; expected roughly 1/5"
      - name: removing a node only moves that node's keys
        hidden: true
        code: |
          ring = HashRing(["a", "b", "c", "d", "e"])
          keys = [f"user:{i}" for i in range(2000)]
          before = {k: ring.get_node(k) for k in keys}
          ring.add_node("a")  # already present: must change nothing
          assert all(ring.get_node(k) == before[k] for k in keys)
          ring.remove_node("c")
          ring.remove_node("zzz")  # unknown node: must change nothing
          for k in keys:
              now = ring.get_node(k)
              assert now != "c", "a removed node must not own keys"
              if before[k] != "c":
                  assert now == before[k], "keys on other nodes must not move"
      - name: a key that hashes exactly onto a virtual node belongs to it
        hidden: true
        code: |
          ring = HashRing(["a", "b", "c"], vnodes=5)
          for n in ["a", "b", "c"]:
              for i in range(5):
                  assert ring.get_node(f"{n}#{i}") == n
      - name: keys past the last position wrap around to the first
        hidden: true
        code: |
          ring = HashRing(["a", "b"], vnodes=1)
          positions = {stable_hash("a#0"): "a", stable_hash("b#0"): "b"}
          top = max(positions)
          key = next(f"k{i}" for i in range(100000) if stable_hash(f"k{i}") > top)
          assert ring.get_node(key) == positions[min(positions)]

  - slug: sd-partitioning-shard-key-design
    skill: sd-data-partitioning
    kind: concept_explanation
    difficulty: 4
    minutes: 15
    tags: [interview]
    title: Choose a shard key for a multi-tenant events table
    objective: Evaluate a time-range sharding proposal and design a partitioning scheme that fits the access pattern and handles skewed tenants.
    prompt: |
      You are sharding the `events` table of a multi-tenant analytics SaaS. It holds about 5 billion rows and grows by about 50 million rows a day; writes are about 70% of database traffic.

      - Almost every query is *"events for tenant X between two timestamps"*.
      - A handful of enterprise tenants produce about 30% of all events.

      A teammate proposes **range-partitioning the shards by `created_at`** "so old months are easy to archive".

      Evaluate the proposal and propose a partitioning scheme. Cover where writes go, how the main query is served, hot spots, and what happens when you need to add shards.
    hints:
      - Under the teammate's scheme, which shard does a brand-new event go to?
      - Pick the key so that the most common query touches as few shards as possible.
      - A few tenants are much bigger than the rest. What does that do to the shards they land on?
    explanation: |
      Range-partitioning on a timestamp is a classic **write hot spot**: every new row has the newest `created_at`, so all inserts hit the latest shard. Since queries are always scoped to one tenant, partition by **tenant** (a hash of `tenant_id`), so the main query is served by a single shard and writes spread evenly. **Skewed tenants** need special handling — dedicated shards or splitting a large tenant over several sub-buckets. Time can still organise data *inside* each shard (an index on `(tenant_id, created_at)` and monthly sub-partitions for archiving), and hashing into many **logical shards** or using consistent hashing keeps future resharding cheap.
    solution: |
      **The proposal creates a write hot spot.** Every new event has the newest `created_at`, so with range partitioning by time all inserts — about 50 million a day, 70% of the traffic — land on the latest shard while the others sit idle. Reads concentrate there too, since recent data is typically what dashboards ask for, and every time-range shard mixes all tenants together.

      **Partition by tenant instead.** Use a hash of `tenant_id` as the partition key. "Events for tenant X between two timestamps" then goes to a single shard, and hashing spreads the tenants' writes evenly across shards.

      **Handle the big tenants.** The few enterprise tenants producing about 30% of events would make their shards hot, so I'd split them: key on `(tenant_id, bucket)` with, say, 16 sub-buckets for each large tenant, or give them dedicated shards through a directory (lookup table). A query for such a tenant fans out only to its own buckets.

      **Keep time inside each shard.** Within each shard, keep a composite index on `(tenant_id, created_at)` and monthly sub-partitions, so the main query is an index range scan and old months can be detached and archived cheaply — which gives the teammate what they wanted.

      **Adding shards.** Hash into a large fixed number of logical shards (say 1,024) mapped to physical nodes through the directory, or use consistent hashing, so adding a node means moving a few logical shards rather than rehashing every row.
    content:
      min_words: 80
      max_words: 500
      placeholder: Evaluate the proposal, then describe your scheme…
      criteria:
        - id: time-range-hot-spot
          label: Explains that range-partitioning by created_at sends every new write to the latest shard (a write hot spot)
          weight: 2
          required: true
          any: ["hot spot", "hotspot", "hot shard", "hot partition", "hot node", "latest shard", "latest partition", "newest shard", "newest partition", "current shard", "current partition", "last shard", "last partition", "most recent shard", "most recent partition", "monoton", "all writes", "all new writes", "all inserts", "all the writes", "every insert", "every new event", "every new row", "re:\\b(writes?|inserts?)\\b[^.]{0,60}\\b(same|one|single)\\s+(shard|partition|node)"]
          missing_feedback: "With time-range partitioning every new event has the latest timestamp, so 100% of the writes hit the newest shard while the others sit idle."
          misconception: {code: monotonic-range-key, label: "Range-partitions on a monotonically increasing key", category: performance}
        - id: tenant-key
          label: Partitions by tenant (for example a hash of tenant_id) so the main query is served by one shard
          weight: 2
          any: ["tenant_id", "tenant id", "by tenant", "per tenant", "tenant as the", "tenant as a", "tenant key", "tenant hash", "hash of the tenant", "hash the tenant", "hashing the tenant", "hash of tenant", "hashed tenant", "single shard", "one shard", "same shard", "co locat", "colocat"]
          missing_feedback: "Use the tenant as (the leading part of) the partition key, hashed to spread tenants evenly; then 'tenant X between two timestamps' is served by one shard."
