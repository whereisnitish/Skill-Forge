  # ================================================================== sd-consistency
  - slug: sd-consistency-cap-partition-mcq
    skill: sd-consistency
    kind: multiple_choice
    difficulty: 3
    minutes: 3
    diagnostic: true
    title: What CAP says when the link between data centres fails
    objective: Apply the CAP theorem to a replicated system during a network partition.
    prompt: |
      A database is replicated across two data centres, **DC-A** and **DC-B**. The network link between them fails, but both data centres are still up and reachable by their local clients.

      A client in DC-A updates a user's email address. A second later, a client in DC-B reads that user's email address.

      What does the CAP theorem tell you about this situation?
    hints:
      - Focus on what each data centre can do *while the link is down*.
      - If DC-B answers the read, can it know about the write in DC-A? If it refuses to answer, which property is lost?
    explanation: |
      CAP applies **during a network partition**: a node that can't reach its peers must either answer — possibly with stale data, giving up linearizable consistency — or refuse or delay the request, giving up availability. It is not a free choice of "two out of three"; partitions happen whether you plan for them or not. When the network is healthy you can have both, and the trade-off becomes latency versus consistency (PACELC). The choice can even differ per operation within one product.
    content:
      multiple: false
      options:
        - id: a
          text: "While the link is down, DC-B must either refuse or delay the read (giving up availability) or return the possibly old email (giving up consistency); it cannot do both."
          correct: true
          feedback: "Right — that is the whole content of CAP: during a partition, each request forces a choice between a guaranteed up-to-date answer and an answer at all."
        - id: b
          text: "Choose a database that is consistent and available (CA), and the partition won't affect it."
          feedback: "A system that spans a network can't opt out of partitions — the link just failed. 'CA' only describes a system that isn't distributed, or one that stops working entirely when partitioned."
          misconception: {code: cap-pick-two, label: "Treats CAP as freely choosing two of three properties", category: conceptual}
        - id: c
          text: "The read in DC-B will be stale, because replicated databases are always eventually consistent."
          feedback: "CAP doesn't force staleness: a consistency-first (CP) system can refuse DC-B's read and stay consistent by giving up availability instead."
          misconception: {code: replication-implies-eventual, label: "Assumes replication always means eventual consistency", category: conceptual}
        - id: d
          text: "CAP only applies to NoSQL databases; a relational database with synchronous replication avoids the trade-off."
          feedback: "CAP applies to any replicated system, SQL included. With synchronous replication a partition makes writes block or fail — that is choosing consistency over availability, not escaping the trade-off."
          misconception: {code: cap-avoided-by-tech, label: "Believes a particular technology escapes the CAP trade-off", category: conceptual}

  - slug: sd-consistency-quorum-size
    skill: sd-consistency
    kind: short_answer
    difficulty: 3
    minutes: 4
    tags: [interview]
    title: Size a read quorum
    objective: Use the R + W > N rule to find the smallest read quorum that always overlaps the latest write.
    prompt: |
      A leaderless (Dynamo-style) key-value store keeps **N = 5** replicas of each key. A write is acknowledged once **W = 3** replicas have stored it.

      What is the **smallest read quorum R** that guarantees every read contacts at least one replica holding the latest acknowledged write? Answer with a number.
    hints:
      - Think about the worst case. Which replicas might a read miss?
      - The set of replicas you read and the set that acknowledged the write must share at least one member. How big must they be together, compared with N?
    explanation: |
      For every read set to overlap every write set you need **R + W > N**: then the R replicas you read and the W that acknowledged the write cannot be disjoint, because together they would need more than N distinct replicas. With N = 5 and W = 3, R must be greater than 2, so **R = 3**. With R = 2, the read could hit exactly the two replicas that missed the write.

      The read then returns the newest value among the responses, identified by its version or timestamp. Overlap alone isn't full linearizability — sloppy quorums, concurrent writes and partially failed writes are classic caveats — but it is the foundation.
    solution: |
      R + W > N  →  R + 3 > 5  →  R > 2  →  **R = 3**. Any 3 replicas read and any 3 that acknowledged the write overlap in at least 3 + 3 − 5 = 1 replica.
    content:
      placeholder: e.g. 4
      accepted: ["3", "r=3", "r = 3", "r is 3", "three", "3 replicas", "three replicas", "r=3 replicas"]
      patterns: ["(r ?(=|is) ?)?(3|three)( replicas| nodes)?"]
      partial:
        - answers: ["4", "r=4", "r = 4", "four", "5", "r=5", "r = 5", "five", "all", "all 5", "all five", "n", "r=n", "r = n"]
          score: 0.3
          feedback: "That does guarantee overlap, but it isn't the smallest R: the read and write sets only need to share one replica, so R + W > N — R = 3 — is enough. A larger R costs latency and availability."
      wrong:
        - answers: ["2", "r=2", "r = 2", "two"]
          feedback: "With R = 2 and W = 3, R + W = 5 = N: the read could hit exactly the two replicas that missed the write. You need R + W > N, not R + W ≥ N."
          misconception: {code: quorum-overlap-off-by-one, label: "Uses R + W ≥ N instead of R + W > N", category: edge_case}
        - answers: ["1", "r=1", "r = 1", "one"]
          feedback: "With R = 1, the single replica you read may be one of the two that doesn't have the write yet."
          misconception: {code: replica-reads-always-fresh, label: "Assumes any single replica returns the latest write", category: conceptual}

  - slug: sd-consistency-ticketing-levels
    skill: sd-consistency
    kind: concept_explanation
    difficulty: 4
    minutes: 15
    tags: [interview]
    secondary_skills: [sd-data-partitioning]
    title: Choose consistency levels for a ticketing platform
    objective: Match consistency guarantees to product features and decide how each behaves during a network partition.
    prompt: |
      You are designing a concert-ticketing platform whose data is replicated across regions. For each item below, say what consistency it needs, why, and how you would provide it:

      1. **Seat reservation** — a seat must never be sold twice.
      2. The **"tickets left" counter** shown on the busy event page.
      3. A user changes their **display name** and expects to see the new name immediately.
      4. During a **network partition between regions**, what should happen to seat reservations and to browsing events?
    hints:
      - Which of these items has a rule that must never be broken, and which ones are only informational?
      - "Item 3 is about one user's view of their own change. Is there a guarantee weaker than strong consistency that covers it?"
      - For item 4, the answer doesn't have to be the same for every operation.
    explanation: |
      Consistency is a per-feature decision. **Seat reservation** protects a hard invariant, so it needs a linearizable, atomic check-and-set on one authoritative copy (a primary or a consensus-replicated store). The **counter** is informational — the reservation enforces the rule — so eventual consistency from replicas or caches is fine. The **display name** needs only **read-your-writes**: the author must see their change, others can lag briefly. During a **partition**, reservations should choose consistency (refuse or pause where the seat's authority is unreachable) while browsing chooses availability (serve possibly stale data).
    solution: |
      **1. Seat reservation — strong consistency.** Selling a seat twice is unacceptable, so the reserve operation must be linearizable: each event's seats have one authoritative primary (or a consensus/quorum-replicated store), and reserving is an atomic conditional write — for example `UPDATE seats SET holder_id = %s WHERE id = %s AND holder_id IS NULL` in a transaction — which affects no rows if someone else got there first.

      **2. "Tickets left" counter — eventual consistency.** It's informational; the reservation step enforces the real rule. It can be served from read replicas or a cache that is a few seconds stale, which keeps the busy event page cheap and fast.

      **3. Display name — read-your-writes.** Other users can see the old name briefly, but the user who changed it must see the new one. After a write, route that user's reads to the primary for a short window, or attach a version token and only read from replicas that have caught up.

      **4. During a partition** I'd choose per operation. Reservations choose consistency: a region that can't reach the seat's primary rejects or pauses reservations with a "please try again shortly" message rather than risk a double sale. Browsing chooses availability: event pages and counters keep being served from local replicas, possibly stale.
    content:
      min_words: 80
      max_words: 500
      placeholder: "1. Seat reservation needs … because …"
      criteria:
        - id: strong-for-seats
          label: Requires strong, atomic consistency for seat reservation (single authority, transaction, conditional write or consensus)
          weight: 2
          required: true
          any: ["strong", "linearizab", "linearisab", "serializab", "serialisab", "single leader", "single primary", "one leader", "one primary", "one authoritative", "authoritative", "transaction", "lock", "compare and set", "compare and swap", "conditional write", "conditional update", "consensus", "quorum", "paxos", "raft", "unique constraint", "select for update", "for update", "atomic"]
          missing_feedback: "Double-selling a seat is unacceptable, so the reservation needs a strongly consistent, atomic check-and-set on one authoritative copy — a primary or consensus/quorum write, a transaction or a conditional update."
          misconception: {code: eventual-everywhere, label: "Applies eventual consistency to data with hard invariants", category: conceptual}
        - id: eventual-for-counter
          label: Accepts eventual consistency for the informational "tickets left" counter (replicas or caches)
          weight: 2
          any: ["eventual", "stale", "approximate", "approximation", "cach", "replica", "a few seconds", "out of date", "outdated", "lag", "doesn't need to be exact", "does not need to be exact", "not need to be exact", "not be exact", "not exact", "informational", "only for display"]
          missing_feedback: "The counter is informational — the reservation itself enforces the rule — so it can be eventually consistent and served from replicas or a cache."
          misconception: {code: strong-everywhere, label: "Demands strong consistency where staleness is harmless", category: performance}
        - id: read-your-writes
          label: Provides read-your-writes for the user's own change (read from the primary after a write, version tokens, session stickiness)
          weight: 1
          any: ["read your", "reads your", "read their own", "see their own", "sees their own", "own write", "own change", "own update", "read after write", "session consisten", "session guarantee", "read from the primary", "read from the leader", "reads from the primary", "reads to the primary", "route their reads", "sticky", "version token", "version number", "version"]
          missing_feedback: "The display name needs read-your-writes: route that user's reads to the primary for a short time after they write, or pass a version token and only read from replicas that have caught up."
          misconception: {code: replica-reads-always-fresh, label: "Assumes any single replica returns the latest write", category: conceptual}
        - id: partition-behaviour
          label: During a partition, chooses consistency for reservations (reject or pause) and availability for browsing
          weight: 2
          any: ["reject", "refuse", "unavailab", "pause", "block", "disable", "degrad", "read only", "error", "try again", "retry later", "sacrific", "give up availability", "gives up availability", "choose consistency", "chooses consistency", "favour consistency", "favor consistency", "prefer consistency", "re:\\bcp\\b", "re:\\bap\\b"]
          missing_feedback: "Spell out the CAP choice: during a partition, the side that can't reach the seat's authority should refuse or pause reservations (consistency), while browsing keeps working on possibly stale data (availability)."

  # ================================================================== sd-rate-limiting
  - slug: sd-rate-limiting-fixed-window-mcq
    skill: sd-rate-limiting
    kind: multiple_choice
    difficulty: 3
    minutes: 2
    diagnostic: true
    title: How many requests fit through a fixed window?
    objective: Recognise the boundary burst that a fixed-window rate limiter allows.
    prompt: |
      An API allows **100 requests per minute** per API key using a fixed-window counter: one counter per key per calendar minute (`12:00:00–12:00:59`, `12:01:00–12:01:59`, …), reset at each minute boundary.

      What is the **maximum** number of requests a single key can get accepted within **any 2-second span**?
    hints:
      - Picture a client that waits until the very end of a window.
      - What happens to the counter one second later?
    explanation: |
      A fixed window only counts requests inside each calendar minute. A client can send 100 requests at `12:00:59` and another 100 at `12:01:00`: **200 requests in about one second**, double the intended rate. Sliding-window limiters (a log of timestamps, or a weighted counter across the current and previous windows) and token buckets (whose capacity bounds any burst) avoid this boundary burst.
    content:
      multiple: false
      options:
        - id: a
          text: "100 — the limit is 100 per minute."
          feedback: "That's the intent, but a fixed window counts each calendar minute separately: two adjacent windows can both be filled in the seconds around the boundary."
          misconception: {code: fixed-window-boundary-burst, label: "Overlooks that fixed windows allow double bursts at the boundary", category: edge_case}
        - id: b
          text: "200 — up to 100 at the end of one window and up to 100 at the start of the next."
          correct: true
          feedback: "Right — the counter resets at the boundary, so a client can double the intended rate for a moment. Sliding windows or a token bucket prevent this."
        - id: c
          text: "About 3 — 100 per minute is about 1.7 requests per second."
          feedback: "A per-minute limit says nothing about how requests are spread inside the minute: a client can send all 100 in the same second."
          misconception: {code: limit-implies-smoothing, label: "Assumes a per-period limit spreads requests evenly", category: conceptual}
        - id: d
          text: "There is no maximum, because the counter keeps resetting."
          feedback: "Each window still caps at 100, and a 2-second span can overlap at most two windows, so the most it can see is 200."
          misconception: {code: misreads-window-reset, label: "Thinks a resetting counter imposes no limit", category: misread}

  - slug: sd-rate-limiting-token-bucket
    skill: sd-rate-limiting
    kind: python_code
    difficulty: 3
    minutes: 20
    tags: [interview]
    title: Implement a token-bucket rate limiter
    objective: Implement a token bucket with an injected clock that allows bursts up to its capacity and refills continuously.
    prompt: |
      Your API gateway needs a per-client rate limiter that allows short bursts but enforces an average rate. Implement a **token bucket**:

      - `TokenBucket(capacity, refill_rate, clock)` starts **full**, with `capacity` tokens, and never holds more than `capacity`.
      - Tokens refill continuously at `refill_rate` tokens per second, and fractions count: after 0.25 s at 2 tokens per second the bucket has gained 0.5 tokens.
      - `clock` is a zero-argument function that returns the current time in seconds. Always read the time through it — never call `time.time()` — so tests can control time. (In production you would pass `time.monotonic`, which never jumps backwards.)
      - `allow(cost=1)` first adds the tokens earned since the last refill. Then, if at least `cost` tokens are available, it removes them and returns `True`; otherwise it returns `False` **and removes nothing**.

      The starter code handles the initial burst but never refills.
    hints:
      - Besides the number of tokens, there is one more thing the bucket must remember between calls.
      - On each call, how much time has passed since you last refilled, and how many tokens is that worth?
      - Cap the total at `capacity`, keep fractional tokens, and update the "last refill" time whenever you refill.
    explanation: |
      A token bucket refills lazily: instead of a background timer, each call computes the tokens earned since the previous call (`elapsed × refill_rate`, capped at `capacity`). Keeping fractional tokens matters — rounding down and resetting the timestamp on every call would starve a client that calls frequently. Capacity bounds the burst, the refill rate bounds the long-run average, and rejected requests must not consume tokens.
    solution: |
      Store the token count as a float together with the time of the last refill. On every call, add `elapsed × refill_rate`, cap it at `capacity` and move the timestamp forward — keeping the fractional remainder, so frequent calls still add up. Only then compare with `cost`; a rejected call leaves the tokens untouched.

      ```python
      class TokenBucket:
          def __init__(self, capacity, refill_rate, clock):
              self.capacity = float(capacity)
              self.refill_rate = float(refill_rate)
              self.clock = clock
              self.tokens = float(capacity)
              self.last = clock()

          def _refill(self):
              now = self.clock()
              elapsed = now - self.last
              if elapsed > 0:
                  self.tokens = min(self.capacity, self.tokens + elapsed * self.refill_rate)
                  self.last = now

          def allow(self, cost=1):
              self._refill()
              if cost <= self.tokens:
                  self.tokens -= cost
                  return True
              return False
      ```

      In a real gateway you keep one bucket per client key; across a fleet, `tokens` and `last` live in a shared store such as Redis and are updated atomically (for example in a Lua script), so concurrent requests can't both spend the same token.
    content:
      starter_code: |
        class TokenBucket:
            def __init__(self, capacity, refill_rate, clock):
                self.capacity = capacity
                self.refill_rate = refill_rate
                self.clock = clock
                self.tokens = capacity
                self.last = clock()

            def allow(self, cost=1):
                # TODO: add the tokens earned since the last call before checking.
                if self.tokens >= cost:
                    self.tokens -= cost
                    return True
                return False
      reference_solution: |
        class TokenBucket:
            def __init__(self, capacity, refill_rate, clock):
                if capacity <= 0 or refill_rate <= 0:
                    raise ValueError("capacity and refill_rate must be positive")
                self.capacity = float(capacity)
                self.refill_rate = float(refill_rate)
                self.clock = clock
                self.tokens = float(capacity)
                self.last = clock()

            def _refill(self):
                now = self.clock()
                elapsed = now - self.last
                if elapsed > 0:
                    self.tokens = min(self.capacity, self.tokens + elapsed * self.refill_rate)
                    self.last = now

            def allow(self, cost=1):
                self._refill()
                if cost <= self.tokens:
                    self.tokens -= cost
                    return True
                return False
    tests:
      - name: starts full and allows a burst up to capacity
        code: |
          class FakeClock:
              def __init__(self):
                  self.now = 0.0
              def __call__(self):
                  return self.now

          bucket = TokenBucket(capacity=3, refill_rate=1, clock=FakeClock())
          assert [bucket.allow() for _ in range(4)] == [True, True, True, False]
      - name: refills over time
        code: |
          class FakeClock:
              def __init__(self):
                  self.now = 0.0
              def __call__(self):
                  return self.now

          clock = FakeClock()
          bucket = TokenBucket(capacity=2, refill_rate=2, clock=clock)
          assert bucket.allow() and bucket.allow()
          assert not bucket.allow()
          clock.now = 0.5
          assert bucket.allow(), "0.5 s at 2 tokens/s should add one token"
          assert not bucket.allow()
          clock.now = 1.5
          assert bucket.allow() and bucket.allow()
          assert not bucket.allow()
      - name: never holds more than capacity
        code: |
          class FakeClock:
              def __init__(self):
                  self.now = 0.0
              def __call__(self):
                  return self.now

          clock = FakeClock()
          bucket = TokenBucket(capacity=3, refill_rate=10, clock=clock)
          for _ in range(3):
              assert bucket.allow()
          clock.now = 100.0
          assert [bucket.allow() for _ in range(4)] == [True, True, True, False]
      - name: rejected requests consume nothing
        hidden: true
        code: |
          class FakeClock:
              def __init__(self):
                  self.now = 0.0
              def __call__(self):
                  return self.now

          bucket = TokenBucket(capacity=5, refill_rate=1, clock=FakeClock())
          assert bucket.allow(cost=4)
          assert not bucket.allow(cost=3), "only 1 token is left"
          assert bucket.allow(cost=1), "the rejected request must not have consumed tokens"
          assert not bucket.allow()
      - name: frequent calls still accumulate fractional tokens
        hidden: true
        code: |
          class FakeClock:
              def __init__(self):
                  self.now = 0.0
              def __call__(self):
                  return self.now

          clock = FakeClock()
          bucket = TokenBucket(capacity=1, refill_rate=1, clock=clock)
          assert bucket.allow()
          for t in (0.25, 0.5, 0.75):
              clock.now = t
              assert not bucket.allow(), f"only {t} tokens available at t={t}"
          clock.now = 1.0
          assert bucket.allow(), "four quarter-second refills add up to one token"
      - name: a cost above capacity is never allowed
        hidden: true
        code: |
          class FakeClock:
              def __init__(self):
                  self.now = 0.0
              def __call__(self):
                  return self.now

          clock = FakeClock()
          bucket = TokenBucket(capacity=2, refill_rate=1, clock=clock)
          clock.now = 1000.0
          assert not bucket.allow(cost=3)
          assert bucket.allow(cost=2)

  - slug: sd-rate-limiting-backpressure-design
    skill: sd-rate-limiting
    kind: concept_explanation
    difficulty: 3
    minutes: 12
    tags: [interview]
    title: Make an upload pipeline degrade gracefully under overload
    objective: Diagnose unbounded buffering under overload and redesign with bounded queues, load shedding, client backoff and isolation.
    prompt: |
      Your public API accepts image uploads. Each API process puts a resize job on an **in-memory queue inside the process**, and a pool of worker threads in the same process drains it.

      During a marketing campaign, uploads arrive at about **3× the rate** the workers can process them. Memory climbs, latency rises for **all** endpoints, and processes are eventually killed for running out of memory. Some mobile clients retry failed uploads **immediately, in a tight loop**.

      Explain what is going wrong, and how you would redesign the system so it degrades gracefully under overload.
    hints:
      - Work arrives 3× faster than it can be done. Where does the excess go, and is there any limit on it?
      - When you can't take more work, what should the API tell the client — and what should the client do next?
      - Why do endpoints that have nothing to do with uploads slow down too?
    explanation: |
      When arrivals exceed capacity, an **unbounded queue** converts overload into ever-growing memory use and latency until the process dies — and here it takes every endpoint down with it. Graceful degradation needs **backpressure**: a bounded (ideally durable, external) queue, **load shedding** with fast `429`/`503` responses and `Retry-After` when it's full, clients that **back off exponentially with jitter**, **isolation** of the heavy work from the rest of the API, and **monitoring and autoscaling** on queue depth — while keeping the bound, because scaling takes time.
    solution: |
      **What's wrong:** uploads arrive 3× faster than the workers finish them, and the in-memory queue is unbounded, so the backlog grows without limit. Because it lives inside the API processes, it eats their memory, slows every endpoint, and loses all queued jobs when a process is OOM-killed. Clients retrying immediately in a tight loop multiply the load just when we are overloaded.

      **Redesign:**

      1. **Bound and externalise the queue.** Put jobs on a durable external broker (for example RabbitMQ or SQS), cap the backlog (a broker max-length setting, or a queue-depth check before enqueueing), and run the resize workers as a separate service, so the API processes stay small and other endpoints are isolated from the upload load.
      2. **Shed load at the edge.** When the queue is over its limit, reject new uploads quickly with `503 Service Unavailable` and a `Retry-After` header; when a single client exceeds its per-key rate limit, return `429 Too Many Requests`. Failing fast is better than accepting work we can't finish.
      3. **Fix the clients.** Retry with exponential backoff plus random jitter, honour `Retry-After`, and cap the number of attempts.
      4. **Monitor and scale.** Alert on queue depth and job age, and autoscale the worker pool from queue depth — keeping the bound, because new workers take minutes to arrive.

      Under a spike, some uploads now get a fast "try again shortly" instead of the whole API falling over.
    content:
      min_words: 60
      max_words: 450
      placeholder: "What's going wrong is … I would …"
      criteria:
        - id: bounded-queue
          label: Identifies the unbounded in-process queue and replaces it with a bounded (ideally durable, external) queue
          weight: 2
          required: true
          any: ["bounded", "unbounded", "queue limit", "max size", "maxsize", "maximum size", "max length", "maximum length", "cap the queue", "capped", "limit the queue", "limit its size", "queue size", "durable queue", "external queue", "message broker", "broker", "rabbitmq", "sqs", "kafka", "celery", "grows without limit", "without limit", "no limit"]
          missing_feedback: "The root problem is an unbounded buffer: work arrives faster than it's processed, so the queue — and memory — grows until the process dies. Bound it, and move it out of the API process into a durable broker."
          misconception: {code: unbounded-buffering, label: "Treats an unbounded queue as a way to absorb overload", category: conceptual}
        - id: shed-load
          label: Sheds load or pushes back when full, rejecting quickly with 429/503 and Retry-After
          weight: 2
          any: ["429", "503", "retry after", "reject", "shed", "load shedding", "too many requests", "service unavailable", "fail fast", "failing fast", "push back", "pushback", "backpressure", "back pressure", "rate limit", "throttl", "admission control", "turn away"]
          missing_feedback: "When the queue is full, reject new uploads quickly with 429/503 and a Retry-After header rather than accepting work you can't finish."
          misconception: {code: accepts-all-work, label: "Accepts every request even when it can't be processed in time", category: conceptual}
        - id: client-backoff
          label: Fixes the client retry loop with exponential backoff and jitter (honouring Retry-After)
          weight: 2
          any: ["backoff", "back off", "jitter", "exponential", "retry budget", "honour retry", "honor retry", "respect retry", "respects retry", "randomi", "random delay", "wait before retrying", "limit retries", "cap the number of retries", "cap retries"]
          missing_feedback: "Tight retry loops multiply the load exactly when you are overloaded. Clients should back off exponentially with random jitter and honour Retry-After."
          misconception: {code: retry-amplification, label: "Overlooks how retries amplify load during an overload", category: performance}
        - id: isolation
          label: Isolates the upload work so other endpoints stay fast (separate worker service, bulkheads, per-client limits)
          weight: 1
          any: ["isolat", "bulkhead", "separate", "dedicated", "own process", "own service", "other endpoints", "out of the api", "outside the api", "per client", "per user", "per key", "per api key", "fair"]
          missing_feedback: "Keep the overload contained: run resize workers outside the API processes (or in their own pool) and apply per-client limits, so one heavy uploader can't slow every endpoint."
        - id: monitor-autoscale
          label: Monitors queue depth or lag and autoscales workers from it
          weight: 1
          any: ["autoscal", "auto scal", "scale the workers", "scale workers", "scale out the workers", "more workers", "add workers", "queue depth", "queue length", "lag", "job age", "alert", "monitor", "metric", "dashboard"]
          missing_feedback: "Track queue depth and processing lag, alert on them, and autoscale workers from that signal — but keep the bound, because scaling takes time."

  # ================================================================== comm-pr-descriptions
  - slug: comm-pr-desc-best-description-mcq
    skill: comm-pr-descriptions
    kind: multiple_choice
    difficulty: 1
    minutes: 2
    diagnostic: true
    title: Which PR description helps the reviewer most?
    objective: Recognise the elements a reviewer needs from a PR description beyond what the diff shows.
    prompt: |
      You fixed a bug: customers in time zones ahead of UTC sometimes saw yesterday's orders on the "Today" dashboard. The diff is 40 lines across two files.

      Which PR description gives the reviewer the most useful information?
    hints:
      - What can the reviewer *not* learn by reading the diff?
      - Look for the option that covers why, what, how it was verified, and what else it might affect.
    explanation: |
      The diff already shows *which lines* changed. A useful description adds what the diff can't: **why** (the problem and who it affects), **what** the approach is in a sentence or two, **how it was verified**, and **risk** — what else the change touches. That lets the reviewer check the change against its intent instead of reverse-engineering it.
    content:
      multiple: false
      options:
        - id: a
          text: "Fix timezone bug."
          feedback: "Too vague: which bug, why it happened, how it was fixed and how you know it works are all missing."
          misconception: {code: description-too-vague, label: "Writes descriptions too vague to review against", category: incomplete}
        - id: b
          text: "Changed `get_today()` in `orders/utils.py`, updated line 52 of `dashboard/views.py`, added an import."
          feedback: "This repeats what the diff already shows. The reviewer needs the reason for the change and how it was verified."
          misconception: {code: describes-diff-not-why, label: "Restates the diff instead of explaining the reason and impact", category: conceptual}
        - id: c
          text: "Problem: the Today dashboard computed 'today' in UTC, so users ahead of UTC (e.g. Sydney) saw the previous day's orders until UTC midnight. Fix: compute the date in the user's time zone. Testing: new tests for UTC+10 and UTC−5 around midnight, plus a manual check with a Sydney test account. Risk: the CSV export also calls `get_today()`; it is covered by the new tests."
          correct: true
          feedback: "Right — the reviewer learns the problem, the approach, the evidence that it works and what else the change touches, so they can review against the intent."
        - id: d
          text: "Took me ages to track this one down — time zones are a nightmare! Should be fine now, let me know if anything looks off."
          feedback: "Friendly, but there is no context, approach or testing evidence; 'should be fine' asks the reviewer to take it on trust."
          misconception: {code: no-testing-evidence, label: "Omits how the change was tested", category: incomplete}

  - slug: comm-pr-desc-write-async-export
    skill: comm-pr-descriptions
    kind: concept_explanation
    difficulty: 2
    minutes: 12
    tags: [scenario]
    title: Write the PR description for an async export change
    objective: Write a PR description that covers the problem, the change, testing evidence, risk and rollout, and where reviewers should focus.
    prompt: |
      Write the pull-request description (title and body) for this change:

      - **Problem:** `POST /api/orders/export` built CSV exports inside the request. Exports above roughly 200k rows hit the 30-second gateway timeout and failed, so the largest merchants couldn't export their orders (ticket **OPS-1423**).
      - **Change:** the endpoint now enqueues a Celery task and returns `202 Accepted` with a job ID. The client polls `GET /api/orders/export/<id>`; when the job is done, the response contains a signed S3 URL for the file, valid for 24 hours. A migration adds an `ExportJob` table.
      - **Testing:** unit tests for the task, an integration test for the enqueue → poll → download flow, and a 500k-row export on staging, which finished in about 3 minutes.
      - **Rollout:** the mobile app still expects the old synchronous response, so the new flow is behind the `async_exports` feature flag, off by default.
    hints:
      - Imagine a reviewer who has never seen the ticket. What do they need to know first?
      - Use short sections — for example Why, What changed, Testing, Risk & rollout.
      - Which parts of this change could break something for someone, and how is that controlled?
    explanation: |
      A strong description leads with **why** (large exports time out; link OPS-1423), summarises **what changed** at the level of the new flow rather than file by file, gives concrete **testing evidence**, and is explicit about **risk and rollout** — the migration, the mobile app's dependency on the old behaviour, the feature flag and how to roll back. Pointing reviewers at the trickiest part (failure handling in the task) makes the review faster and better.
    solution: |
      **Title:** Move order CSV exports to a background job to stop timeouts on large exports

      **Why**
      Exports of more than about 200k rows hit the 30-second gateway timeout and fail, so our largest merchants can't export their orders (OPS-1423).

      **What changed**
      - `POST /api/orders/export` now enqueues a Celery task and returns `202 Accepted` with a job ID instead of building the CSV inside the request.
      - New `GET /api/orders/export/<id>` returns the job status and, once done, a signed S3 URL for the file, valid for 24 hours.
      - New `ExportJob` model and migration (additive: it creates one table).

      **Testing**
      - Unit tests for the export task (success, failure, empty export).
      - Integration test for the enqueue → poll → download flow.
      - Ran a 500k-row export on staging: it finished in about 3 minutes.

      **Risk & rollout**
      - The mobile app still expects the old synchronous response, so the new flow is behind the `async_exports` feature flag (off by default). Plan: enable it for web merchants first, then update the mobile client.
      - Rollback: turn the flag off. The migration only adds a table, so it is safe to leave in place.

      **Review focus**
      Please look closely at the task's error handling and how failed jobs are reported to the client.
    content:
      min_words: 60
      max_words: 450
      placeholder: "Title: …"
      criteria:
        - id: why-context
          label: Explains the problem and its impact (large exports time out) and links the ticket
          weight: 2
          required: true
          any: ["timeout", "time out", "times out", "timed out", "timing out", "30 second", "30s", "30 sec", "ops 1423", "1423", "gateway", "fail", "problem", "why", "motivation", "context", "couldn't export", "could not export", "can't export", "cannot export"]
          missing_feedback: "Start with why: large exports were timing out at the 30-second gateway limit (OPS-1423). Without the problem, the reviewer can't judge whether the approach fits."
          misconception: {code: describes-diff-not-why, label: "Restates the diff instead of explaining the reason and impact", category: conceptual}
        - id: what-changed
          label: Summarises the new flow (background task, 202 with a job ID, polling endpoint, signed S3 URL)
          weight: 2
          any: ["celery", "background", "async", "asynchronous", "202", "job id", "poll", "signed url", "signed s3", "s3", "enqueue", "queue", "task"]
          missing_feedback: "Summarise the approach in a few lines: the export runs in a Celery task, the endpoint returns 202 with a job ID, the client polls, and the file is served from S3 through a signed URL."
          misconception: {code: description-too-vague, label: "Writes descriptions too vague to review against", category: incomplete}
        - id: testing
          label: Says how the change was tested (unit and integration tests, the 500k-row staging run)
          weight: 2
          any: ["test", "staging", "verified", "verify", "500k", "500,000", "500 000", "ran a", "tried"]
          missing_feedback: "Say how you know it works: the new unit and integration tests and the 500k-row staging export that finished in about 3 minutes."
          misconception: {code: no-testing-evidence, label: "Omits how the change was tested", category: incomplete}
        - id: risk-rollout
          label: Calls out risk and rollout — the migration, the mobile app dependency, the feature flag and how to roll back
          weight: 2
          any: ["feature flag", "flag", "async_exports", "mobile", "migration", "rollback", "roll back", "risk", "rollout", "roll out", "backward", "backwards", "breaking"]
          missing_feedback: "Flag what could break and how it's controlled: the new migration, the mobile app's dependency on the old response, the async_exports flag (off by default) and how to roll back."
          misconception: {code: hides-risk, label: "Leaves the risky parts of a change unmentioned", category: incomplete}
        - id: reviewer-guidance
          label: Tells reviewers where to focus, or notes follow-ups and what is out of scope
          weight: 1
          any: ["review focus", "reviewers", "please look", "please check", "please review", "look closely", "pay attention", "focus on", "feedback on", "follow up", "out of scope", "not in this pr", "next step", "todo", "open question", "questions"]
          missing_feedback: "Point reviewers at what matters most (for example the task's retry and failure handling) and note follow-ups such as updating the mobile client."

  - slug: comm-pr-desc-critique
    skill: comm-pr-descriptions
    kind: code_review
    difficulty: 1
    minutes: 8
    tags: [scenario]
    title: Critique a vague PR description
    objective: Identify what is missing or harmful in a weak PR description and ask for the specific information reviewers need.
    prompt: |
      A teammate asks you to review a PR in the payments module. This is the entire description.

      Review the **description itself** (not the code): what is missing or problematic, why does it matter, and what would you ask the author to change?
    hints:
      - Could someone who missed the standup understand what problem this PR solves?
      - Count how many different kinds of change are in the list. Which one is the riskiest in a payments module?
      - What does "tests pass locally" actually tell you?
    explanation: |
      The description fails a reviewer in four ways. It gives **no context** — "the thing from standup" means nothing to anyone else or to a future reader. It **bundles unrelated changes** (a refactor, a behaviour change, renames and dependency bumps), which makes review hard and independent reverts impossible. It **hides the riskiest change** — "changed retry logic" in payments could cause duplicate charges — without explaining what changed or how to roll back. And "tests pass locally" is **no evidence** of what was tested. Urgency is a reason for a clearer description, not a shorter one.
    solution: |
      1. **No context.** The title "Updates" and "the thing from standup" don't say what problem this solves. Please add the motivation and a link to the ticket, so reviewers — and anyone reading this later through `git blame` — understand why.
      2. **Too many unrelated changes.** A `PaymentService` refactor, a change to retry behaviour, variable renames and dependency bumps are mixed together. Please split them into separate PRs: the refactor and renames can go in quickly, and the risky parts can be reviewed and reverted on their own.
      3. **The risky part is hidden.** "Changed retry logic" in the payments module could cause duplicate charges if a non-idempotent call is retried. Please explain what changed and why, and how we roll back. Also list which packages were bumped and to which versions.
      4. **Testing is vague.** "Tests pass locally" — which ones? Please add tests for the new retry behaviour and say how it was verified in CI or on staging.

      If it's urgent, say why (for example a linked incident) so reviewers can prioritise it.
    content:
      language: markdown
      code: |
        ## Updates

        Did some cleanup in the payments module and fixed the thing from standup.
        Also bumped a few packages while I was in there.

        Changes:
        - refactored PaymentService
        - changed retry logic
        - renamed some vars
        - updated requirements.txt
        - misc fixes

        Should be good to go, tests pass locally. Need this merged today pls!
      min_words: 30
      max_words: 400
      placeholder: List what's missing or problematic and what you would ask for…
      criteria:
        - id: missing-context
          label: Points out the missing why and context ("the thing from standup", vague title, no ticket link)
          weight: 2
          required: true
          any: ["context", "why", "standup", "ticket", "jira", "link", "motivation", "what problem", "which problem", "the problem", "background", "reason", "title", "future reader", "git blame"]
          missing_feedback: "'The thing from standup' means nothing to anyone who wasn't there, or to whoever reads this in six months. Ask for the problem being solved and a ticket link."
          misconception: {code: describes-diff-not-why, label: "Restates the diff instead of explaining the reason and impact", category: conceptual}
        - id: split-unrelated
          label: Asks to split the unrelated changes (refactor, retry behaviour change, dependency bumps) into separate PRs
          weight: 2
          any: ["split", "separate", "unrelated", "too many", "too much", "mixed", "mixing", "bundl", "one pr", "single pr", "smaller", "focused", "scope", "independently"]
          missing_feedback: "A refactor, a behaviour change and dependency bumps in one PR are hard to review and impossible to revert independently — ask for separate PRs."
          misconception: {code: bundles-unrelated-changes, label: "Bundles unrelated changes into one PR", category: conceptual}
        - id: hidden-risk
          label: Flags the unexplained retry-logic and package changes in payments as risky and asks what changed and how to roll back
          weight: 2
          any: ["retry", "retries", "risk", "double charg", "charged twice", "duplicat", "idempoten", "behavio", "rollback", "roll back", "dependency", "dependencies", "package", "versions", "requirements"]
          missing_feedback: "'Changed retry logic' in payments is the riskiest line here — it could cause double charges — yet it's unexplained. Ask what changed, why and how to roll back; the same goes for which packages were bumped."
          misconception: {code: hides-risk, label: "Leaves the risky parts of a change unmentioned", category: incomplete}
        - id: testing-evidence
          label: Asks for concrete testing evidence beyond "tests pass locally"
          weight: 1
          any: ["test", "locally", "staging", "evidence", "verif", "re:\\bci\\b", "coverage", "how was it checked", "how it was checked"]
          missing_feedback: "'Tests pass locally' doesn't say what was tested. Ask for tests covering the retry change and evidence from CI or staging."
          misconception: {code: no-testing-evidence, label: "Omits how the change was tested", category: incomplete}

  # ================================================================== comm-code-review-feedback
  - slug: comm-review-sql-injection-comment-mcq
    skill: comm-code-review-feedback
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    title: Pick the most effective review comment
    objective: Recognise a review comment that is specific, explains impact, suggests a fix and signals severity.
    prompt: |
      A PR contains this line, where `email` comes straight from the request:

      ```python
      cursor.execute(f"SELECT * FROM users WHERE email = '{email}'")
      ```

      Which review comment is the most effective?
    hints:
      - Which comment lets the author fix the problem without having to ask a follow-up question?
      - Look for the location, the impact, a suggested fix and how serious it is.
    explanation: |
      An effective comment names the **specific problem**, explains its **impact**, offers a **concrete fix** and signals **severity**, while talking about the code rather than the author. SQL injection is a blocking security issue, so labelling it a nit is as unhelpful as a personal jab or a vague "I wouldn't do it this way".
    content:
      multiple: false
      options:
        - id: a
          text: "This is a SQL injection hole. Did you even read the security guidelines?"
          feedback: "It spots the issue, but the jab at the author invites defensiveness, and it offers no fix."
          misconception: {code: attacks-the-person, label: "Critiques the author instead of the code", category: conceptual}
        - id: b
          text: "nit: maybe use parameters here?"
          feedback: "Right idea, wrong severity: SQL injection is a blocking security issue, and the comment doesn't explain why parameters matter."
          misconception: {code: misjudged-severity, label: "Mislabels how serious an issue is", category: conceptual}
        - id: c
          text: |-
            Blocking: `email` comes from the request and is interpolated into the SQL, so input like `' OR '1'='1` would return every user (SQL injection). Please pass it as a query parameter instead: `cursor.execute("SELECT * FROM users WHERE email = %s", [email])`.
          correct: true
          feedback: "Right — it names the problem and its impact, gives a concrete fix and a clear severity, and it's about the code, not the person."
        - id: d
          text: "I wouldn't do it this way."
          feedback: "Vague: the author can't tell what is wrong, how serious it is or what to do instead."
          misconception: {code: vague-feedback, label: "Gives feedback without saying what is wrong or what to do", category: incomplete}

  - slug: comm-review-rewrite-harsh-comment
    skill: comm-code-review-feedback
    kind: concept_explanation
    difficulty: 2
    minutes: 10
    tags: [scenario]
    title: Rewrite a harsh review comment
    objective: Rewrite a harsh review comment so it names the problem and its impact, suggests a fix, signals severity and stays respectful.
    prompt: |
      You are reviewing a teammate's PR. This function runs on **every load** of the order-history page:

      ```python
      def order_summaries(user):
          summaries = []
          for order in Order.objects.filter(user=user):
              summaries.append({
                  "id": order.id,
                  "items": order.items.count(),
                  "customer": order.customer.name,
              })
          return summaries
      ```

      Your first-draft comment was:

      > This is terrible. Have you never heard of N+1 queries? Fix it.

      Rewrite the comment so that it is respectful, specific and actionable.
    hints:
      - Name exactly which lines cause extra queries, and roughly how many.
      - Why should the author care? Think about a user with hundreds of orders.
      - Offer the fix, say whether it blocks the merge, and keep the tone about the code.
    explanation: |
      A good rewrite keeps the technical substance and drops the attack: it names the problem precisely (`order.items.count()` and `order.customer.name` each run a query per order — an N+1 pattern), explains the **impact** (the page gets slower as order history grows), offers a **concrete fix** (`select_related("customer")` plus `annotate(item_count=Count("items"))`), states the **severity**, and uses collaborative language.
    solution: |
      **Blocking (performance):** this loop has an N+1 query problem — `order.items.count()` and `order.customer.name` each run a separate query for every order, so a user with 500 orders costs about 1,000 extra queries on every page load, and the page gets slower as their history grows.

      We can get it down to a single query:

      ```python
      orders = (
          Order.objects.filter(user=user)
          .select_related("customer")
          .annotate(item_count=Count("items"))
      )
      ```

      and then use `order.item_count` instead of `order.items.count()`. Happy to pair on it if that's useful — the rest of the change looks good to me.
    content:
      min_words: 30
      max_words: 300
      placeholder: Write the comment you would post…
      criteria:
        - id: specific-problem
          label: Names the specific problem — each order triggers extra queries (N+1) for its items and customer
          weight: 2
          required: true
          any: ["n+1", "re:\\bn\\s*\\+\\s*1\\b", "n plus 1", "n plus one", "one query per", "a query per", "a separate query", "extra quer", "additional quer", "query for each", "queries for each", "query for every", "queries per order", "per order", "each order", "every order", "in the loop", "inside the loop", "order.items", "order.customer", "items.count", "customer.name"]
          missing_feedback: "Point to the exact problem: `order.items.count()` and `order.customer.name` each run a query per order, so N orders cost 2N + 1 queries."
          misconception: {code: vague-feedback, label: "Gives feedback without saying what is wrong or what to do", category: incomplete}
        - id: impact
          label: Explains the impact (slow page, cost grows with the number of orders, database load)
          weight: 2
          any: ["slow", "latency", "performance", "scale", "grows", "database load", "load on the database", "db load", "hundreds of queries", "thousands of queries", "1,000", "1000", "many queries", "every page load", "each page load", "page load", "response time"]
          missing_feedback: "Say why it matters: on every page load, a user with 500 orders triggers about 1,000 extra queries, so the page slows down as their history grows."
        - id: concrete-fix
          label: Suggests a concrete fix (select_related for the customer, annotate with Count for the items, or prefetch_related)
          weight: 2
          any: ["select_related", "prefetch_related", "annotate", "count(", "join", "aggregat", "in one query", "single query", "fewer queries", "batch"]
          missing_feedback: "Offer a fix: `select_related(\"customer\")` for the customer and `annotate(item_count=Count(\"items\"))` for the count turn 2N + 1 queries into one."
        - id: collaborative-tone
          label: Uses a collaborative, code-focused tone (we, a question, an offer to help, acknowledging what works)
          weight: 1
          any: ["re:\\bwe\\b", "re:\\blet's\\b", "re:\\blet us\\b", "what do you think", "happy to", "could we", "how about", "i suggest", "suggestion", "thanks", "thank you", "nice", "looks good", "good work", "great", "would you", "could you", "consider", "pair"]
          missing_feedback: "Keep the tone collaborative and about the code: 'we', a genuine question or an offer to pair goes a long way."
          misconception: {code: attacks-the-person, label: "Critiques the author instead of the code", category: conceptual}
        - id: severity
          label: Signals severity (blocking versus suggestion or nit)
          weight: 1
          any: ["blocking", "blocker", "must", "before merg", "before we merg", "suggestion", "nit", "optional", "important", "should be fixed", "priority", "minor", "major", "non blocking"]
          missing_feedback: "Say how important it is — for example 'Blocking: this runs on every page load' — so the author knows it must be fixed before merging."

  - slug: comm-review-critique-thread
    skill: comm-code-review-feedback
    kind: code_review
    difficulty: 2
    minutes: 8
    tags: [scenario]
    title: Critique a reviewer's comments on a password-reset PR
    objective: Identify vague, mis-prioritised and personal review comments and explain how each should be written instead.
    prompt: |
      A colleague left these comments on a PR that adds a password-reset endpoint. You are asked to coach them on their reviewing.

      Critique the **review comments** (not the code): which ones are unhelpful or harmful, why, and what should they have written instead?
    hints:
      - Which comment points at the most serious problem in the PR? How is it labelled?
      - Imagine you're the author. Which comments tell you what to do next, and which ones don't?
      - Is a human reviewer the best way to enforce formatting rules?
    explanation: |
      Four patterns make this review worse than useless. Comment 1 is **vague and condescending** — it gives no reason or alternative. Comment 2 **mislabels severity**: reset tokens from `random` are predictable (the module isn't cryptographically secure) and a 6-digit code can be brute-forced, so it must be blocking — use `secrets`, expire tokens and limit attempts. Comments 3–6 are **repetitive style nits** that bury that issue and belong to a linter or formatter. Comment 7 **attacks the author** instead of naming the missing tests and what is needed to approve.
    solution: |
      - **Comment 1 is vague and condescending.** "Why would you do it like this??" doesn't say what's wrong. Replace it with the actual concern and an alternative, e.g. "This returns a different error for unknown emails, which lets anyone check whether an account exists — could we always return the same response?"
      - **Comment 2 has the wrong severity.** Generating the reset token with `random.randint` is a security problem, not a nit: `random` isn't cryptographically secure and a 6-digit code can be brute-forced. It should be blocking: use `secrets.token_urlsafe()`, expire the token and limit attempts.
      - **Comments 3–6 are noise.** Four separate style nits (f-strings, a rename) bury the one critical issue. Group them into a single optional comment — or better, let the linter or formatter enforce them.
      - **Comment 7 attacks the author.** "You clearly didn't test this" is an accusation without detail. Say which tests are missing — e.g. expired, reused and invalid tokens — and what is needed to approve.
    content:
      language: text
      code: |
        PR #812: Add password reset endpoint

        Review comments

        1. views.py line 14:  Why would you do it like this??
        2. views.py line 22:  nit: the reset token is generated with random.randint(100000, 999999)
        3. views.py line 30:  Use f-strings.
        4. views.py line 31:  Use f-strings.
        5. views.py line 35:  Use f-strings.
        6. views.py line 40:  Rename `tok` to `token`.
        7. Overall: You clearly didn't test this. Request changes.
      min_words: 40
      max_words: 400
      placeholder: Go through the comments and say what's wrong with each…
      criteria:
        - id: vague-comment
          label: Points out that comment 1 is vague or condescending and should state the concern and an alternative
          weight: 1
          any: ["comment 1", "first comment", "re:#\\s?1\\b", "vague", "why would you", "condescend", "rhetorical", "sarcas", "unclear", "doesn't explain", "does not explain", "doesn't say", "does not say", "no explanation", "not actionable", "actionable"]
          missing_feedback: "'Why would you do it like this??' tells the author nothing. A good comment says what the concern is and suggests an alternative."
          misconception: {code: vague-feedback, label: "Gives feedback without saying what is wrong or what to do", category: incomplete}
        - id: security-severity
          label: Recognises that the random-based reset token is a blocking security issue, not a nit (use secrets, expiry, attempt limits)
          weight: 2
          required: true
          any: ["secrets", "secure", "insecure", "security", "cryptograph", "predictab", "guess", "brute", "blocking", "blocker", "not a nit", "severity", "critical"]
          missing_feedback: "Comment 2 points at the most important problem and labels it a nit. `random` isn't cryptographically secure and a 6-digit code can be brute-forced: this is blocking — use `secrets`, and add expiry and attempt limits."
          misconception: {code: misjudged-severity, label: "Mislabels how serious an issue is", category: conceptual}
        - id: nit-noise
          label: Notes that the repeated style nits drown out the important issue and belong in a linter, a formatter or one grouped comment
          weight: 1
          any: ["f string", "style", "linter", "lint", "formatter", "black", "ruff", "automat", "repeat", "repetit", "noise", "drown", "bury", "buries", "buried", "one comment", "single comment", "group", "batch"]
          missing_feedback: "Four separate style nits bury the real problem. Group them into one comment, or leave them to a linter or formatter."
          misconception: {code: nit-flood, label: "Floods reviews with style nits that bury important issues", category: conceptual}
        - id: personal-attack
          label: Calls out that "You clearly didn't test this" attacks the author and should instead name the missing tests and what is needed to approve
          weight: 2
          any: ["comment 7", "overall comment", "last comment", "final comment", "clearly didn't", "you clearly", "didn't test", "did not test", "accus", "personal", "attack", "blame", "tone", "assum", "which tests", "what tests", "missing tests", "what is needed to approve", "what's needed to approve"]
          missing_feedback: "'You clearly didn't test this' is about the person and gives no detail. Say which cases lack tests (e.g. expired or reused tokens) and what would get the PR approved."
          misconception: {code: attacks-the-person, label: "Critiques the author instead of the code", category: conceptual}

  # ================================================================== comm-explaining-tradeoffs
  - slug: comm-tradeoffs-launch-reply-mcq
    skill: comm-explaining-tradeoffs
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    title: Reply to "can we launch on Friday?"
    objective: Recognise a trade-off explanation that gives a non-technical stakeholder options, costs and a recommendation.
    prompt: |
      Your product manager asks whether the new search feature can launch next Friday. It works, but at the expected launch traffic it needs either a bigger search cluster, adding about **$4,000 a month**, or **two more weeks** to add caching that keeps costs flat. Marketing has already announced Friday.

      Which reply explains the trade-off best?
    hints:
      - What does the PM need in order to make a decision today?
      - Look for options, their costs in the PM's terms, and a recommendation.
    explanation: |
      A good trade-off explanation gives the **options**, what each **costs in the audience's terms** (money, dates, user impact), a **recommendation with its reason**, and asks for the decision. Jargon, silently picking an option, or deferring without sharing what you know all leave the stakeholder unable to decide.
    content:
      multiple: false
      options:
        - id: a
          text: "We could, but the search shards will run hot and p99 latency will blow up unless we put a Redis layer in front of the query path."
          feedback: "Accurate, but jargon-heavy, and it gives the PM neither options nor a recommendation to act on."
          misconception: {code: jargon-over-impact, label: "Explains in technical jargon instead of user and business impact", category: conceptual}
        - id: b
          text: "Yes, we can launch on Friday."
          feedback: "It hides the cost: the PM would be surprised by a $4,000-a-month bill they never agreed to."
          misconception: {code: hides-tradeoff, label: "Presents a decision without its costs or alternatives", category: incomplete}
        - id: c
          text: "Two options: launch Friday on a bigger search cluster, which adds about $4,000 a month, or launch two weeks later with caching that keeps costs flat. Users get the same experience either way. I'd launch Friday and add the caching straight after, so we keep the announced date and the extra cost only runs for a few weeks. Does that work for the budget?"
          correct: true
          feedback: "Right — options, costs in the PM's terms, user impact, a recommendation with its reason, and a clear question to decide on."
        - id: d
          text: "It depends on a lot of technical factors. Let me look into it and get back to you."
          feedback: "The team already knows the trade-off; holding it back delays a decision the PM could make today."
          misconception: {code: no-recommendation, label: "Lists or withholds options without recommending one", category: incomplete}

  - slug: comm-tradeoffs-replica-lag-reply
    skill: comm-explaining-tradeoffs
    kind: concept_explanation
    difficulty: 2
    minutes: 12
    tags: [scenario]
    secondary_skills: [sd-consistency]
    title: Explain a replication-lag trade-off to the head of support
    objective: Explain a technical cause in plain language and present costed options with a clear recommendation to a non-technical stakeholder.
    prompt: |
      The head of customer support, who is not technical, messages you: *"Customers keep telling us their address change didn't save, but it shows up a minute later. Can engineering just make it instant?"*

      What you know:

      - The "My account" page reads from database **replicas** that lag behind the main database by up to about 60 seconds at peak.
      - **Option A:** read the account page from the main database. Changes appear instantly for everyone, but the main database is near capacity, so this needs about 3 days of work plus a database upgrade costing about $1,500 a month.
      - **Option B:** right after a customer changes something, read *their* next few page views from the main database. They see their own change immediately; other people (including support agents) may still see the old value for up to a minute. About 2 days of work, no extra running cost.
      - **Option C:** leave it as it is.

      Write your reply to the head of support (aim for 120–250 words).
    hints:
      - Explain *why* it happens in everyday words before talking about fixes.
      - What does each option cost, and what will customers and support agents actually notice?
      - Finish with what you recommend and what you need from them.
    explanation: |
      A strong reply explains the cause without jargon (the page reads from copies of the database that can be up to a minute behind), lays out the options with their **cost and effort**, describes what **customers and support** will experience with each, makes a **clear recommendation** — B fixes exactly what customers notice at no ongoing cost — and ends with a **next step or a decision to make**.
    solution: |
      Hi Priya,

      Good question — here's what's going on. To keep the site fast, the "My account" page reads from copies of our main database. The copies usually catch up quickly, but at busy times they can be up to a minute behind, so a customer who has just changed their address can still see the old one and assumes it didn't save.

      We have three options:

      - **Make it instant for everyone:** about 3 days of work plus a database upgrade costing roughly $1,500 a month, because the main database is already close to its limit.
      - **Show customers their own change immediately:** about 2 days of work and no extra cost. The person who made the change sees it straight away; anyone else, including support agents, might see the old address for up to a minute.
      - **Leave it as it is:** no cost, but the confused customers and tickets keep coming.

      I recommend the second option: it fixes exactly what customers notice and complain about, without the monthly cost. If you're happy with that, we can start next sprint — let me know, or I'm happy to talk it through.
    content:
      min_words: 80
      max_words: 350
      placeholder: "Hi …"
      criteria:
        - id: plain-cause
          label: Explains the cause in plain language (the page reads from copies of the database that catch up after a delay)
          weight: 2
          any: ["copy", "copies", "catch up", "catches up", "delay", "behind", "lag", "sync", "replica", "secondary", "mirror", "a minute to update", "takes a minute", "up to a minute"]
          missing_feedback: "Explain why it happens in everyday words: the page reads from copies of the database that can be up to a minute behind."
          misconception: {code: jargon-over-impact, label: "Explains in technical jargon instead of user and business impact", category: conceptual}
        - id: options-with-costs
          label: Presents the options with their cost and effort (instant everywhere costs 3 days plus about $1,500 a month; own change instant costs 2 days)
          weight: 2
          required: true
          any: ["1,500", "1500", "1.5k", "cost", "per month", "a month", "monthly", "days of work", "3 days", "three days", "2 days", "two days", "budget", "expensive", "cheaper", "price"]
          missing_feedback: "Lay out the options side by side with what each costs: instant for everyone means about 3 days plus roughly $1,500 a month; showing customers their own change instantly is about 2 days with no extra cost."
          misconception: {code: hides-tradeoff, label: "Presents a decision without its costs or alternatives", category: incomplete}
        - id: user-impact
          label: Frames the options by what customers and support will experience
          weight: 2
          any: ["their own change", "own change", "own update", "own address", "their change", "their update", "see it immediately", "see it straight away", "see it right away", "see the change", "see the new", "sees the new", "see their", "sees their", "the person who", "whoever made", "confus", "fewer tickets", "support ticket", "tickets", "fewer calls", "complain", "support agents", "agents"]
          missing_feedback: "Describe what customers and support will notice: with option B the customer who changed their address sees it immediately — which is what generates the tickets — while agents may see it a minute later."
        - id: recommendation
          label: Makes a clear recommendation and gives the reason
          weight: 2
          any: ["recommend", "i suggest", "i'd suggest", "i would suggest", "suggest we", "i'd go with", "i would go with", "my advice", "propose", "best option", "i'd choose", "i would choose", "we should", "my vote", "i prefer", "i'd pick", "i would pick"]
          missing_feedback: "Don't stop at the options — say which one you recommend and why (for example: B fixes what customers actually notice, with no ongoing cost)."
          misconception: {code: no-recommendation, label: "Lists or withholds options without recommending one", category: incomplete}
        - id: next-step
          label: Asks for a decision or offers a concrete next step
          weight: 1
          any: ["let me know", "shall we", "shall i", "should we", "next step", "next sprint", "next week", "if you agree", "if that works", "if you're happy", "if you are happy", "happy to", "can start", "could start", "sign off", "decide", "decision", "go ahead", "approve", "your call", "talk it through", "call"]
          missing_feedback: "Close with the decision you need or the next step, e.g. 'If you're happy with B, we can ship it next sprint.'"

  - slug: comm-tradeoffs-critique-sso-message
    skill: comm-explaining-tradeoffs
    kind: code_review
    difficulty: 2
    minutes: 8
    tags: [scenario]
    title: Critique a trade-off message sent to a VP of Sales
    objective: Identify why a technical reply fails a non-technical decision-maker and say how to restructure it.
    prompt: |
      The VP of Sales asked an engineer: *"Can we give Acme single sign-on (SSO) by the end of the month? It's blocking their renewal."* This was the reply.

      Critique the message: why doesn't it work for this reader, and how should it be rewritten?
    hints:
      - Read it as the VP of Sales. Which words would you have to look up?
      - What exactly did the VP ask? Find the sentence that answers it.
      - Two approaches are mentioned. Can the reader tell which is faster, cheaper or riskier — or which one the engineer recommends?
    explanation: |
      The reply buries a decision-maker in **jargon** (SAML, IdP, JIT, SCIM), **never answers the question** that was asked — can it be done by the end of the month, and if not, when — and mentions **build versus buy without comparing** them on time, cost or risk. It ends with **no recommendation or next step**, so the VP has nothing to act on. Lead with the answer and an estimate, translate the options into business terms, recommend one, and say what happens next.
    solution: |
      1. **Too much jargon for the audience.** SAML, SP-initiated flows, IdP metadata, JIT provisioning, SCIM and "multi-IdP tenancy" mean nothing to a VP of Sales. Translate into outcomes: "Acme's staff would log in with their company accounts, and people who leave would lose access automatically."
      2. **It never answers the question.** The VP asked whether SSO can ship by the end of the month. Lead with the answer and an estimate, even a range with conditions: "Not by the end of the month if we build it ourselves; probably sooner if we use a vendor" — with the team's real numbers.
      3. **The options aren't compared.** Building versus buying from a vendor is mentioned, but without the time, cost or risk of each, so the reader can't weigh the trade-off. "Lock-in, per-user pricing, data residency" need translating into what they mean for the business.
      4. **No recommendation or next step.** "Not sure. Depends on a lot of things." leaves the VP with nothing to act on. Recommend an option and the next step, e.g. "I suggest the vendor route; I'll confirm pricing and Acme's requirements by Thursday."

      Also drop "the current auth code is a mess" — it's a complaint, not information the VP can use, and it undermines confidence in the team.
    content:
      language: text
      code: |
        Re: SSO for Acme by end of month?

        So basically we'd need to implement a SAML 2.0 SP-initiated flow with IdP
        metadata ingestion, plus JIT provisioning, and SCIM if they want
        deprovisioning, and our session layer isn't really built for multi-IdP
        tenancy so there's a refactor of the auth middleware too. Could also buy
        it from an SSO vendor but that has its own issues (lock-in, per-user
        pricing, data residency questions). Honestly the current auth code is a
        mess and needs rewriting anyway. Not sure. Depends on a lot of things.
      min_words: 30
      max_words: 400
      placeholder: Explain what doesn't work for this reader and how to fix it…
      criteria:
        - id: jargon
          label: Points out the jargon (SAML, IdP, JIT, SCIM) that a VP of Sales can't follow
          weight: 2
          any: ["jargon", "acronym", "technical terms", "too technical", "saml", "scim", "idp", "plain language", "plain english", "non technical", "nontechnical", "audience", "won't understand", "will not understand", "wouldn't understand", "doesn't understand", "can't follow", "cannot follow", "translate"]
          missing_feedback: "The VP of Sales won't know what SAML, IdP, JIT or SCIM mean. Translate them into what the customer gets and what it takes."
          misconception: {code: jargon-over-impact, label: "Explains in technical jargon instead of user and business impact", category: conceptual}
        - id: no-direct-answer
          label: Notes that it never answers the actual question (by the end of the month?) with a timeline or estimate
          weight: 2
          required: true
          any: ["answer", "yes or no", "yes/no", "timeline", "time frame", "timeframe", "estimate", "end of month", "end of the month", "deadline", "date", "how long", "weeks", "bottom line", "lead with", "up front", "upfront", "tl;dr", "tldr", "summary first"]
          missing_feedback: "The VP asked a yes-or-no question with a date. Lead with the answer and a time estimate — even a range with what it depends on — before any detail."
          misconception: {code: buries-the-answer, label: "Buries or omits the bottom line the audience asked for", category: incomplete}
        - id: options-not-compared
          label: Points out that the build and buy options aren't compared on time, cost and risk
          weight: 1
          any: ["compar", "build vs", "build versus", "build or buy", "buy", "vendor", "cost", "price", "pricing", "trade off", "tradeoff", "pros and cons", "options", "alternatives"]
          missing_feedback: "Building and buying are mentioned but never compared. Give each a rough time, cost and risk so the VP can see the trade-off."
          misconception: {code: hides-tradeoff, label: "Presents a decision without its costs or alternatives", category: incomplete}
        - id: no-recommendation
          label: Notes that there is no recommendation or next step
          weight: 2
          any: ["recommend", "suggest", "next step", "propos", "what to do", "decision", "decide", "call to action", "action", "nothing to act on", "way forward", "who does what"]
          missing_feedback: "It ends with 'Not sure. Depends on a lot of things.' Recommend an option and a next step, such as a scoping call with Acme."
          misconception: {code: no-recommendation, label: "Lists or withholds options without recommending one", category: incomplete}

  # ================================================================== comm-incident-updates
  - slug: comm-incident-status-page-mcq
    skill: comm-incident-updates
    kind: multiple_choice
    difficulty: 2
    minutes: 2
    diagnostic: true
    title: Choose the best status-page update
    objective: Recognise a customer-facing incident update that states impact, actions and the next update time without speculating.
    prompt: |
      Since 14:05 UTC, about 30% of checkout attempts have been failing. It is now 14:25. The team suspects a recent deploy but hasn't confirmed it.

      Which **status-page** update is best?
    hints:
      - Imagine you're a customer reading the status page. What do you need to know?
      - Look for impact, what is being done and when you'll hear more — without guesses or promises.
    explanation: |
      A good public update states the **impact** precisely (what's affected, since when, what still works), what is **being done**, any **workaround**, and **when the next update** will come — in plain language. It avoids unconfirmed causes, blame and fix-time promises, and keeps internal detail such as deploy hashes and error budgets for the internal channel.
    content:
      multiple: false
      options:
        - id: a
          text: "We are experiencing issues. We apologise for any inconvenience."
          feedback: "It says nothing about what is affected, what you're doing or when you'll update again."
          misconception: {code: update-lacks-impact, label: "Omits who and what is affected", category: incomplete}
        - id: b
          text: "A bad deploy by the payments team broke checkout. It will be fixed in 10 minutes."
          feedback: "It states an unconfirmed cause, blames a team in public and promises a fix time nobody can guarantee."
          misconception: {code: speculates-and-promises, label: "States unconfirmed causes or promises fix times in live updates", category: conceptual}
        - id: c
          text: "Since 14:05 UTC, about 30% of checkout attempts have been failing. Browsing and existing orders are not affected. We are investigating and working to restore checkout. Next update by 14:45 UTC."
          correct: true
          feedback: "Right — precise impact and scope, what's being done and a committed next update, with no speculation or promises."
        - id: d
          text: "INVESTIGATING: elevated 5xx on checkout-svc after deploy 4f2a91, rolling back, p99 12 s, error budget burned."
          feedback: "That belongs in the internal incident channel: customers can't parse it, and it presents an unconfirmed cause as fact."
          misconception: {code: wrong-audience-detail, label: "Uses internal jargon in customer-facing updates", category: conceptual}

  - slug: comm-incident-write-update
    skill: comm-incident-updates
    kind: concept_explanation
    difficulty: 3
    minutes: 10
    tags: [scenario]
    title: Write an internal incident update
    objective: Write an incident update with impact, status, a caveated ETA, guidance for support and a committed next-update time.
    prompt: |
      You are the incident commander. Write the update for the internal **#incident** channel, which support, sales and engineering leads all read.

      The facts at **10:40 UTC**:

      - Since **10:12 UTC**, customers in the **EU region** can't log in to the web app. Users who are already logged in, mobile app logins and the **US region** are not affected.
      - Cause confirmed: a **configuration change** deployed to the EU login service at 10:10 UTC. The team is **rolling it back**.
      - Rollbacks of this service normally take about **20 minutes**, but this is the first rollback since the service was migrated, so it **may take longer**.
    hints:
      - "Lead with what people would ask first: who is affected, and since when?"
      - Support and sales will be talking to customers. What can you tell them to say or do?
      - Give the recovery estimate honestly, and say when people will hear from you next.
    explanation: |
      A useful update leads with **impact** (EU web logins down since 10:12 UTC; logged-in users, mobile and the US unaffected), gives the **status and confirmed cause** (configuration change, rollback in progress), an **ETA with its caveat** rather than a promise, **actionable guidance** for support and sales (the mobile app works; point customers to the status page), and a **specific next-update time**.
    solution: |
      **[Incident] EU web logins failing — update 10:40 UTC**

      **Impact:** since 10:12 UTC, customers in the EU region can't log in to the web app. Users who are already logged in, mobile app logins and the US region are not affected.

      **Status:** cause identified — a configuration change deployed to the EU login service at 10:10 UTC. We are rolling it back now.

      **Expected recovery:** rollbacks normally take about 20 minutes, so we expect logins to recover around 11:00 UTC. This is the first rollback since the service was migrated, so it may take longer; we'll say so as soon as we know.

      **For support and sales:** customers can log in with the mobile app in the meantime. Please point them to the status page rather than promising a time.

      **Next update:** 11:10 UTC, or sooner if anything changes.
    content:
      min_words: 50
      max_words: 300
      placeholder: "[Incident] …"
      criteria:
        - id: impact
          label: States the impact — who and what is affected since when (EU web logins since 10:12 UTC) and what isn't
          weight: 2
          required: true
          any: ["eu", "europe", "log in", "login", "sign in", "10:12", "logged in", "unaffected", "not affected", "mobile", "us region", "impact", "affected"]
          missing_feedback: "Lead with the impact: EU customers can't log in to the web app since 10:12 UTC; logged-in users, mobile and the US are fine."
          misconception: {code: update-lacks-impact, label: "Omits who and what is affected", category: incomplete}
        - id: status-cause
          label: States the current status and the confirmed cause (configuration change identified, rollback in progress)
          weight: 1
          any: ["cause", "identified", "config", "configuration", "rolling back", "roll back", "rollback", "reverting", "revert", "root cause"]
          missing_feedback: "Say where things stand: cause identified (a configuration change at 10:10 UTC) and the rollback is in progress."
        - id: eta-with-caveat
          label: Gives a realistic recovery estimate with its uncertainty instead of a promise
          weight: 2
          any: ["eta", "expect", "estimate", "about 20", "20 min", "20 minutes", "around 11", "by 11", "may take longer", "might take longer", "could take longer", "may be longer", "might be longer", "not guaranteed", "uncertain", "first rollback", "no guarantee"]
          missing_feedback: "Give the expected recovery time with its caveat — about 20 minutes, possibly longer because this rollback hasn't been done since the migration — rather than a promise."
          misconception: {code: speculates-and-promises, label: "States unconfirmed causes or promises fix times in live updates", category: conceptual}
        - id: support-guidance
          label: Tells support and sales what to do or say (mobile app workaround, status page, no promised times)
          weight: 1
          any: ["workaround", "mobile app", "use the app", "status page", "tell customers", "customers can", "advise", "support should", "support can", "for support", "support team", "for sales", "macro", "canned", "point customers", "point them", "ask customers"]
          missing_feedback: "Give support and sales something actionable: point customers to the mobile app as a workaround and to the status page for updates."
        - id: next-update
          label: Commits to a specific time for the next update
          weight: 2
          any: ["next update", "update at", "update by", "update in", "another update", "further update", "re:\\b(by|at)\\s+1[01]:[0-5][0-9]\\b", "re:\\bin\\s+[0-9]+\\s*min"]
          missing_feedback: "End with when the next update will come (e.g. 'Next update at 11:10 UTC, or sooner if anything changes') — even if there's nothing new by then."
          misconception: {code: no-update-cadence, label: "Leaves stakeholders without a next-update time", category: incomplete}

  - slug: comm-incident-critique-update
    skill: comm-incident-updates
    kind: code_review
    difficulty: 3
    minutes: 8
    tags: [scenario]
    title: Critique a first incident update
    objective: Identify understated impact, blame, speculation, unfounded promises and missing cadence in an incident update.
    prompt: |
      This was the first message posted in the incident channel. At the time, dashboards showed **about 25% of API requests failing with timeouts since 14:35 UTC**; the alerts had fired at 14:35.

      Critique the update: what is wrong with it, why does it matter during an incident, and what should it have said?
    hints:
      - Compare the words in the message with what the dashboards showed.
      - Which statements are facts, and which are guesses?
      - When was this posted relative to the alerts, and when will people hear more?
    explanation: |
      The update **understates the impact** ("minor slowness" for a quarter of requests failing), **blames an individual and speculates** about an unconfirmed cause in a public channel, makes an **unfounded promise** ("5 mins tops") that will erode trust when it slips, and arrives **45 minutes late with no next-update time**. Good updates state facts precisely, stay blameless, give estimates only when there's a basis, and commit to a cadence.
    solution: |
      1. **The impact is understated and vague.** "Some users might be seeing minor slowness" — the dashboards show about 25% of API requests failing with timeouts since 14:35 UTC. Say exactly that, plus which features are affected.
      2. **Blame and speculation.** "Probably that migration Dave ran … he really should have checked" names an individual and guesses at an unconfirmed cause in a shared channel. Stick to facts ("we're investigating a possible link to this morning's schema migration") and leave cause analysis to a blameless post-incident review.
      3. **An unfounded promise.** "Should be fixed in 5 mins tops" sets an expectation nobody can back yet; when it slips, people stop trusting the updates. Give an estimate only when there's a basis for one.
      4. **Too late, and no next update.** The first update came 45 minutes after the alerts fired, and it doesn't say who is leading, what is being done or when the next update will be. Post a first update within minutes, then commit to a cadence: "Next update at 15:50 UTC."

      A better version: "15:20 UTC — Since 14:35 UTC about 25% of API requests are failing with timeouts. Cause not yet confirmed; we're investigating database performance, including this morning's schema migration. Incident lead: Priya. Next update at 15:50 UTC."
