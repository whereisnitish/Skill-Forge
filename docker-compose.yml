# Local production-like stack: web, worker, beat, PostgreSQL, Redis and the
# isolated code-runner sandbox.  Usage:  cp .env.example .env && docker compose up --build
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://skillforge:skillforge@db:5432/skillforge
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CODE_RUNNER_URL: http://sandbox:8080
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  web:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_catalog &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    ports: ["8000:8000"]
    networks: [backend, sandbox]

  worker:
    <<: *app
    command: celery -A config worker --loglevel=INFO --concurrency=4 --max-tasks-per-child=200
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 60s
      timeout: 15s
    networks: [backend, sandbox]

  beat:
    <<: *app
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    networks: [backend]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skillforge
      POSTGRES_USER: skillforge
      POSTGRES_PASSWORD: skillforge
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillforge -d skillforge"]
      interval: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    command: redis-server --save 60 1 --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [backend]

  sandbox:
    build: ./sandbox
    environment:
      RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:?set CODE_RUNNER_TOKEN in .env}
      RUNNER_MAX_CONCURRENCY: "4"
      RUNNER_MEMORY_LIMIT_MB: "256"
    # Hardening: no capabilities, no privilege escalation, read-only root,
    # small private /tmp, bounded processes, memory and CPU, and a network
    # that only reaches the web/worker containers (no internet, no DB/Redis).
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    # For production, prefer a user-space kernel such as gVisor:
    # runtime: runsc
    networks: [sandbox]
    restart: unless-stopped

networks:
  backend: {}
  sandbox:
    internal: true

volumes:
  pgdata: {}
  redisdata: {}
