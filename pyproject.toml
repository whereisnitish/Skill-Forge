[project]
name = "skillforge"
version = "0.1.0"
description = "Adaptive learning and skill development for software engineers."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/*", "node_modules", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "BLE", "C4", "SIM", "RUF", "N"]
ignore = [
  "S101",    # assert is fine in tests
  "RUF012",  # Django Meta/class attributes
  "DJ001",   # CharField null usage reviewed case by case
  "SIM108",
  "N818",    # domain exception names (InvalidResponse, RunnerBusy) read better without an Error suffix
  "RUF001",  # curly quotes and dashes in user-facing copy are intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311", "N802"]
"config/settings/*" = ["F405"]
"scripts/brand_assets.py" = ["E501"]  # embedded HTML/CSS template strings

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider -m \"not e2e\""
markers = [
  "e2e: browser tests driven by Playwright (run with `pytest -m e2e`)",
  "posix: tests that need a POSIX host (sandbox resource limits)",
]
filterwarnings = [
  "ignore::DeprecationWarning:kombu.*",
  "ignore::DeprecationWarning:celery.*",
  "ignore:No directory at:UserWarning",
]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
skip_covered = true
show_missing = false
