{% extends "layouts/auth.html" %}
{% load ui %}
{% block title %}Reset your password{% endblock %}
{% block content %}
<h1 class="page-title">Reset your password</h1>
<p class="mt-2 text-sm text-muted">Enter the email address for your account and we'll send you a reset link.</p>
<form method="post" class="mt-8 space-y-5" novalidate>
  {% csrf_token %}
  {% form_field form.email %}
  <button type="submit" class="btn btn-primary btn-lg w-full"><span class="spinner" aria-hidden="true"></span>Send reset link</button>
</form>
<p class="mt-6 text-center text-sm"><a href="{% url 'accounts:login' %}" class="link">Back to log in</a></p>
{% endblock %}
