{% extends "layouts/auth.html" %}
{% load ui %}
{% block title %}Password updated{% endblock %}
{% block content %}
<span class="grid size-12 place-items-center rounded-2xl bg-success-soft text-success">{% icon "circle-check" "size-6" %}</span>
<h1 class="page-title mt-5">Your password has been updated</h1>
<p class="mt-3 text-muted">You can now log in with your new password.</p>
<a href="{% url 'accounts:login' %}" class="btn btn-primary mt-8 w-fit">Log in</a>
{% endblock %}
