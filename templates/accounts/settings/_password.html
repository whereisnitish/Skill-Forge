{% load ui %}
<section id="password" class="card card-pad scroll-mt-24" aria-labelledby="password-heading">
  <h2 id="password-heading" class="section-title">Password</h2>
  <form method="post" action="{% url 'accounts_settings:password' %}" hx-post="{% url 'accounts_settings:password' %}" hx-target="#password" hx-swap="outerHTML" class="mt-5 space-y-5" novalidate>
    {% csrf_token %}
    {% form_field password_form.old_password %}
    <div class="grid gap-5 sm:grid-cols-2">{% form_field password_form.new_password1 %}{% form_field password_form.new_password2 %}</div>
    <div class="flex items-center gap-4"><button type="submit" class="btn btn-secondary btn-sm"><span class="spinner htmx-indicator" aria-hidden="true"></span>Update password</button>{% include "accounts/settings/_saved.html" %}</div>
  </form>
</section>
