{% load ui %}{% if page.has_other_pages %}
<nav class="mt-6 flex items-center justify-between gap-3 text-sm" aria-label="Pagination">
  {% if page.has_previous %}
  <a class="btn btn-secondary btn-sm" href="{% query_with page=page.previous_page_number %}" {% if hx_target %}hx-get="{% query_with page=page.previous_page_number %}" hx-target="{{ hx_target }}" hx-push-url="true"{% endif %}>{% icon "chevron-left" "size-4" %} Previous</a>
  {% else %}<span></span>{% endif %}
  <span class="text-muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
  <a class="btn btn-secondary btn-sm" href="{% query_with page=page.next_page_number %}" {% if hx_target %}hx-get="{% query_with page=page.next_page_number %}" hx-target="{{ hx_target }}" hx-push-url="true"{% endif %}>Next {% icon "chevron-right" "size-4" %}</a>
  {% else %}<span></span>{% endif %}
</nav>
{% endif %}
