{% load static %}<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong · SkillForge</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="{% static 'dist/app.css' %}">
</head>
<body>
  <main class="mx-auto flex min-h-dvh max-w-xl flex-col items-center justify-center px-4 text-center">
    <p class="stat-value text-6xl text-faint">500</p>
    <h1 class="page-title mt-4">Something went wrong on our side</h1>
    <p class="mt-3 text-muted">We've been notified. Please try again in a moment.</p>
    {% if request_id %}<p class="mt-4 font-mono text-xs text-faint">Reference: {{ request_id }}</p>{% endif %}
    <a href="/" class="btn btn-primary mt-8">Go home</a>
  </main>
</body>
</html>
