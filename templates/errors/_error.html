{% extends "layouts/marketing.html" %}
{% load ui %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<section class="mx-auto flex max-w-xl flex-col items-center px-4 py-24 text-center sm:py-32">
  <p class="font-display text-7xl leading-none text-gold-text">{{ status }}</p>
  <span class="rule-gold mt-6" aria-hidden="true"></span>
  <h1 class="page-title mt-6">{% block error_title %}{% endblock %}</h1>
  <p class="mt-3 text-muted">{% block error_body %}{% endblock %}</p>
  <div class="mt-8 flex flex-wrap justify-center gap-3">
    {% if user.is_authenticated %}<a href="{% url 'learning:today' %}" class="btn btn-primary">Go to Today</a>{% else %}<a href="{% url 'marketing:home' %}" class="btn btn-primary">Go home</a>{% endif %}
    <a href="{% url 'marketing:contact' %}" class="btn btn-secondary">Contact support</a>
  </div>
</section>
{% endblock %}
